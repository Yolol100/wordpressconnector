name: DoctorCura post-cleanup full verification E

on:
  push:
    branches:
      - audit/doctorcura-final-recheck-20260910-1742
    paths:
      - 'doctorcura-post-cleanup-verification-e/*.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Full production verification after draft cleanup
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-full-e"; rm -rf "$root"; mkdir -p "$root/options" "$root/elementor" "$root/posts" "$root/rendered"

          hc=$(curl -sS -L --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/health.json" -w '%{http_code}' "$base/health" || true)
          [[ "$hc" == 200 ]] || { echo "HEALTH_HTTP=$hc" >&2; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok') and d.get('transport')=='rest',d
          print('FULL_E_HEALTH_OK version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          call(){
            suffix="$1"; action="$2"; payload="$3"
            req="$root/r-$suffix.json"; out="$root/o-$suffix.json"
            python3 - "$req" "$action" "$payload" <<'PY'
          import json,sys,uuid
          out,action,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':'dc-full-e-'+uuid.uuid4().hex[:18],'action':action,'dry_run':True,'confirm':False,'payload':json.loads(payload)},open(out,'w',encoding='utf-8'),separators=(',',':'))
          PY
            for n in $(seq 1 6); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$req" -o "$out" -w '%{http_code}' "$base/execute" || true)
              if [[ "$code" == 200 ]] && python3 - "$out" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') else 1)
          PY
              then return 0; fi
              [[ "$code" == 000 || "$code" == 429 || "$code" == 503 ]] && { sleep 8; continue; }
              echo "ACTION_FAIL action=$action HTTP=$code" >&2; return 1
            done
            return 1
          }

          for key in woocommerce_store_address woocommerce_store_address_2 woocommerce_store_city woocommerce_store_postcode woocommerce_default_country woocommerce_allowed_countries woocommerce_specific_allowed_countries woocommerce_all_except_countries woocommerce_ship_to_countries woocommerce_specific_ship_to_countries; do
            call "opt-${key//_/-}" option.get "{\"name\":\"$key\"}"
            cp "$root/o-opt-${key//_/-}.json" "$root/options/$key.json"
          done

          for id in 3 9 11 3285; do
            call "el-$id" elementor.inspect "{\"id\":$id}"
            cp "$root/o-el-$id.json" "$root/elementor/$id.json"
          done
          call core filesystem.read_text '{"path":"wp-content/plugins/doctorcura-core/includes/extra-request-form.php"}'

          scode=$(curl -sS -L --connect-timeout 10 --max-time 60 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/snippets.json" -w '%{http_code}' "$site/wp-json/code-snippets/v1/snippets?per_page=100&page=1" || true)
          [[ "$scode" == 200 ]] || { echo "SNIPPETS_HTTP=$scode" >&2; exit 1; }

          for id in 900066 900067; do
            code=$(curl -sS -L --connect-timeout 10 --max-time 60 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/post-$id.json" -w '%{http_code}' "$site/wp-json/wp/v2/posts/$id?context=edit" || true)
            [[ "$code" == 200 ]] || { echo "POST_ID_HTTP id=$id HTTP=$code" >&2; exit 1; }
          done

          page=1
          while (( page <= 20 )); do
            code=$(curl -sS -L --connect-timeout 10 --max-time 75 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/posts/$page.json" -w '%{http_code}' "$site/wp-json/wp/v2/posts?context=edit&per_page=100&page=$page&status=any" || true)
            [[ "$code" == 200 ]] || { echo "POSTS_HTTP=$code page=$page" >&2; exit 1; }
            count=$(python3 - "$root/posts/$page.json" <<'PY'
          import json,sys
          print(len(json.load(open(sys.argv[1],encoding='utf-8'))))
          PY
          )
            (( count < 100 )) && break
            page=$((page+1))
          done
          jq -s 'add' "$root"/posts/*.json > "$root/all-posts.json"

          pcode=$(curl -sS -L --connect-timeout 10 --max-time 75 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/pages.json" -w '%{http_code}' "$site/wp-json/wp/v2/pages?context=edit&status=publish&per_page=100" || true)
          [[ "$pcode" == 200 ]] || { echo "PAGES_HTTP=$pcode" >&2; exit 1; }

          python3 - "$root" "$site" <<'PY'
          import concurrent.futures,json,os,sys,urllib.parse,urllib.request
          root,site=sys.argv[1:]
          pages=json.load(open(root+'/pages.json',encoding='utf-8'))
          urls=[]
          for p in pages:
              if p.get('link'): urls.append(('page-'+str(p.get('id')),p['link']))
          extras=['/','/en/','/kontakt/','/en/kontakt/','/privacy-policy/','/en/privacy-policy/','/geschaftsbedingungen/','/en/geschaftsbedingungen/','/datenschutz/','/en/uber-uns/','/en/faq/','/fr/','/fr/privacy-policy/']
          for rel in extras: urls.append(('extra-'+rel,urllib.parse.urljoin(site+'/',rel.lstrip('/'))))
          seen=set(); ded=[]
          for x in urls:
              if x[1] not in seen: seen.add(x[1]); ded.append(x)
          def fetch(x):
              label,u=x
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 DoctorCuraFullE'})
                  with urllib.request.urlopen(req,timeout=30) as r:return label,u,r.status,r.geturl(),r.read().decode('utf-8','replace')
              except Exception as e:return label,u,int(getattr(e,'code',0) or 0),u,''
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for row in ex.map(fetch,ded):rows.append(row)
          for i,row in enumerate(rows):open(f'{root}/rendered/{i}.html','w',encoding='utf-8').write(row[4])
          json.dump([{'label':a,'url':b,'status':c,'final':d,'file':f'rendered/{i}.html'} for i,(a,b,c,d,e) in enumerate(rows)],open(root+'/render-index.json','w',encoding='utf-8'),indent=2)
          PY

          python3 - "$root" "$site" <<'PY'
          import hashlib,html,json,os,re,sys,urllib.parse,urllib.request,concurrent.futures
          root,site=sys.argv[1:]
          phone='+31 85 505 54 33'; tel='tel:+31855055433'; addr='Veldbloemlaan 93'; postcode='3452CK Vleuten'; mapq='Veldbloemlaan%2093%2C%203452CK%20Vleuten%2C%20The%20Netherlands'
          old_visible=re.compile(r'Keizersgracht\s*241|1016\s*EA\s*,?\s*Amsterdam|\b08\s*550\s*55\s*433\b|\b085\s*505\s*5433\b|\b0855055433\b|\+31\s*\(0\)\s*85\s*505\s*5433\b|\+31\s+85\s+505\s+5433\b',re.I)
          old_tel=re.compile(r'tel:\s*\+318550554\s*(?=["\'])',re.I)
          editorial=re.compile(r'\b(?:USA|United States|Vereinigte Staaten|FDA|DEA|HIPAA|Zepbound|Medicare|Medicaid|USD)\b|Suicide\s*&\s*Crisis\s*Lifeline|\bUS-amerikan\w*\b|in den Deutschland|von ein entsprechend zugelassener|eines ärztlichen Rückfragens|variieren kosten|Mounjaro enthält wie Mounjaro|Gewichtsverlust Medikamente Vergleich|Behandlung erektile Dysfunktion online|Potenzbehandlung digital beantragen leicht|\bsofort Rezept online\b|medikamente aus EU apotheke sicher|Viagra Wirkung Review|Mounjaro Bewertung|\bWegovy Rezept\b|\bMounjaro Rezept\b|\bDie beste online Behandlungen\b',re.I)
          kvk_rx=re.compile(r'\bKvK\b|\bKVK\b|Kamer van Koophandel',re.I)
          def oval(k):
              d=json.load(open(f'{root}/options/{k}.json',encoding='utf-8')); return (d.get('data') or {}).get('value')
          expected={'woocommerce_store_address':'Veldbloemlaan 93','woocommerce_store_address_2':'','woocommerce_store_city':'Vleuten','woocommerce_store_postcode':'3452CK','woocommerce_default_country':'NL','woocommerce_allowed_countries':'specific','woocommerce_specific_allowed_countries':['DE','FR','GB'],'woocommerce_all_except_countries':[],'woocommerce_ship_to_countries':'','woocommerce_specific_ship_to_countries':[]}
          for k,v in expected.items(): assert oval(k)==v,(k,oval(k),v)
          def walk(v):
              if isinstance(v,str):yield v
              elif isinstance(v,list):
                  for x in v:yield from walk(x)
              elif isinstance(v,dict):
                  for x in v.values():yield from walk(x)
          def el(i): return json.load(open(f'{root}/elementor/{i}.json',encoding='utf-8')).get('data')
          c,f,p,t=el(9),el(3285),el(3),el(11)
          cs='\n'.join(walk(c)); fs='\n'.join(walk(f)); ps='\n'.join(walk(p)); ts='\n'.join(walk(t))
          assert phone in cs and tel in cs and addr in cs and postcode in cs
          maps=[]
          def mw(v):
              if isinstance(v,dict):
                  if v.get('widgetType')=='google_maps' and isinstance(v.get('settings'),dict):maps.append(v['settings'].get('address'))
                  for x in v.values():mw(x)
              elif isinstance(v,list):
                  for x in v:mw(x)
          mw(c); assert 'Veldbloemlaan 93, 3452CK Vleuten, The Netherlands' in maps,maps
          assert addr in fs and phone in fs and addr in ps and postcode in ps and not old_visible.search(ps) and not old_visible.search(ts)

          a=json.load(open(root+'/post-900066.json',encoding='utf-8')); b=json.load(open(root+'/post-900067.json',encoding='utf-8'))
          assert a.get('status')=='trash',('900066 status',a.get('status'))
          assert b.get('status')=='publish',('900067 status',b.get('status'))
          canonical_hash=hashlib.sha256(((b.get('content') or {}).get('raw') or '').encode()).hexdigest()

          posts=json.load(open(root+'/all-posts.json',encoding='utf-8')); active=[]; legacy=[]; editor=[]; kvk=[]; same_hash=[]; internal=set()
          for q in posts:
              if q.get('status')=='trash': continue
              active.append(q.get('id'))
              content=(q.get('content') or {}).get('raw') or ''; title=html.unescape((q.get('title') or {}).get('raw') or ''); excerpt=html.unescape((q.get('excerpt') or {}).get('raw') or ''); yh=q.get('yoast_head_json') or {}
              blob=' '.join([title,excerpt,content,json.dumps(yh,ensure_ascii=False)])
              m=old_visible.search(blob) or old_tel.search(blob)
              if m: legacy.append(('post',q.get('id'),m.group(0)))
              visible=re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<[^>]+>',' ',content)))
              m=editorial.search(' '.join([title,excerpt,visible,str(yh.get('title') or ''),str(yh.get('description') or '')]))
              if m: editor.append((q.get('id'),m.group(0)))
              if kvk_rx.search(blob):kvk.append(('post',q.get('id')))
              if hashlib.sha256(content.encode()).hexdigest()==canonical_hash:same_hash.append(q.get('id'))
              for u in re.findall(r'href=["\']([^"\']+)',content,re.I):
                  u=html.unescape(u.strip())
                  if not u or u.startswith(('#','mailto:','tel:','javascript:')):continue
                  absu=urllib.parse.urljoin(site+'/',u)
                  purl=urllib.parse.urlparse(absu)
                  if purl.netloc.lower().endswith('doctorcura.com') and not re.search(r'/(?:wp-json|wc-api)/',purl.path,re.I):internal.add(absu)
          assert 900066 not in active,'trashed draft still active'
          assert same_hash==[900067],('canonical duplicate active content',same_hash)
          if legacy:raise SystemExit('LEGACY_ACTIVE_POST '+repr(legacy[:20]))
          if editor:raise SystemExit('EDITORIAL_RESIDUE '+repr(editor[:20]))

          s=json.load(open(root+'/snippets.json',encoding='utf-8')); items=s if isinstance(s,list) else (s.get('items') or s.get('snippets') or []) if isinstance(s,dict) else []
          for x in items:
              if isinstance(x,dict) and isinstance(x.get('code'),str):
                  m=old_visible.search(x['code']) or old_tel.search(x['code'])
                  if m:raise SystemExit('LEGACY_SNIPPET '+repr((x.get('id'),m.group(0))))
                  if kvk_rx.search(x['code']):kvk.append(('snippet',x.get('id')))
          core=json.load(open(root+'/o-core.json',encoding='utf-8')); ctxt=str((core.get('data') or {}).get('content') or '')
          m=old_visible.search(ctxt) or old_tel.search(ctxt)
          if m:raise SystemExit('LEGACY_CORE '+repr(m.group(0)))
          if kvk_rx.search(ctxt):kvk.append(('core',0))

          rendered=json.load(open(root+'/render-index.json',encoding='utf-8')); got={}; render_legacy=[]
          for r in rendered:
              body=open(root+'/'+r['file'],encoding='utf-8',errors='replace').read(); got[r['url']]=(r,body)
              if r['label'].startswith('page-') and r['status']!=200:raise SystemExit('PUBLISHED_PAGE_HTTP '+repr(r))
              m=old_visible.search(body) or old_tel.search(body)
              if m:render_legacy.append((r['url'],m.group(0)))
              if kvk_rx.search(body):kvk.append(('rendered',r['url']))
          if render_legacy:raise SystemExit('LEGACY_RENDERED '+repr(render_legacy[:20]))
          required=[site+'/',site+'/en/',site+'/kontakt/',site+'/en/kontakt/',site+'/privacy-policy/',site+'/en/privacy-policy/',site+'/geschaftsbedingungen/',site+'/en/geschaftsbedingungen/']
          for u in required:
              assert u in got and got[u][0]['status']==200,('required render',u,got.get(u,(None,None))[0])
              body=got[u][1]; assert addr in body and phone in body,('new contact missing',u)
          contact=got[site+'/kontakt/'][1]
          hrefs=re.findall(r'href=["\']\s*(tel:[^"\']+)["\']',contact,re.I); norm=[re.sub(r'\s+','',x).lower() for x in hrefs]
          assert 'tel:+31855055433' in norm and not [x for x in norm if x.startswith('tel:+318550554') and x!='tel:+31855055433'],norm
          assert mapq in contact,'contact map mismatch'

          def chk(u):
              try:
                  q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 DoctorCuraFullELinkQA'},method='HEAD')
                  with urllib.request.urlopen(q,timeout=15) as r:return u,r.status
              except Exception:
                  try:
                      q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 DoctorCuraFullELinkQA'})
                      with urllib.request.urlopen(q,timeout=18) as r:return u,r.status
                  except Exception as e:return u,int(getattr(e,'code',0) or 0)
          broken=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for u,code in ex.map(chk,sorted(internal)):
                  if code==0 or code==404 or code>=500:broken.append((code,u))
          if broken:raise SystemExit('BROKEN_INTERNAL_LINKS '+repr(broken[:20]))

          pub_req=urllib.request.Request(site+'/?p=900066',headers={'User-Agent':'Mozilla/5.0 DoctorCuraFullE'})
          try:
              with urllib.request.urlopen(pub_req,timeout=20) as r:trash_public=r.status
          except Exception as e:trash_public=int(getattr(e,'code',0) or 0)
          assert trash_public==404,('trashed draft public status',trash_public)
          print('FULL_E_OK '+json.dumps({'active_posts_checked':len(active),'published_pages_checked':len(json.load(open(root+'/pages.json',encoding='utf-8'))),'rendered_urls_checked':len(rendered),'internal_links_checked':len(internal),'broken_internal_links':0,'draft_900066':'trash_and_public_404','canonical_900067':'published','active_duplicate_hash_matches':same_hash,'legacy_contact_hits':0,'editorial_residue_hits':0,'woocommerce':'ok','contact':'ok','google_maps':'ok','privacy':'ok','terms':'ok','snippets':'ok','core':'ok','kvk_locations':kvk},ensure_ascii=False,separators=(',',':')))
          PY
