name: DoctorCura FR Request-2 Migration Fix

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-fr-request2.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Apply exact French Request-2 migration
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/code-snippets/v1/snippets/43"
          tmp="$RUNNER_TEMP/dc-fr-request2"; mkdir -p "$tmp"
          baseline='85f7ba66ed973660925a865279244be844c952a534fb34a06bf1cfa56c6267b3'
          marker='DoctorCura French request-2 migration V8.4f'
          changed=0; helper=0

          canonical(){ python3 - "$1" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          m=re.search(r'<link[^>]+rel=["\'][^"\']*canonical[^"\']*["\'][^>]+href=["\']([^"\']+)',s,re.I)
          if not m: m=re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\'][^"\']*canonical',s,re.I)
          print(m.group(1) if m else '',end='')
          PY
          }
          first(){ local u h; u="$1"; h="$2"; curl "${c[@]}" --compressed --max-redirs 0 --dump-header "$h" --output /dev/null "$u" || true; awk '/^HTTP\//{print $2;exit}' "$h"; }
          loc(){ awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$1"; }
          make_payload(){ php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["code"=>$c,"active"=>true],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$1" "$2"; }
          put_code(){ local src label payload out http; src="$1"; label="$2"; payload="$tmp/$label.json"; out="$tmp/$label-out.json"; make_payload "$src" "$payload"; http=$(curl "${c[@]}" --location "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$api"); echo "PUT label=$label http=$http"; [[ "$http" == 200 ]]; }
          purge_wp(){
            local src label token helperfile ok; src="$1"; label="$2"; ok=0; token=$(openssl rand -hex 24); helperfile="$tmp/$label-helper.php"; cp "$src" "$helperfile"
            cat >> "$helperfile" <<PHP

          /* DoctorCura one-time cache purge helper */
          add_action( 'init', function () {
              if ( ! isset( \$_GET['doctorcura_fr_request2_purge'] ) || ! hash_equals( '$token', (string) \$_GET['doctorcura_fr_request2_purge'] ) ) return;
              if ( function_exists( 'rocket_clean_domain' ) ) rocket_clean_domain();
              if ( function_exists( 'wp_cache_flush' ) ) wp_cache_flush();
              header( 'X-DoctorCura-FR-Request2-Purge: done' );
          }, 1 );
          PHP
            put_code "$helperfile" "$label-install"; helper=1
            if curl "${c[@]}" --compressed --dump-header "$tmp/$label.h" --output /dev/null "$base/wp-json/?doctorcura_fr_request2_purge=$token"; then grep -Eiq '^x-doctorcura-fr-request2-purge:[[:space:]]*done' "$tmp/$label.h" && ok=1 || true; fi
            put_code "$src" "$label-remove"; helper=0; [[ "$ok" == 1 ]]
          }
          eventual_404_no_redirect(){
            local url="$1" label="$2" attempt code h location seen=0
            for attempt in 1 2 3; do
              h="$tmp/$label-$attempt.h"; code=$(first "$url?doctorcura_guard=$label-$attempt-$(date +%s%N)" "$h"); location=$(loc "$h")
              echo "UNCHANGED_GUARD label=$label attempt=$attempt code=$code location=${location:-none}"
              case "$code" in 301|302|307|308) return 1;; 404) seen=1; break;; 200) ;; *) return 1;; esac
            done
            [[ "$seen" == 1 ]]
          }
          fr_redirect_round(){
            local round="$1" attempt code h location good=0 wrong=0
            for attempt in 1 2 3; do
              h="$tmp/fr-$round-$attempt.h"; code=$(first "$base/fr/request-2/?doctorcura_verify=$round-$attempt-$(date +%s%N)" "$h"); location=$(loc "$h")
              echo "FR_PROBE round=$round attempt=$attempt code=$code location=${location:-none}"
              if [[ "$code" == 301 && "$location" == "$base/fr/anfrage-2/" ]]; then good=$((good+1)); fi
              if [[ "$code" =~ ^30[1278]$ && "$location" != "$base/fr/anfrage-2/" ]]; then wrong=1; fi
            done
            [[ "$wrong" == 0 && "$good" -ge 2 ]]
          }
          rollback(){ local rc=$?; [[ "$rc" == 0 ]] && return; echo "ROLLBACK_START rc=$rc" >&2; set +e; if [[ "$changed" == 1 || "$helper" == 1 ]]; then put_code "$tmp/original.php" rollback-original >/dev/null 2>&1 || true; purge_wp "$tmp/original.php" rollback-purge >/dev/null 2>&1 || true; fi; curl "${c[@]}" --location "${auth[@]}" --output "$tmp/rb.json" "$api" >/dev/null 2>&1 || true; if [[ -s "$tmp/rb.json" ]]; then php -r '$s=json_decode(file_get_contents($argv[1]),true);$c=(string)($s["code"]??"");echo "ROLLBACK_READBACK hash=".hash("sha256",$c)." marker=".(strpos($c,$argv[2])===false?"absent":"present")." helper=".(strpos($c,"DoctorCura one-time cache purge helper")===false?"absent":"present").PHP_EOL;' "$tmp/rb.json" "$marker" || true; fi; echo ROLLBACK_ATTEMPTED >&2; }
          trap rollback EXIT

          echo '=== PREFLIGHT ==='
          http=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/current.json" --write-out '%{http_code}' "$api"); [[ "$http" == 200 ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");$tokens=["DoctorCura gewichtsverlust legacy final redirect V8.4b","DoctorCura datenschutz root-only migration V8.4c","DoctorCura product variation hreflang cleanup V8.4d","DoctorCura GSC-proven legacy category redirects V8.4e"];if((int)($s["id"]??0)!==43||($s["name"]??"")!=="DoctorCura SEO indexation cleanup"||empty($s["active"])||hash("sha256",$c)!==$argv[3]||strpos($c,$argv[4])!==false||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);foreach($tokens as $t){if(substr_count($c,$t)!==1)exit(3);}file_put_contents($argv[2],$c);echo "BASELINE hash=".hash("sha256",$c).PHP_EOL;' "$tmp/current.json" "$tmp/original.php" "$baseline" "$marker"

          eventual_404_no_redirect "$base/fr/request-2/" fr-request2-pre
          eventual_404_no_redirect "$base/request-2/" root-request2-pre
          eventual_404_no_redirect "$base/en/request-2/" en-request2-pre
          curl "${c[@]}" --compressed --output "$tmp/target.html" "$base/fr/anfrage-2/"
          target_status=$(curl "${c[@]}" --compressed --output "$tmp/target2.html" --write-out '%{http_code}' "$base/fr/anfrage-2/"); target_can=$(canonical "$tmp/target2.html")
          [[ "$target_status" == 200 && "$target_can" == "$base/fr/anfrage-2/" ]] || exit 1
          echo "TARGET_OK status=$target_status canonical=$target_can"

          cp "$tmp/original.php" "$tmp/new.php"
          cat >> "$tmp/new.php" <<'PHP'

          /* DoctorCura French request-2 migration V8.4f - 2026-09-10 */
          add_action( 'template_redirect', function () {
              $gt_lang = isset( $_SERVER['HTTP_X_GT_LANG'] ) ? strtolower( trim( (string) $_SERVER['HTTP_X_GT_LANG'] ) ) : '';
              if ( 'fr' !== $gt_lang ) return;
              $request_uri = isset( $_SERVER['REQUEST_URI'] ) ? (string) $_SERVER['REQUEST_URI'] : '';
              $path = wp_parse_url( $request_uri, PHP_URL_PATH );
              if ( ! is_string( $path ) || '' === $path ) return;
              $path = '/' . trim( $path, '/' ) . '/';
              if ( '/request-2/' === $path || '/fr/request-2/' === $path ) {
                  wp_safe_redirect( home_url( '/fr/anfrage-2/' ), 301, 'DoctorCura migration' );
                  exit;
              }
          }, 0 );
          PHP
          newhash=$(sha256sum "$tmp/new.php" | awk '{print $1}')

          echo '=== WRITE ==='
          put_code "$tmp/new.php" apply; changed=1; purge_wp "$tmp/new.php" apply-purge
          curl "${c[@]}" --location "${auth[@]}" --output "$tmp/after.json" "$api"
          after=$(php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||substr_count($c,$argv[2])!==1||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);echo hash("sha256",$c);' "$tmp/after.json" "$marker"); [[ "$after" == "$newhash" ]] || exit 1
          echo "READBACK hash=$after helper=absent"

          for round in 1 2; do
            fr_redirect_round "$round"
            eventual_404_no_redirect "$base/request-2/" root-request2-post-$round
            eventual_404_no_redirect "$base/en/request-2/" en-request2-post-$round
            body="$tmp/follow-$round.html"; result=$(curl "${c[@]}" --location --compressed --output "$body" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base/fr/request-2/?doctorcura_follow=$round-$(date +%s%N)"); IFS=$'\t' read -r status final redirects <<< "$result"; can=$(canonical "$body")
            [[ "$status" == 200 && "$final" == "$base/fr/anfrage-2/" && "$redirects" == 1 && "$can" == "$base/fr/anfrage-2/" ]] || { echo "FOLLOW_FAIL round=$round result=$result canonical=$can" >&2; exit 1; }
            for pair in '/product-categorie/hiv-praevention-prep/|/product-category/hiv-praevention-prep/' '/product-categorie/quit-smoking/|/product-category/rauchstopp/' '/product-categorie/schlafprobleme/|/product-category/schlafprobleme/' '/product-categorie/gewichtsverlust/|/product-category/gewichtsverlust/' '/datenschutz/|/privacy-policy/'; do source=${pair%%|*}; target=${pair#*|}; h="$tmp/canary-$round.h"; code=$(first "$base$source" "$h"); location=$(loc "$h"); [[ "$code" == 301 && "$location" == "$base$target" ]] || exit 1; done
            [[ $(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/16/") == 200 ]]
            p17=$(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/17/"); if [[ "$p17" != 404 ]]; then sleep 2; p17=$(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/17/"); fi; [[ "$p17" == 404 ]]
            echo "ROUND_OK=$round"
          done

          clean_good=0; clean_wrong=0
          for attempt in 1 2 3; do h="$tmp/clean-$attempt.h"; code=$(first "$base/fr/request-2/" "$h"); location=$(loc "$h"); cache=$(awk 'BEGIN{IGNORECASE=1}/^x-hcdn-cache-status:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$h"); echo "EDGE attempt=$attempt code=$code cache=${cache:-none} location=${location:-none}"; if [[ "$code" == 301 && "$location" == "$base/fr/anfrage-2/" ]]; then clean_good=$((clean_good+1)); fi; if [[ "$code" =~ ^30[1278]$ && "$location" != "$base/fr/anfrage-2/" ]]; then clean_wrong=1; fi; done
          [[ "$clean_wrong" == 0 && "$clean_good" -ge 2 ]] || exit 1
          trap - EXIT
          echo "FR_REQUEST2_FIX_GREEN snippet_hash=$newhash"
