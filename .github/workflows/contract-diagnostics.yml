name: Contract Diagnostics

on:
  pull_request:
    paths-ignore:
      - 'requests/**'
      - 'results/**'
      - 'receipts/**'
      - 'assets/inbox/**'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        test:
          - action-catalog.php
          - custom-css-contract.php
          - elementor-inventory-contract.php
          - elementor-forms-contract.php
          - elementor-json-export-runtime.php
          - elementor-json-import-contract.php
          - state-token-contract.php
          - plugin-control-contract.php
          - plugin-package-contract.php
          - connector-update-contract.php
          - strict-input-contract.php
          - payload-boolean-contract.php
          - security-boundary-contract.php
          - runtime-preflight-contract.php
          - filesystem-control-contract.php
          - public-runtime-contract.php
          - mutation-lock-contract.php
          - audit-hardening-contract.php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run contract
        run: php -d auto_prepend_file=tests/php-compat.php "tests/${{ matrix.test }}"
