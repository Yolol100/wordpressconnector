name: Runtime Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[runtime-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live connector without exposing response data
        env:
          SITE_URL: ${{ vars.WPCONNECTOR_SITE_URL }}
          REST_USERNAME: ${{ secrets.WPCONNECTOR_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.WPCONNECTOR_REST_APPLICATION_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}"
          test -n "${REST_USERNAME:-}"
          test -n "${REST_APP_PASSWORD:-}"
          case "$SITE_URL" in
            https://*) ;;
            *) echo 'WPCONNECTOR_SITE_URL must use https://.' >&2; exit 1 ;;
          esac

          root="$RUNNER_TEMP/wpconnector-runtime-probe"
          rm -rf "$root"
          mkdir -p "$root"
          trap 'rm -rf "$root"' EXIT

          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"
          health="$root/health.json"
          http_code=$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
            --header 'Accept: application/json' \
            --output "$health" \
            --write-out '%{http_code}' \
            "$base/health")
          if [[ "$http_code" != '200' ]]; then
            echo 'REST connector health check failed.' >&2
            exit 1
          fi

          version=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); if(empty($d["ok"])||($d["transport"]??"")!=="rest"){exit(2);} $v=(string)($d["version"]??""); if(!preg_match("/^[0-9]+\.[0-9]+\.[0-9]+$/D",$v)){exit(3);} echo $v;' "$health")
          echo "connector_version=${version}"

          request="$root/request.json"
          result="$root/result.json"
          request_id="runtime-probe-${RUN_ID}"
          php -r '$r=["version"=>1,"request_id"=>$argv[1],"action"=>"connector.discover","dry_run"=>true,"confirm"=>false,"payload"=>(object)[]]; file_put_contents($argv[2],json_encode($r,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));' "$request_id" "$request"

          http_code=$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@$request" \
            --output "$result" \
            --write-out '%{http_code}' \
            "$base/execute")
          if [[ "$http_code" != '200' ]]; then
            echo 'Connector capability probe failed.' >&2
            exit 1
          fi

          php -r '
            $health=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            $result=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);
            if(empty($result["ok"]) || ($result["action"]??"")!=="connector.discover"){fwrite(STDERR,"Connector capability probe returned an invalid result.\n");exit(1);}
            $actions=$result["data"]["actions"]??[];
            if(!is_array($actions)){$actions=[];}
            $hasPackage=array_key_exists("plugin.install_package",$actions);
            $hasCheck=array_key_exists("connector.update.check",$actions);
            $hasApply=array_key_exists("connector.update.apply",$actions);
            $gates=$health["gates"]??[];
            $privileged=!empty($gates["privileged"]);
            $systemUpdates=!empty($gates["system_updates"]);
            echo "plugin_install_package_available=".($hasPackage?"true":"false").PHP_EOL;
            echo "connector_update_check_available=".($hasCheck?"true":"false").PHP_EOL;
            echo "connector_update_apply_available=".($hasApply?"true":"false").PHP_EOL;
            echo "self_update_preflight_ready=".(($hasApply&&$privileged&&$systemUpdates)?"true":"false").PHP_EOL;
          ' "$health" "$result"
