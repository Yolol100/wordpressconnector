name: One-time DoctorCura editorial and EU medical accuracy fix

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-editorial-fix/*.json'

permissions:
  contents: read

concurrency:
  group: doctorcura-editorial-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Rewrite awkward copy and correct EU medical context
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || { echo 'Unexpected site'; exit 1; }
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-editorial-fix"; rm -rf "$root"; mkdir -p "$root/before" "$root/yoast-before" "$root/payload" "$root/yoast-payload" "$root/after" "$root/yoast-after"
          ids=(900060 900048 900043 6050 6048 6046 6044 6042 6033 6020 6008 5999 5995 5993 5990 5986 5904 5896 5892)

          call(){
            suffix="$1"; action="$2"; dry="$3"; confirm="$4"; payload="$5"
            python3 - "$root/r-$suffix.json" "$action" "$dry" "$confirm" "$payload" <<'PY'
          import json,sys,uuid
          out,action,dry,confirm,payload=sys.argv[1:]
          req={'version':1,'request_id':'dc-editor-'+uuid.uuid4().hex[:20],'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':json.load(open(payload,encoding='utf-8'))}
          json.dump(req,open(out,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            for attempt in $(seq 1 8); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 150 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute" || true)
              if [[ "$code" == 200 ]] && python3 - "$root/o-$suffix.json" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1],encoding='utf-8'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') else 1)
          PY
              then return 0; fi
              if [[ "$code" == 503 || "$code" == 000 ]]; then sleep 12; continue; fi
              echo "$action failed HTTP=$code" >&2; cat "$root/o-$suffix.json" >&2 || true; return 1
            done
            return 1
          }

          # Baseline every post and Yoast field before any mutation.
          for id in "${ids[@]}"; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "get-$id" post.get true false "$root/id.json"; cp "$root/o-get-$id.json" "$root/before/$id.json"
            call "yoast-$id" yoast.inspect true false "$root/id.json"; cp "$root/o-yoast-$id.json" "$root/yoast-before/$id.json"
          done

          # Build all post + Yoast updates locally. Required substitutions fail before any write.
          python3 - "$root" <<'PY'
          import html,json,os,re,sys
          root=sys.argv[1]
          titles={
            900060:'Rezeptpflichtige Therapie digital anfragen',
            900048:'Wegovy-Erfahrungen medizinisch eingeordnet',
            900043:'Viagra-Wirkung: medizinisch erklärt',
            6050:'Mounjaro beim Gewichtsmanagement: medizinisch eingeordnet',
            6048:'Digitale Rezeptbehandlung: Ablauf verständlich erklärt',
            6046:'Rezeptpflichtige Schlafhilfe online anfragen',
            6044:'Digitales Rezept oder Praxisbesuch: Was passt?',
            6042:'Rezept online erhalten: sicher und diskret',
            6033:'Was kostet eine GLP-1-Therapie?',
            6020:'Diskrete Medikamentenbestellung: So läuft sie ab',
            6008:'Rezept online anfragen: Ablauf und ärztliche Prüfung',
            5999:'Ist Wegovy für mich geeignet? Medizinische Kriterien',
            5995:'Wer bekommt Mounjaro verschrieben? Medizinische Kriterien',
            5993:'Online-Rezept für Wegovy: sicher anfragen',
            5990:'Potenzbehandlung online anfragen: Ablauf und Sicherheit',
            5986:'Medikamente zur Gewichtsabnahme im Vergleich',
            5904:'Behandlung erektiler Dysfunktion online erklärt',
            5896:'Medikamente sicher über eine EU-Apotheke bestellen',
            5892:'Ist ein Online-Rezept in Deutschland legal?',
          }
          desc={
            900060:'So läuft eine digitale Anfrage für eine rezeptpflichtige Therapie ab – von den Gesundheitsangaben und der ärztlichen Prüfung bis zu Rezept und Versand.',
            900048:'Wegovy-Erfahrungen richtig einordnen: Was Semaglutid bewirken kann, welche Nebenwirkungen häufig sind und warum ärztliche Kontrollen wichtig sind.',
            900043:'Wie Sildenafil wirkt, wann Viagra typischerweise einsetzt, welche Neben- und Wechselwirkungen wichtig sind und wann ärztlicher Rat nötig ist.',
            6050:'Mounjaro mit Tirzepatid kann bei Typ-2-Diabetes und beim Gewichtsmanagement eingesetzt werden. Entscheidend sind Eignung, Risiken und ärztliche Begleitung.',
            6048:'Vom Gesundheitsfragebogen bis zur Apotheke: So läuft eine digitale Rezeptbehandlung ab und an welchen Stellen die ärztliche Prüfung entscheidet.',
            6046:'Wie eine digitale Anfrage für rezeptpflichtige Schlafmittel abläuft, welche Risiken geprüft werden und wann eine Untersuchung vor Ort sinnvoller ist.',
            6044:'Telemedizin oder Termin in der Praxis? Welche Beschwerden sich online beurteilen lassen und wann eine persönliche Untersuchung die bessere Wahl ist.',
            6042:'Online-Rezept Schritt für Schritt: medizinischer Fragebogen, ärztliche Prüfung, mögliche Verordnung und diskreter Versand über eine zugelassene Apotheke.',
            6033:'Die Kosten einer GLP-1-Therapie hängen von Präparat, Dosis, ärztlicher Betreuung, Apotheke und möglicher Kostenerstattung ab. Darauf sollten Sie achten.',
            6020:'So läuft eine diskrete Medikamentenbestellung ab: medizinische Angaben, ärztliche Entscheidung, Rezept, Apotheke und neutral verpackter Versand.',
            6008:'Ein Online-Rezept beginnt nicht mit der Bestellung, sondern mit einer medizinischen Prüfung. So funktionieren Anfrage, Verordnung und Versand.',
            5999:'Ob Wegovy passt, hängt nicht nur vom BMI ab. Entscheidend sind Vorerkrankungen, Medikamente, Risiken und die langfristigen Behandlungsziele.',
            5995:'Mounjaro ist in der EU für Typ-2-Diabetes und unter bestimmten Voraussetzungen für Gewichtsmanagement zugelassen. Welche Kriterien Ärzte prüfen.',
            5993:'Wegovy online anfragen: Welche Angaben der Arzt braucht, wann eine Verordnung möglich ist und was nach der Genehmigung bei Dosierung und Versand folgt.',
            5990:'Erektionsprobleme diskret online ansprechen: So laufen Gesundheitsfragebogen, ärztliche Beurteilung, mögliche Verordnung und Apothekenversand ab.',
            5986:'Wegovy, Mounjaro und Saxenda im Vergleich: Unterschiede bei Wirkstoff, Anwendung, Eignung und Risiken – ohne pauschale Empfehlung.',
            5904:'Erektile Dysfunktion online behandeln lassen: Wie die ärztliche Prüfung funktioniert, welche Medikamente infrage kommen und wann ein Praxisbesuch sinnvoller ist.',
            5896:'Woran Sie einen seriösen Bezug über eine EU-Apotheke erkennen: Rezeptpflicht, ärztliche Prüfung, registrierte Apotheke und nachvollziehbarer Versand.',
            5892:'Online-Rezepte können in Deutschland zulässig sein, wenn die Fernbehandlung im Einzelfall ärztlich vertretbar ist und die erforderliche Sorgfalt gewahrt bleibt.',
          }
          required={}
          def add(pid,old,new): required.setdefault(pid,[]).append((old,new))

          # Human-language repairs and de-templating.
          add(900048,'Die Suche nach „Wegovy Erfahrungen medizinisch eingeordnet“ beginnt oft mit sehr persönlichen Fragen:','Wer sich für Wegovy interessiert, hat oft sehr konkrete Fragen:')
          add(900048,'In den Deutschland ist Wegovy zur langfristigen Gewichtsbehandlung bei Erwachsenen mit Adipositas oder mit Übergewicht plus mindestens einer gewichtsbedingten Begleiterkrankung zugelassen. Dazu können etwa Bluthochdruck, Fettstoffwechselstörungen oder Typ-2-Diabetes gehören. Die ärztliche Beurteilung betrachtet jedoch mehr als den BMI: Vorerkrankungen, aktuelle Medikamente, Essverhalten und frühere Abnehmversuche sind für die Therapiewahl relevant.','In der Europäischen Union ist Wegovy zur Gewichtsregulierung bei Erwachsenen mit einem BMI von mindestens 30 kg/m² oder mit einem BMI ab 27 bis unter 30 kg/m² und mindestens einer gewichtsbedingten Begleiterkrankung zugelassen. Dazu können etwa Bluthochdruck, Fettstoffwechselstörungen oder Typ-2-Diabetes gehören. Ob die Behandlung im Einzelfall passt, hängt zusätzlich von Vorerkrankungen, aktuellen Medikamenten und weiteren Risikofaktoren ab.')
          add(900048,'Wegovy darf nicht angewendet werden, wenn eine persönliche oder familiäre Vorgeschichte eines medullären Schilddrüsenkarzinoms besteht oder ein multiples endokrines Neoplasie-Syndrom Typ 2 vorliegt. Diese und weitere Gegenanzeigen gehören in eine sorgfältige medizinische Anamnese - nicht in eine Selbstentscheidung nach Social-Media-Videos.','Wegovy darf nicht angewendet werden, wenn eine Überempfindlichkeit gegen Semaglutid oder einen der sonstigen Bestandteile besteht. Andere Vorerkrankungen und mögliche Risiken gehören ebenfalls in die medizinische Anamnese und sollten vor Beginn der Behandlung ärztlich eingeordnet werden.')

          add(900043,'Eine seriöse Viagra Wirkung Review beginnt nicht mit Versprechen über Leistung, sondern mit einer medizinischen Frage:','Bei Viagra ist die erste Frage nicht, wie stark die Wirkung ausfällt, sondern ob Sildenafil medizinisch zu Ihnen passt:')
          add(900043,'### Viagra Wirkung Review: Was Sildenafil im Körper macht','### Wie Sildenafil im Körper wirkt')
          add(900043,'### Viagra Wirkung Review: Für wen die Behandlung sinnvoll sein kann','### Für wen Sildenafil infrage kommen kann')
          add(900043,'### Was eine faire Bewertung der Viagra-Wirkung ausmacht','### Wie sich die Wirkung realistisch beurteilen lässt')

          add(6050,'Wer nach „mounjaro bewertung bei gewichtsmanagement“ sucht, möchte meist mehr wissen als die mögliche Zahl auf der Waage.','Wer Mounjaro für das Gewichtsmanagement erwägt, möchte meist mehr wissen als nur die mögliche Veränderung auf der Waage.')
          add(6050,'### Mounjaro Bewertung beim Gewichtsmanagement','### Mounjaro beim Gewichtsmanagement einordnen')
          add(6050,'In den Deutschland ist Mounjaro zur Verbesserung der Blutzuckerkontrolle bei Erwachsenen mit Typ-2-Diabetes zugelassen, ergänzend zu Ernährung und Bewegung. Für die langfristige Gewichtstherapie ist Tirzepatid unter einer anderen Markenbezeichnung zugelassen. Ob Mounjaro in einer konkreten Situation ärztlich vertretbar ist, hängt deshalb nicht allein vom Wunsch abzunehmen ab, sondern von Diagnose, Vorerkrankungen, bisherigen Therapien und dem geltenden medizinischen Rahmen.','In der Europäischen Union ist Mounjaro für die Behandlung von Typ-2-Diabetes zugelassen. Zusätzlich ist es bei Erwachsenen zum Gewichtsmanagement zugelassen, wenn ein BMI von mindestens 30 kg/m² vorliegt oder bei einem BMI ab 27 bis unter 30 kg/m² mindestens eine gewichtsbedingte Begleiterkrankung besteht. Ob Mounjaro im Einzelfall geeignet ist, hängt von Diagnose, Vorerkrankungen, bisherigen Therapien und möglichen Risiken ab.')
          add(6050,'Nicht geeignet ist Tirzepatid für Personen mit einer persönlichen oder familiären Vorgeschichte eines medullären Schilddrüsenkarzinoms oder mit multipler endokriner Neoplasie Typ 2. Auch bei früheren schweren Überempfindlichkeitsreaktionen gegen den Wirkstoff darf es nicht angewendet werden. Bei Schwangerschaft, Kinderwunsch oder Stillzeit ist eine individuelle ärztliche Beratung erforderlich. Diese Punkte gehören in den medizinischen Fragebogen und in das Arztgespräch - vollständig und ehrlich.','Mounjaro darf nicht angewendet werden, wenn eine Überempfindlichkeit gegen Tirzepatid oder einen der sonstigen Bestandteile besteht. Bei Schwangerschaft wird die Anwendung nicht empfohlen. Weitere Vorerkrankungen, aktuelle Medikamente und frühere Unverträglichkeiten sollten vollständig angegeben werden, damit der Arzt Nutzen und Risiken im Einzelfall beurteilen kann.')
          add(6050,'Tirzepatid kann zudem die Aufnahme oral eingenommener Arzneimittel beeinflussen, weil sich die Magenentleerung verlangsamt. Das ist insbesondere bei hormonellen Verhütungsmitteln relevant. Nach Beginn der Behandlung und nach jeder Dosissteigerung kann vorübergehend eine zusätzliche oder nicht orale Verhütungsmethode notwendig sein. Die behandelnde Ärztin oder der behandelnde Arzt kann die passende Empfehlung für die persönliche Situation geben.','Tirzepatid verzögert die Magenentleerung und kann dadurch die Aufnahme oral eingenommener Arzneimittel beeinflussen. Nach aktueller EU-Produktinformation ist für orale Verhütungsmittel keine Dosisanpassung erforderlich. Informieren Sie den behandelnden Arzt dennoch über alle regelmäßig eingenommenen Medikamente, insbesondere wenn ein schneller Wirkungseintritt wichtig ist.')

          add(6048,'Hier wird der Ablauf der digitalen Rezeptbehandlung verständlich erklärt : klar, medizinisch verantwortungsvoll und auf den deutschen Markt bezogen.','Der Ablauf lässt sich klar in einzelne Schritte gliedern – vom Gesundheitsfragebogen bis zur Abgabe durch die Apotheke.')

          add(6046,'Der digitale Weg beginnt mit einer medizinischen Anfrage, nicht mit einer automatischen Bestellung.','Eine digitale Anfrage beginnt mit Ihren Gesundheitsangaben, nicht mit einer automatischen Bestellung.')
          add(6046,'Je nach Deutschland, medizinischer Situation und gewünschter Therapie kann eine zusätzliche Rückfrage oder eine telemedizinische Konsultation erforderlich sein.','Je nach medizinischer Situation und gewünschter Therapie kann eine zusätzliche Rückfrage oder eine telemedizinische Konsultation erforderlich sein.')
          add(6046,'In den Deutschland rufen Sie bei einem medizinischen Notfall 112. Bei Suizidgedanken oder einer akuten seelischen Krise erreichen Sie die 116117 Suicide & Crisis Lifeline per Anruf oder Text unter 116117.','Bei akuter Selbstgefährdung oder unmittelbarer Gefahr wählen Sie 112. Wenn Sie in einer psychischen Krise Unterstützung brauchen, erreichen Sie die TelefonSeelsorge rund um die Uhr unter 0800 1110111, 0800 1110222 oder 116 123. Für dringende, aber nicht lebensbedrohliche medizinische Beschwerden außerhalb der Sprechzeiten ist der ärztliche Bereitschaftsdienst unter 116117 erreichbar.')

          add(6044,'Ein digitales Rezept oder Praxisbesuch ist für viele Erwachsene keine Grundsatzfrage, sondern eine praktische medizinische Entscheidung:','Die Wahl zwischen einem digitalen Rezept und einem Praxisbesuch ist für viele Erwachsene keine Grundsatzfrage, sondern eine praktische medizinische Entscheidung:')
          add(6044,'Bei vielen wiederkehrenden oder häufig behandelten Anliegen lässt sich die medizinische Eignung anhand eines strukturierten Fragebogens , Ihrer Krankengeschichte, aktueller Medikamente und gegebenenfalls eines ärztlichen Rückfragens zuverlässig bewerten.','Bei vielen wiederkehrenden oder häufig behandelten Anliegen lässt sich die medizinische Eignung anhand eines strukturierten Fragebogens, Ihrer Krankengeschichte, aktueller Medikamente und gegebenenfalls einer ärztlichen Rückfrage beurteilen.')

          add(6042,'Die genaue Lieferzeit hängt unter anderem ab von:','Die genaue Lieferzeit hängt unter anderem von folgenden Faktoren ab:')

          add(6033,'Die Frage „was kostet glp1 therapie komplett“ lässt sich nicht mit einem einzigen Betrag beantworten.','Wie viel eine GLP-1-Therapie insgesamt kostet, lässt sich nicht mit einem einzigen Betrag beantworten.')
          add(6033,'Markenpräparate wie Wegovy oder Mounjaro können ohne Versicherung je nach Stärke, Apotheke und Verfügbarkeit je nach Präparat und Bezugsweg deutlich variieren kosten.','Die Kosten von Markenpräparaten wie Wegovy oder Mounjaro können je nach Stärke, Apotheke, Verfügbarkeit und Bezugsweg deutlich variieren.')

          add(6020,'So funktioniert diskrete Medikamentenbestellung : Sie stellen online eine Behandlungsanfrage,','So läuft eine diskrete Medikamentenbestellung ab: Sie stellen online eine Behandlungsanfrage,')

          add(6008,'Ein sofort Rezept online klingt nach einer einfachen Lösung, besonders wenn Beschwerden diskret behandelt werden sollen oder ein Praxisbesuch gerade nicht realistisch ist. Medizinisch verantwortungsvoll bedeutet „sofort“ jedoch nicht, dass jede Anfrage automatisch zu einem Rezept führt. Es bedeutet, dass Sie ohne Wartezimmer eine digitale Behandlungsanfrage starten können und ein zugelassener Arzt Ihre Angaben zeitnah prüft.','Ein Rezept online anzufragen kann praktisch sein, wenn Sie ein sensibles Thema diskret klären möchten oder kurzfristig keinen Praxisbesuch organisieren können. Eine digitale Anfrage bedeutet jedoch nicht, dass automatisch ein Rezept ausgestellt wird. Zuerst prüft ein zugelassener Arzt, ob die gewünschte Behandlung medizinisch zu Ihrer Situation passt.')
          add(6008,'### Was ein sofort Rezept online tatsächlich bedeutet','### Was ein Online-Rezept tatsächlich bedeutet')
          add(6008,'### Wann Sie nicht auf ein sofort Rezept online warten sollten','### Wann Sie nicht auf eine Online-Anfrage warten sollten')

          add(5999,'Bei Erwachsenen mit Übergewicht oder Adipositas und bestehender Herz-Kreislauf-Erkrankung kann Wegovy unter bestimmten Voraussetzungen außerdem zur Senkung schwerwiegender kardiovaskulärer Ereignisse eingesetzt werden. Ob diese Indikation auf Sie zutrifft, muss ärztlich beurteilt werden.','Bestehende Herz-Kreislauf-Erkrankungen können als gewichtsbedingte Begleiterkrankung für die Beurteilung der Gewichtsbehandlung relevant sein. Ob Wegovy im Einzelfall geeignet ist, muss ärztlich beurteilt werden.')
          add(5999,'Wegovy darf nicht angewendet werden, wenn Sie oder ein Familienmitglied jemals an medullärem Schilddrüsenkarzinom erkrankt sind oder wenn bei Ihnen ein multiples endokrines Neoplasie-Syndrom Typ 2, kurz MEN 2, vorliegt. Auch bei einer bekannten schweren Überempfindlichkeit gegen Semaglutid oder einen der Bestandteile ist das Arzneimittel nicht geeignet.','Wegovy darf nicht angewendet werden, wenn eine Überempfindlichkeit gegen Semaglutid oder einen der sonstigen Bestandteile besteht. Vorerkrankungen und mögliche Risiken sollten dennoch vollständig angegeben werden, damit der Arzt beurteilen kann, ob besondere Vorsicht oder eine andere Behandlung erforderlich ist.')

          add(5995,'### Für wen wird Mounjaro in den Deutschland verschrieben?','### Für wen kann Mounjaro verschrieben werden?')
          add(5995,'Mounjaro ist in den Deutschland zur Verbesserung der Blutzuckerkontrolle bei Erwachsenen mit Typ-2-Diabetes zugelassen. Es wird zusätzlich zu einer ausgewogenen Ernährung und regelmäßiger Bewegung eingesetzt. Der Wirkstoff Tirzepatid aktiviert die Rezeptoren GIP und GLP-1. Das kann die Insulinfreisetzung abhängig vom Blutzucker unterstützen, die Magenentleerung verlangsamen und das Hungergefühl beeinflussen.','Mounjaro ist in der Europäischen Union sowohl zur Behandlung von Typ-2-Diabetes als auch – unter festgelegten Voraussetzungen – zum Gewichtsmanagement bei Erwachsenen zugelassen. Der Wirkstoff Tirzepatid aktiviert die Rezeptoren GIP und GLP-1. Das kann die Insulinfreisetzung abhängig vom Blutzucker unterstützen, die Magenentleerung verlangsamen und das Hunger- und Sättigungsgefühl beeinflussen.')
          add(5995,'Viele Menschen interessieren sich für Tirzepatid wegen einer möglichen Gewichtsabnahme. Hier ist eine klare Unterscheidung wichtig: Mounjaro ist in den Deutschland unter diesem Markennamen für Typ-2-Diabetes zugelassen. Für die langfristige Gewichtskontrolle bei Erwachsenen ist Tirzepatid unter dem Markennamen Mounjaro zugelassen.','Mounjaro ist in der Europäischen Union auch für das Gewichtsmanagement bei Erwachsenen zugelassen. Dafür gilt ein BMI von mindestens 30 kg/m² oder ein BMI ab 27 bis unter 30 kg/m² zusammen mit mindestens einer gewichtsbedingten Begleiterkrankung.')
          add(5995,'Ärzte können Arzneimittel in bestimmten Situationen auch außerhalb der jeweiligen Markenindikation verordnen. Eine solche sogenannte Off-Label-Verordnung liegt jedoch im individuellen medizinischen Ermessen des Arztes. Sie ist nicht automatisch passend, nur weil eine Person abnehmen möchte oder ein bestimmter BMI erreicht wird.','Wenn die Zulassungskriterien für das Gewichtsmanagement erfüllt sind, handelt es sich bei dieser Anwendung von Mounjaro nicht um eine Off-Label-Behandlung. Ob die Kriterien erfüllt sind und die Therapie medizinisch passt, entscheidet der behandelnde Arzt.')
          add(5995,'Bei einer Behandlung von Adipositas prüfen Ärzte üblicherweise, ob ein BMI von mindestens 30 vorliegt. Auch bei einem BMI ab 27 kann eine medikamentöse Behandlung in Betracht kommen, wenn gewichtsbedingte Erkrankungen bestehen, etwa Bluthochdruck, Fettstoffwechselstörungen, Schlafapnoe oder Typ-2-Diabetes. Diese Werte sind Orientierungspunkte, keine Zusage für ein Rezept.','Neben dem BMI berücksichtigt der Arzt unter anderem Begleiterkrankungen, bisherige Behandlungen, aktuelle Medikamente und mögliche Gegenanzeigen. Die Zulassungskriterien allein sind deshalb noch keine Zusage für ein Rezept.')
          add(5995,'Menschen mit einer persönlichen oder familiären Vorgeschichte eines medullären Schilddrüsenkarzinoms oder mit multipler endokriner Neoplasie Typ 2 dürfen Mounjaro nicht anwenden. Der Grund ist ein Warnhinweis, der sich aus Beobachtungen in Tierstudien ergibt.','Mounjaro darf nicht angewendet werden, wenn eine Überempfindlichkeit gegen Tirzepatid oder einen der sonstigen Bestandteile besteht. Andere Vorerkrankungen können die Nutzen-Risiko-Abwägung beeinflussen und sollten deshalb vollständig mit dem behandelnden Arzt besprochen werden.')
          add(5995,'Zusätzlich kann Tirzepatid die Wirkung oraler hormoneller Verhütungsmittel beeinflussen, insbesondere zu Beginn der Behandlung und nach einer Dosiserhöhung. Der Arzt kann in diesem Zeitraum eine nicht orale oder zusätzliche Verhütungsmethode empfehlen. Eine verlässliche Angabe zu Verhütung und Familienplanung ist deshalb Teil einer verantwortungsvollen Beurteilung.','Tirzepatid verzögert die Magenentleerung und kann die Aufnahme oral eingenommener Arzneimittel beeinflussen. Nach aktueller EU-Produktinformation ist für orale Verhütungsmittel keine Dosisanpassung erforderlich. Familienplanung und Schwangerschaft sollten trotzdem vor und während der Behandlung ärztlich besprochen werden.')
          add(5995,'anderen gewichtsbegleitenden Erkrankungen','anderen gewichtsbedingten Erkrankungen')

          add(5993,'Die Angaben werden von ein entsprechend zugelassener Arzt in Deutschland oder einem zugelassenen Arzt bewertet.','Die Angaben werden von einem entsprechend zugelassenen Arzt oder einer zugelassenen Ärztin bewertet.')
          add(5993,'Wegovy ist nicht für alle Menschen geeignet. Bei einer persönlichen oder familiären Vorgeschichte von medullärem Schilddrüsenkarzinom oder bei multipler endokriner Neoplasie Typ 2 darf das Medikament in der Regel nicht angewendet werden. Auch bei einer bekannten schweren Überempfindlichkeit gegen Inhaltsstoffe von Wegovy ist eine Behandlung ausgeschlossen.','Wegovy ist nicht für alle Menschen geeignet. Es darf nicht angewendet werden, wenn eine Überempfindlichkeit gegen Semaglutid oder einen der sonstigen Bestandteile besteht. Weitere Vorerkrankungen und mögliche Risiken müssen vor einer Verordnung ärztlich eingeordnet werden.')

          add(5990,'Wer eine Potenzbehandlung digital beantragen leicht möchte, kann den Weg zur ärztlichen Einschätzung heute häufig online beginnen - diskret, strukturiert und ohne Wartezimmer.','Wer Erektionsprobleme diskret medizinisch abklären lassen möchte, kann die ärztliche Einschätzung häufig online beginnen – strukturiert und ohne Wartezimmer.')
          add(5990,'Nach dem Absenden wird Ihre Anfrage von einem zugelassenen Arzt oder einer zugelassenen medizinischen Fachperson geprüft, soweit dies nach den geltenden Vorschriften Ihres Bundesstaats zulässig ist.','Nach dem Absenden wird Ihre Anfrage von einem entsprechend zugelassenen Arzt oder einer zugelassenen Ärztin geprüft. Ob eine reine Fernbehandlung im Einzelfall ausreicht, hängt von der medizinischen Situation und den geltenden berufsrechtlichen Anforderungen ab.')

          add(5986,'Ein Gewichtsverlust Medikamente Vergleich kann dabei Orientierung geben - vorausgesetzt, er berücksichtigt nicht nur die erwartete Gewichtsabnahme, sondern auch Vorerkrankungen, Nebenwirkungen, Alltagstauglichkeit und die zugelassene Anwendung in den Deutschland.','Ein Vergleich der verfügbaren Medikamente kann Orientierung geben – vorausgesetzt, er berücksichtigt nicht nur die mögliche Gewichtsabnahme, sondern auch Vorerkrankungen, Nebenwirkungen, Alltagstauglichkeit und die jeweilige Zulassung.')
          add(5986,'### Gewichtsverlust Medikamente Vergleich: Die wichtigsten Optionen','### Die wichtigsten Medikamente im Vergleich')
          add(5986,'Mounjaro enthält wie Mounjaro Tirzepatid, ist in den Deutschland jedoch primär zur Behandlung von Typ-2-Diabetes zugelassen. Bei Diabetes kann es deshalb eine passende Therapie sein, die zusätzlich das Gewicht beeinflusst. Für das Gewichtsmanagement wird in Deutschland die in der EU zugelassene Tirzepatid-Therapie nach den geltenden Indikationskriterien ärztlich beurteilt. Auch Ozempic, das Semaglutid enthält, ist vor allem ein Diabetesmedikament und nicht mit Wegovy gleichzusetzen, obwohl beide Wirkstoffe verwandt sind.','Mounjaro enthält Tirzepatid und ist in der Europäischen Union sowohl für Typ-2-Diabetes als auch für das Gewichtsmanagement bei Erwachsenen mit Adipositas beziehungsweise Übergewicht plus mindestens einer gewichtsbedingten Begleiterkrankung zugelassen. Ozempic enthält ebenfalls Semaglutid, ist jedoch ein Diabetesmedikament und nicht mit Wegovy gleichzusetzen.')
          add(5986,'Nicht jede Person ist für diese Medikamente geeignet. Eine persönliche oder familiäre Vorgeschichte bestimmter Schilddrüsentumoren, insbesondere medulläres Schilddrüsenkarzinom, oder das MEN-2-Syndrom können Gegenanzeigen darstellen. Auch bei einer Vorgeschichte von Bauchspeicheldrüsenentzündung, schweren Magen-Darm-Erkrankungen, Gallenproblemen oder diabetischer Augenerkrankung muss ein zugelassener Arzt die Risiken sorgfältig einordnen.','Gegenanzeigen und Warnhinweise unterscheiden sich je nach Wirkstoff. Deshalb muss ein Arzt die jeweilige Produktinformation, Ihre Vorerkrankungen und die aktuelle Medikation gemeinsam prüfen. Auch frühere Bauchspeicheldrüsenentzündungen, ausgeprägte Magen-Darm-Beschwerden, Gallenprobleme oder diabetesbedingte Augenerkrankungen können für die Auswahl und Überwachung relevant sein.')

          add(5904,'Genau hier kann die Behandlung erektile Dysfunktion online eine sinnvolle Lösung sein:','Genau hier kann eine Online-Behandlung bei erektiler Dysfunktion eine sinnvolle Möglichkeit sein:')
          add(5904,'### Was eine Behandlung erektile Dysfunktion online leisten sollte','### Was eine Online-Behandlung leisten sollte')
          add(5904,'### So läuft die Behandlung erektile Dysfunktion online ab','### So läuft die Online-Behandlung ab')

          add(5896,'Genau deshalb ist das Thema medikamente aus EU apotheke sicher für viele Patienten in Deutschland zentral - vor allem bei Behandlungen wie Gewichtsmanagement, sexueller Gesundheit oder Schlafproblemen, bei denen Diskretion und Verlässlichkeit zusammengehören.','Deshalb ist für viele Patienten in Deutschland entscheidend, ob ein Medikament tatsächlich über eine regulierte EU-Apotheke abgegeben wird – besonders bei sensiblen Behandlungen, bei denen Diskretion und Verlässlichkeit zusammengehören.')
          add(5896,'### Wann sind Medikamente aus EU-Apotheke sicher?','### Wann ist der Bezug über eine EU-Apotheke sicher?')
          add(5896,'Medikamente aus EU-Apotheke sicher zu beziehen bedeutet, dass vor der Abgabe eine echte medizinische Prüfung stattfindet, das Medikament aus einer registrierten Apotheke kommt und der Versand dokumentiert sowie nachvollziehbar erfolgt.','Ein sicherer Bezug über eine EU-Apotheke setzt voraus, dass vor der Abgabe die nötige medizinische Prüfung stattfindet, die Apotheke registriert ist und der Versand nachvollziehbar organisiert wird.')

          add(5892,'Diese Beurteilung kann je nach Behandlung, Deutschland und Medikament unterschiedlich ablaufen.','Wie diese Beurteilung abläuft, hängt von der Behandlung, dem Medikament und der konkreten medizinischen Situation ab.')
          add(5892,'Telemedizin ist kein rechtlicher Graubereich mehr, sondern ein regulierter Teil der Gesundheitsversorgung. Für viele Standardbehandlungen - etwa in den Bereichen sexuelle Gesundheit , Gewichtsmanagement oder Schlafprobleme - ist die digitale ärztliche Prüfung heute ein etablierter Weg.','Telemedizin ist Teil der regulierten Gesundheitsversorgung. Eine ausschließliche Fernbehandlung ist nach den berufsrechtlichen Vorgaben möglich, wenn sie im konkreten Einzelfall ärztlich vertretbar ist und die erforderliche Sorgfalt gewahrt bleibt.')
          add(5892,'Hinzu kommt, dass bestimmte Medikamente, Diagnosefelder oder telemedizinische Abläufe je nach Medikament, Diagnose und Behandlungsablauf unterschiedlich geregelt sein können. Deshalb gibt es keine pauschale Aussage, die für jede Behandlung pauschal gelten würde. Legalität hängt immer auch davon ab, ob der konkrete Anbieter die zuständigen Regeln tatsächlich einhält.','Zusätzliche Anforderungen können sich je nach Medikament, Diagnose und Behandlungsablauf unterscheiden. Deshalb muss der konkrete Anbieter prüfen, welche medizinischen und rechtlichen Vorgaben für die jeweilige Behandlung gelten.')

          # Some openers/closers used the same template repeatedly. Vary them without changing medical meaning.
          add(900060,'Entscheidend ist dabei nicht nur die Bequemlichkeit: Eine seriöse telemedizinische Versorgung stellt sicher, dass die gewünschte Behandlung zu Ihrer gesundheitlichen Situation passt.','Der digitale Zugang ist nur dann sinnvoll, wenn die medizinische Entscheidung genauso sorgfältig getroffen wird wie bei einer Behandlung vor Ort.')
          add(6048,'Nicht jede Anfrage führt zu einem Rezept. Das ist kein Nachteil des Systems, sondern ein Zeichen medizinischer Verantwortung.','Nicht jede Anfrage endet mit einem Rezept – und genau das gehört zu einem verantwortungsvollen medizinischen Prozess.')
          add(5904,'Eine medizinisch verantwortungsvolle Plattform priorisiert nicht den schnellen Verkauf, sondern die passende Entscheidung.','Bei einer medizinisch verantwortungsvollen Plattform steht die passende Entscheidung vor dem schnellen Abschluss.')

          for pid,title in titles.items():
              d=json.load(open(f'{root}/before/{pid}.json',encoding='utf-8')); post=(d.get('data') or {}).get('post') or {}
              content=post.get('content') or ''
              old_hrefs=re.findall(r'href=["\']([^"\']+)',content,re.I)
              for old,new in required.get(pid,[]):
                  if old not in content:
                      raise SystemExit(f'PRECHECK missing required phrase post={pid}: {old[:140]}')
                  content=content.replace(old,new)
              # Safe recurring language/typography errors from the earlier audit.
              content=content.replace('in den Deutschland','in Deutschland').replace('In den Deutschland','In Deutschland')
              content=re.sub(r'\s+([,.;:!?])',r'\1',content)
              # Keep link attributes byte-for-byte in the same order.
              new_hrefs=re.findall(r'href=["\']([^"\']+)',content,re.I)
              if old_hrefs!=new_hrefs: raise SystemExit(f'href changed locally post={pid}')
              payload={'id':pid,'title':title,'content':content,'status':post.get('status','publish')}
              if pid==5892: payload['slug']='ist-ein-online-rezept-legal-deutschland'
              json.dump(payload,open(f'{root}/payload/{pid}.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))

              yd=json.load(open(f'{root}/yoast-before/{pid}.json',encoding='utf-8')); fields=(yd.get('data') or {}).get('fields') or {}
              updates={'description':desc[pid]}
              old_title=str(post.get('title') or '')
              for k in ('title','opengraph_title','twitter_title'):
                  v=fields.get(k)
                  if isinstance(v,str) and v:
                      updates[k]=v.replace(old_title,title) if old_title in v else title
              for k in ('opengraph_description','twitter_description'):
                  if fields.get(k): updates[k]=desc[pid]
              json.dump({'id':pid,'fields':updates},open(f'{root}/yoast-payload/{pid}.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print('LOCAL_PREFLIGHT_OK posts=',len(titles))
          PY

          # Mutate only after the entire local preflight is clean.
          for id in "${ids[@]}"; do
            call "write-post-$id" post.update false true "$root/payload/$id.json"
            call "write-yoast-$id" yoast.update false true "$root/yoast-payload/$id.json"
          done
          printf '{}' > "$root/empty.json"; call cache cache.flush false true "$root/empty.json" || true

          # Readback every object and verify identity, links and corrected content.
          for id in "${ids[@]}"; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "after-post-$id" post.get true false "$root/id.json"; cp "$root/o-after-post-$id.json" "$root/after/$id.json"
            call "after-yoast-$id" yoast.inspect true false "$root/id.json"; cp "$root/o-after-yoast-$id.json" "$root/yoast-after/$id.json"
          done
          python3 - "$root" <<'PY'
          import json,os,re,sys
          root=sys.argv[1]
          ids=[900060,900048,900043,6050,6048,6046,6044,6042,6033,6020,6008,5999,5995,5993,5990,5986,5904,5896,5892]
          banned=re.compile(r'\bin den Deutschland\b|\bBundesstaat(?:s|en)?\b|Suicide\s*&\s*Crisis\s*Lifeline|\b988\b|\bZepbound\b|\bUSA\b|\bUnited States\b|\bVereinigte Staaten\b|\bUS-amerikan\w*\b|\bmedullär(?:en|em|er|es)? Schilddrüsenkarzinom\b|\bMEN[- ]?2\b',re.I)
          awkward=re.compile(r'Gewichtsverlust Medikamente Vergleich|Behandlung erektile Dysfunktion online|Potenzbehandlung digital beantragen leicht|\bsofort Rezept online\b|medikamente aus EU apotheke sicher|Viagra Wirkung Review|Mounjaro Bewertung',re.I)
          report=[]
          for id in ids:
              before=(json.load(open(f'{root}/before/{id}.json',encoding='utf-8')).get('data') or {}).get('post') or {}
              after=(json.load(open(f'{root}/after/{id}.json',encoding='utf-8')).get('data') or {}).get('post') or {}
              yc=(json.load(open(f'{root}/yoast-after/{id}.json',encoding='utf-8')).get('data') or {}).get('fields') or {}
              b_links=re.findall(r'href=["\']([^"\']+)',before.get('content') or '',re.I)
              a_links=re.findall(r'href=["\']([^"\']+)',after.get('content') or '',re.I)
              if b_links!=a_links: raise SystemExit(f'READBACK href mismatch {id}')
              if after.get('status')!='publish': raise SystemExit(f'not published {id}')
              joined=' '.join([str(after.get('title') or ''),str(after.get('content') or ''),str(yc.get('title') or ''),str(yc.get('description') or ''),str(yc.get('opengraph_description') or '')])
              m=banned.search(joined)
              if m: raise SystemExit(f'banned residual {id}: {m.group(0)}')
              m=awkward.search(joined)
              if m: raise SystemExit(f'awkward query residual {id}: {m.group(0)}')
              if re.search(r'\s+[,.!?;:](?!//)',after.get('content') or ''): raise SystemExit(f'punctuation spacing residual {id}')
              report.append({'id':id,'title':after.get('title'),'slug':after.get('slug'),'links_preserved':True,'link_count':len(a_links),'description':yc.get('description')})
          json.dump(report,open(root+'/editorial-fix-report.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('EDITORIAL_READBACK_OK posts=',len(report),'links_preserved=yes')
          PY

          # Verify old US slug redirects to new German slug; WordPress normally keeps old slugs for redirect handling.
          old="$site/ist-ein-online-rezept-legal-usa/"; new="$site/ist-ein-online-rezept-legal-deutschland/"
          final=$(curl -sS -L --connect-timeout 10 --max-time 45 -o /dev/null -w '%{url_effective}|%{http_code}' "$old")
          echo "OLD_SLUG_REDIRECT=$final"
          [[ "$final" == "$new|200" ]] || { echo 'Old slug did not resolve to new canonical URL' >&2; exit 1; }

      - name: Upload editorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-editorial-fix
          path: |
            ${{ runner.temp }}/dc-editorial-fix/editorial-fix-report.json
            ${{ runner.temp }}/dc-editorial-fix/before
            ${{ runner.temp }}/dc-editorial-fix/after
          retention-days: 7
          if-no-files-found: warn
