name: Temp DoctorCura Doctors Card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-doctors-card.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect DoctorCura doctor card styles
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          root="$RUNNER_TEMP/dc-doctors"; rm -rf "$root"; mkdir -p "$root"
          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"
          python3 - "$root/request.json" <<'PY'
          import json,sys
          json.dump({'version':1,'request_id':'dc-doctors-style-inspect','action':'elementor.inspect','dry_run':True,'confirm':False,'payload':{'id':900099}},open(sys.argv[1],'w'),separators=(',',':'))
          PY
          code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$root/request.json" -o "$root/result.json" -w '%{http_code}' "$base/execute")
          [[ "$code" == 200 ]]
          python3 - "$root/result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); data=d.get('data') or {}; doc=data.get('document') or {}; nodes=doc.get('data') or []
          ids={'a7fc286','1c098c6','8810bdb','3aa64a3','54f118f','429aa11','b30115e','537985a','0fe317c','908dc83','66f037a','7a7a90f','b2ea7e6','3d19027','4f4f11c'}
          def walk(items):
              for e in items if isinstance(items,list) else []:
                  if not isinstance(e,dict): continue
                  if e.get('id') in ids:
                      print('NODE '+str(e.get('id'))+' '+json.dumps({'elType':e.get('elType'),'widgetType':e.get('widgetType'),'settings':e.get('settings') or {},'child_ids':[x.get('id') for x in e.get('elements') or [] if isinstance(x,dict)]},ensure_ascii=False,separators=(',',':')))
                  walk(e.get('elements') or [])
          walk(nodes)
          print('fingerprint='+str(data.get('fingerprint') or ''))
          PY
