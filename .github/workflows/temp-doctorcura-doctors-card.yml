name: Temp DoctorCura Doctors Card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-doctors-card.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Apply compatible modern DoctorCura doctor profile
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || exit 1
          root="$RUNNER_TEMP/dc-doctors"; rm -rf "$root"; mkdir -p "$root"
          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"

          call_action(){
            suffix="$1"; action="$2"; dry="$3"; confirm="$4"; payload_file="$5"; fingerprint="${6:-}"
            req="$root/r-$suffix.json"; out="$root/o-$suffix.json"
            python3 - "$req" "$suffix" "$action" "$dry" "$confirm" "$payload_file" "$fingerprint" <<'PY'
          import json,sys
          req,suffix,action,dry,confirm,payload_path,fingerprint=sys.argv[1:]
          data={'version':1,'request_id':'dc-doctor-card2-'+suffix,'action':action,'dry_run':dry.lower()=='true','confirm':confirm.lower()=='true','payload':json.load(open(payload_path,encoding='utf-8'))}
          if fingerprint: data['expected_fingerprint']=fingerprint
          json.dump(data,open(req,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            code=$(curl -sS -L --connect-timeout 10 --max-time 180 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$req" -o "$out" -w '%{http_code}' "$base/execute")
            [[ "$code" == 200 ]] || { echo "$action HTTP $code" >&2; exit 1; }
            python3 - "$out" "$action" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok'): raise SystemExit(sys.argv[2]+': '+str(d.get('error','connector error'))[:240])
          PY
          }

          printf '%s' '{"id":900099}' > "$root/inspect.json"
          call_action inspect elementor.inspect true false "$root/inspect.json"
          python3 - "$root/o-inspect.json" "$root/patch.json" "$root/meta.json" <<'PY'
          import copy,json,sys
          src,patch_path,meta_path=sys.argv[1:]
          d=json.load(open(src,encoding='utf-8')); data=d.get('data') or {}; doc=data.get('document') or {}; nodes=doc.get('data') or []; fp=str(data.get('fingerprint') or '')
          if len(fp)!=64: raise SystemExit('Missing Elementor fingerprint')
          target=None
          def walk(items):
              global target
              for e in items if isinstance(items,list) else []:
                  if not isinstance(e,dict): continue
                  if e.get('id')=='54f118f': target=e; return
                  walk(e.get('elements') or [])
                  if target is not None: return
          walk(nodes)
          if target is None: raise SystemExit('Doctor cards container not found')
          raw=json.dumps(target,ensure_ascii=False)
          if raw.count('Lorem Ipsum')!=2 or raw.count('shutterstock_2603324581-scaled.jpg')<2: raise SystemExit('Expected placeholder state not found')
          t=copy.deepcopy(target)
          s=t.setdefault('settings',{})
          s['flex_direction']='row'; s['flex_direction_tablet']='column'; s['flex_direction_mobile']='column'
          s['flex_gap']={'unit':'px','size':0,'column':'0','row':'0','isLinked':True}
          s['flex_gap_tablet']={'unit':'px','size':0,'column':'0','row':'0','isLinked':True}
          s['flex_gap_mobile']={'unit':'px','size':0,'column':'0','row':'0','isLinked':True}
          s['background_background']='classic'; s['background_color']='#FFFFFF'; s['box_shadow_box_shadow_type']='yes'
          s['border_radius']={'unit':'px','top':'20','right':'20','bottom':'20','left':'20','isLinked':True}
          s['padding']={'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True}
          s['margin']={'unit':'rem','top':'0','right':'0','bottom':'4','left':'0','isLinked':False}
          s['margin_tablet']={'unit':'rem','top':'0','right':'1.5','bottom':'3','left':'1.5','isLinked':False}
          s['margin_mobile']={'unit':'rem','top':'0','right':'1','bottom':'2.5','left':'1','isLinked':False}

          left,right=t['elements']
          ls=left.setdefault('settings',{})
          ls['width']={'unit':'%','size':'44'}; ls['width_tablet']={'unit':'%','size':100,'sizes':[]}; ls['width_mobile']={'unit':'%','size':100,'sizes':[]}
          ls['padding']={'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True}
          ls['padding_tablet']={'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True}; ls['padding_mobile']=copy.deepcopy(ls['padding_tablet'])
          image=left['elements'][0]; ims=image.setdefault('settings',{})
          ims.pop('hide_tablet',None); ims.pop('background_xpos',None); ims.pop('flex_justify_content',None); ims.pop('flex_align_items',None); ims.pop('flex_justify_content_tablet',None)
          ims['content_width']='full'; ims['min_height']={'unit':'px','size':460,'sizes':[]}; ims['min_height_tablet']={'unit':'px','size':380,'sizes':[]}; ims['min_height_mobile']={'unit':'px','size':285,'sizes':[]}
          ims['border_radius']={'unit':'px','top':'20','right':'0','bottom':'0','left':'20','isLinked':False}
          ims['border_radius_tablet']={'unit':'px','top':'20','right':'20','bottom':'0','left':'0','isLinked':False}; ims['border_radius_mobile']=copy.deepcopy(ims['border_radius_tablet'])
          ims['padding']={'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True}; ims['padding_tablet']=copy.deepcopy(ims['padding']); ims['padding_mobile']=copy.deepcopy(ims['padding'])
          image['elements']=[]

          rs=right.setdefault('settings',{})
          rs['width']={'unit':'%','size':'56'}; rs['width_tablet']={'unit':'%','size':100,'sizes':[]}; rs['width_mobile']={'unit':'%','size':100,'sizes':[]}
          rs['padding']={'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True}; rs['padding_tablet']=copy.deepcopy(rs['padding']); rs['padding_mobile']=copy.deepcopy(rs['padding'])
          panel=right['elements'][0]; ps=panel['settings']
          keep_bg=ps.get('background_background','classic')
          panel['settings']={
            'flex_direction':'column','flex_justify_content':'center','content_width':'full','width':{'unit':'%','size':100},
            'min_height':{'unit':'px','size':460,'sizes':[]},'min_height_tablet':{'unit':'px','size':'','sizes':[]},'min_height_mobile':{'unit':'px','size':'','sizes':[]},
            'background_background':keep_bg,'background_color':'#FFFFFF','box_shadow_box_shadow_type':'yes',
            'border_radius':{'unit':'px','top':'0','right':'20','bottom':'20','left':'0','isLinked':False},
            'border_radius_tablet':{'unit':'px','top':'0','right':'0','bottom':'20','left':'20','isLinked':False},
            'border_radius_mobile':{'unit':'px','top':'0','right':'0','bottom':'20','left':'20','isLinked':False},
            'padding':{'unit':'rem','top':'3.25','right':'3.5','bottom':'3.25','left':'3.5','isLinked':False},
            'padding_tablet':{'unit':'rem','top':'2.5','right':'2.5','bottom':'2.5','left':'2.5','isLinked':False},
            'padding_mobile':{'unit':'rem','top':'1.75','right':'1.5','bottom':'1.75','left':'1.5','isLinked':False},
            'margin':{'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True}
          }
          inner=panel['elements'][0]; ins=inner['settings']
          inner['settings']={
            'content_width':'full','width':{'unit':'%','size':100,'sizes':[]},
            'flex_gap':{'column':'0.85','row':'0.85','isLinked':True,'unit':'rem','size':0.85},
            'background_background':'classic','background_color':'#FFFFFF',
            'border_radius':{'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True},
            'margin':{'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True},
            'padding':{'unit':'px','top':'0','right':'0','bottom':'0','left':'0','isLinked':True}
          }
          heading,body=inner['elements']
          hs=heading['settings']; hs['title']='Dr. Cura'; hs['typography_font_size']={'unit':'px','size':32,'sizes':[]}; hs['typography_font_size_tablet']={'unit':'px','size':30,'sizes':[]}; hs['typography_font_size_mobile']={'unit':'px','size':27,'sizes':[]}; hs['typography_font_weight']='600'; hs['typography_line_height']={'unit':'em','size':1.15,'sizes':[]}
          bs=body['settings']; bs['editor']='<p><strong>Medizinische Beurteilung von Behandlungsanfragen</strong></p><p>Dr. Cura prüft medizinische Angaben sorgfältig und beurteilt, ob die gewünschte Behandlung aus ärztlicher Sicht geeignet ist. Ein Rezept wird nur ausgestellt, wenn dies medizinisch vertretbar ist.</p><p><strong>Individuell geprüft.</strong> Jede Anfrage wird medizinisch bewertet.<br><strong>Rezept nach Eignung.</strong> Nur wenn die Behandlung ärztlich vertretbar ist.</p>'
          bs['typography_font_family']='Karla'; bs['typography_font_size']={'unit':'px','size':16,'sizes':[]}; bs['typography_font_size_mobile']={'unit':'px','size':15,'sizes':[]}; bs['typography_line_height']={'unit':'em','size':1.6,'sizes':[]}; bs['paragraph_spacing']={'unit':'px','size':10,'sizes':[]}

          json.dump({'id':900099,'element_id':'54f118f','replace':t},open(patch_path,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          json.dump({'fingerprint':fp},open(meta_path,'w',encoding='utf-8'),separators=(',',':'))
          print('baseline_fingerprint='+fp)
          PY
          fingerprint=$(python3 - "$root/meta.json" <<'PY'
          import json,sys; print(json.load(open(sys.argv[1]))['fingerprint'])
          PY
          )
          call_action dry elementor.patch_element true false "$root/patch.json" "$fingerprint"
          python3 - "$root/o-dry.json" <<'PY'
          import json,sys
          raw=json.dumps((json.load(open(sys.argv[1])).get('data') or {}).get('after_element') or {},ensure_ascii=False)
          if 'Dr. Cura' not in raw or 'Lorem Ipsum' in raw or raw.count('shutterstock_2603324581-scaled.jpg')!=1: raise SystemExit('Dry-run layout verification failed')
          print('dry_run_verified=true')
          PY
          call_action apply elementor.patch_element false true "$root/patch.json" "$fingerprint"
          printf '%s' '{}' > "$root/regenerate.json"
          call_action regenerate elementor.regenerate false true "$root/regenerate.json"
          call_action verify elementor.inspect true false "$root/inspect.json"
          python3 - "$root/o-verify.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); data=d.get('data') or {}; doc=data.get('document') or {}; found=None
          def walk(items):
              global found
              for e in items if isinstance(items,list) else []:
                  if not isinstance(e,dict): continue
                  if e.get('id')=='54f118f': found=e; return
                  walk(e.get('elements') or [])
                  if found is not None:return
          walk(doc.get('data') or [])
          if found is None: raise SystemExit('Profile container missing')
          raw=json.dumps(found,ensure_ascii=False)
          if 'Dr. Cura' not in raw or 'Lorem Ipsum' in raw or raw.count('shutterstock_2603324581-scaled.jpg')!=1: raise SystemExit('Independent Elementor readback failed')
          st=found.get('settings') or {}
          if st.get('flex_direction_tablet')!='column' or st.get('flex_direction_mobile')!='column': raise SystemExit('Responsive stack missing')
          print('independent_elementor_verification=true')
          print('responsive_verified=true')
          print('after_fingerprint='+str(data.get('fingerprint') or ''))
          PY
          html_code=$(curl -sS -L --compressed --connect-timeout 10 --max-time 60 -o "$root/page.html" -w '%{http_code}' "${SITE_URL%/}/unsere-aerzte/")
          [[ "$html_code" == 200 ]]
          grep -Fq 'Dr. Cura' "$root/page.html"
          grep -Fq 'Medizinische Beurteilung von Behandlungsanfragen' "$root/page.html"
          if grep -Fq 'Lorem Ipsum' "$root/page.html"; then exit 1; fi
          echo 'public_render_verified=true'
