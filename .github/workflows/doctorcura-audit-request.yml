name: DoctorCura SEO Audit Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'doctorcura-audits/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-seo-audit-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.guard.outputs.request_id }}
    steps:
      - name: Validate fixed DoctorCura audit marker
        id: guard
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "$GITHUB_REPOSITORY" ]] || { echo 'Fork PRs are not allowed.' >&2; exit 1; }
          actor="${{ github.event.pull_request.user.login }}"
          owner="${{ github.repository_owner }}"
          if [[ "$actor" != "$owner" && ( -z "${TRUSTED_REQUEST_ACTOR:-}" || "$actor" != "$TRUSTED_REQUEST_ACTOR" ) ]]; then
            echo 'Untrusted audit actor.' >&2
            exit 1
          fi
          root="$RUNNER_TEMP/doctorcura-audit-guard"
          rm -rf "$root" && mkdir -p "$root"
          cd "$root"
          git init repo >/dev/null && cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git branch trusted-base FETCH_HEAD
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" fetch --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git branch audit-head FETCH_HEAD
          mapfile -t changed < <(git diff --name-only trusted-base audit-head)
          count=0; marker=''
          for path in "${changed[@]}"; do
            case "$path" in
              doctorcura-audits/*.json) ((count+=1)); marker="$path" ;;
              *) echo "Disallowed DoctorCura audit path: $path" >&2; exit 1 ;;
            esac
          done
          (( count == 1 )) || { echo 'Exactly one doctorcura-audits/*.json marker is required.' >&2; exit 1; }
          git show "audit-head:$marker" > "$root/marker.json"
          request_id=$(python3 - "$root/marker.json" <<'PY'
          import json,re,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if set(d) != {'version','request_id','scope'} or d.get('version') != 1 or d.get('scope') != 'seo-indexation':
              raise SystemExit('Invalid DoctorCura audit marker.')
          rid=d.get('request_id','')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,99}',rid):
              raise SystemExit('Invalid request_id.')
          print(rid)
          PY
          )
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted DoctorCura SEO audit
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUEST_ID: ${{ needs.guard.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'main','inputs':{'pr_number':os.environ['PR_NUMBER'],'expected_head_sha':os.environ['EXPECTED_HEAD_SHA'],'request_id':os.environ['REQUEST_ID']}}))
          PY
          )
          code=$(curl --silent --show-error --location --output "$RUNNER_TEMP/dispatch.json" --write-out '%{http_code}' --request POST --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_REPO_TOKEN}" --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/doctorcura-audit-execute.yml/dispatches")
          [[ "$code" == '200' || "$code" == '204' ]] || { echo "DoctorCura audit dispatch failed: HTTP $code" >&2; exit 1; }
