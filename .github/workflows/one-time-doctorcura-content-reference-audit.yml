name: One-time DoctorCura comprehensive content reference audit

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-content-reference-audit/*.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Audit CMS objects, Elementor and rendered site for US references
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          [[ "$site" == 'https://doctorcura.com' ]] || { echo 'Unexpected target.' >&2; exit 1; }
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-content-audit"; rm -rf "$root"; mkdir -p "$root/objects" "$root/elementor"

          health=$(curl -sS -L --connect-timeout 10 --max-time 30 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/health.json" -w '%{http_code}' "$base/health")
          [[ "$health" == 200 ]] || { echo "Health failed HTTP $health" >&2; exit 1; }

          call() {
            suffix="$1"; action="$2"; payload="$3"
            python3 - "$root/r-$suffix.json" "$action" "$payload" <<'PY'
          import json,sys,uuid
          out,action,payload=sys.argv[1:]
          req={'version':1,'request_id':'dc-audit-'+uuid.uuid4().hex[:24],'action':action,'dry_run':True,'confirm':False,'payload':json.loads(payload)}
          json.dump(req,open(out,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute")
            [[ "$code" == 200 ]] || return 1
            python3 - "$root/o-$suffix.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          raise SystemExit(0 if d.get('ok') else 1)
          PY
          }

          : > "$root/object-index.tsv"
          for type in post page product elementor_library wp_block; do
            for page in $(seq 1 30); do
              payload=$(printf '{"post_type":"%s","status":"any","per_page":100,"page":%s}' "$type" "$page")
              if ! call "list-$type-$page" post.list "$payload"; then break; fi
              count=$(python3 - "$root/o-list-$type-$page.json" "$root/object-index.tsv" "$type" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); items=(d.get('data') or {}).get('items',[]); typ=sys.argv[3]
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              for x in items:
                  if isinstance(x,dict) and isinstance(x.get('id'),int):
                      f.write(f"{x['id']}\t{typ}\n")
          print(len(items))
          PY
          )
              [[ "$count" -lt 100 ]] && break
            done
          done
          sort -u "$root/object-index.tsv" -o "$root/object-index.tsv"

          while IFS=$'\t' read -r id type; do
            [[ -n "$id" ]] || continue
            if call "get-$id" post.get "{\"id\":$id}"; then cp "$root/o-get-$id.json" "$root/objects/$id.json"; fi
            if call "el-$id" elementor.inspect "{\"id\":$id}"; then cp "$root/o-el-$id.json" "$root/elementor/$id.json"; fi
          done < "$root/object-index.tsv"

          python3 - "$root" "$site" <<'PY'
          import concurrent.futures,glob,html,json,os,re,sys,urllib.parse,urllib.request,xml.etree.ElementTree as ET
          root,site=sys.argv[1:]
          patterns={
            'united_states': r'\bUnited States(?: of America)?\b|\bU\.\s*S\.\s*A?\.?\b|\bUSA\b|\bUS[- ](?:based|market|healthcare|doctor|patient|prescription|pharmacy|law|regulation|system|provider|resident|citizen)\b',
            'america_english': r'\bAmerican(?:s)?\b|\bAmerica\b',
            'german_us_terms': r'\bVereinigte Staaten\b|\bUSA\b|\bUS-amerikan(?:isch|ische|ischen|ischer|isches|ischem|ischen)\b|\bamerikan(?:isch|ische|ischen|ischer|isches|ischem)\b',
            'french_us_terms': r'\bÉtats-Unis\b|\bEtats-Unis\b|\baméricain(?:e|es|s)?\b|\bamericain(?:e|es|s)?\b',
            'us_regulators': r'\bFDA\b|Food and Drug Administration|\bDEA\b|Drug Enforcement Administration|\bHIPAA\b',
            'us_geography': r'\bNew York\b|\bCalifornia\b|\bTexas\b|\bFlorida\b|\bWashington,? D\.?C\.?\b|\bLos Angeles\b|\bChicago\b|\bBoston\b|\bMiami\b|\bSan Francisco\b',
            'us_currency': r'\bUSD\b|US\$|\$\s?\d'
          }
          def strip_html(s):
              s=re.sub(r'(?is)<script\b[^>]*>.*?</script>',' ',s)
              s=re.sub(r'(?is)<style\b[^>]*>.*?</style>',' ',s)
              return html.unescape(re.sub(r'(?s)<[^>]+>',' ',s))
          def scan_text(text):
              hits=[]
              for name,pat in patterns.items():
                  ms=list(re.finditer(pat,text,re.I))
                  if ms:
                      contexts=[]
                      for m in ms[:20]:
                          a=max(0,m.start()-220); b=min(len(text),m.end()+320)
                          contexts.append(re.sub(r'\s+',' ',text[a:b]).strip())
                      hits.append({'type':name,'matches':sorted(set(m.group(0) for m in ms))[:20],'contexts':contexts})
              return hits
          def walk_strings(v,path=''):
              if isinstance(v,str): yield path,v
              elif isinstance(v,list):
                  for i,x in enumerate(v): yield from walk_strings(x,f'{path}[{i}]')
              elif isinstance(v,dict):
                  for k,x in v.items(): yield from walk_strings(x,f'{path}.{k}' if path else str(k))

          cms=[]
          for p in glob.glob(os.path.join(root,'objects','*.json')):
              try: d=json.load(open(p,encoding='utf-8')); post=(d.get('data') or {}).get('post') or {}
              except Exception: continue
              strings=[]
              for path,val in walk_strings(post):
                  if path.endswith('content') or path.endswith('title') or 'excerpt' in path.lower() or 'description' in path.lower() or 'meta' in path.lower():
                      text=strip_html(val)
                      hits=scan_text(text)
                      if hits: strings.append({'path':path,'hits':hits})
              if strings:
                  cms.append({'source':'post.get','id':post.get('id'),'type':post.get('type'),'status':post.get('status'),'slug':post.get('slug'),'title':post.get('title'),'link':post.get('link') or post.get('url'),'matches':strings,'post':post})
          for p in glob.glob(os.path.join(root,'elementor','*.json')):
              try: d=json.load(open(p,encoding='utf-8')); doc=(d.get('data') or {}).get('document') or {}; pid=int(os.path.basename(p).split('.')[0])
              except Exception: continue
              strings=[]
              for path,val in walk_strings(doc):
                  # Ignore URL-only strings to preserve links and avoid URL-name false positives.
                  if re.match(r'^https?://',val.strip(),re.I): continue
                  hits=scan_text(strip_html(val))
                  if hits: strings.append({'path':path,'hits':hits,'value':val})
              if strings: cms.append({'source':'elementor.inspect','id':pid,'matches':strings,'document':doc})
          json.dump(cms,open(os.path.join(root,'cms-us-reference-report.json'),'w',encoding='utf-8'),ensure_ascii=False,indent=2)

          headers={'User-Agent':'Mozilla/5.0 (compatible; WebactueelDoctorCuraAudit/1.0)'}
          def fetch(url,timeout=20):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      ct=r.headers.get('Content-Type',''); data=r.read(3_000_000)
                      return r.geturl(),r.status,ct,data.decode('utf-8','replace')
              except Exception as e: return url,0,'',str(e)
          urls={site+'/',site+'/en/rezept-online-erhalten/'}
          seen_maps=set(); queue=[site+'/sitemap_index.xml',site+'/wp-sitemap.xml']
          for _ in range(3):
              nxt=[]
              for sm in queue:
                  if sm in seen_maps: continue
                  seen_maps.add(sm)
                  final,status,ct,body=fetch(sm)
                  if status!=200: continue
                  try:
                      xml=ET.fromstring(body)
                      locs=[(x.text or '').strip() for x in xml.iter() if x.tag.lower().endswith('loc')]
                  except Exception: continue
                  for loc in locs:
                      if not loc.startswith(site): continue
                      if loc.lower().endswith('.xml'): nxt.append(loc)
                      else: urls.add(loc)
              queue=nxt
          urls=sorted(urls)[:2500]
          rendered=[]
          def one(url):
              final,status,ct,body=fetch(url)
              if status!=200 or 'html' not in ct.lower(): return None
              text=strip_html(body); hits=scan_text(text)
              return {'url':url,'final_url':final,'status':status,'hits':hits} if hits else None
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for x in ex.map(one,urls):
                  if x: rendered.append(x)
          json.dump(rendered,open(os.path.join(root,'rendered-us-reference-report.json'),'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          with open(os.path.join(root,'summary.txt'),'w',encoding='utf-8') as f:
              f.write(f'cms_matching_objects={len(cms)}\nrendered_matching_urls={len(rendered)}\nscanned_rendered_urls={len(urls)}\n')
              for x in cms: f.write(f"CMS\t{x.get('source')}\t{x.get('id')}\t{x.get('slug','')}\t{x.get('title','')}\n")
              for x in rendered: f.write(f"URL\t{x['url']}\n")
          print(f'cms_matching_objects={len(cms)} rendered_matching_urls={len(rendered)} scanned_rendered_urls={len(urls)}')
          for x in cms: print('CMS',x.get('source'),x.get('id'),x.get('slug'),x.get('title'))
          for x in rendered[:100]: print('URL',x['url'])
          PY

      - name: Upload comprehensive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-content-reference-audit
          path: |
            ${{ runner.temp }}/dc-content-audit/cms-us-reference-report.json
            ${{ runner.temp }}/dc-content-audit/rendered-us-reference-report.json
            ${{ runner.temp }}/dc-content-audit/summary.txt
          retention-days: 7
          if-no-files-found: error
