name: WordPress Connector independent strict audit

on:
  push:
    branches:
      - audit/connector-strict-20261020

permissions:
  contents: read

jobs:
  full-wpcs-phpstan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install pinned WPCS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs"
          cd "$RUNNER_TEMP/wpcs"
          composer init --no-interaction --name wordpressconnector/scans --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Scan exactly checked out plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/reports/workflow-head.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/source-commit.txt"
          (cd plugin/wordpressconnector && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/reports/plugin-file-shas.txt"
          "$RUNNER_TEMP/wpcs/vendor/bin/phpcs" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/reports/wpcs.txt" 2>&1 || true
          composer install --working-dir=scripts/phpstan --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts --locked
          scripts/phpstan/vendor/bin/phpstan analyse -c scripts/phpstan/phpstan.neon --no-progress --error-format=json > "$RUNNER_TEMP/reports/phpstan.json" 2> "$RUNNER_TEMP/reports/phpstan-stderr.txt" || true
          python3 - <<'PY'
          import os, json, re, pathlib, collections
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"reports"
          s=(d/"wpcs.txt").read_text()
          n=re.search(r"A TOTAL OF ([0-9,]+) ERRORS AND ([0-9,]+) WARNINGS WERE FOUND",s)
          if not n:
            raise SystemExit("Missing WPCS total; inspect raw report.")
          result=json.loads((d/"phpstan.json").read_text())
          total=result.get("totals",{}).get("file_errors")
          if not isinstance(total,int):
            raise SystemExit("Missing PHPStan total; inspect raw report.")
          groups=collections.Counter(m.get("identifier","unknown") for file in result.get("files",{}).values() for m in file.get("messages",[]))
          summary={"audit_sha":os.environ["GITHUB_SHA"],"wpcs_errors":int(n.group(1).replace(",","")),"wpcs_warnings":int(n.group(2).replace(",","")),"phpstan_errors":total,"phpstan_families":dict(groups.most_common())}
          (d/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload evidence even if scanning fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-wpcs-phpstan-20261020
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn
          retention-days: 14

  strict-wordpress-plugin-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: plugin/wordpressconnector
          strict: 'true'
