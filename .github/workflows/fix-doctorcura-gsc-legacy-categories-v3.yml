name: DoctorCura GSC Legacy Category Redirect Fix V3

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-gsc-legacy-categories-v3.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Guard write and verify exact redirects
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/code-snippets/v1/snippets/43"
          tmp="$RUNNER_TEMP/dc-gsc-v3"; mkdir -p "$tmp"
          baseline='939d9bc10b33e053c1c668b58f13491b2ac6a87c9673bd9ae76ade739bc77c40'
          marker='DoctorCura GSC-proven legacy category redirects V8.4e'
          changed=0; helper=0

          canonical(){ python3 - "$1" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          m=re.search(r'<link[^>]+rel=["\'][^"\']*canonical[^"\']*["\'][^>]+href=["\']([^"\']+)',s,re.I)
          if not m: m=re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\'][^"\']*canonical',s,re.I)
          print(m.group(1) if m else '',end='')
          PY
          }
          first(){ local u h; u="$1"; h="$2"; curl "${c[@]}" --compressed --max-redirs 0 --dump-header "$h" --output /dev/null "$u" || true; awk '/^HTTP\//{print $2;exit}' "$h"; }
          loc(){ awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$1"; }
          make_payload(){ php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["code"=>$c,"active"=>true],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$1" "$2"; }
          put_code(){ local src label payload out http; src="$1"; label="$2"; payload="$tmp/$label.json"; out="$tmp/$label-out.json"; make_payload "$src" "$payload"; http=$(curl "${c[@]}" --location "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$api"); echo "PUT label=$label http=$http"; [[ "$http" == 200 ]]; }
          purge_wp(){
            local src label token helperfile ok; src="$1"; label="$2"; ok=0; token=$(openssl rand -hex 24); helperfile="$tmp/$label-helper.php"; cp "$src" "$helperfile"
            cat >> "$helperfile" <<PHP

          /* DoctorCura one-time cache purge helper */
          add_action( 'init', function () {
              if ( ! isset( \$_GET['doctorcura_gsc_legacy_purge'] ) || ! hash_equals( '$token', (string) \$_GET['doctorcura_gsc_legacy_purge'] ) ) return;
              if ( function_exists( 'rocket_clean_domain' ) ) rocket_clean_domain();
              if ( function_exists( 'wp_cache_flush' ) ) wp_cache_flush();
              header( 'X-DoctorCura-GSC-Legacy-Purge: done' );
          }, 1 );
          PHP
            put_code "$helperfile" "$label-install"; helper=1
            if curl "${c[@]}" --compressed --dump-header "$tmp/$label.h" --output /dev/null "$base/wp-json/?doctorcura_gsc_legacy_purge=$token"; then grep -Eiq '^x-doctorcura-gsc-legacy-purge:[[:space:]]*done' "$tmp/$label.h" && ok=1 || true; fi
            put_code "$src" "$label-remove"; helper=0; [[ "$ok" == 1 ]]
          }
          translated_guard(){
            local lang="$1" source="$2" phase="$3" round="$4" seen404=0 attempt code h location url
            for attempt in 1 2 3; do
              url="$base/$lang${source}?doctorcura_translation_guard=$phase-$round-$attempt-$(date +%s%N)"; h="$tmp/t-$phase-$round-$lang-$attempt-$(echo "$source" | tr '/-' '__').h"; code=$(first "$url" "$h"); location=$(loc "$h")
              echo "TRANSLATED_GUARD phase=$phase round=$round lang=$lang attempt=$attempt code=$code location=${location:-none}"
              case "$code" in 301|302|307|308) return 1;; 404) seen404=1; break;; 200) ;; *) return 1;; esac
            done
            [[ "$seen404" == 1 ]]
          }
          rollback(){ local rc=$?; [[ "$rc" == 0 ]] && return; echo "ROLLBACK_START rc=$rc" >&2; set +e; if [[ "$changed" == 1 || "$helper" == 1 ]]; then put_code "$tmp/original.php" rollback-original >/dev/null 2>&1 || true; purge_wp "$tmp/original.php" rollback-purge >/dev/null 2>&1 || true; fi; curl "${c[@]}" --location "${auth[@]}" --output "$tmp/rb.json" "$api" >/dev/null 2>&1 || true; if [[ -s "$tmp/rb.json" ]]; then php -r '$s=json_decode(file_get_contents($argv[1]),true);$c=(string)($s["code"]??"");echo "ROLLBACK_READBACK hash=".hash("sha256",$c)." marker=".(strpos($c,$argv[2])===false?"absent":"present")." helper=".(strpos($c,"DoctorCura one-time cache purge helper")===false?"absent":"present").PHP_EOL;' "$tmp/rb.json" "$marker" || true; fi; echo ROLLBACK_ATTEMPTED >&2; }
          trap rollback EXIT

          echo '=== PREFLIGHT ==='
          http=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/current.json" --write-out '%{http_code}' "$api"); [[ "$http" == 200 ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");$tokens=["DoctorCura gewichtsverlust legacy final redirect V8.4b","DoctorCura datenschutz root-only migration V8.4c","DoctorCura product variation hreflang cleanup V8.4d"];if((int)($s["id"]??0)!==43||($s["name"]??"")!=="DoctorCura SEO indexation cleanup"||empty($s["active"])||hash("sha256",$c)!==$argv[3]||strpos($c,$argv[4])!==false||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);foreach($tokens as $t){if(substr_count($c,$t)!==1)exit(3);}file_put_contents($argv[2],$c);echo "BASELINE hash=".hash("sha256",$c).PHP_EOL;' "$tmp/current.json" "$tmp/original.php" "$baseline" "$marker"
          while IFS='|' read -r source target; do
            [[ -n "$source" ]] || continue
            code=$(first "$base$source?doctorcura_pre=$(date +%s%N)" "$tmp/pre.h"); [[ "$code" == 404 ]] || { echo "SOURCE_FAIL source=$source code=$code" >&2; exit 1; }
            body="$tmp/target.html"; status=$(curl "${c[@]}" --compressed --output "$body" --write-out '%{http_code}' "$base$target"); can=$(canonical "$body"); [[ "$status" == 200 && "$can" == "$base$target" ]] || exit 1
            translated_guard fr "$source" pre 0; translated_guard en "$source" pre 0
            echo "PAIR_PREFLIGHT_OK source=$source target=$target"
          done <<'MAP'
          /product-categorie/hiv-praevention-prep/|/product-category/hiv-praevention-prep/
          /product-categorie/quit-smoking/|/product-category/rauchstopp/
          /product-categorie/schlafprobleme/|/product-category/schlafprobleme/
          MAP
          for pair in '/product-categorie/gewichtsverlust/|/product-category/gewichtsverlust/' '/datenschutz/|/privacy-policy/' '/product-categorie/sexual-problems/|/product-category/sexuelle-probleme/' '/product-categorie/menstruation-verschieben/|/product-category/menstruation-verschieben/'; do source=${pair%%|*}; target=${pair#*|}; h="$tmp/pre-canary.h"; code=$(first "$base$source" "$h"); location=$(loc "$h"); [[ "$code" == 301 && "$location" == "$base$target" ]] || exit 1; done
          [[ $(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/16/") == 200 ]]
          [[ $(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/17/") == 404 ]]

          cp "$tmp/original.php" "$tmp/new.php"
          cat >> "$tmp/new.php" <<'PHP'

          /* DoctorCura GSC-proven legacy category redirects V8.4e - 2026-09-10 */
          add_action( 'template_redirect', function () {
              if ( ! empty( $_SERVER['HTTP_X_GT_LANG'] ) ) return;
              $request_uri = isset( $_SERVER['REQUEST_URI'] ) ? (string) $_SERVER['REQUEST_URI'] : '';
              $path = wp_parse_url( $request_uri, PHP_URL_PATH );
              if ( ! is_string( $path ) || '' === $path ) return;
              $path = '/' . trim( $path, '/' ) . '/';
              $map = array(
                  '/product-categorie/hiv-praevention-prep/' => '/product-category/hiv-praevention-prep/',
                  '/product-categorie/quit-smoking/' => '/product-category/rauchstopp/',
                  '/product-categorie/schlafprobleme/' => '/product-category/schlafprobleme/',
              );
              if ( isset( $map[ $path ] ) ) {
                  wp_safe_redirect( home_url( $map[ $path ] ), 301, 'DoctorCura migration' );
                  exit;
              }
          }, 0 );
          PHP
          newhash=$(sha256sum "$tmp/new.php" | awk '{print $1}')
          echo '=== WRITE ==='; put_code "$tmp/new.php" apply; changed=1; purge_wp "$tmp/new.php" apply-purge
          curl "${c[@]}" --location "${auth[@]}" --output "$tmp/after.json" "$api"
          after=$(php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||substr_count($c,$argv[2])!==1||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);echo hash("sha256",$c);' "$tmp/after.json" "$marker"); [[ "$after" == "$newhash" ]]; echo "READBACK hash=$after helper=absent"

          for round in 1 2; do
            while IFS='|' read -r source target; do
              [[ -n "$source" ]] || continue
              probe="$base$source?doctorcura_verify=$round-$(date +%s%N)"; h="$tmp/v-$round.h"; code=$(first "$probe" "$h"); location=$(loc "$h"); cache=$(awk 'BEGIN{IGNORECASE=1}/^x-hcdn-cache-status:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$h")
              [[ "$code" == 301 && "$location" == "$base$target" && "${cache:-}" != HIT ]] || { echo "ORIGIN_FAIL round=$round source=$source code=$code cache=${cache:-none} location=$location" >&2; exit 1; }
              body="$tmp/f-$round.html"; result=$(curl "${c[@]}" --location --compressed --output "$body" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$probe"); IFS=$'\t' read -r status final redirects <<< "$result"; can=$(canonical "$body"); [[ "$status" == 200 && "$final" == "$base$target" && "$redirects" == 1 && "$can" == "$base$target" ]] || exit 1
              translated_guard fr "$source" post "$round"; translated_guard en "$source" post "$round"
              echo "PAIR_OK round=$round source=$source final=$final"
            done <<'MAP'
          /product-categorie/hiv-praevention-prep/|/product-category/hiv-praevention-prep/
          /product-categorie/quit-smoking/|/product-category/rauchstopp/
          /product-categorie/schlafprobleme/|/product-category/schlafprobleme/
          MAP
            for pair in '/product-categorie/gewichtsverlust/|/product-category/gewichtsverlust/' '/datenschutz/|/privacy-policy/' '/product-categorie/sexual-problems/|/product-category/sexuelle-probleme/' '/product-categorie/menstruation-verschieben/|/product-category/menstruation-verschieben/'; do source=${pair%%|*}; target=${pair#*|}; h="$tmp/canary-$round.h"; code=$(first "$base$source" "$h"); location=$(loc "$h"); [[ "$code" == 301 && "$location" == "$base$target" ]] || exit 1; done
            [[ $(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/16/") == 200 ]]
            p17=$(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/17/"); if [[ "$p17" != 404 ]]; then sleep 2; p17=$(curl "${c[@]}" --compressed --output /dev/null --write-out '%{http_code}' "$base/blogs/17/"); fi; [[ "$p17" == 404 ]]
            echo "ROUND_OK=$round"
          done

          edge_pending=0
          while IFS='|' read -r source target; do [[ -n "$source" ]] || continue; h="$tmp/edge.h"; code=$(first "$base$source" "$h"); location=$(loc "$h"); cache=$(awk 'BEGIN{IGNORECASE=1}/^x-hcdn-cache-status:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$h"); echo "EDGE source=$source code=$code cache=${cache:-none} location=${location:-none}"; [[ "$code" == 301 && "$location" == "$base$target" ]] || edge_pending=1; done <<'MAP'
          /product-categorie/hiv-praevention-prep/|/product-category/hiv-praevention-prep/
          /product-categorie/quit-smoking/|/product-category/rauchstopp/
          /product-categorie/schlafprobleme/|/product-category/schlafprobleme/
          MAP
          trap - EXIT
          if [[ "$edge_pending" == 0 ]]; then echo "GSC_LEGACY_CATEGORY_FIX_GREEN snippet_hash=$newhash"; else echo "GSC_LEGACY_CATEGORY_ORIGIN_GREEN_EDGE_PENDING snippet_hash=$newhash"; fi
