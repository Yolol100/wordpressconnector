name: Audit DoctorCura Code Snippets Update Contract

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect Code Snippets update schema read-only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-snippet-options"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          endpoint="$base/wp-json/code-snippets/v1/snippets/43"

          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --request OPTIONS --output "$tmp/options.json" --write-out '%{http_code}' "$endpoint")
          echo "options_http=$code"
          [[ "$code" == '200' ]]
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "methods=".implode(",",$d["methods"]??[]).PHP_EOL;foreach(($d["endpoints"]??[])as$e){echo "endpoint_methods=".implode(",",$e["methods"]??[]).PHP_EOL;foreach(($e["args"]??[])as$k=>$v){if(in_array($k,["id","name","code","scope","active","priority"],true))echo "arg=$k required=".json_encode($v["required"]??null)." type=".json_encode($v["type"]??null)." default=".json_encode($v["default"]??null).PHP_EOL;}}' "$tmp/options.json"

          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$endpoint" > "$tmp/snippet.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "current_id=".($s["id"]??"")." active=".json_encode($s["active"]??null)." name=".($s["name"]??"").PHP_EOL;echo "top_keys=".implode(",",array_keys($s)).PHP_EOL;' "$tmp/snippet.json"
          echo 'SNIPPET_OPTIONS_AUDIT_COMPLETE'
