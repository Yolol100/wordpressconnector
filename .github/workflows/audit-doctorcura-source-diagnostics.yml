name: Audit DoctorCura SEO Source Diagnostics

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect targeted remaining SEO anomalies
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-targeted"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')

          echo '=== REDIRECT SOURCE HEADERS ==='
          for path in '/product-categorie/gewichtsverlust/' '/de/about-us/' '/comments/feed/' '/category/blogs/'; do
            curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --dump-header "$tmp/h" --output /dev/null "$base$path"
            echo "-- $path --"
            awk 'BEGIN{IGNORECASE=1}/^HTTP\//||/^location:|^x-redirect-by:|^x-robots-tag:|^x-gt-/{gsub(/\r/,"");print}' "$tmp/h"
          done

          echo '=== EPIPEN PARAMETER HREFLANG ==='
          q='?attribute_pa_medication-strength=300mcg&attribute_pa_amount=3&attribute_pa_medication=epipen'
          for path in "/product/epipen/$q" "/fr/product/epipen/$q" "/en/product/epipen/$q"; do
            curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base$path" > "$tmp/epipen.html"
            echo "-- $path --"
            grep -Eio '<link[^>]+rel="(canonical|alternate)"[^>]*>|<link[^>]+hreflang="[^"]+"[^>]*>' "$tmp/epipen.html" | grep -Ei 'canonical|hreflang' | head -20 || true
          done

          echo '=== BROKEN FEATURED IMAGE PAGE SOURCE ==='
          slug='welche-medikamente-beeinflussen-die-erektion'
          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base/$slug/" > "$tmp/post.html"
          grep -Ein 'featured|og:image|twitter:image|wp-post-image|welche-medikamente-beeinflussen-die-erektion-featured' "$tmp/post.html" | head -30 || true

          echo '=== WP REST POST + MEDIA ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/wp/v2/posts?slug=$slug&context=edit&_fields=id,slug,status,featured_media,link,title,content,meta" > "$tmp/post.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); foreach($d as $p){echo "post_id=".($p["id"]??"")." featured_media=".($p["featured_media"]??"")." link=".($p["link"]??"").PHP_EOL; $c=(string)($p["content"]["raw"]??$p["content"]["rendered"]??""); foreach(preg_split("/\R/",$c) as $i=>$line){if(stripos($line,"welche-medikamente")!==false||stripos($line,"<img")!==false)echo "content:".($i+1).":".substr($line,0,500).PHP_EOL;}}' "$tmp/post.json"
          media_id=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo (int)($d[0]["featured_media"]??0);' "$tmp/post.json")
          if [[ "$media_id" != '0' ]]; then
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/wp/v2/media/$media_id?context=edit&_fields=id,slug,status,source_url,alt_text,media_details,caption,title" > "$tmp/media.json"
            php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo "media_id=".($m["id"]??"")." source_url=".($m["source_url"]??"")." alt=".($m["alt_text"]??"")." title=".($m["title"]["raw"]??$m["title"]["rendered"]??"").PHP_EOL; echo "file=".($m["media_details"]["file"]??"").PHP_EOL;' "$tmp/media.json"
          fi

          echo '=== POST SITEMAP DUPLICATE CONTEXT ==='
          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base/post-sitemap.xml" > "$tmp/post-sitemap.xml"
          grep -n -B3 -A8 '<loc>https://doctorcura.com/welche-medikamente-beeinflussen-die-erektion/</loc>' "$tmp/post-sitemap.xml" || true

          echo '=== SHOP DUPLICATE SITEMAP CONTEXT ==='
          for sm in page-sitemap.xml product-sitemap.xml; do
            curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base/$sm" > "$tmp/$sm"
            echo "-- $sm --"
            grep -n -B2 -A5 '<loc>https://doctorcura.com/shop/</loc>' "$tmp/$sm" || true
          done

          echo '=== LANGUAGE SWITCHER LINKS ==='
          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base/" > "$tmp/home.html"
          grep -Eio '<a[^>]+(?:data-gt-lang="(fr|en)"|href="https?://doctorcura\.com/(fr|en)"[^/]?)[^>]*>' "$tmp/home.html" | head -40 || true
          grep -Eio 'href="https?://doctorcura\.com/(fr|en)"' "$tmp/home.html" | sort | uniq -c || true

          echo '=== PAGE-1 PAGINATION LINKS ==='
          for path in '/shop/page/2/' '/product-category/alle-medikamente/page/2/' '/blogs/2/'; do
            curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base$path" > "$tmp/p.html"
            echo "-- $path --"
            grep -Eio 'href="[^"]+/page/1/"' "$tmp/p.html" | sort -u | head -20 || true
          done
