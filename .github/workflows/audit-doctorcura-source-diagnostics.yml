name: Audit DoctorCura Elementor Image Owner

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Find the Elementor document that owns widget 695868ca
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-elementor-owner"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          page="$base/welche-medikamente-beeinflussen-die-erektion/?dc_owner=1"

          curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 "$page" > "$tmp/live.html"
          echo '=== ELEMENTOR DOCUMENT IDS NEAR WIDGET ==='
          widget_line=$(grep -n 'data-id="695868ca"' "$tmp/live.html" | head -1 | cut -d: -f1 || true)
          echo "widget_line=$widget_line"
          if [[ -n "$widget_line" ]]; then
            start=$(( widget_line > 250 ? widget_line-250 : 1 ))
            sed -n "${start},${widget_line}p" "$tmp/live.html" | grep -E 'data-elementor-id=|elementor-location-|data-elementor-type=' | tail -30 || true
          fi
          echo '=== ALL ELEMENTOR ROOTS ==='
          grep -Eio '<div[^>]+data-elementor-(id|type)=[^>]*>' "$tmp/live.html" | head -80 || true

          echo '=== REST TYPES MATCHING ELEMENTOR ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/wp/v2/types?context=edit" > "$tmp/types.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($d as$k=>$v){$r=(string)($v["rest_base"]??"");$n=(string)($v["name"]??"");if(stripos($k,"elementor")!==false||stripos($r,"elementor")!==false||stripos($n,"elementor")!==false)echo "type=$k rest_base=$r name=$n\n";}' "$tmp/types.json"

          echo '=== TRY ELEMENTOR LIBRARY REST ==='
          for endpoint in elementor_library e-landing-page; do
            code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --output "$tmp/$endpoint.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/$endpoint?context=edit&per_page=100")
            echo "$endpoint http=$code"
            if [[ "$code" == '200' ]]; then
              php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "count=".count($d).PHP_EOL;foreach($d as$p){$raw=json_encode($p,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE);if(strpos($raw,"695868ca")!==false||strpos($raw,"900069")!==false||strpos($raw,"welche-medikamente-beeinflussen-die-erektion-featured")!==false)echo "MATCH id=".($p["id"]??"")." slug=".($p["slug"]??"")." status=".($p["status"]??"")." title=".($p["title"]["raw"]??$p["title"]["rendered"]??"")." link=".($p["link"]??"").PHP_EOL;}' "$tmp/$endpoint.json"
            else head -c 300 "$tmp/$endpoint.json" || true; echo; fi
          done

          echo '=== WP REST SEARCH BY TEMPLATE TITLES ==='
          for q in single post blog; do
            code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "search=$q" --data-urlencode 'context=edit' --data-urlencode 'per_page=100' --output "$tmp/search-$q.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/elementor_library")
            echo "search=$q http=$code"
            if [[ "$code" == '200' ]]; then php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($d as$p)echo " id=".($p["id"]??"")." status=".($p["status"]??"")." slug=".($p["slug"]??"")." title=".($p["title"]["raw"]??$p["title"]["rendered"]??"").PHP_EOL;' "$tmp/search-$q.json"; fi
          done

          echo '=== REST ROUTES CONTAINING ELEMENTOR ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/" > "$tmp/root.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach(($d["routes"]??[])as$r=>$v){if(stripos($r,"elementor")!==false)echo $r.PHP_EOL;}' "$tmp/root.json" | head -120
          echo 'ELEMENTOR_OWNER_AUDIT_COMPLETE'
