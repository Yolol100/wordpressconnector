name: Audit DoctorCura Remaining Routes

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Read-only route, canonical, pagination and snippet probe
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-remaining-routes"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          canonical_of(){ local f="$1"; grep -Eio '<link[^>]+rel="canonical"[^>]+href="[^"]+"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true; }
          probe(){
            local label="$1" path="$2" html="$tmp/$label.html" result canon first
            result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 45 --dump-header "$tmp/$label.h" --output "$html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base$path")
            first=$(awk '/^HTTP\//{print $2; exit}' "$tmp/$label.h" || true)
            canon=$(canonical_of "$html")
            printf '%s\t%s\tfirst=%s\tcanonical=%s\n' "$label" "$result" "$first" "$canon"
          }

          echo '=== CURRENT SNIPPET ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/code-snippets/v1/snippets/43" > "$tmp/snippet.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");echo "id=".($s["id"]??"")." name=".($s["name"]??"")." active=".(!empty($s["active"])?"true":"false")." sha256=".hash("sha256",$c).PHP_EOL;foreach(["DoctorCura blog pagination cleanup V8.2","DoctorCura legacy taxonomy migration V11","DoctorCura article social image alignment V8.3"] as$m){echo $m."=".(strpos($c,$m)!==false?"yes":"no").PHP_EOL;}' "$tmp/snippet.json"

          echo '=== PAGINATION ==='
          for spec in \
            'p16:/blogs/16/' 'p17:/blogs/17/' \
            'fr16:/fr/blogs/16/' 'fr17:/fr/blogs/17/' \
            'en16:/en/blogs/16/' 'en17:/en/blogs/17/' \
            'alias:/blogs/page/5/' 'fralias:/fr/blogs/page/5/' 'enalias:/en/blogs/page/5/'; do
            probe "${spec%%:*}" "${spec#*:}"
          done

          echo '=== LEGACY ROUTES ==='
          for spec in \
            'weight-de:/product-categorie/gewichtsverlust/' \
            'weight-fr:/fr/product-categorie/gewichtsverlust/' \
            'weight-en:/en/product-categorie/gewichtsverlust/' \
            'sexual-fr:/fr/product-categorie/sexual-problems/' \
            'privacy-de:/datenschutz/' 'privacy-fr:/fr/datenschutz/' 'privacy-en:/en/datenschutz/'; do
            probe "${spec%%:*}" "${spec#*:}"
          done

          echo '=== INTENDED TARGETS ==='
          for spec in \
            'weight-target-de:/product-category/gewichtsverlust/' \
            'weight-target-fr:/fr/product-category/gewichtsverlust/' \
            'weight-target-en:/en/product-category/gewichtsverlust/' \
            'sexual-target:/product-category/sexuelle-probleme/' \
            'privacy-target:/privacy-policy/'; do
            probe "${spec%%:*}" "${spec#*:}"
          done

          echo 'DOCTORCURA_REMAINING_ROUTE_AUDIT_COMPLETE'
