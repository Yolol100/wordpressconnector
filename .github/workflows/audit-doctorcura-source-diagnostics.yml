name: Audit DoctorCura Cache Plugins And Headers

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect cache stack read-only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-cache-stack"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')

          echo '=== ACTIVE PLUGINS REST ==='
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --output "$tmp/plugins.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/plugins?status=active&per_page=100")
          echo "plugins_http=$code"
          if [[ "$code" == '200' ]]; then
            php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($d as$p){$plugin=(string)($p["plugin"]??"");$name=(string)($p["name"]??"");if(preg_match("/(cache|rocket|lite|hostinger|cdn|optimi)/i",$plugin." ".$name))echo "plugin=".$plugin." name=".$name." status=".($p["status"]??"").PHP_EOL;}' "$tmp/plugins.json"
          else
            head -c 500 "$tmp/plugins.json" || true; echo
          fi

          echo '=== ALL RESPONSE HEADERS ==='
          for path in '/welche-medikamente-beeinflussen-die-erektion/' '/welche-medikamente-beeinflussen-die-erektion-2/' '/wp-json/'; do
            echo "-- $path --"
            curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --dump-header "$tmp/h.txt" --output /dev/null "$base$path"
            tr -d '\r' < "$tmp/h.txt" | grep -Ei '^(HTTP/|server:|cache-control:|age:|x-|cf-|via:|etag:|last-modified:)' || true
          done

          echo '=== REST NAMESPACES CACHE/HOSTINGER ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/" > "$tmp/root.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach(($d["namespaces"]??[])as$n){if(preg_match("/(lite|cache|rocket|hostinger|cdn)/i",$n))echo "namespace=$n\n";}' "$tmp/root.json"

          echo 'CACHE_STACK_AUDIT_COMPLETE'
