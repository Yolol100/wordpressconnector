name: Audit DoctorCura Rollback And Snippet 43

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Verify rollback and inspect snippet 43
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-snippet43"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          wpapi="$base/wp-json/wp/v2"
          redapi="$base/wp-json/redirection/v1"

          echo '=== VERIFY SECOND ROLLBACK ==='
          for source in '/datenschutz/' '/product-categorie/gewichtsverlust/' '/welche-medikamente-beeinflussen-die-erektion-2/'; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "filterBy[url]=$source" --data-urlencode 'per_page=20' "$redapi/redirect" > "$tmp/red.json"
            total=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($d["total"]??0);' "$tmp/red.json")
            echo "redirect_source=$source total=$total"
          done
          for id in 900066 900067; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/$id?context=edit" > "$tmp/p$id.json"
            php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "post=".($p["id"]??"")." status=".($p["status"]??"")." slug=".($p["slug"]??"")." featured=".($p["featured_media"]??0).PHP_EOL;' "$tmp/p$id.json"
          done
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/pages/11?context=edit" > "$tmp/terms.json"
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$raw=(string)($p["content"]["raw"]??"");echo "terms_http_www_count=".substr_count($raw,"href=\"http://www.doctorcura.com\"").PHP_EOL;' "$tmp/terms.json"

          echo '=== SNIPPET 43 METADATA ==='
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 35 "${auth[@]}" --output "$tmp/snippet43.json" --write-out '%{http_code}' "$base/wp-json/code-snippets/v1/snippets/43")
          echo "snippet_rest_status=$code"
          [[ "$code" == '200' ]] || exit 1
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "id=".($s["id"]??"")." name=".($s["name"]??"")." active=".json_encode($s["active"]??null)." scope=".($s["scope"]??"")." code_sha=".hash("sha256",(string)($s["code"]??""))." code_len=".strlen((string)($s["code"]??"")).PHP_EOL;' "$tmp/snippet43.json"
          echo '=== SNIPPET 43 CODE START ==='
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(string)($s["code"]??"");' "$tmp/snippet43.json"
          echo
          echo '=== SNIPPET 43 CODE END ==='
