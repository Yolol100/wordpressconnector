name: Audit DoctorCura Phase 2B Featured Image Source

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Trace the rendered featured image source read-only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-phase2b-source"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          postapi="$base/wp-json/wp/v2/posts/900067?context=edit"
          page="$base/welche-medikamente-beeinflussen-die-erektion/"

          echo '=== ACTIVE THEME ==='
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --output "$tmp/themes.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/themes?status=active")
          echo "themes_http=$code"
          if [[ "$code" == '200' ]]; then
            php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($d as$t)echo "stylesheet=".($t["stylesheet"]??"")." template=".($t["template"]??"")." name=".($t["name"]["rendered"]??$t["name"]??"")." version=".($t["version"]??"").PHP_EOL;' "$tmp/themes.json"
          else head -c 600 "$tmp/themes.json" || true; echo; fi

          echo '=== POST REST FEATURED LINK ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$postapi" > "$tmp/post.json"
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "id=".($p["id"]??"")." status=".($p["status"]??"")." slug=".($p["slug"]??"")." featured_media=".($p["featured_media"]??0).PHP_EOL;echo "featured_link=".($p["_links"]["wp:featuredmedia"][0]["href"]??"").PHP_EOL;echo "classes=".json_encode($p["class_list"]??[]).PHP_EOL;' "$tmp/post.json"

          echo '=== FEATURED MEDIA RECORDS ==='
          for id in 900069 5925; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/wp/v2/media/$id?context=edit" > "$tmp/m$id.json"
            php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "id=".($m["id"]??"")." status=".($m["status"]??"")." parent=".($m["post"]??0)." source=".($m["source_url"]??"")." file=".($m["media_details"]["file"]??"")." width=".($m["media_details"]["width"]??"")." height=".($m["media_details"]["height"]??"").PHP_EOL;echo "sizes=".implode(",",array_keys($m["media_details"]["sizes"]??[])).PHP_EOL;' "$tmp/m$id.json"
          done

          echo '=== LIVE BROKEN IMAGE ELEMENT CONTEXT ==='
          curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 "$page?dc_trace=featured" > "$tmp/live.html"
          grep -Eio '<img[^>]+welche-medikamente-beeinflussen-die-erektion-featured[^>]*>' "$tmp/live.html" | head -10 || true
          echo '=== PARENT CONTEXT LINES ==='
          tr '>' '>\n' < "$tmp/live.html" | grep -n -B3 -A3 'welche-medikamente-beeinflussen-die-erektion-featured' | head -80 || true
          echo '=== WP POST IMAGE CLASSES ==='
          grep -Eio '<img[^>]+class="[^"]*(wp-post-image|attachment-[^"]*)[^"]*"[^>]*>' "$tmp/live.html" | head -20 || true
          echo '=== OG/TWITTER IMAGE ==='
          grep -Eio '<meta[^>]+(property|name)="(og:image|twitter:image)"[^>]*>' "$tmp/live.html" | head -20 || true

          echo '=== ALL REFERENCES TO MEDIA IDS/FILENAMES ==='
          for needle in '900069' '5925' 'welche-medikamente-beeinflussen-die-erektion-featured' 'beste-optionen-bei-erektionsstoerungen-featured'; do
            echo "-- $needle --"
            grep -Eio ".{0,180}$needle.{0,220}" "$tmp/live.html" | head -12 || true
          done

          echo '=== WP ROCKET ROUTES ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/" > "$tmp/root.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach(($d["routes"]??[])as$r=>$v){if(stripos($r,"wp-rocket")!==false)echo $r.PHP_EOL;}' "$tmp/root.json"

          echo 'PHASE2B_SOURCE_TRACE_COMPLETE'
