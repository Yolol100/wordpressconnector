name: Audit DoctorCura SEO Source Diagnostics

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Find existing valid related media and source posts
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-media-search"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')

          echo '=== RELATED POSTS AND FEATURED MEDIA ==='
          for slug in \
            'viagra-online-mit-arztpruefung' \
            'cialis-wirkung-und-vertraeglichkeit' \
            'online-arztgespraech-bei-potenzproblemen' \
            'welche-medikamente-beeinflussen-die-erektion'; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/wp/v2/posts?slug=$slug&context=edit&per_page=10" > "$tmp/post.json"
            php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); foreach($d as$p){echo "slug=".($p["slug"]??"")." id=".($p["id"]??"")." status=".($p["status"]??"")." featured=".($p["featured_media"]??0)." title=".($p["title"]["raw"]??"").PHP_EOL;}' "$tmp/post.json"
            ids=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($d as$p){$id=(int)($p["featured_media"]??0);if($id)echo$id."\n";}' "$tmp/post.json")
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --output "$tmp/media.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/media/$id?context=edit")
              if [[ "$code" == '200' ]]; then
                src=$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(string)($m["source_url"]??"");' "$tmp/media.json")
                alt=$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo preg_replace("/\s+/"," ",(string)($m["alt_text"]??""));' "$tmp/media.json")
                title=$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo preg_replace("/\s+/"," ",(string)($m["title"]["raw"]??$m["title"]["rendered"]??""));' "$tmp/media.json")
                http=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$src")
                echo "  media=$id http=$http src=$src alt=$alt title=$title"
              fi
            done <<< "$ids"
          done

          echo '=== MEDIA SEARCH ==='
          for term in 'erektion' 'potenz' 'erectile' 'viagra' 'cialis' 'medikamente'; do
            echo "-- search=$term --"
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get \
              --data-urlencode "search=$term" --data-urlencode 'context=edit' --data-urlencode 'per_page=50' \
              "$base/wp-json/wp/v2/media" > "$tmp/search.json"
            php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($d as$m){echo "id=".($m["id"]??"")." parent=".($m["post"]??0)." date=".($m["date_gmt"]??"")." src=".($m["source_url"]??"")." alt=".preg_replace("/\s+/"," ",(string)($m["alt_text"]??""))." title=".preg_replace("/\s+/"," ",(string)($m["title"]["raw"]??$m["title"]["rendered"]??"")).PHP_EOL;}' "$tmp/search.json" | head -50
          done

          echo '=== NEARBY RECENT MEDIA ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get \
            --data-urlencode 'after=2026-09-08T00:00:00' --data-urlencode 'before=2026-09-10T23:59:59' --data-urlencode 'context=edit' --data-urlencode 'per_page=100' \
            "$base/wp-json/wp/v2/media" > "$tmp/recent.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($d as$m){echo "id=".($m["id"]??"")." parent=".($m["post"]??0)." date=".($m["date_gmt"]??"")." src=".($m["source_url"]??"")." alt=".preg_replace("/\s+/"," ",(string)($m["alt_text"]??""))." title=".preg_replace("/\s+/"," ",(string)($m["title"]["raw"]??$m["title"]["rendered"]??"")).PHP_EOL;}' "$tmp/recent.json" | head -100
