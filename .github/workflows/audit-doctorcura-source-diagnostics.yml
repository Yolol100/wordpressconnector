name: Audit DoctorCura Elementor Cache Capability

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect Elementor cache REST contract read-only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-el-cache"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')

          echo '=== ROUTE CONTRACT FROM ROOT ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/" > "$tmp/root.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach(["/elementor/v1/cache","/elementor/v1/post"]as$r){echo "-- $r --\n";echo json_encode($d["routes"][$r]??null,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";}' "$tmp/root.json"

          echo '=== OPTIONS CACHE ==='
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --request OPTIONS --output "$tmp/cache-options.json" --write-out '%{http_code}' "$base/wp-json/elementor/v1/cache")
          echo "options_http=$code"
          cat "$tmp/cache-options.json" | head -c 5000; echo

          echo '=== GET CACHE ==='
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --output "$tmp/cache-get.json" --write-out '%{http_code}' "$base/wp-json/elementor/v1/cache")
          echo "get_http=$code"
          cat "$tmp/cache-get.json" | head -c 3000; echo

          echo '=== OPTIONS TEMPLATE WRITE ==='
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --request OPTIONS --output "$tmp/template-options.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/elementor_library/5841")
          echo "template_options_http=$code"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo "methods=".implode(",",$d["methods"]??[]).PHP_EOL;$m=$d["schema"]["properties"]["meta"]["properties"]["_elementor_data"]??[];echo "elementor_data_schema=".json_encode($m,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;' "$tmp/template-options.json"
          echo 'ELEMENTOR_CACHE_CAPABILITY_COMPLETE'
