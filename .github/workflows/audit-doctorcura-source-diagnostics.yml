name: Diagnose DoctorCura Yoast Social Meta

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Probe hidden Yoast social metadata and restore exact snippet
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-yoast-meta-probe"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/code-snippets/v1/snippets/43"
          expected_hash='8122c4a08ebf1c6bc29eda1561e38658a2e41bef239cc65102ba7251af83ed35'
          helper_b64=''
          helper_written=0

          put_payload(){ local payload="$1" out="$2"; curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$api"; }
          make_payload(){ local codefile="$1" outfile="$2"; php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["code"=>$c,"active"=>true],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$codefile" "$outfile"; }
          restore(){
            make_payload "$tmp/original.php" "$tmp/restore.json"
            [[ "$(put_payload "$tmp/restore.json" "$tmp/restore-response.json")" == '200' ]]
            helper_written=0
          }
          cleanup(){
            rc=$?
            if [[ "$helper_written" == '1' ]]; then set +e; restore >/dev/null 2>&1 || true; fi
            exit "$rc"
          }
          trap cleanup EXIT

          http=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --output "$tmp/current.json" --write-out '%{http_code}' "$api")
          [[ "$http" == '200' ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if((int)($s["id"]??0)!==43||($s["name"]??"")!=="DoctorCura SEO indexation cleanup"||empty($s["active"])||hash("sha256",$c)!==$argv[3]||strpos($c,"DoctorCura one-time Yoast social meta probe")!==false)exit(2);file_put_contents($argv[2],$c);echo"snippet_preflight=active_v82\n";' "$tmp/current.json" "$tmp/original.php" "$expected_hash"

          token=$(openssl rand -hex 24)
          cp "$tmp/original.php" "$tmp/helper.php"
          printf '%s' "$helper_b64" | base64 -d >> "$tmp/helper.php"
          sed -i "s/__TOKEN__/$token/g" "$tmp/helper.php"
          make_payload "$tmp/helper.php" "$tmp/helper.json"
          [[ "$(put_payload "$tmp/helper.json" "$tmp/helper-response.json")" == '200' ]]
          helper_written=1

          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --dump-header "$tmp/probe.h" --output /dev/null "$base/wp-json/?doctorcura_social_probe=$token"
          encoded=$(sed -n 's/^x-doctorcura-social-meta:[[:space:]]*//Ip' "$tmp/probe.h" | tr -d '\r' | head -1)
          [[ -n "$encoded" ]]
          printf '%s' "$encoded" | base64 -d > "$tmp/meta.json"
          php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($m as$k=>$v){echo $k."=".json_encode($v,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;}' "$tmp/meta.json"

          restore
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$api" > "$tmp/readback.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||hash("sha256",$c)!==$argv[2]||strpos($c,"DoctorCura one-time Yoast social meta probe")!==false)exit(2);echo"snippet_readback=active_v82_exact\n";' "$tmp/readback.json" "$expected_hash"
          trap - EXIT
          echo 'YOAST_SOCIAL_META_PROBE_COMPLETE'
