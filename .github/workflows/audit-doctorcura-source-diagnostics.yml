name: Audit DoctorCura Phase 2 Image Context

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect broken image usage read-only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-phase2-img"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          url="$base/welche-medikamente-beeinflussen-die-erektion/"
          broken="$base/wp-content/uploads/2026/09/welche-medikamente-beeinflussen-die-erektion-featured.webp"
          candidate="$base/wp-content/uploads/2026/06/beste-optionen-bei-erektionsstoerungen-featured.webp"

          curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 "$url" > "$tmp/live.html"
          echo '=== META IMAGE TAGS ==='
          grep -Eio '<meta[^>]+(og:image|twitter:image)[^>]*>' "$tmp/live.html" || true
          echo '=== TAGS CONTAINING BROKEN URL ==='
          grep -Eio '<[^>]+welche-medikamente-beeinflussen-die-erektion-featured[^>]*>' "$tmp/live.html" | head -30 || true
          echo '=== TAGS CONTAINING CANDIDATE URL ==='
          grep -Eio '<[^>]+beste-optionen-bei-erektionsstoerungen-featured[^>]*>' "$tmp/live.html" | head -30 || true
          echo '=== SOURCE COUNTS ==='
          printf 'broken_count='; grep -Foc "$broken" "$tmp/live.html" || true
          printf 'candidate_count='; grep -Foc "$candidate" "$tmp/live.html" || true

          echo '=== MEDIA HTTP ==='
          for u in "$broken" "$candidate"; do
            curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}\n' "$u"
          done

          echo '=== POST CONTENT RAW IMAGE REFERENCES ==='
          for id in 900067 900066; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/wp/v2/posts/$id?context=edit" > "$tmp/p$id.json"
            php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$raw=(string)($p["content"]["raw"]??"");echo "post=".($p["id"]??"")." broken_in_content=".substr_count($raw,"welche-medikamente-beeinflussen-die-erektion-featured")." candidate_in_content=".substr_count($raw,"beste-optionen-bei-erektionsstoerungen-featured").PHP_EOL;' "$tmp/p$id.json"
          done
          echo 'PHASE2_IMAGE_CONTEXT_COMPLETE'
