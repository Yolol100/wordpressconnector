name: Diagnose DoctorCura Social Image Source

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect post metadata and public social tags read-only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-social-image-diagnostic"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          slug='welche-medikamente-beeinflussen-die-erektion'
          expected_hash='8122c4a08ebf1c6bc29eda1561e38658a2e41bef239cc65102ba7251af83ed35'

          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/code-snippets/v1/snippets/43" > "$tmp/snippet.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||hash("sha256",$c)!==$argv[2])exit(2);echo"snippet=active_v82\n";' "$tmp/snippet.json" "$expected_hash"

          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/wp/v2/posts/900067?context=edit" > "$tmp/post.json"
          php -r '
            $p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            echo "featured_media=".(int)($p["featured_media"]??0)." status=".($p["status"]??"")." slug=".($p["slug"]??"")."\n";
            echo "registered_meta_keys=".implode(",",array_keys($p["meta"]??[]))."\n";
            foreach(($p["meta"]??[]) as $k=>$v){if(preg_match("/(yoast|opengraph|twitter|image)/i",(string)$k)){echo "meta[$k]=".json_encode($v,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";}}
            $y=$p["yoast_head_json"]??[];
            echo "yoast_og_image=".json_encode($y["og_image"]??null,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";
            echo "yoast_twitter_image=".json_encode($y["twitter_image"]??null,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";
          ' "$tmp/post.json"

          for lang in base fr en; do
            [[ "$lang" == 'base' ]] && prefix='' || prefix="/$lang"
            url="$base$prefix/$slug/"
            curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 "$url" > "$tmp/$lang.html"
            echo "=== $lang ==="
            grep -Eio '<meta[^>]+property="og:image(:[^\"]*)?"[^>]*>' "$tmp/$lang.html" | head -8 || true
            grep -Eio '<meta[^>]+name="twitter:image"[^>]*>' "$tmp/$lang.html" | head -4 || true
            grep -n -F 'welche-medikamente-beeinflussen-die-erektion-featured' "$tmp/$lang.html" | head -3 || true
          done

          echo 'SOCIAL_IMAGE_DIAGNOSTIC_COMPLETE'
