name: Audit DoctorCura Failed Fix Rollback

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Verify every production mutation was rolled back
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-rollback-check"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          wpapi="$base/wp-json/wp/v2"
          redapi="$base/wp-json/redirection/v1"

          echo '=== REDIRECT ROLLBACK ==='
          for source in '/datenschutz/' '/product-categorie/gewichtsverlust/'; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "filterBy[url]=$source" --data-urlencode 'per_page=20' "$redapi/redirect" > "$tmp/red.json"
            total=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($d["total"]??0);' "$tmp/red.json")
            echo "source=$source total=$total"
            [[ "$total" == '0' ]] || { echo "Rollback failed: redirect remains for $source" >&2; exit 1; }
          done
          dcode=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$base/datenschutz/")
          echo "datenschutz_status=$dcode"
          [[ "$dcode" == '404' ]] || { echo 'Rollback failed: Datenschutz is no longer 404' >&2; exit 1; }
          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --dump-header "$tmp/weight.h" --output /dev/null "$base/product-categorie/gewichtsverlust/"
          wcode=$(awk '/^HTTP\//{code=$2}END{print code}' "$tmp/weight.h")
          wloc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$tmp/weight.h" || true)
          echo "weight_status=$wcode location=$wloc"
          [[ "$wcode" == '301' && "$wloc" == 'https://doctorcura.com/gewichtsverlust-medikamente-vergleich/' ]] || { echo 'Rollback failed: weight route did not return to original state' >&2; exit 1; }

          echo '=== POST ROLLBACK ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900066?context=edit" > "$tmp/p66.json"
          f66=$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($p["featured_media"]??0);' "$tmp/p66.json")
          echo "post900066_featured=$f66"
          [[ "$f66" == '900068' ]] || { echo 'Rollback failed: post 900066 featured media not restored' >&2; exit 1; }
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900067?context=edit" > "$tmp/p67.json"
          s67=$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(string)($p["status"]??"");' "$tmp/p67.json")
          echo "post900067_status=$s67"
          [[ "$s67" == 'publish' ]] || { echo 'Rollback failed: post 900067 not republished' >&2; exit 1; }

          echo '=== TERMS ROLLBACK ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/pages/11?context=edit" > "$tmp/terms.json"
          http_count=$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$raw=(string)($p["content"]["raw"]??"");echo substr_count($raw,"href=\"http://www.doctorcura.com\"");' "$tmp/terms.json")
          echo "terms_http_www_count=$http_count"
          [[ "$http_count" == '1' ]] || { echo 'Rollback failed: terms source not restored exactly' >&2; exit 1; }

          echo '=== SITEMAP ROLLBACK ==='
          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base/post-sitemap.xml" > "$tmp/post-sitemap.xml"
          dup_count=$(grep -Fc '<loc>https://doctorcura.com/welche-medikamente-beeinflussen-die-erektion/</loc>' "$tmp/post-sitemap.xml")
          echo "duplicate_sitemap_count=$dup_count"
          [[ "$dup_count" == '2' ]] || { echo 'Rollback failed or state changed: expected duplicate sitemap count 2' >&2; exit 1; }

          echo 'ROLLBACK_VERIFIED_EXACT'
