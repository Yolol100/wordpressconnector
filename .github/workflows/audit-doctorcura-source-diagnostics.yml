name: Diagnose DoctorCura Redirect Owners

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-source-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect exact redirect entries and first-hop headers read-only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-redirect-owners"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          red="$base/wp-json/redirection/v1/redirect"
          expected_hash='2fc561ed59d45aebe0e8b8c770c582c8359560316544f34ab228a9d4f8cabaa8'

          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$base/wp-json/code-snippets/v1/snippets/43" > "$tmp/snippet.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");echo"snippet_hash=".hash("sha256",$c)." active=".(!empty($s["active"])?"true":"false").PHP_EOL;if(empty($s["active"])||hash("sha256",$c)!==$argv[2]||strpos($c,"DoctorCura redirect and feed cleanup V8.4")!==false)exit(2);' "$tmp/snippet.json" "$expected_hash"

          echo '=== FIRST HOP HEADERS ==='
          for spec in \
            'comments:/comments/feed/' \
            'weight:/product-categorie/gewichtsverlust/' \
            'frweight:/fr/product-categorie/gewichtsverlust/' \
            'frmalaria:/fr/product-categorie/malaria/' \
            'privacy:/datenschutz/'; do
            label="${spec%%:*}"; path="${spec#*:}"
            curl --silent --show-error --connect-timeout 10 --max-time 30 --max-redirs 0 --dump-header "$tmp/$label.h" --output /dev/null "$base$path" || true
            echo "-- $label $path --"
            grep -Ei '^(HTTP/|location:|x-redirect-by:|x-robots-tag:|server:|x-powered-by:)' "$tmp/$label.h" | tr -d '\r' || true
          done

          echo '=== REDIRECTION EXACT SEARCH ==='
          for path in \
            '/comments/feed/' \
            '/product-categorie/gewichtsverlust/' \
            '/fr/product-categorie/gewichtsverlust/' \
            '/en/product-categorie/gewichtsverlust/' \
            '/product-categorie/malaria/' \
            '/fr/product-categorie/malaria/' \
            '/en/product-categorie/malaria/' \
            '/datenschutz/' '/fr/datenschutz/' '/en/datenschutz/'; do
            key=$(printf '%s' "$path" | tr '/:' '__')
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "filterBy[url]=$path" --data-urlencode 'per_page=100' "$red" > "$tmp/$key.json"
            echo "-- $path --"
            php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach(($d["items"]??[])as$x){$url="";if(is_array($x["action_data"]??null))$url=(string)($x["action_data"]["url"]??"");elseif(is_string($x["action_data"]??null))$url=(string)$x["action_data"];echo json_encode(["id"=>$x["id"]??null,"url"=>$x["url"]??null,"action_type"=>$x["action_type"]??null,"action_code"=>$x["action_code"]??null,"target"=>$url,"match_type"=>$x["match_type"]??null,"status"=>$x["status"]??null,"group_id"=>$x["group_id"]??null],JSON_UNESCAPED_SLASHES).PHP_EOL;}' "$tmp/$key.json"
          done
          echo 'REDIRECT_OWNER_DIAGNOSTIC_COMPLETE'
