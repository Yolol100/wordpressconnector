name: One-time DoctorCura legal contact update

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-contact-update/*.json'

permissions:
  contents: read

concurrency:
  group: one-time-doctorcura-contact-update
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update DoctorCura contact details in legal pages and Elementor templates
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "${SITE_URL%/}" == 'https://doctorcura.com' ]] || { echo 'Unexpected target.' >&2; exit 1; }
          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-contact-update"
          mkdir -p "$root"

          health_code=$(curl -sS -L --connect-timeout 10 --max-time 30 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/health.json" -w '%{http_code}' "$base/health")
          [[ "$health_code" == '200' ]] || { echo "Health failed: HTTP $health_code" >&2; exit 1; }

          call_action() {
            local suffix="$1" action="$2" dry="$3" confirm="$4" payload_file="$5"
            local req="$root/request-$suffix.json" out="$root/result-$suffix.json"
            python3 - "$req" "$action" "$dry" "$confirm" "$payload_file" <<'PY'
          import json,sys,uuid
          req,action,dry,confirm,payload_file=sys.argv[1:]
          payload=json.load(open(payload_file,encoding='utf-8'))
          data={
            'version':1,
            'request_id':'dc-contact-'+uuid.uuid4().hex[:24],
            'action':action,
            'dry_run':dry=='true',
            'confirm':confirm=='true',
            'payload':payload,
          }
          json.dump(data,open(req,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            local code
            code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$req" -o "$out" -w '%{http_code}' "$base/execute")
            [[ "$code" == '200' ]] || { echo "$action transport failed: HTTP $code" >&2; cat "$out" >&2 || true; exit 1; }
            python3 - "$out" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok'):
              raise SystemExit('Connector action returned ok=false')
          PY
          }

          printf '%s' '{"post_type":"page","status":"publish","per_page":100,"page":1}' > "$root/pages.json"
          call_action pages post.list true false "$root/pages.json"
          printf '%s' '{"post_type":"elementor_library","status":"publish","per_page":100,"page":1}' > "$root/templates.json"
          call_action templates post.list true false "$root/templates.json"

          python3 - "$root/result-pages.json" "$root/result-templates.json" "$root/targets.tsv" <<'PY'
          import json,sys
          out=[]
          for path in sys.argv[1:3]:
              d=json.load(open(path,encoding='utf-8'))
              for x in (d.get('data') or {}).get('items',[]):
                  if not isinstance(x,dict): continue
                  pid=x.get('id'); typ=x.get('type'); slug=x.get('slug',''); title=x.get('title','')
                  if isinstance(pid,int) and pid>0:
                      out.append((pid,typ,slug,title.replace('\t',' ')))
          with open(sys.argv[3],'w',encoding='utf-8') as f:
              for row in out: f.write('\t'.join(map(str,row))+'\n')
          PY

          changed=0
          while IFS=$'\t' read -r post_id post_type slug title; do
            printf '{"id":%s}' "$post_id" > "$root/payload.json"
            call_action "post-$post_id" post.get true false "$root/payload.json"
            if [[ "$post_type" == 'elementor_library' || "$slug" == 'privacy-policy' || "$slug" == 'datenschutz' || "$slug" == 'geschaftsbedingungen' ]]; then
              call_action "el-$post_id" elementor.inspect true false "$root/payload.json" || true
            else
              continue
            fi

            python3 - "$root/result-post-$post_id.json" "$root/result-el-$post_id.json" "$root/update.json" "$root/el-update.json" <<'PY'
          import json,os,sys
          postf,elf,postout,elout=sys.argv[1:]
          replacements=[
            ('Keizersgracht 241, 1016 EA Amsterdam, Netherlands.', 'Veldbloemlaan 93, 3452CK Vleuten, The Netherlands.'),
            ('Keizersgracht 241, 1016 EA Amsterdam, Netherlands', 'Veldbloemlaan 93, 3452CK Vleuten, The Netherlands'),
            ('Keizersgracht 241, 1016 EA, Amsterdam, The Netherlands', 'Veldbloemlaan 93, 3452CK Vleuten, The Netherlands'),
            ('Keizersgracht 241, 1016 EA, Amsterdam, Niederlande', 'Veldbloemlaan 93, 3452CK Vleuten, The Netherlands'),
            ('Keizersgracht 241, 1016 EA,<br>Amsterdam, The Netherlands', 'Veldbloemlaan 93<br>3452CK Vleuten, The Netherlands'),
            ('Keizersgracht 241, 1016 EA,<br />Amsterdam, The Netherlands', 'Veldbloemlaan 93<br />3452CK Vleuten, The Netherlands'),
            ('08 550 55 433', '+31 85 505 54 33'),
            ('085 505 5433', '+31 85 505 54 33'),
            ('0855055433', '+31855055433'),
            ('tel:0855055433', 'tel:+31855055433'),
          ]
          def rep(s):
              for a,b in replacements: s=s.replace(a,b)
              return s
          def walk(v):
              if isinstance(v,str): return rep(v)
              if isinstance(v,list): return [walk(x) for x in v]
              if isinstance(v,dict): return {k:walk(x) for k,x in v.items()}
              return v

          pd=json.load(open(postf,encoding='utf-8'))
          post=(pd.get('data') or {}).get('post') or {}
          content=post.get('content','') if isinstance(post,dict) else ''
          new_content=rep(content)
          json.dump({'id':int(post.get('id',0)),'content':new_content,'status':'publish'},open(postout,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          open(postout+'.changed','w').write('1' if new_content!=content else '0')

          if os.path.exists(elf):
              try:
                  ed=json.load(open(elf,encoding='utf-8'))
                  doc=(ed.get('data') or {}).get('document') or {}
                  data=doc.get('data',[]); settings=doc.get('page_settings',{})
                  ndata=walk(data); nsettings=walk(settings)
                  json.dump({'id':int(post.get('id',0)),'data':ndata,'page_settings':nsettings},open(elout,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
                  open(elout+'.changed','w').write('1' if (ndata!=data or nsettings!=settings) else '0')
              except Exception:
                  open(elout+'.changed','w').write('0')
          else:
              open(elout+'.changed','w').write('0')
          PY

            if [[ "$(cat "$root/update.json.changed")" == '1' ]]; then
              call_action "post-write-$post_id" post.update false true "$root/update.json"
              changed=$((changed+1))
            fi
            if [[ "$(cat "$root/el-update.json.changed")" == '1' ]]; then
              call_action "el-write-$post_id" elementor.replace_document false true "$root/el-update.json"
              changed=$((changed+1))
            fi
          done < "$root/targets.tsv"

          printf '%s' '{}' > "$root/empty.json"
          call_action cache cache.flush false true "$root/empty.json" || true

          for url in \
            'https://doctorcura.com/en/privacy-policy/' \
            'https://doctorcura.com/en/geschaftsbedingungen/' \
            'https://doctorcura.com/datenschutz/' \
            'https://doctorcura.com/'; do
            body=$(curl -sS -L --connect-timeout 10 --max-time 30 "$url")
            if printf '%s' "$body" | grep -Fq 'Keizersgracht 241'; then
              echo "Old address still present at $url" >&2
              exit 1
            fi
            if printf '%s' "$body" | grep -Fq '08 550 55 433'; then
              echo "Old phone still present at $url" >&2
              exit 1
            fi
          done
          echo "DoctorCura contact update completed; changed objects: $changed"
