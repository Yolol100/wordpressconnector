name: Temporary DoctorCura 5892 fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-doctorcura-5892-fix.yml']
permissions:
  contents: read
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Correct German legal wording and verify links
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]]; base="$site/wp-json/webactueel-wordpress-connector/v1"; root="$RUNNER_TEMP/dc5892fix"; mkdir -p "$root"
          call(){ suf="$1"; action="$2"; dry="$3"; confirm="$4"; payload="$5"; python3 - "$root/r-$suf.json" "$action" "$dry" "$confirm" "$payload" <<'PY'
          import json,sys,uuid
          p,a,d,c,payload=sys.argv[1:]; json.dump({'version':1,'request_id':'dc5892-'+uuid.uuid4().hex[:20],'action':a,'dry_run':d=='true','confirm':c=='true','payload':json.load(open(payload,encoding='utf-8'))},open(p,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            code=$(curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Content-Type: application/json' --data-binary "@$root/r-$suf.json" -o "$root/o-$suf.json" -w '%{http_code}' "$base/execute"); [[ "$code" == 200 ]]; python3 - "$root/o-$suf.json" <<'PY'
          import json,sys
          if not json.load(open(sys.argv[1],encoding='utf-8')).get('ok'): raise SystemExit('connector action failed')
          PY
          }
          printf '%s' '{"id":5892}' > "$root/id.json"; call before post.get true false "$root/id.json"
          python3 - "$root/o-before.json" "$root/write.json" <<'PY'
          import json,re,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); p=(d.get('data') or {}).get('post') or {}
          before={k:str(p.get(k,'') or '') for k in ('title','excerpt','content')}
          links_before=re.findall(r'href=["\']([^"\']+)',before['content'],re.I)
          def tx(s):
              replacements=[
                ('Ist ein Online-Rezept legal in den Deutschland?', 'Ist ein Online-Rezept legal in Deutschland?'),
                ('Welche Rolle spielt der Deutschland in den Deutschland?', 'Welche Regeln gelten für Online-Rezepte in Deutschland?'),
                ('In den Deutschland gelten nicht nur allgemeine telemedizinische Standards, sondern auch Regeln auf Ebene der einzelnen Deutschland.', 'In Deutschland gelten für Telemedizin insbesondere das ärztliche Berufsrecht und die allgemeinen medizinischen Sorgfaltspflichten.'),
                ('ob die Behandlung in Ihrem Staat rechtlich angeboten werden darf', 'ob die Behandlung in Deutschland rechtlich angeboten werden darf'),
                ('je nach Staat unterschiedlich geregelt sein können', 'je nach Medikament, Diagnose und Behandlungsablauf unterschiedlich geregelt sein können'),
                ('für jede Behandlung in jedem Deutschland identisch wäre', 'für jede Behandlung pauschal gelten würde'),
                ('in Ihrem Staat', 'in Deutschland'),
                ('Ihres Staates', 'der in Deutschland geltenden Vorgaben'),
                ('je nach Staat', 'je nach medizinischer Situation und geltender Rechtslage'),
                ('im jeweiligen Staat', 'nach den in Deutschland geltenden Vorgaben'),
                ('in den Deutschland', 'in Deutschland'),
                ('der Deutschland', 'Deutschland'),
                ('einzelnen Deutschland', 'in Deutschland geltenden Vorgaben'),
              ]
              for a,b in replacements: s=s.replace(a,b)
              s=re.sub(r'\bjedem Deutschland\b','Deutschland',s,flags=re.I)
              return s
          after={k:tx(v) for k,v in before.items()}
          links_after=re.findall(r'href=["\']([^"\']+)',after['content'],re.I)
          if links_before!=links_after: raise SystemExit('Link preservation failure')
          bad=[r'\bden Deutschland\b',r'\bder Deutschland\b',r'einzelnen Deutschland',r'je nach Deutschland',r'Ihrem Deutschland',r'jedem Deutschland']
          visible=re.sub(r'<[^>]+>',' ',' '.join(after.values()))
          for pat in bad:
              if re.search(pat,visible,re.I): raise SystemExit('Remaining awkward wording: '+pat)
          json.dump({'id':5892,'title':after['title'],'excerpt':after['excerpt'],'content':after['content'],'status':p.get('status','publish')},open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
          call write post.update false true "$root/write.json"
          call after post.get true false "$root/id.json"
          python3 - "$root/o-before.json" "$root/o-after.json" <<'PY'
          import json,re,sys
          b=(json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('post') or {}; a=(json.load(open(sys.argv[2],encoding='utf-8')).get('data') or {}).get('post') or {}
          lb=re.findall(r'href=["\']([^"\']+)',str(b.get('content','')),re.I); la=re.findall(r'href=["\']([^"\']+)',str(a.get('content','')),re.I)
          if lb!=la: raise SystemExit('Readback links changed')
          if a.get('title')!='Ist ein Online-Rezept legal in Deutschland?': raise SystemExit('Title readback mismatch')
          text=re.sub(r'<[^>]+>',' ',' '.join(str(a.get(k,'')) for k in ('title','excerpt','content')))
          for pat in [r'\bden Deutschland\b',r'\bder Deutschland\b',r'einzelnen Deutschland',r'je nach Deutschland',r'Ihrem Deutschland',r'jedem Deutschland']:
              if re.search(pat,text,re.I): raise SystemExit('Awkward wording remains')
          print('POST_5892_READBACK_OK links_preserved=yes')
          PY
