name: DoctorCura Minimum Closure Read-Only QA

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-minimum-closure-20260911.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Snippet identity
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == https://doctorcura.com ]]
          tmp="$RUNNER_TEMP/dc-min"; mkdir -p "$tmp"
          curl -fsSL --retry 3 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" "$base/wp-json/code-snippets/v1/snippets/43" -o "$tmp/s.json"
          python3 - "$tmp/s.json" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1])); c=str(d.get('code') or '')
          assert d.get('active')
          assert hashlib.sha256(c.encode()).hexdigest()=='77f76f8dce012e8122d25243b9e60a020253c85236165f2bf7c5d237ed6d9270'
          assert 'DoctorCura one-time cache purge helper' not in c
          ms=['DoctorCura article social image alignment V8.3','DoctorCura gewichtsverlust legacy final redirect V8.4b','DoctorCura datenschutz root-only migration V8.4c','DoctorCura product variation hreflang cleanup V8.4d','DoctorCura GSC-proven legacy category redirects V8.4e','DoctorCura French request-2 migration V8.4f']
          assert all(c.count(m)==1 for m in ms)
          print('SNIPPET_GREEN')
          PY

      - name: Required redirect matrix
        shell: bash
        run: |
          set -euo pipefail
          b="${SITE_URL%/}"
          check(){ src="$1" dst="$2"; out=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}\t%{redirect_url}' "$src"); echo "$src $out"; [[ "$out" == $'301\t'"$dst" ]]; }
          check "$b/welche-medikamente-beeinflussen-die-erektion-2/" "$b/welche-medikamente-beeinflussen-die-erektion/"
          check "$b/product-categorie/gewichtsverlust/" "$b/product-category/gewichtsverlust/"
          check "$b/product-categorie/hiv-praevention-prep/" "$b/product-category/hiv-praevention-prep/"
          check "$b/product-categorie/quit-smoking/" "$b/product-category/rauchstopp/"
          check "$b/product-categorie/schlafprobleme/" "$b/product-category/schlafprobleme/"
          check "$b/datenschutz/" "$b/privacy-policy/"
          check "$b/fr/request-2/" "$b/fr/anfrage-2/"
          echo REDIRECTS_GREEN

      - name: Phase 2B and content readback
        shell: bash
        run: |
          set -euo pipefail
          b="${SITE_URL%/}"; t="$RUNNER_TEMP/dc-min"; mkdir -p "$t"
          curl -fsSL --retry 3 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" "$b/wp-json/wp/v2/posts/900067?context=edit&_fields=id,status,featured_media,link" -o "$t/p.json"
          curl -fsSL --retry 3 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" "$b/wp-json/wp/v2/media/5925?_fields=id,source_url" -o "$t/m.json"
          curl -fsSL --retry 3 "$b/welche-medikamente-beeinflussen-die-erektion/" -o "$t/a.html"
          curl -fsSL --retry 3 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" "$b/wp-json/wp/v2/pages/11?context=edit&_fields=status,content" -o "$t/terms.json"
          curl -fsSL --retry 3 "$b/geschaftsbedingungen/?dc_min=$(date +%s%N)" -o "$t/terms.html"
          python3 - "$t/p.json" "$t/m.json" "$t/a.html" "$t/terms.json" "$t/terms.html" <<'PY'
          import json,os,re,sys,urllib.parse
          p=json.load(open(sys.argv[1])); m=json.load(open(sys.argv[2])); a=open(sys.argv[3],errors='ignore').read(); q=json.load(open(sys.argv[4])); h=open(sys.argv[5],errors='ignore').read()
          assert p.get('status')=='publish' and p.get('featured_media')==5925
          og=''
          for tag in re.findall(r'<meta\b[^>]*>',a,re.I):
              if re.search(r'(?:property|name)=["\']og:image["\']',tag,re.I):
                  mm=re.search(r'content=["\']([^"\']+)',tag,re.I); og=mm.group(1) if mm else ''; break
          stem=lambda u: re.sub(r'-\d+x\d+$','',os.path.splitext(os.path.basename(urllib.parse.urlsplit(u).path))[0])
          assert og and stem(og)==stem(m.get('source_url',''))
          raw=str((q.get('content') or {}).get('raw') or '')
          assert 'http://www.doctorcura.com' not in raw and 'http://www.doctorcura.com' not in h
          print('PHASE2B_TERMS_GREEN')
          PY

      - name: Epipen pagination and sitemap
        shell: bash
        run: |
          set -euo pipefail
          b="${SITE_URL%/}"; t="$RUNNER_TEMP/dc-min"; mkdir -p "$t"
          x=$(curl -sS --retry 3 --compressed -o "$t/e.html" -w '%{http_code}\t%{url_effective}\t%{num_redirects}' "$b/product/epipen/?attribute_pa_wirkstarke=150mcg"); echo "$x"; [[ "$x" == $'200\t'"$b/product/epipen/?attribute_pa_wirkstarke=150mcg"$'\t0' ]]
          python3 - "$t/e.html" <<'PY'
          import html,re,sys,urllib.parse
          s=open(sys.argv[1],errors='ignore').read(); can=''; alts=[]
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
              rel=re.search(r'rel=["\']([^"\']+)',tag,re.I); href=re.search(r'href=["\']([^"\']+)',tag,re.I)
              if rel and href and 'canonical' in rel.group(1).lower(): can=html.unescape(href.group(1))
              if rel and href and 'alternate' in rel.group(1).lower() and re.search(r'hreflang=',tag,re.I): alts.append(html.unescape(href.group(1)))
          assert can=='https://doctorcura.com/product/epipen/' and len(alts)>=3 and all('attribute_pa_' not in urllib.parse.urlsplit(u).query for u in alts)
          PY
          s16=$(curl -sS --retry 3 -o "$t/b16.html" -w '%{http_code}' "$b/blogs/16/"); [[ "$s16" == 200 ]]
          s17=$(curl -sS --retry 3 -o "$t/b17.html" -w '%{http_code}' "$b/blogs/17/?dc_min=$(date +%s%N)"); [[ "$s17" == 404 ]]
          curl -fsSL --retry 3 "$b/sitemap_index.xml" -o "$t/i.xml"
          python3 - "$t/i.xml" "$t/list" <<'PY'
          import re,sys,html
          s=open(sys.argv[1]).read(); u=[html.unescape(x.strip()) for x in re.findall(r'<loc>(.*?)</loc>',s,re.I|re.S)]; assert u; open(sys.argv[2],'w').write('\n'.join(u))
          PY
          : > "$t/urls"
          while IFS= read -r sm; do curl -fsSL --retry 3 "$sm" | grep -oP '(?<=<loc>).*?(?=</loc>)' >> "$t/urls"; done < "$t/list"
          n=$(sort -u "$t/urls" | grep '^https://doctorcura.com/' | wc -l | tr -d ' '); echo SITEMAP_URLS=$n; [[ "$n" == 176 ]]
          echo CORE_GREEN

      - name: Read-only about-us chain
        shell: bash
        run: |
          set -euo pipefail
          b="${SITE_URL%/}"
          curl -sS --retry 3 -L --max-redirs 10 -o /dev/null -w 'ABOUT_US status=%{http_code} final=%{url_effective} redirects=%{num_redirects}\n' "$b/de/about-us/"

      - name: Closure marker
        run: echo DOCTORCURA_MINIMUM_CLOSURE_GREEN
