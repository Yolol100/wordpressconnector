name: Temporary AST safe all-PHP WPCS pass
on:
  push:
    branches: [fix/release-readiness-guarded-wpcs-20261019]
    paths: [.github/workflows/ast-safe-full-php-once.yml]
permissions:
  contents: write
jobs:
  all-php-ast-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install pinned WordPressCS and PHP AST parser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ast-tools"
          cd "$RUNNER_TEMP/ast-tools"
          composer init --no-interaction --name wordpressconnector/ast-whole --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress \
            nikic/php-parser:5.9.0 squizlabs/php_codesniffer:3.13.6 \
            wp-coding-standards/wpcs:3.4.1 \
            dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Check every proposed change, commit only tested PHP-equivalent files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/release-readiness-guarded-wpcs-20261019"
          mkdir -p "$RUNNER_TEMP/ast-evidence"
          cat > "$RUNNER_TEMP/ast-tools/compare.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/vendor/autoload.php';
          use PhpParser\Node;
          use PhpParser\ParserFactory;
          function normalizedTree($node) {
              if ($node instanceof Node) {
                  $properties = array();
                  foreach ($node->getSubNodeNames() as $key) {
                      $properties[$key] = normalizedTree($node->$key);
                  }
                  return array(get_class($node), $properties);
              }
              return is_array($node) ? array_map('normalizedTree', $node) : $node;
          }
          function commentsAndDocblocks(string $php): array {
              $result = array();
              foreach (token_get_all($php) as $token) {
                  if (is_array($token) && in_array($token[0], array(T_COMMENT, T_DOC_COMMENT), true)) {
                      $result[] = array($token[0], preg_replace('/\s+/', ' ', $token[1]));
                  }
              }
              return $result;
          }
          $before = file_get_contents($argv[1]);
          $after = file_get_contents($argv[2]);
          if (! is_string($before) || ! is_string($after)) exit(1);
          $parser=(new ParserFactory())->createForHostVersion();
          if (normalizedTree($parser->parse($before)) !== normalizedTree($parser->parse($after))
              || commentsAndDocblocks($before) !== commentsAndDocblocks($after)) {
              fwrite(STDERR, "REJECT: AST or comments/DocBlocks changed\n");
              exit(1);
          }
          PHP
          scan="$RUNNER_TEMP/ast-tools/vendor/bin/phpcs"
          fix="$RUNNER_TEMP/ast-tools/vendor/bin/phpcbf"
          "$scan" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/ast-evidence/before.txt" 2>&1 || true
          mapfile -d '' -t files < <(find plugin/wordpressconnector -type f -name '*.php' -print0 | sort -z)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          accepted=0
          rejected=0
          unchanged=0
          for source in "${files[@]}"; do
            original="$RUNNER_TEMP/ast-evidence/$(basename "$source").original"
            cp "$source" "$original"
            set +e
            "$fix" --standard=WordPress "$source" > "$RUNNER_TEMP/ast-evidence/last-formatter.log" 2>&1
            status=$?
            set -e
            if test "$status" -gt 2 || ! php -l "$source" >/dev/null 2>&1 ||
               ! php "$RUNNER_TEMP/ast-tools/compare.php" "$original" "$source" >/dev/null 2>&1 ||
               ! git diff --check -- "$source" >/dev/null 2>&1; then
              cp "$original" "$source"
              rejected=$((rejected+1))
              printf 'REJECT AST / PHP syntax: %s\\n' "$source" >> "$RUNNER_TEMP/ast-evidence/decisions.txt"
              continue
            fi
            if cmp -s "$original" "$source"; then
              unchanged=$((unchanged+1))
              continue
            fi
            if ! bash scripts/run-contracts.sh > "$RUNNER_TEMP/ast-evidence/last-contracts.log" 2>&1; then
              cp "$original" "$source"
              rejected=$((rejected+1))
              printf 'REJECT contract: %s\\n' "$source" >> "$RUNNER_TEMP/ast-evidence/decisions.txt"
              continue
            fi
            git add -- "$source"
            git diff --cached --check
            git commit -m "style(wpcs): AST and security-contract equivalent $(basename "$source")"
            accepted=$((accepted+1))
            printf 'ACCEPT AST and contracts: %s\\n' "$source" >> "$RUNNER_TEMP/ast-evidence/decisions.txt"
          done
          git diff --check
          "$scan" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/ast-evidence/after.txt" 2>&1 || true
          printf 'accepted=%s rejected=%s unchanged=%s scanned=%s\\n' "$accepted" "$rejected" "$unchanged" "${#files[@]}" | tee "$RUNNER_TEMP/ast-evidence/totals.txt"
          git log -65 --oneline > "$RUNNER_TEMP/ast-evidence/commits.txt"
          if test "$accepted" -gt 0; then
            git push origin HEAD:fix/release-readiness-guarded-wpcs-20261019
          fi
      - name: Archive bounded proof and rejection decisions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: all-php-wpcs-safe-review
          path: ${{ runner.temp }}/ast-evidence/
          retention-days: 7
          if-no-files-found: warn
