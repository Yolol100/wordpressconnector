# One-time private method parameter refactor; remove before PR.
name: Temporary WPCS Private Parameters
on:
  push:
    branches:
      - fix/wpcs-private-params-20261115
permissions:
  contents: write
jobs:
  candidate:
    if: >-
      github.repository == 'Yolol100/wordpressconnector' &&
      !startsWith(github.event.head_commit.message, 'style(wpcs): rename scoped private parameters')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout bounded branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/wpcs-private-params-20261115
          persist-credentials: true
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xmlreader, xml, dom
          coverage: none
      - name: Rename only private scoped parameters, verify contracts and WPCS
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Yolol100/wordpressconnector'
          test "$GITHUB_REF" = 'refs/heads/fix/wpcs-private-params-20261115'
          test -z "$(git status --porcelain)"
          tools_dir="$RUNNER_TEMP/wpcs-private-tools"
          mkdir -p "$tools_dir"
          cat > "$tools_dir/composer.json" <<'JSON'
          {"name":"webactueel/wpcs-private-check","require-dev":{"squizlabs/php_codesniffer":"3.13.6","wp-coding-standards/wpcs":"3.4.1"},"config":{"allow-plugins":{"dealerdirect/phpcodesniffer-composer-installer":true}}}
          JSON
          composer install --working-dir="$tools_dir" --prefer-dist --no-interaction --no-progress
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/before.json" || true
          php scripts/wpcs-private-params-temp.php plugin/wordpressconnector > "$RUNNER_TEMP/renamed.log"
          tail -n 4 "$RUNNER_TEMP/renamed.log"
          "$tools_dir/vendor/bin/phpcbf" --standard=phpcs.xml.dist --sniffs=Generic.Formatting.MultipleStatementAlignment plugin/wordpressconnector > "$RUNNER_TEMP/align.log" 2>&1 || true
          php <<'PHP'
          <?php
          $names=trim((string)shell_exec('git diff --name-only -- plugin/wordpressconnector'));
          if ($names==='')throw new RuntimeException('Expected private parameter changes');
          foreach(explode("\n",$names) as $file){
            if(!preg_match('~^plugin/wordpressconnector/[a-zA-Z0-9/_-]+\.php$~D',$file))throw new RuntimeException('Unexpected path '.$file);
            $old=shell_exec('git show HEAD:'.escapeshellarg($file));
            $new=file_get_contents($file);
            if(!is_string($old)||!is_string($new))throw new RuntimeException('Missing candidate source');
            $normalize=function($s){
              $out=[];
              foreach(token_get_all($s,TOKEN_PARSE) as $t){
                if(is_array($t)){
                   if(in_array($t[0],[T_WHITESPACE,T_COMMENT,T_DOC_COMMENT],true))continue;
                   $out[]=[$t[0],$t[1]];
                }else $out[]=$t;
              }
              return $out;
            };
            $o=$normalize($old);$n=$normalize($new);
            if(count($o)!==count($n))throw new RuntimeException('PHP token count changed: '.$file);
            foreach($o as $i=>$tok){
              $other=$n[$i];
              if(!is_array($tok)||!is_array($other)){
                if($tok!==$other)throw new RuntimeException('Literal PHP token changed: '.$file);
                continue;
              }
              if($tok[0]!==$other[0])throw new RuntimeException('PHP token type changed: '.$file);
              if($tok[0]===T_VARIABLE && $tok[1]!==$other[1]){
                $body=substr($tok[1],1);
                $body=preg_replace('/([A-Z]+)([A-Z][a-z])/','$1_$2',$body);
                $body=preg_replace('/([a-z0-9])([A-Z])/','$1_$2',$body);
                $expected='$'.strtolower($body);
                if($other[1]!==$expected)throw new RuntimeException('Non-snake private rename: '.$file);
              }elseif($tok[1]!==$other[1])throw new RuntimeException('Non-variable PHP token changed: '.$file);
            }
          }
          echo "PHP token parity verified across ".count(explode("\n",$names))." files.\n";
          PHP
          find plugin/wordpressconnector -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/lint.log"
          git add plugin/wordpressconnector
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(wpcs): rename scoped private parameters'
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/contracts.log"; exit 1; }
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/after.json" || true
          python3 - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]))
          print('PRIVATE_PARAMS_WPCS_BEFORE',a['totals'],'AFTER',b['totals'],'files',len(b['files']))
          assert len(b['files'])==57
          assert a['totals']['errors']>=2068
          assert b['totals']['errors'] < a['totals']['errors']-150
          assert b['totals']['warnings'] <= a['totals']['warnings']
          PY
          git push origin 'HEAD:refs/heads/fix/wpcs-private-params-20261115'
          echo "verified_sha=$(git rev-parse HEAD)"

      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: temporary-wpcs-private-params-audit
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/renamed.log
            ${{ runner.temp }}/contracts.log
            ${{ runner.temp }}/align.log
          retention-days: 1
