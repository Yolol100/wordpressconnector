            6046:'Rezeptpflichtige Schlafmittel erfordern eine sorgfältige ärztliche Prüfung. Der Artikel erklärt den digitalen Ablauf, wichtige Risiken und wann eine Untersuchung vor Ort sinnvoller ist.',
            6044:'Telemedizin oder Praxisbesuch? Welche Option passt, hängt davon ab, ob eine sichere Beurteilung online möglich ist oder eine persönliche Untersuchung nötig ist.',
            6042:'Ein Online-Rezept setzt eine medizinische Prüfung voraus. So funktionieren Gesundheitsfragebogen, mögliche Verordnung und diskreter Versand über eine zugelassene Apotheke.',
