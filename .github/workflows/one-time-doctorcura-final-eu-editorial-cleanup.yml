                  c=replace_para(c,r'Mounjaro-Einordnung bei gewichtsmanagement', '<p>Wer Mounjaro für das Gewichtsmanagement erwägt, möchte meist mehr wissen als nur die mögliche Veränderung auf der Waage. Wichtig sind die medizinische Eignung, die realistische Wirkung, mögliche Nebenwirkungen und eine Betreuung, die über die erste Verordnung hinausgeht. Mounjaro kann für geeignete Erwachsene Teil einer langfristigen Behandlung sein, sollte aber nur nach individueller ärztlicher Prüfung eingesetzt werden.</p>')
              if pid==6048:
                  c=replace_para(c,r'Ablauf der digitalen Rezeptbehandlung verständlich erklärt', '<p>Wer eine verschreibungspflichtige Behandlung online anfragt, möchte vor allem wissen, was mit den eigenen Gesundheitsdaten geschieht, wer die Therapie prüft und wann das Medikament ankommt. Der Ablauf lässt sich klar in einzelne Schritte gliedern – vom medizinischen Fragebogen über die ärztliche Beurteilung bis zur möglichen Verordnung und Abgabe durch eine Apotheke. Eine digitale Anfrage ersetzt die ärztliche Prüfung nicht, sondern organisiert den Zugang dazu.</p>')
              if pid==6033:
                  c=replace_para(c,r'Herstellerprogramm', '<p>Viele Preisangaben beziehen sich nur auf einen Teil der Versorgung. Ein Betrag kann etwa nur die telemedizinische Leistung abdecken, aber nicht das Arzneimittel. Ein anderer Preis gilt nur für eine bestimmte Dosierungsstufe. Für Patienten in Deutschland ist deshalb entscheidend, welche Leistungen enthalten sind und ob die Krankenkasse im konkreten Fall Kosten übernimmt.</p>')
              if pid==6020:
                  c=replace_para(c,r'So funktioniert diskrete Medikamentenbestellung', '<p>Wer bei einem sensiblen Gesundheitsthema Hilfe sucht, möchte nicht unbedingt im Wartezimmer darüber sprechen oder ein Rezept persönlich in der Apotheke abholen. Eine diskrete Medikamentenbestellung beginnt online mit einer Behandlungsanfrage und medizinischen Angaben. Ein Medikament wird erst dann verschrieben und über eine Apotheke abgegeben, wenn die Behandlung nach ärztlicher Prüfung geeignet ist. Diskret bedeutet dabei nicht anonym oder unkontrolliert, sondern einen geschützten Ablauf mit medizinischer Verantwortung.</p>')
              if pid==6008:
                  c=replace_para(c,r'Ein Rezept online klingt nach einer einfachen Lösung', '<p>Ein Rezept online anzufragen kann praktisch sein, wenn Sie ein sensibles Thema diskret klären möchten oder kurzfristig keinen Praxisbesuch organisieren können. Eine digitale Anfrage bedeutet jedoch nicht, dass automatisch ein Rezept ausgestellt wird. Zuerst prüft ein zugelassener Arzt, ob die gewünschte Behandlung medizinisch zu Ihrer Situation passt.</p>')
              if pid==5995:
                  c=replace_para(c,r'Bei einer Behandlung von Adipositas prüfen Ärzte üblicherweise', '<p>Bei einer <a href="https://doctorcura.com/gewichtstherapie-mit-glp1-medikamenten/">Behandlung von Adipositas</a> berücksichtigt der Arzt neben dem BMI auch Begleiterkrankungen, bisherige Therapien, aktuelle Medikamente und mögliche Gegenanzeigen. Die Zulassungskriterien allein sind deshalb noch keine Zusage für ein Rezept.</p>')
              if pid==5990:
                  c=replace_para(c,r'Nach dem Absenden wird Ihre Anfrage', '<p>Nach dem Absenden wird Ihre Anfrage von einem zugelassenen Arzt oder einer entsprechend berechtigten medizinischen Fachperson geprüft. Ob eine reine Fernbehandlung im konkreten Einzelfall ausreicht, hängt von der medizinischen Situation und den geltenden berufsrechtlichen Anforderungen ab. Die Prüfung berücksichtigt außerdem, ob das gewünschte Medikament zu Ihrem gesundheitlichen Profil und Ihren Begleitmedikamenten passt.</p>')
