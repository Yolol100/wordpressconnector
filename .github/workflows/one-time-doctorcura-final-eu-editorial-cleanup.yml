            6008:'Ein Rezept online anzufragen kann Wege sparen, ersetzt aber keine ärztliche Prüfung. So laufen Anfrage, mögliche Verordnung und Arzneimittelversand ab.',
            5999:'Ob Wegovy für Sie infrage kommt, hängt von BMI, Begleiterkrankungen, Medikamenten und weiteren Risiken ab. Die Entscheidung gehört in ärztliche Hände.',
            5995:'Mounjaro ist in der EU für Typ-2-Diabetes und unter bestimmten Voraussetzungen auch für Gewichtsmanagement zugelassen. Diese Kriterien prüft der behandelnde Arzt.',
