          links=[]; report=[]
          for pid in ids:
              b=(json.load(open(f'{root}/before/{pid}.json',encoding='utf-8')).get('data') or {}).get('post') or {}; a=(json.load(open(f'{root}/after/{pid}.json',encoding='utf-8')).get('data') or {}).get('post') or {}; y=(json.load(open(f'{root}/ya/{pid}.json',encoding='utf-8')).get('data') or {}).get('fields') or {}
              bl=re.findall(r'href=["\']([^"\']+)',b.get('content') or '',re.I); al=re.findall(r'href=["\']([^"\']+)',a.get('content') or '',re.I)
              if bl!=al: raise SystemExit(f'LINK_READBACK_FAIL {pid}')
              if a.get('status')!='publish': raise SystemExit(f'NOT_PUBLISHED {pid}')
              parser=T(); parser.feed(a.get('content') or ''); visible=html.unescape(parser.text())
              meta=' '.join(str(y.get(k) or '') for k in ('title','description','focus_keyphrase','canonical','redirect','breadcrumb_title','opengraph_title','opengraph_description','twitter_title','twitter_description'))
              joined=' '.join([str(a.get('title') or ''),str(a.get('slug') or ''),str(a.get('excerpt') or ''),visible,meta])
              m=banned.search(joined) or awkward.search(joined)
              if m: raise SystemExit(f'FINAL_RESIDUAL_FAIL {pid}: {m.group(0)}')
              if re.search(r'[ \t]+[,.!?;:]',visible): raise SystemExit(f'VISIBLE_PUNCTUATION_FAIL {pid}')
              if pid==5892 and a.get('slug')!='ist-ein-online-rezept-legal-deutschland': raise SystemExit('SLUG_FAIL')
              links.extend((pid,urllib.parse.urljoin(site+'/',u)) for u in al if u.startswith(('http://','https://','/')))
              report.append({'id':pid,'title':a.get('title'),'slug':a.get('slug'),'excerpt':a.get('excerpt'),'links_preserved':True,'link_count':len(al),'yoast_description':y.get('description')})
          def check(item):
              pid,u=item
              for method in ('HEAD','GET'):
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; DoctorCuraFinalQA/1.0)'},method=method)
                      with urllib.request.urlopen(req,timeout=18) as r:return pid,u,r.status,r.geturl()
                  except Exception as e:last=e
              return pid,u,int(getattr(last,'code',0) or 0),u
          broken=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for pid,u,code,final in ex.map(check,links):
                  internal=urllib.parse.urlparse(u).netloc.lower().endswith('doctorcura.com'); bad=(not 200<=code<400) if internal else (code==0 or code>=500 or code==404)
                  if bad: broken.append((pid,code,u))
          if broken: raise SystemExit('BROKEN_LINKS '+repr(broken[:20]))
          json.dump(report,open(root+'/final-eu-report.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('FINAL_EU_READBACK_OK posts=',len(report),'links=',len(links),'broken=0','usa=0')
          PY

          final=$(curl -sS -L --connect-timeout 10 --max-time 45 -o /dev/null -w '%{url_effective}|%{http_code}' "$site/ist-ein-online-rezept-legal-usa/")
          echo "OLD_US_SLUG=$final"
          [[ "$final" == "$site/ist-ein-online-rezept-legal-deutschland/|200" ]] || exit 1

      - name: Upload final EU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-final-eu-editorial-cleanup
          path: |
            ${{ runner.temp }}/dc-final-eu/final-eu-report.json
            ${{ runner.temp }}/dc-final-eu/before
            ${{ runner.temp }}/dc-final-eu/after
            ${{ runner.temp }}/dc-final-eu/ya
          retention-days: 7
          if-no-files-found: warn
