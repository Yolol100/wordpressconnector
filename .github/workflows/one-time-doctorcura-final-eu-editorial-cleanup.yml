                  c=replace_para(c,r'Bei Viagra ist die erste Frage', '<p>Bei Viagra ist die erste Frage nicht, wie stark die Wirkung ausfällt, sondern ob Sildenafil medizinisch zu Ihnen passt. Viagra ist ein verschreibungspflichtiges Arzneimittel zur Behandlung der erektilen Dysfunktion. Es kann vielen Männern helfen, eine für den Geschlechtsverkehr ausreichende Erektion zu erreichen oder aufrechtzuerhalten. Es wirkt jedoch nicht ohne sexuelle Stimulation und ist weder ein Luststeigerer noch eine spontane Lösung für jede Ursache von Erektionsproblemen.</p>')
