                  c=replace_para(c,r'Für Patientinnen und Patienten in Deutschland ist die kurze Antwort', '<p>Wer zum ersten Mal eine Behandlung online anfragt, stellt häufig zuerst die rechtliche Frage: Ist ein Online-Rezept in Deutschland überhaupt zulässig? Grundsätzlich kann eine Verschreibung im Rahmen einer Fernbehandlung möglich sein. Voraussetzung ist, dass die Behandlung im konkreten Einzelfall ärztlich vertretbar ist und die erforderliche medizinische Sorgfalt gewahrt bleibt.</p>')
