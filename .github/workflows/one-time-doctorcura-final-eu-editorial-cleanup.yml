          banned=re.compile(r'\b(?:USA|United States|Vereinigte Staaten|Bundesstaat(?:s|en)?|FDA|DEA|HIPAA|Zepbound|988|Medicare|Medicaid)\b|Suicide\s*&\s*Crisis\s*Lifeline|ist-ein-online-rezept-legal-usa',re.I)
          awkward=re.compile(r'in den Deutschland|von ein entsprechend zugelassener|eines ärztlichen Rückfragens|variieren kosten|Mounjaro enthält wie Mounjaro|Mounjaro-Einordnung bei gewichtsmanagement|So funktioniert diskrete Medikamentenbestellung|Ein Rezept online klingt nach einer einfachen Lösung|Telemedizin ist kein rechtlicher Graubereich|Herstellerprogramm|geprüft,\s*Dabei',re.I)
          class T(HTMLParser):
              blocks={'p','div','li','h1','h2','h3','h4','h5','h6','br','ul','ol'}
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,d): self.parts.append(d)
