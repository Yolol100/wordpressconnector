              fk=str(yf.get('focus_keyphrase') or '')
              if fk and (banned.search(fk) or awkward.search(fk)): upd['focus_keyphrase']=focus[pid]
              for k in ('canonical','redirect'):
                  v=str(yf.get(k) or '')
                  if v and 'ist-ein-online-rezept-legal-usa' in v: upd[k]=v.replace('ist-ein-online-rezept-legal-usa','ist-ein-online-rezept-legal-deutschland')
              json.dump({'id':pid,'fields':upd},open(f'{root}/y/{pid}.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print('FINAL_EU_PREFLIGHT_OK',len(ids))
