name: Haknes temporary read-only HTTP QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/haknes-postfix-http-qa.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect anonymous Haknes CSS, redirects and SEO metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, re, time
          from html.parser import HTMLParser
          class SEO(HTMLParser):
              def __init__(self):
                  super().__init__(); self.titles=[]; self._title=False; self.canonical=''; self.og=''; self.h1=''; self._h1=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='title': self._title=True
                  if tag=='h1': self._h1=True
                  if tag=='link' and a.get('rel','').lower()=='canonical': self.canonical=a.get('href','')
                  if tag=='meta' and a.get('property','').lower()=='og:url': self.og=a.get('content','')
              def handle_endtag(self,tag):
                  if tag=='title': self._title=False
                  if tag=='h1': self._h1=False
              def handle_data(self,data):
                  if self._title: self.titles.append(data)
                  if self._h1: self.h1+=data
          paths=['/wp-content/uploads/elementor/css/post-65.css','/wp-content/uploads/elementor/css/post-50.css','/wp-content/uploads/elementor/css/post-4190.css','/wp-content/uploads/elementor/css/post-7.css','/','/winkel/page/3/','/product/wudy-worst/','/product-categorie/rund/','/category/blog/','/product/rundertong/','/hoe-halal-vlees-invriezen/']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          for path in paths:
              url='https://haknes.nl'+path
              request=urllib.request.Request(url,headers={'User-Agent':'Haknes-ReadOnly-QA/1.0','Accept':'text/html,text/css,*/*'})
              t=time.monotonic()
              try:
                  with opener.open(request,timeout=15) as r: status=r.status;location=r.headers.get('Location','');ctype=r.headers.get('Content-Type','');data=r.read(200000)
              except urllib.error.HTTPError as e: status=e.code;location=e.headers.get('Location','');ctype=e.headers.get('Content-Type','');data=b''
              except Exception as e:
                  print('FAIL',path,type(e).__name__,str(e)[:120],flush=True);continue
              elapsed=round((time.monotonic()-t)*1000)
              print('HTTP',status,path,'type='+ctype.split(';')[0], 'bytes='+str(len(data)), 'fetch_ms='+str(elapsed),'location='+location,flush=True)
              if status==200 and 'text/html' in ctype:
                  p=SEO()
                  try: p.feed(data.decode('utf8','replace'))
                  except Exception: pass
                  print('SEO',path,'title='+repr(''.join(p.titles).strip()[:115]),'h1='+repr(p.h1.strip()[:80]),'canonical='+p.canonical,'og_url='+p.og,flush=True)
                  refs=sorted(set(re.findall(r'post-(?:65|50|4190|7)\\.css[^\\s"\\\']*',data.decode('utf8','replace'))))
                  if refs:print('CSS_REFS',path,refs[:12],flush=True)
          PY

      - name: Inspect internal links and response header patterns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,time
          from urllib.parse import urlparse
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      a=dict(attrs); h=a.get('href','')
                      if h:self.hrefs.append(h)
          old=['/product/rundertong/','/product/himalaya-zout-fijn/','/product/kalkoendijen/','/hoe-halal-vlees-bewaren/','/product/haknes-runder-steak/','/hoe-halal-vlees-invriezen/','/kan-je-vlees-opnieuw-invriezen/','/hoe-halal-gehakt-invriezen/']
          paths=['/','/winkel/page/3/','/product/wudy-worst/','/product-categorie/rund/']
          for path in paths:
              url='https://haknes.nl'+path
              t=time.monotonic()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Haknes-ReadOnly-QA/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      header_ms=round(1000*(time.monotonic()-t))
                      headers={k.lower():v for k,v in r.headers.items()}
                      data=r.read(700000).decode('utf8','replace')
              except Exception as e:print('LINK_SCAN_ERROR',path,type(e).__name__,str(e)[:120],flush=True);continue
              links=Links();links.feed(data)
              hits=sorted(set(h for h in links.hrefs for o in old if urlparse(h).path.rstrip('/')==o.rstrip('/')))
              print('HEADERS',path,'ttfb_proxy_ms='+str(header_ms),'cache_control='+headers.get('cache-control',''),'rocket_cache='+headers.get('x-rocket-cache',''),'litespeed='+headers.get('x-litespeed-cache',''),'server='+headers.get('server',''),flush=True)
              print('LINKS',path,'total='+str(len(links.hrefs)),'old_redirect_urls='+repr(hits),flush=True)
          PY
