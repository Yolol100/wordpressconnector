name: WPCS rejected-file exact-token retry
on:
  push:
    branches: [fix/release-readiness-guarded-wpcs-20261019]
    paths: [.github/workflows/wpcs-guarded-rejects.yml]
permissions:
  contents: write
jobs:
  retry-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install versioned official formatter
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs"
          cd "$RUNNER_TEMP/wpcs"
          composer init --no-interaction --name wordpressconnector/rejected-safefix --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Verify exact token parity, PHP syntax and complete contracts per file
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/release-readiness-guarded-wpcs-20261019"
          mkdir -p "$RUNNER_TEMP/reject-proof/original" "$RUNNER_TEMP/reject-proof/reports"
          cat > "$RUNNER_TEMP/reject-proof/equal.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function tokens(string $file): array {
            $source=file_get_contents($file);
            if (!is_string($source)) { throw new RuntimeException('Unreadable source'); }
            $tokens=array();
            foreach (token_get_all($source) as $token) {
              if (is_array($token) && T_WHITESPACE===$token[0]) { continue; }
              $tokens[]=is_array($token) ? array($token[0],$token[1]) : $token;
            }
            return $tokens;
          }
          if (tokens($argv[1])!==tokens($argv[2])) {
            fwrite(STDERR,"Refused PHP token, comments or string change\n");
            exit(1);
          }
          PHP
          targetfiles=(
            plugin/wordpressconnector/includes/Adapters/CacheMaintenanceAdapter.php
            plugin/wordpressconnector/includes/Adapters/ConnectorUpdateAdapter.php
            plugin/wordpressconnector/includes/Adapters/DiscoveryAdapter.php
            plugin/wordpressconnector/includes/Adapters/PluginPackageAdapter.php
            plugin/wordpressconnector/includes/Adapters/YoastAdapter.php
            plugin/wordpressconnector/includes/Adapters/YoastFeatureSettingsAdapter.php
            plugin/wordpressconnector/includes/Admin/Settings.php
            plugin/wordpressconnector/includes/CLI/Command.php
            plugin/wordpressconnector/includes/MCP/Controller.php
            plugin/wordpressconnector/includes/Runtime/Runner.php
            plugin/wordpressconnector/includes/Security/FilesystemPolicy.php
          )
          scanner="$RUNNER_TEMP/wpcs/vendor/bin/phpcs"
          fixer="$RUNNER_TEMP/wpcs/vendor/bin/phpcbf"
          "$scanner" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/reject-proof/reports/before.txt" 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          accepted=0
          rejected=0
          for file in "${targetfiles[@]}"; do
            base="$(basename "$file" .php)"
            original="$RUNNER_TEMP/reject-proof/original/$base.php"
            cp "$file" "$original"
            pass=no
            for mode in complete indent; do
              cp "$original" "$file"
              set +e
              if test "$mode" = complete; then
                "$fixer" --standard=WordPress "$file" > "$RUNNER_TEMP/reject-proof/reports/$base.phptool.txt" 2>&1
              else
                "$fixer" --standard=WordPress --sniffs=Generic.WhiteSpace.DisallowSpaceIndent "$file" > "$RUNNER_TEMP/reject-proof/reports/$base.phptool.txt" 2>&1
              fi
              rc=$?
              set -e
              if test "$rc" -gt 2; then continue; fi
              if php "$RUNNER_TEMP/reject-proof/equal.php" "$original" "$file" >/dev/null 2>&1 &&
                 php -l "$file" >/dev/null 2>&1 &&
                 git diff --check -- "$file" >/dev/null 2>&1; then
                pass=yes
                break
              fi
            done
            if test "$pass" != yes; then
              cp "$original" "$file"
              rejected=$((rejected+1))
              echo "$file REJECT token/syntax/diff" | tee -a "$RUNNER_TEMP/reject-proof/reports/decisions.txt"
              continue
            fi
            if cmp -s "$original" "$file"; then
              echo "$file UNCHANGED" >> "$RUNNER_TEMP/reject-proof/reports/decisions.txt"
              continue
            fi
            # One changed PHP file is the maximum test blast radius.
            if ! bash scripts/run-contracts.sh > "$RUNNER_TEMP/reject-proof/reports/$base.contracts.log" 2>&1; then
              cp "$original" "$file"
              rejected=$((rejected+1))
              echo "$file REJECT contract regression" | tee -a "$RUNNER_TEMP/reject-proof/reports/decisions.txt"
              continue
            fi
            git add -- "$file"
            git diff --cached --check
            git commit -m "style(wpcs): exact token parity for $base"
            accepted=$((accepted+1))
            echo "$file ACCEPT $mode" | tee -a "$RUNNER_TEMP/reject-proof/reports/decisions.txt"
          done
          "$scanner" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/reject-proof/reports/after.txt" 2>&1 || true
          printf 'accepted=%s rejected=%s\n' "$accepted" "$rejected" > "$RUNNER_TEMP/reject-proof/reports/counts.txt"
          if test "$accepted" -gt 0; then git push origin HEAD:fix/release-readiness-guarded-wpcs-20261019; fi
      - name: Keep accepted and rejected evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpcs-exact-token-retry-evidence
          path: ${{ runner.temp }}/reject-proof/reports/
          retention-days: 14
          if-no-files-found: warn
