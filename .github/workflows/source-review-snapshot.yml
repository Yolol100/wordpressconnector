name: Temporary source review snapshot
on:
  push:
    branches:
      - fix/release-readiness-guarded-wpcs-20261019
    paths:
      - .github/workflows/source-review-snapshot.yml
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export tracked code without credentials or Git internals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/review-source"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/review-source/REVIEW-COMMIT.txt"
          test -f "$RUNNER_TEMP/review-source/scripts/run-contracts.sh"
          test -f "$RUNNER_TEMP/review-source/plugin/wordpressconnector/wordpressconnector.php"
      - name: Upload isolated review source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpconnector-reviewed-source
          path: ${{ runner.temp }}/review-source/
          retention-days: 3
          if-no-files-found: error
