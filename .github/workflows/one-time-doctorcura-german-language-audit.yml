name: One-time DoctorCura German language quality audit

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-german-language-audit/*.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Run German grammar and humanity audit on 19 posts
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-de-audit"; rm -rf "$root"; mkdir -p "$root/posts"
          ids=(900060 900048 900043 6050 6048 6046 6044 6042 6033 6020 6008 5999 5995 5993 5990 5986 5904 5896 5892)
          for id in "${ids[@]}"; do
            for attempt in $(seq 1 5); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 60 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/posts/$id.json" -w '%{http_code}' "$site/wp-json/wp/v2/posts/$id?context=edit" || true)
              [[ "$code" == 200 ]] && break
              sleep 6
            done
            [[ "$code" == 200 ]] || exit 1
          done
          python3 - "$root" <<'PY'
          import collections,html,json,os,re,sys,urllib.parse,urllib.request,time
          root=sys.argv[1]
          ids=[900060,900048,900043,6050,6048,6046,6044,6042,6033,6020,6008,5999,5995,5993,5990,5986,5904,5896,5892]
          out=[]; sentence_bank=[]
          suspicious=[
            r'\bin den Deutschland\b',r'\bGewichtsverlust Medikamente\b',r'\bBehandlung erektile Dysfunktion\b',
            r'\bPotenzbehandlung digital beantragen leicht\b',r'\bsofort Rezept online\b',r'\bmedikamente aus EU apotheke\b',
            r'\bViagra Wirkung Review\b',r'\bMounjaro Bewertung\b',r'\s+:',r'\bErfahren Sie\b',
            r'\bEntscheidend ist\b',r'\bEine seriöse\b',r'\bmedizinisch verantwortungsvoll\b',r'\bärztliche Prüfung\b'
          ]
          def strip(s):
              s=re.sub(r'(?is)<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>',' ',s or '')
              s=re.sub(r'(?i)<br\s*/?>','\n',s)
              s=re.sub(r'(?i)</p>|</h[1-6]>|</li>','\n',s)
              return re.sub(r'[ \t]+',' ',html.unescape(re.sub(r'(?s)<[^>]+>',' ',s))).replace('\r','').strip()
          def lt_check(text):
              # Public LanguageTool API, split to keep requests modest. Fail-open with explicit error evidence.
              chunks=[]
              paragraphs=[x.strip() for x in text.split('\n') if x.strip()]
              cur=''
              for p in paragraphs:
                  if len(cur)+len(p)+1>12000 and cur:
                      chunks.append(cur); cur=p
                  else: cur=(cur+'\n'+p).strip()
              if cur: chunks.append(cur)
              matches=[]; errors=[]; offset_base=0
              for ci,ch in enumerate(chunks):
                  data=urllib.parse.urlencode({'text':ch,'language':'de-DE','enabledOnly':'false'}).encode()
                  req=urllib.request.Request('https://api.languagetool.org/v2/check',data=data,headers={'User-Agent':'DoctorCuraEditorialQA/1.0','Content-Type':'application/x-www-form-urlencoded'})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r: d=json.loads(r.read().decode())
                      for m in d.get('matches',[]):
                          rule=m.get('rule') or {}; cat=(rule.get('category') or {}).get('id','')
                          # Keep spelling/grammar/typography/style, but suppress common noisy proper-name/whitespace rules later by review.
                          matches.append({'chunk':ci,'message':m.get('message'),'short':m.get('shortMessage'),'offset':m.get('offset'),'length':m.get('length'),'context':(m.get('context') or {}).get('text'),'replacements':[x.get('value') for x in (m.get('replacements') or [])[:5]],'rule':rule.get('id'),'category':cat,'issueType':rule.get('issueType')})
                  except Exception as e: errors.append(str(e))
                  time.sleep(3.2)
              return matches,errors
          for id in ids:
              p=json.load(open(f'{root}/posts/{id}.json',encoding='utf-8'))
              title=html.unescape((p.get('title') or {}).get('raw') or '')
              content=(p.get('content') or {}).get('raw') or ''
              text=strip(content)
              desc=html.unescape((p.get('yoast_head_json') or {}).get('description') or '')
              combined=title+'\n'+desc+'\n'+text
              manual=[]
              for pat in suspicious:
                  rx=re.compile(pat,re.I)
                  for m in rx.finditer(combined):
                      a=max(0,m.start()-120); b=min(len(combined),m.end()+180)
                      manual.append({'pattern':pat,'match':m.group(0),'context':re.sub(r'\s+',' ',combined[a:b])})
              sentences=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if len(s.strip())>30]
              sentence_bank.extend((id,s) for s in sentences)
              lt,errs=lt_check(title+'\n'+desc+'\n'+text)
              row={'id':id,'slug':p.get('slug'),'title':title,'description':desc,'manual_flags':manual,'language_tool':lt,'language_tool_errors':errs,'word_count':len(re.findall(r'\b\w+\b',text,re.U))}
              out.append(row)
              print('=== POST',id,p.get('slug'),'===')
              print('TITLE',title)
              print('DESC',desc)
              for x in manual[:80]: print('FLAG',x['match'],'|',x['context'])
              for x in lt[:120]: print('LT',x['category'],x['rule'],'|',x['message'],'|',x['context'],'| repl=',x['replacements'][:3])
              if errs: print('LT_ERRORS',errs)
          # Cross-post repeated long sentence openings: useful AI/template signal.
          norms=collections.defaultdict(list)
          for id,s in sentence_bank:
              key=' '.join(re.findall(r'[A-Za-zÄÖÜäöüß]+',s.lower())[:7])
              if len(key)>20: norms[key].append((id,s))
          repeats={k:v for k,v in norms.items() if len(set(i for i,_ in v))>=2}
          print('=== CROSS_POST_REPEATED_SENTENCE_OPENINGS ===')
          for k,v in sorted(repeats.items(),key=lambda kv:-len(kv[1]))[:100]:
              print('REPEAT',k,'|',[(i,s[:180]) for i,s in v[:8]])
          json.dump({'posts':out,'repeated_sentence_openings':repeats},open(root+'/german-language-audit.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Upload German language audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-german-language-audit
          path: ${{ runner.temp }}/dc-de-audit/german-language-audit.json
          retention-days: 7
          if-no-files-found: warn
