name: DoctorCura SEO Snippet Execute

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-seo-snippet-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Revalidate trusted DoctorCura snippet request
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,99}$ ]] || exit 1
          pr="$RUNNER_TEMP/pr.json"
          code=$(curl --silent --show-error --location --output "$pr" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_REPO_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [[ "$code" == '200' ]] || exit 1
          python3 - "$pr" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          repo=os.environ['GITHUB_REPOSITORY']
          owner=os.environ['REPOSITORY_OWNER']
          trusted=os.environ.get('TRUSTED_REQUEST_ACTOR','')
          expected=os.environ['EXPECTED_HEAD_SHA']
          actor=(p.get('user') or {}).get('login','')
          ok=(
              p.get('state')=='open' and actor and actor in {owner,trusted}
              and (p.get('head') or {}).get('sha')==expected
              and ((p.get('head') or {}).get('repo') or {}).get('full_name')==repo
              and ((p.get('base') or {}).get('repo') or {}).get('full_name')==repo
              and (p.get('base') or {}).get('ref')=='main'
          )
          if not ok:
              raise SystemExit('Trusted DoctorCura snippet validation failed.')
          PY

      - name: Create, activate and verify fixed SEO snippet
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || { echo 'DoctorCura target mismatch.' >&2; exit 1; }

          root="$RUNNER_TEMP/doctorcura-seo-snippet"
          rm -rf "$root" && mkdir -p "$root"
          site="${SITE_URL%/}"
          connector="$site/wp-json/webactueel-wordpress-connector/v1"
          snippets="$site/wp-json/code-snippets/v1/snippets"
          snippet_name='DoctorCura SEO indexation cleanup'

          health_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
            --header 'Accept: application/json' \
            --output "$root/health.json" --write-out '%{http_code}' "$connector/health")
          [[ "$health_code" == '200' ]] || { echo "DoctorCura connector health failed: HTTP $health_code" >&2; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok') or d.get('transport')!='rest':
              raise SystemExit('DoctorCura connector health payload invalid.')
          print('DoctorCura target/auth health OK; connector version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          cat > "$root/snippet.php" <<'PHP'
          /**
           * DoctorCura SEO indexation cleanup.
           * Keeps technical endpoints functional while discouraging indexing,
           * consolidates WooCommerce variation parameter canonicals, and applies one
           * explicitly verified legacy redirect.
           */

          if ( ! function_exists( 'wa_doctorcura_is_woocommerce_runtime_request' ) ) {
              function wa_doctorcura_is_woocommerce_runtime_request(): bool {
                  $request_uri = isset( $_SERVER['REQUEST_URI'] )
                      ? wp_unslash( (string) $_SERVER['REQUEST_URI'] )
                      : '';

                  if ( false !== strpos( $request_uri, '/wc-api/' ) ) {
                      return true;
                  }

                  return isset( $_GET['wc-ajax'] );
              }
          }

          add_action(
              'send_headers',
              static function (): void {
                  if ( ! headers_sent() && wa_doctorcura_is_woocommerce_runtime_request() ) {
                      header( 'X-Robots-Tag: noindex, follow', true );
                  }
              },
              20
          );

          add_action(
              'template_redirect',
              static function (): void {
                  if ( ! headers_sent() && is_feed() ) {
                      header( 'X-Robots-Tag: noindex, follow', true );
                  }
              },
              0
          );

          add_filter(
              'rest_post_dispatch',
              static function ( $response, $server, $request ) {
                  $response = rest_ensure_response( $response );

                  if ( $response instanceof WP_REST_Response ) {
                      $response->header( 'X-Robots-Tag', 'noindex, follow' );
                  }

                  return $response;
              },
              100,
              3
          );

          add_filter(
              'wpseo_canonical',
              static function ( $canonical ) {
                  if ( ! function_exists( 'is_product' ) || ! is_product() ) {
                      return $canonical;
                  }

                  foreach ( array_keys( $_GET ) as $key ) {
                      if ( 0 !== strpos( (string) $key, 'attribute_' ) ) {
                          continue;
                      }

                      $product_id = get_queried_object_id();
                      $permalink  = $product_id ? get_permalink( $product_id ) : false;

                      return $permalink ? $permalink : $canonical;
                  }

                  return $canonical;
              },
              20
          );

          add_action(
              'template_redirect',
              static function (): void {
                  if ( is_admin() ) {
                      return;
                  }

                  $request_uri = isset( $_SERVER['REQUEST_URI'] )
                      ? wp_unslash( (string) $_SERVER['REQUEST_URI'] )
                      : '';
                  $path = (string) wp_parse_url( $request_uri, PHP_URL_PATH );

                  if ( '/fr/product-categorie/sexual-problems' !== untrailingslashit( $path ) ) {
                      return;
                  }

                  wp_safe_redirect(
                      home_url( '/product-category/sexuelle-probleme/' ),
                      301,
                      'DoctorCura SEO'
                  );
                  exit;
              },
              1
          );
          PHP

          php -r '$c=file_get_contents($argv[1]); $f=tempnam(sys_get_temp_dir(),"dcseo-").".php"; file_put_contents($f,"<?php\n".$c); passthru("php -l ".escapeshellarg($f),$rc); @unlink($f); exit($rc);' "$root/snippet.php"

          python3 - "$root/snippet.php" "$root/create.json" <<'PY'
          import json,sys
          code=open(sys.argv[1],encoding='utf-8').read()
          payload={
              'name':'DoctorCura SEO indexation cleanup',
              'desc':'Indexation cleanup for technical endpoints, Woo variation canonicals, and one verified legacy redirect.',
              'code':code,
              'tags':['seo','indexation','doctorcura'],
              'scope':'global',
              'active':False,
              'priority':10,
          }
          json.dump(payload,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY

          list_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
            --header 'Accept: application/json' \
            --output "$root/list.json" --write-out '%{http_code}' \
            "$snippets?per_page=100&page=1")
          [[ "$list_code" == '200' ]] || { echo "Code Snippets list failed: HTTP $list_code" >&2; exit 1; }

          python3 - "$root/list.json" "$root/snippet.php" "$root/state.env" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          expected=open(sys.argv[2],encoding='utf-8').read().replace('\r\n','\n').strip()
          items=data if isinstance(data,list) else data.get('items',data.get('snippets',[])) if isinstance(data,dict) else []
          matches=[x for x in items if isinstance(x,dict) and x.get('name')=='DoctorCura SEO indexation cleanup']
          if len(matches)>1:
              raise SystemExit('Multiple matching DoctorCura SEO snippets already exist; refusing ambiguous write.')
          with open(sys.argv[3],'w',encoding='utf-8') as f:
              if not matches:
                  f.write('SNIPPET_ID=\nWAS_ACTIVE=false\nCREATED=true\n')
              else:
                  item=matches[0]
                  code=str(item.get('code') or '').replace('\r\n','\n').strip()
                  if code and code!=expected:
                      raise SystemExit('Existing DoctorCura SEO snippet has different code; refusing overwrite.')
                  f.write('SNIPPET_ID='+str(int(item.get('id')))+'\n')
                  f.write('WAS_ACTIVE='+('true' if bool(item.get('active')) else 'false')+'\n')
                  f.write('CREATED=false\n')
          PY
          source "$root/state.env"

          if [[ -z "$SNIPPET_ID" ]]; then
            create_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
              --request POST \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data-binary "@$root/create.json" \
              --output "$root/create-result.json" --write-out '%{http_code}' "$snippets")
            [[ "$create_code" == '200' || "$create_code" == '201' ]] || { echo "Code Snippets create failed: HTTP $create_code" >&2; cat "$root/create-result.json" >&2; exit 1; }
            SNIPPET_ID=$(python3 - "$root/create-result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          item=d.get('snippet',d) if isinstance(d,dict) else {}
          sid=item.get('id') if isinstance(item,dict) else None
          if not isinstance(sid,int) or sid<1:
              raise SystemExit('Created snippet response did not contain a valid id.')
          print(sid)
          PY
          )
            WAS_ACTIVE=false
            CREATED=true
          fi

          get_snippet() {
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
              --header 'Accept: application/json' \
              --output "$2" --write-out '%{http_code}' "$snippets/$1"
          }

          read_code=$(get_snippet "$SNIPPET_ID" "$root/readback-before.json")
          [[ "$read_code" == '200' ]] || { echo "Snippet readback failed: HTTP $read_code" >&2; exit 1; }
          python3 - "$root/readback-before.json" "$root/snippet.php" "$SNIPPET_ID" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          item=d.get('snippet',d) if isinstance(d,dict) else {}
          expected=open(sys.argv[2],encoding='utf-8').read().replace('\r\n','\n').strip()
          actual=str(item.get('code') or '').replace('\r\n','\n').strip()
          if int(item.get('id',0))!=int(sys.argv[3]) or item.get('name')!='DoctorCura SEO indexation cleanup' or actual!=expected:
              raise SystemExit('Snippet readback does not match the fixed source.')
          PY

          activated_by_run=false
          rollback() {
            rc=$?
            if [[ "$rc" -ne 0 && "$activated_by_run" == 'true' ]]; then
              echo 'A post-activation check failed; deactivating DoctorCura SEO snippet.' >&2
              curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
                --request POST --header 'Accept: application/json' \
                --output "$root/rollback.json" \
                "$snippets/$SNIPPET_ID/deactivate" >/dev/null || true
            fi
            exit "$rc"
          }
          trap rollback EXIT

          if [[ "$WAS_ACTIVE" != 'true' ]]; then
            activate_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
              --request POST --header 'Accept: application/json' \
              --output "$root/activate.json" --write-out '%{http_code}' \
              "$snippets/$SNIPPET_ID/activate" || true)
            echo "Code Snippets activate HTTP ${activate_code:-transport-error}; verifying state by readback."
            activated_by_run=true
          fi

          read_active_code=$(get_snippet "$SNIPPET_ID" "$root/readback-active.json")
          [[ "$read_active_code" == '200' ]] || { echo "Active snippet readback failed: HTTP $read_active_code" >&2; exit 1; }
          python3 - "$root/readback-active.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          item=d.get('snippet',d) if isinstance(d,dict) else {}
          if not bool(item.get('active')):
              raise SystemExit('DoctorCura SEO snippet is not active after activation attempt.')
          print('DoctorCura SEO snippet active; id='+str(item.get('id')))
          PY

          fetch_headers() {
            url="$1"; file="$2"
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /dev/null --dump-header "$file" "$url" || return 1
          }

          fetch_headers "$site/" "$root/home.headers"
          fetch_headers "$site/fr/" "$root/fr.headers"
          fetch_headers "$site/en/" "$root/en.headers"
          fetch_headers "$site/product/epipen/" "$root/product.headers"
          fetch_headers "$site/wp-json/" "$root/rest.headers"
          fetch_headers "$site/product-category/alle-medikamente/feed/" "$root/feed.headers"
          fetch_headers "$site/?wc-ajax=%25%25endpoint%25%25" "$root/wcajax.headers"
          fetch_headers "$site/fr/product/condyline/" "$root/fr-product.headers"

          old_url="$site/fr/product-categorie/sexual-problems/"
          curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null \
            --dump-header "$root/redirect.headers" "$old_url"

          variation_url="$site/product/epipen/?attribute_pa_wirkstarke=150mcg&attribute_pa_menge=3&attribute_pa_medikament=epipen"
          variation_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --output "$root/variation.html" --write-out '%{http_code}' "$variation_url")

          python3 - "$root" "$variation_code" <<'PY'
          import os,re,sys
          root=sys.argv[1]
          variation_code=sys.argv[2]
          def raw(name):
              return open(os.path.join(root,name),encoding='iso-8859-1',errors='replace').read()
          def statuses(name):
              return [int(x) for x in re.findall(r'^HTTP/\S+\s+(\d{3})',raw(name),re.M|re.I)]
          def last_status(name):
              values=statuses(name)
              return values[-1] if values else 0
          def has_noindex(name):
              return bool(re.search(r'^X-Robots-Tag:\s*[^\r\n]*\bnoindex\b',raw(name),re.M|re.I))
          for name in ('home.headers','fr.headers','en.headers','product.headers','fr-product.headers'):
              if last_status(name) != 200:
                  raise SystemExit(f'{name} did not return HTTP 200: {statuses(name)}')
              if has_noindex(name):
                  raise SystemExit(f'{name} unexpectedly received X-Robots-Tag noindex')
          for name in ('rest.headers','feed.headers','wcajax.headers'):
              status=last_status(name)
              if status >= 500 or status == 0:
                  raise SystemExit(f'{name} returned unsafe HTTP status: {statuses(name)}')
              if not has_noindex(name):
                  raise SystemExit(f'{name} is missing X-Robots-Tag noindex')
          redirect=raw('redirect.headers')
          if last_status('redirect.headers') != 301:
              raise SystemExit(f'Legacy category redirect is not HTTP 301: {statuses("redirect.headers")}')
          locations=re.findall(r'^Location:\s*(\S+)\s*$',redirect,re.M|re.I)
          if not locations or locations[-1].rstrip('/')!='https://doctorcura.com/product-category/sexuelle-probleme':
              raise SystemExit('Legacy category redirect Location is incorrect: '+repr(locations[-1:] if locations else []))
          if variation_code!='200':
              raise SystemExit('Variation product URL did not return HTTP 200: '+variation_code)
          html=open(os.path.join(root,'variation.html'),encoding='utf-8',errors='replace').read()
          canonicals=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',html,re.I)
          if not canonicals:
              canonicals=re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',html,re.I)
          if not canonicals or canonicals[0].rstrip('/')!='https://doctorcura.com/product/epipen':
              raise SystemExit('Variation canonical is incorrect: '+repr(canonicals[:3]))
          print('Regression checks PASS: public indexable pages preserved, technical noindex headers present, exact redirect correct, variation canonical consolidated.')
          PY

          activated_by_run=false
          trap - EXIT
          echo "DOCTORCURA_SNIPPET_RESULT request_id=$REQUEST_ID snippet_id=$SNIPPET_ID active=true created=$CREATED rollback=armed-and-not-needed"
