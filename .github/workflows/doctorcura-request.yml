name: DoctorCura WordPress Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'doctorcura-requests/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-wordpress-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.guard.outputs.request_path }}
      request_id: ${{ steps.guard.outputs.request_id }}
    steps:
      - name: Validate DoctorCura request without production credentials
        id: guard
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${GITHUB_REPOSITORY}" ]]; then
            echo 'Fork PRs are not allowed.' >&2
            exit 1
          fi
          actor="${{ github.event.pull_request.user.login }}"
          owner="${{ github.repository_owner }}"
          if [[ "$actor" != "$owner" && ( -z "${TRUSTED_REQUEST_ACTOR:-}" || "$actor" != "$TRUSTED_REQUEST_ACTOR" ) ]]; then
            echo 'Untrusted request actor.' >&2
            exit 1
          fi
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git branch trusted-base FETCH_HEAD
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" fetch --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git branch request-head FETCH_HEAD
          mapfile -t changed < <(git diff --name-only trusted-base request-head)
          request_count=0
          request_path=''
          for path in "${changed[@]}"; do
            case "$path" in
              doctorcura-requests/*.json)
                ((request_count+=1)); request_path="$path" ;;
              doctorcura-receipts/*.json) ;;
              *) echo "Disallowed DoctorCura runtime path: $path" >&2; exit 1 ;;
            esac
          done
          (( request_count == 1 )) || { echo 'Exactly one doctorcura-requests/*.json file is required.' >&2; exit 1; }
          mkdir -p ../trusted/scripts ../request
          git show "trusted-base:scripts/validate-request.php" > ../trusted/scripts/validate-request.php
          git show "trusted-base:scripts/validate-public-request.php" > ../trusted/scripts/validate-public-request.php
          git show "request-head:$request_path" > ../request/request.json
          php ../trusted/scripts/validate-request.php ../request/request.json
          php ../trusted/scripts/validate-public-request.php ../request/request.json
          request_id=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $d["request_id"];' ../request/request.json)
          echo "request_path=$request_path" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch isolated DoctorCura executor
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'ref':'main','inputs':{'pr_number':os.environ['PR_NUMBER'],'expected_head_sha':os.environ['EXPECTED_HEAD_SHA']}}))
          PY
          )
          code=$(curl --silent --show-error --location --output "$RUNNER_TEMP/dispatch.json" --write-out '%{http_code}' --request POST --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_REPO_TOKEN}" --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/doctorcura-execute.yml/dispatches")
          [[ "$code" == '200' || "$code" == '204' ]] || { echo "DoctorCura dispatch failed: HTTP $code" >&2; exit 1; }
