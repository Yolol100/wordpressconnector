name: WordPress Connector Docker runtime smoke

on:
  push:
    branches: [main]
    paths:
      - '.wp-env.json'
      - 'plugin/wordpressconnector/**'
      - '.github/workflows/docker-runtime-smoke.yml'
      - 'docs/LOCAL-RUNTIME-TESTING.md'
  pull_request:
    paths:
      - '.wp-env.json'
      - 'plugin/wordpressconnector/**'
      - '.github/workflows/docker-runtime-smoke.yml'
      - 'docs/LOCAL-RUNTIME-TESTING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp-env-smoke:
    name: Isolated WordPress runtime (no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install pinned WordPress test environment
        run: |
          # Upstream wp-env 11.17.0 currently resolves an unpublished Playground
          # dependency (@wp-playground/blueprints@3.1.59). Pin the compatible
          # tooling pair until the npm release set is complete.
          npm install --global --no-fund --no-audit \
            @wordpress/env@11.16.0 \
            @wp-playground/cli@3.1.54 \
            @wp-playground/blueprints@3.1.54
          wp-env --version
      - name: Start disposable WordPress with Docker
        run: wp-env start
      - name: Verify exact WordPress, PHP, and database runtime
        run: |
          wp-env run cli wp eval '
            global $wpdb;
            if (get_bloginfo("version") !== "7.1.3") {
              WP_CLI::error("Expected WordPress 7.1.3");
            }
            if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3) {
              WP_CLI::error("Expected PHP 8.3");
            }
            if ((string) $wpdb->get_var("SELECT 1") !== "1") {
              WP_CLI::error("Isolated database query failed");
            }
            WP_CLI::success("Pinned WordPress, PHP and database runtime verified");
          '
      - name: Check plugin activation
        run: wp-env run cli wp plugin is-active wordpressconnector
      - name: Check plugin bootstrap and REST registration
        run: |
          wp-env run cli wp eval '
            if (! defined("WPCONNECTOR_VERSION")) {
              WP_CLI::error("Connector failed to boot");
            }
            $routes = rest_get_server()->get_routes();
            foreach (array("/webactueel-wordpress-connector/v1/presence", "/webactueel-wordpress-connector/v1/health", "/webactueel-wordpress-connector/v1/execute") as $route) {
              if (! isset($routes[$route])) {
                WP_CLI::error("Missing expected REST route: " . $route);
              }
            }
            WP_CLI::success("Connector boot and REST route registry verified");
          '
      - name: Verify public and private REST permission boundaries
        run: |
          wp-env run cli wp eval '
            $base = "/webactueel-wordpress-connector/v1/";
            if (is_ssl()) { WP_CLI::error("Expected disposable HTTP site"); }
            foreach (array(
              array("GET", "presence"),
              array("GET", "health"),
              array("POST", "assets"),
              array("POST", "execute")
            ) as $probe) {
              $request = new WP_REST_Request($probe[0], $base . $probe[1]);
              if ($probe[1] === "assets") {
                $request->set_param("request_id", "test-access-12345");
                $request->set_param("asset_path", "synthetic.txt");
              }
              $response = rest_do_request($request);
              if ($response->get_status() !== 403) {
                WP_CLI::error("Anonymous HTTP access not blocked for " . $probe[1]);
              }
            }
            $_SERVER["HTTPS"] = "on";
            if (! is_ssl()) { WP_CLI::error("HTTPS test precondition failed"); }
            $public = rest_do_request(new WP_REST_Request("GET", $base . "presence"));
            if ($public->get_status() !== 200 || $public->get_data()["ok"] !== true) {
              WP_CLI::error("HTTPS public presence contract failed");
            }
            foreach (array(
              array("GET", "health"),
              array("POST", "assets"),
              array("POST", "execute")
            ) as $probe) {
              $request = new WP_REST_Request($probe[0], $base . $probe[1]);
              if ($probe[1] === "assets") {
                $request->set_param("request_id", "test-access-12345");
                $request->set_param("asset_path", "synthetic.txt");
              }
              $response = rest_do_request($request);
              if ($response->get_status() !== 401) {
                WP_CLI::error("Anonymous HTTPS access not blocked for " . $probe[1]);
              }
            }
            WP_CLI::success("Eight anonymous HTTP/HTTPS REST gate probes passed");
          '
      - name: Verify modern MCP read-only resources and prompts with real WordPress auth
        run: |
          wp-env run cli wp eval '
            $namespace = "/webactueel-wordpress-connector/v1/mcp";
            $_SERVER["HTTPS"] = "on";
            $modernMeta = array(
              "io.modelcontextprotocol/protocolVersion" => "2026-07-28",
              "io.modelcontextprotocol/clientCapabilities" => array()
            );
            $send = static function (string $method, array $args = array()) use ($namespace, $modernMeta) {
              $request = new WP_REST_Request("POST", $namespace);
              $request->set_header("Content-Type", "application/json");
              $request->set_header("MCP-Protocol-Version", "2026-07-28");
              $request->set_header("Mcp-Method", $method);
              $args["_meta"] = $modernMeta;
              $request->set_body(wp_json_encode(array(
                "jsonrpc" => "2.0",
                "id" => "smoke-" . $method,
                "method" => $method,
                "params" => $args,
              )));
              return rest_do_request($request);
            };
            wp_set_current_user(0);
            $unauthenticated = $send("resources/list");
            if ($unauthenticated->get_status() !== 401) {
              WP_CLI::error("Anonymous MCP resource listing was not denied");
            }
            $admins = get_users(array("role" => "administrator", "number" => 1));
            if (!$admins) WP_CLI::error("Disposable WordPress lacks administrator");
            wp_set_current_user((int) $admins[0]->ID);
            $list = $send("resources/list");
            $data = $list->get_data();
            if ($list->get_status() !== 200 || count($data["result"]["resources"] ?? array()) !== 2 ||
              ($data["result"]["cacheScope"] ?? "") !== "private") {
              WP_CLI::error("Real WordPress standard MCP resources/list failed");
            }
            $read = $send("resources/read", array("uri" => "wordpress-connector://guide/safe-changes"));
            if ($read->get_status() !== 200 || empty($read->get_data()["result"]["contents"][0]["text"])) {
              WP_CLI::error("Real WordPress standard MCP resources/read failed");
            }
            $prompts = $send("prompts/list");
            if ($prompts->get_status() !== 200 || count($prompts->get_data()["result"]["prompts"] ?? array()) !== 2) {
              WP_CLI::error("Real WordPress standard MCP prompts/list failed");
            }
            $prompt = $send("prompts/get", array("name" => "wordpress_connector_readonly_audit"));
            if ($prompt->get_status() !== 200 ||
              empty($prompt->get_data()["result"]["messages"][0]["content"]["text"])) {
              WP_CLI::error("Real WordPress standard MCP prompts/get failed");
            }
            $blocked = $send("resources/read", array("uri" => "file:///etc/passwd"));
            if ($blocked->get_status() !== 200 ||
              ($blocked->get_data()["error"]["code"] ?? 0) !== -32602) {
              WP_CLI::error("MCP resource allowlist did not reject local files");
            }
            WP_CLI::success("Real WordPress private MCP resources/prompts, anonymous denial and URI guards verified");
          '
      - name: Verify plugin install hooks, lifecycle and confirmed asset writes on real WordPress
        run: |
          wp-env run cli wp eval '
            if (!class_exists("ZipArchive")) {
              WP_CLI::error("ZipArchive is required for verified plugin package management.");
            }
            $admins = get_users(array("role" => "administrator", "number" => 1));
            if (!$admins) WP_CLI::error("Disposable WordPress has no administrator.");
            wp_set_current_user((int) $admins[0]->ID);

            $name = "wpconnector-runtime-fixture";
            $file = $name . "/fixture.php";
            $root = WP_PLUGIN_DIR . "/" . $name;
            $assetRoot = WP_CONTENT_DIR . "/uploads/wpconnector-qa-assets";
            wp_mkdir_p($assetRoot . "/plugin-packages");
            $package = $assetRoot . "/plugin-packages/" . $name . ".zip";
            $fixture = "<?php\n/*\nPlugin Name: Connector Runtime Fixture\nVersion: 1.0.0\n*/\nregister_activation_hook(__FILE__, static function () { update_option(\"wpconnector_qa_activation_count\", 1 + (int) get_option(\"wpconnector_qa_activation_count\", 0)); });\n";
            $archive = new ZipArchive();
            if ($archive->open($package, ZipArchive::CREATE | ZipArchive::OVERWRITE) !== true) {
              WP_CLI::error("Could not build disposable test package.");
            }
            $archive->addFromString($file, $fixture);
            $archive->close();

            $pluginAdapter = new \Webactueel\WordPressConnector\Adapters\PluginPackageAdapter();
            $system = new \Webactueel\WordPressConnector\Adapters\SystemAdapter();
            $files = new \Webactueel\WordPressConnector\Adapters\FilesystemAdapter();
            delete_option("wpconnector_qa_activation_count");
            $payload = array("source_path" => "plugin-packages/" . $name . ".zip",
              "sha256" => hash_file("sha256", $package), "expected_plugin" => $file,
              "overwrite" => false, "activate" => true, "network_wide" => false);
            $context = array("asset_root" => $assetRoot, "dry_run" => false);
            $preview = $pluginAdapter->installPackage($payload, array("asset_root" => $assetRoot, "dry_run" => true));
            if (empty($preview["would_install_package"])) WP_CLI::error("Package dry-run failed.");
            $done = $pluginAdapter->installPackage($payload, $context);
            if (!is_plugin_active($file) || (int) get_option("wpconnector_qa_activation_count") !== 1 ||
                empty($done["after"]["active"])) {
              WP_CLI::error("Verified ZIP installation skipped real activation hooks.");
            }

            $plugins = $system->pluginList();
            $matches = array_values(array_filter($plugins["plugins"], static function (array $item) use ($file): bool {
              return ($item["file"] ?? "") === $file;
            }));
            if (count($matches) !== 1 || empty($matches[0]["active"]) || empty($matches[0]["can_deactivate"])
                || !empty($matches[0]["update_available"])) {
              WP_CLI::error("Installed fixture was not correctly reported by plugin.list.");
            }

            $d = $system->pluginDeactivate(array("file" => $file), array("dry_run" => false));
            if (empty($d["readback_verified"]) || is_plugin_active($file)) WP_CLI::error("Plugin deactivation failed.");
            $a = $system->pluginActivate(array("file" => $file), array("dry_run" => false));
            if (empty($a["readback_verified"]) || (int) get_option("wpconnector_qa_activation_count") !== 2) {
              WP_CLI::error("Normal plugin activation did not execute the registered hook.");
            }

            wp_mkdir_p($root . "/assets");
            $relative = "wp-content/plugins/" . $name . "/assets/demo.html";
            $content = "<section>Safe disposable QA asset</section>";
            $plan = $files->createText(array("path" => $relative, "content" => $content), array("dry_run" => true));
            if (empty($plan["requires_active_content_acknowledgement"])) {
              WP_CLI::error("Browser-active asset was not identified in preview.");
            }
            try {
              $files->createText(array("path" => $relative, "content" => $content), array("dry_run" => false));
              WP_CLI::error("Unacknowledged active HTML creation was incorrectly allowed.");
            } catch (\RuntimeException $expected) {
              // Explicit approval is required before creating browser-active code.
            }
            $c = $files->createText(array("path" => $relative, "content" => $content,
              "acknowledge_active_content" => true), array("dry_run" => false));
            if (empty($c["after"]["sha256"]) || file_get_contents(ABSPATH . $relative) !== $content) {
              WP_CLI::error("Created HTML asset did not pass live readback.");
            }
            $read = $files->readText(array("path" => $relative));
            if (($read["content"] ?? "") !== $content) {
              WP_CLI::error("Created HTML asset could not be read via the connector.");
            }
            $updatedText = "<section>Updated disposable QA asset</section>";
            $writePreview = $files->writeText(array("path" => $relative, "content" => $updatedText),
              array("dry_run" => true));
            if (($writePreview["before"]["sha256"] ?? "") !== hash("sha256", $content)
                || empty($writePreview["requires_active_content_acknowledgement"])
                || file_get_contents(ABSPATH . $relative) !== $content) {
              WP_CLI::error("Filesystem edit dry-run changed or misidentified the source.");
            }
            try {
              $files->writeText(array("path" => $relative, "content" => $updatedText,
                "acknowledge_active_content" => true), array("dry_run" => false));
              WP_CLI::error("Filesystem edit accepted a missing stale-state hash.");
            } catch (\RuntimeException $expected) {
              // A valid mutation always carries the prior file checksum.
            }
            try {
              $files->writeText(array("path" => $relative, "content" => $updatedText,
                "expected_sha256" => hash("sha256", $content)), array("dry_run" => false));
              WP_CLI::error("Browser-active HTML edit bypassed explicit approval.");
            } catch (\RuntimeException $expected) {
              // Missing acknowledgement must never overwrite active browser code.
            }
            $blockEdits = static function ($allowed, $context) {
              return "connector_filesystem" === $context ? false : $allowed;
            };
            add_filter("file_mod_allowed", $blockEdits, 10, 2);
            try {
              $files->writeText(array("path" => $relative, "content" => $updatedText,
                "expected_sha256" => hash("sha256", $content),
                "acknowledge_active_content" => true), array("dry_run" => false));
              WP_CLI::error("WordPress file modification policy was bypassed.");
            } catch (\RuntimeException $expected) {
              // An authenticated request cannot override site/hosting file policy.
            } finally {
              remove_filter("file_mod_allowed", $blockEdits, 10);
            }
            $write = $files->writeText(array("path" => $relative, "content" => $updatedText,
              "expected_sha256" => hash("sha256", $content),
              "acknowledge_active_content" => true), array("dry_run" => false));
            if (($write["after"]["sha256"] ?? "") !== hash("sha256", $updatedText)
                || file_get_contents(ABSPATH . $relative) !== $updatedText
                || ($write["_rollback"]["action"] ?? "") !== "filesystem.write_text"
                || ($write["_rollback"]["payload"]["acknowledge_active_content"] ?? null) !== true) {
              WP_CLI::error("Filesystem edit did not persist or lost its rollback data.");
            }
            $restored = $files->writeText($write["_rollback"]["payload"], array("dry_run" => false));
            if (($restored["after"]["sha256"] ?? "") !== hash("sha256", $content)
                || file_get_contents(ABSPATH . $relative) !== $content) {
              WP_CLI::error("Filesystem rollback failed exact readback.");
            }

            $del = $files->deleteText(array("path" => $relative,
              "expected_sha256" => hash("sha256", $content), "acknowledge_active_content" => true),
              array("dry_run" => false));
            if (file_exists(ABSPATH . $relative) || ($del["_rollback"]["action"] ?? "") !== "filesystem.create_text") {
              WP_CLI::error("Guarded HTML asset deletion or rollback evidence failed.");
            }

            $system->pluginDeactivate(array("file" => $file), array("dry_run" => false));
            $removed = $system->pluginDelete(array("file" => $file), array("dry_run" => false));
            if (empty($removed["readback_verified"]) || isset(get_plugins()[$file])) {
              WP_CLI::error("Disposable plugin delete failed readback.");
            }
            delete_option("wpconnector_qa_activation_count");
            @unlink($package);
            @rmdir($assetRoot . "/plugin-packages");
            @rmdir($assetRoot);
            WP_CLI::success("Real WordPress ZIP install, installed status readback, activation hooks, plugin lifecycle, guarded HTML create/edit/rollback/delete and plugin removal verified.");
          '
      - name: Test real WordPress inactive theme overwrite and failure recovery
        run: |
          wp-env run cli wp eval '
            if (!class_exists("ZipArchive")) WP_CLI::error("Required ZipArchive missing.");
            $admins = get_users(array("role" => "administrator", "number" => 1));
            wp_set_current_user((int) $admins[0]->ID);
            $slug = "wpconnector-qa-theme";
            $assetRoot = WP_CONTENT_DIR . "/uploads/wpconnector-qa-theme-assets";
            $themeRoot = get_theme_root() . "/" . $slug;
            wp_mkdir_p($assetRoot . "/theme-packages");
            $path = $assetRoot . "/theme-packages/fixture.zip";
            $makeZip = static function (string $version, string $marker) use ($path, $slug): array {
              $style = "/*\nTheme Name: Connector QA Theme\nVersion: " . $version . "\n*/\n";
              $zip = new ZipArchive();
              if (true !== $zip->open($path, ZipArchive::CREATE | ZipArchive::OVERWRITE)) WP_CLI::error("ZIP creation failed");
              $zip->addFromString($slug . "/style.css", $style);
              $zip->addFromString($slug . "/index.php", "<?php // " . $marker . "\n");
              $zip->close();
              return array("source_path" => "theme-packages/fixture.zip", "sha256" => hash_file("sha256", $path),
                "expected_stylesheet" => $slug, "overwrite" => false);
            };
            $adapter = new \Webactueel\WordPressConnector\Adapters\PluginPackageAdapter();
            $original = $makeZip("1.0.0", "original-marker");
            $preview = $adapter->installThemePackage($original, array("asset_root" => $assetRoot, "dry_run" => true));
            if (empty($preview["would_install_theme_package"])) WP_CLI::error("New theme preview denied");
            $first = $adapter->installThemePackage($original, array("asset_root" => $assetRoot, "dry_run" => false));
            if (empty($first["readback_verified"]) || !wp_get_theme($slug)->exists()) WP_CLI::error("Theme install failed");
            $originalHash = hash_file("sha256", $themeRoot . "/index.php");
            $replacement = $makeZip("2.0.0", "replacement-marker");
            $replacement["overwrite"] = true;
            $dry = $adapter->installThemePackage($replacement, array("asset_root" => $assetRoot, "dry_run" => true));
            if (empty($dry["would_install_theme_package"])) WP_CLI::error("Overwrite preview denied");
            $denied = false;
            try {
              $adapter->installThemePackage($replacement, array("asset_root" => $assetRoot, "dry_run" => false));
            } catch (\RuntimeException $expected) { $denied = true; }
            if (!$denied || hash_file("sha256", $themeRoot . "/index.php") !== $originalHash) {
              WP_CLI::error("Overwrite bypassed server-side approval");
            }
            define("WPCONNECTOR_ALLOW_THEME_PACKAGE_REPLACE", true);
            $changed = $adapter->installThemePackage($replacement, array("asset_root" => $assetRoot, "dry_run" => false));
            $updatedHash = hash_file("sha256", $themeRoot . "/index.php");
            if (($changed["operation"] ?? "") !== "updated" || empty($changed["readback_verified"]) ||
                $originalHash === $updatedHash || wp_get_theme($slug)->get("Version") !== "2.0.0") {
              WP_CLI::error("Actual theme overwrite failed");
            }
            $backupDir = WP_CONTENT_DIR . "/upgrade-temp-backup/themes/" . $slug;
            if (is_dir($backupDir)) WP_CLI::error("Successful overwrite left a temporary backup behind");
            $beforeFailedHash = hash_file("sha256", $themeRoot . "/index.php");
            $broken = $makeZip("3.0.0", "should-never-install");
            $broken["overwrite"] = true;
            $inject = static function ($result, $hook) {
              if (is_array($hook) && ($hook["type"] ?? "") === "theme") {
                return new WP_Error("wpconnector_qa_intentional_failure", "Controlled test install failure");
              }
              return $result;
            };
            add_filter("upgrader_pre_install", $inject, 10, 2);
            $failed = false;
            try {
              $adapter->installThemePackage($broken, array("asset_root" => $assetRoot, "dry_run" => false));
            } catch (\RuntimeException $expected) { $failed = true; }
            finally { remove_filter("upgrader_pre_install", $inject, 10); }
            wp_clean_themes_cache();
            if (!$failed || hash_file("sha256", $themeRoot . "/index.php") !== $beforeFailedHash ||
                wp_get_theme($slug)->get("Version") !== "2.0.0" || is_dir($backupDir)) {
              WP_CLI::error("Theme overwrite failure did not restore identical files");
            }
            require_once ABSPATH . "wp-admin/includes/theme.php";
            $removed = delete_theme($slug);
            if (is_wp_error($removed) || true !== $removed || wp_get_theme($slug)->exists()) WP_CLI::error("Fixture cleanup failed");
            @unlink($path);
            @rmdir($assetRoot . "/theme-packages");
            @rmdir($assetRoot);
            WP_CLI::success("Verified new theme ZIP, inactive overwrite, backup cleanup and byte-equal recovery");
          '
      - name: Docker diagnostics on failure
        if: failure()
        run: docker ps -a --format 'table {{.Names}}\t{{.Status}}'
      - name: Test WordPress Site Editor template write and rollback on disposable block theme
        run: |
          wp-env run cli wp eval '
            $admins = get_users(array("role" => "administrator", "number" => 1));
            if (!$admins) WP_CLI::error("Missing disposable test administrator");
            wp_set_current_user((int) $admins[0]->ID);
            if (!wp_is_block_theme() && wp_get_theme("twentytwentyfive")->exists()) {
              switch_theme("twentytwentyfive");
            }
            if (!wp_is_block_theme()) WP_CLI::error("Disposable WordPress test must have an active block theme");
            $adapter = new \Webactueel\WordPressConnector\Adapters\SiteEditorAdapter();
            $list = $adapter->listTemplates(array("kind" => "template"));
            if (($list["theme"] ?? "") !== get_stylesheet() || !is_array($list["items"] ?? null)) {
              WP_CLI::error("Native Site Editor template listing failed");
            }
            $styles = $adapter->globalStyles();
            if (($styles["theme"] ?? "") !== get_stylesheet() || !isset($styles["fingerprint"])) {
              WP_CLI::error("Native WordPress global styles route failed");
            }
            $beforeContent = "<!-- wp:paragraph --><p>Connector QA Original</p><!-- /wp:paragraph -->";
            $create = new WP_REST_Request("POST", "/wp/v2/templates");
            foreach (array("slug" => "wpconnector-qa", "theme" => get_stylesheet(),
              "title" => "WordPress Connector QA", "content" => $beforeContent, "status" => "publish") as $k => $v) {
              $create->set_param($k, $v);
            }
            $created = rest_do_request($create);
            if ($created->get_status() < 200 || $created->get_status() >= 300) {
              WP_CLI::error("Could not create a disposable customized WordPress template");
            }
            $id = $created->get_data()["id"] ?? "";
            if ($id !== get_stylesheet() . "//wpconnector-qa") WP_CLI::error("Unexpected custom template identity");
            $target = array("kind" => "template", "id" => $id);
            $before = $adapter->inspect($target);
            if (empty($before["customized"])) WP_CLI::error("WordPress template did not become a customized template");
            $updatedContent = "<!-- wp:paragraph --><p>Connector QA Changed</p><!-- /wp:paragraph -->";
            $request = $target + array("content" => $updatedContent,
              "expected_before_fingerprint" => $before["fingerprint"]);
            $preview = $adapter->update($request, array("dry_run" => true));
            if (empty($preview["would_change"])) WP_CLI::error("Site Editor dry-run missing change");
            $denied = false;
            try { $adapter->update($request, array("dry_run" => false)); }
            catch (\RuntimeException $expected) { $denied = true; }
            if (!$denied || $adapter->inspect($target)["content"] !== $before["content"]) {
              WP_CLI::error("Site Editor mutation bypassed default-off policy");
            }
            define("WPCONNECTOR_ALLOW_SITE_EDITOR_WRITES", true);
            $changed = $adapter->update($request, array("dry_run" => false));
            if (empty($changed["updated"]) || $adapter->inspect($target)["content"] !== $updatedContent) {
              WP_CLI::error("Site Editor native REST write did not persist");
            }
            $recovered = $adapter->restore($changed["_rollback"]["payload"], array("rollback_mode" => true));
            if (empty($recovered["readback_verified"]) || $adapter->inspect($target)["content"] !== $before["content"]) {
              WP_CLI::error("Site Editor native REST rollback did not restore identical content");
            }
            $delete = new WP_REST_Request("DELETE", "/wp/v2/templates/" . $id);
            $delete->set_param("force", true);
            $deleted = rest_do_request($delete);
            if ($deleted->get_status() < 200 || $deleted->get_status() >= 300) {
              WP_CLI::error("Disposable Site Editor template cleanup failed");
            }
            WP_CLI::success("Native block theme templates, Site Editor default-off writes and exact rollback verified");
          '
      - name: Verify private ChatGPT connection and backup recovery guide on WordPress
        run: |
          wp-env run cli wp eval '
            $admins = get_users(array("role" => "administrator", "number" => 1));
            if (!$admins) WP_CLI::error("Disposable WordPress has no administrator");
            wp_set_current_user((int) $admins[0]->ID);
            $adapter = new \Webactueel\WordPressConnector\Adapters\ConnectionReadinessAdapter();
            $registry = new \Webactueel\WordPressConnector\Runtime\Registry();
            $adapter->register($registry);
            $action = $registry->descriptor("connector.setup.inspect");
            if (empty($action["privileged"]) || !empty($action["public_repository_safe"]) ||
                !empty($action["mutation"]) || ($action["capability"] ?? "") !== "manage_options") {
              WP_CLI::error("Connection readiness action is not private admin read-only");
            }
            $before = get_option("blogname");
            $status = $adapter->inspect();
            if (empty($status["read_only"]) || !empty($status["chatgpt"]["oauth_21_ready"]) ||
                !empty($status["recovery"]["database_backup_verified"]) ||
                !empty($status["recovery"]["site_files_backup_verified"]) ||
                !empty($status["recovery"]["staging_restore_verified"]) ||
                !empty($status["high_risk_changes_cleared"]) ||
                get_option("blogname") !== $before) {
              WP_CLI::error("Real WordPress setup inspection claimed unverified external capabilities");
            }
            require_once ABSPATH . "wp-admin/includes/template.php";
            require_once ABSPATH . "wp-admin/includes/plugin.php";
            ob_start();
            (new \Webactueel\WordPressConnector\Admin\Settings())->renderPage();
            $html = (string) ob_get_clean();
            if (strpos($html, "ChatGPT connection and recovery setup") === false ||
                strpos($html, "Not independently verified") === false ||
                strpos($html, "Official ChatGPT MCP connection instructions") === false ||
                strpos($html, "Full restore tested on staging") === false) {
              WP_CLI::error("Administrator setup guide did not render fail-closed external requirements");
            }
            if (strpos($html, "wpconnector-test-mcp") === false ||
                strpos($html, "wpconnector-copy-mcp") === false ||
                strpos($html, "does NOT connect ChatGPT") === false) {
              WP_CLI::error("MCP browser doctor admin controls are missing or misleading");
            }
            (new \Webactueel\WordPressConnector\Admin\Settings())->enqueueConnectionDoctor("settings_page_wordpressconnector");
            if (!wp_script_is("wpconnector-connection-doctor", "enqueued")) {
              WP_CLI::error("Admin MCP diagnostic script was not enqueued on its settings page");
            }
            $registered = wp_scripts()->registered["wpconnector-connection-doctor"] ?? null;
            if (!$registered || strpos($registered->src, "connection-doctor.js") === false ||
                strpos($registered->extra["data"] ?? "", "WPConnectorDoctor") === false) {
              WP_CLI::error("MCP admin script lacks REST nonce or is not registered");
            }
            WP_CLI::success("Real WordPress admin setup guide and read-only OAuth/full backup readiness verified");
          '
      - name: Destroy disposable test environment
        if: always()
        run: wp-env destroy --force
