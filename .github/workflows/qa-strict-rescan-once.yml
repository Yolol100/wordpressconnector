name: WordPress Connector independent full scanner rerun
on:
  push:
    branches:
      - fix/wpcs-phase5-three-adapters-20261019
    paths:
      - .github/workflows/qa-strict-rescan-once.yml

permissions:
  contents: read

jobs:
  full-wpcs-phpstan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install exact WordPress Coding Standards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs"
          cd "$RUNNER_TEMP/wpcs"
          composer init --no-interaction --name wordpressconnector/wpcs-rescan --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Scan all shipped PHP files and locked PHPStan providers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-scans"
          echo "repository_head=$GITHUB_SHA" > "$RUNNER_TEMP/qa-scans/commit.txt"
          set +e
          "$RUNNER_TEMP/wpcs/vendor/bin/phpcs" --standard=WordPress --report=summary --extensions=php plugin/wordpressconnector > "$RUNNER_TEMP/qa-scans/wpcs.txt" 2>&1
          code=$?
          set -e
          echo "$code" > "$RUNNER_TEMP/qa-scans/wpcs-exit.txt"
          composer install --working-dir=scripts/phpstan --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          composer validate --no-check-publish --working-dir=scripts/phpstan
          set +e
          scripts/phpstan/vendor/bin/phpstan analyse -c scripts/phpstan/phpstan.neon --no-progress --error-format=json > "$RUNNER_TEMP/qa-scans/phpstan.json" 2> "$RUNNER_TEMP/qa-scans/phpstan-stderr.txt"
          code=$?
          set -e
          echo "$code" > "$RUNNER_TEMP/qa-scans/phpstan-exit.txt"
          python3 - <<'PY'
          import json, pathlib, re, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa-scans'
          wpcs=(root/'wpcs.txt').read_text()
          mat=re.search(r'A TOTAL OF (\d+) ERRORS AND (\d+) WARNINGS WERE FOUND',wpcs)
          if not mat: raise SystemExit('WPCS summary missing; no valid result')
          phpstan=json.loads((root/'phpstan.json').read_text())
          totals=phpstan.get('totals')
          if not isinstance(totals,dict) or 'file_errors' not in totals: raise SystemExit('PHPStan summary missing')
          result={'wpcs_errors':int(mat.group(1)),'wpcs_warnings':int(mat.group(2)),
                  'phpstan_errors':int(totals['file_errors']),
                  'wpcs_exit':(root/'wpcs-exit.txt').read_text().strip(),
                  'phpstan_exit':(root/'phpstan-exit.txt').read_text().strip()}
          (root/'summary.json').write_text(json.dumps(result,indent=2))
          print('Diagnostic only (failure counts retained):',result)
          PY
      - name: Keep full scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connector-full-wpcs-phpstan-rescan
          path: ${{ runner.temp }}/qa-scans/
          retention-days: 14
          if-no-files-found: warn

  strict-plugin-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: plugin/wordpressconnector
          strict: 'true'
