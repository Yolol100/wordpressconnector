name: One-time DoctorCura phase 2 EU residual cleanup

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-phase2-eu-residual-cleanup/*.json'

permissions:
  contents: read

concurrency:
  group: doctorcura-phase2-eu-residual-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight apply readback and focused production verification
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || { echo 'Unexpected target' >&2; exit 1; }
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-phase2"; rm -rf "$root"; mkdir -p "$root/before" "$root/after" "$root/plan" "$root/dry" "$root/write"
          ids=(5864 5866 5877 5892 5896 5900 5902 5904 5906 5912 5918 5924 5926 5975 5979 5981 5984 5986 5988 5990 5993 5995 5999 6001 6008 6012 6014 6018 6020 6022 6024 6026 6028 6033 6035 6037 6042 6044 6046 6048 6050 900043 900048 900050 900060 900064)
          call(){
            suf="$1"; action="$2"; dry="$3"; confirm="$4"; payload="$5"
            python3 - "$root/r-$suf.json" "$action" "$dry" "$confirm" "$payload" <<'PY'
          import json,sys,uuid
          out,action,dry,confirm,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':'dc-p2-'+uuid.uuid4().hex[:20],'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':json.load(open(payload,encoding='utf-8'))},open(out,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            for n in $(seq 1 8); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$root/r-$suf.json" -o "$root/o-$suf.json" -w '%{http_code}' "$base/execute" || true)
              if [[ "$code" == 200 ]] && python3 - "$root/o-$suf.json" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') else 1)
          PY
              then return 0; fi
              [[ "$code" == 000 || "$code" == 429 || "$code" == 503 ]] && { echo "RETRY $n action=$action HTTP=$code"; sleep 12; continue; }
              echo "ACTION_FAIL action=$action HTTP=$code" >&2; cat "$root/o-$suf.json" >&2 || true; return 1
            done
            return 1
          }
          # Sitegate + connector health.
          health_ok=0
          for n in $(seq 1 8); do
            hc=$(curl -sS -L --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -o "$root/health.json" -w '%{http_code}' "$base/health" || true)
            [[ "$hc" == 200 ]] && { health_ok=1; break; }
            sleep 12
          done
          [[ "$health_ok" == 1 ]] || { echo 'HEALTH_UNAVAILABLE' >&2; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok') and d.get('transport')=='rest',d
          print('PHASE2_HEALTH_OK version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY
          # Baseline snapshots.
          for id in "${ids[@]}"; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "before-$id" post.get true false "$root/id.json"
            cp "$root/o-before-$id.json" "$root/before/$id.json"
          done
          # Deterministic preflight transformation; aborts before writes on missing anchors, link drift or banned residue.
          python3 scripts/doctorcura_eu_cleanup.py "$root/before" "$root/plan"
          changed=$(tr '\n' ' ' < "$root/plan/changed.txt" | sed 's/[[:space:]]*$//')
          echo "PHASE2_PLANNED_CHANGED=$changed"
          # Dry-run every planned write first.
          while read -r id; do
            [[ -n "$id" ]] || continue
            call "dry-$id" post.update true false "$root/plan/$id.json"
            cp "$root/o-dry-$id.json" "$root/dry/$id.json"
          done < "$root/plan/changed.txt"
          # Apply only after all dry-runs succeeded. Connector request IDs + before snapshots provide rollback evidence.
          while read -r id; do
            [[ -n "$id" ]] || continue
            call "write-$id" post.update false true "$root/plan/$id.json"
            cp "$root/o-write-$id.json" "$root/write/$id.json"
          done < "$root/plan/changed.txt"
          printf '{}' > "$root/empty.json"; call cache cache.flush false true "$root/empty.json" || true
          # Fresh readback for the entire 46-post affected universe.
          for id in "${ids[@]}"; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "after-$id" post.get true false "$root/id.json"
            cp "$root/o-after-$id.json" "$root/after/$id.json"
          done
          python3 - "$root" <<'PY'
          import html,json,os,re,sys
          root=sys.argv[1]
          ids=[5864,5866,5877,5892,5896,5900,5902,5904,5906,5912,5918,5924,5926,5975,5979,5981,5984,5986,5988,5990,5993,5995,5999,6001,6008,6012,6014,6018,6020,6022,6024,6026,6028,6033,6035,6037,6042,6044,6046,6048,6050,900043,900048,900050,900060,900064]
          changed={int(x.strip()) for x in open(root+'/plan/changed.txt',encoding='utf-8') if x.strip()}
          banned=re.compile(r'\bin\s+den\s+Deutschland\b|\bje\s+nach\s+Deutschland\b|Ebene\s+der\s+Deutschland|\bBundesstaat\w*\b|\bföderal\w*\b|Pharmacy\s+Benefit(?:\s+Plan|\s+Manager)?|Primary[- ]Care(?:\s+Provider|-Anbieter)?|Suicide\s*&\s*Crisis\s*Lifeline|\b(?:USA|United States|Vereinigte Staaten|FDA|DEA|HIPAA|Medicare|Medicaid|Zepbound|988|911)\b|\bUS-amerikan\w*\b|ist-ein-online-rezept-legal-usa',re.I)
          href=re.compile(r'href=["\']([^"\']+)',re.I)
          for pid in ids:
            b=(json.load(open(f'{root}/before/{pid}.json',encoding='utf-8')).get('data') or {}).get('post') or {}
            a=(json.load(open(f'{root}/after/{pid}.json',encoding='utf-8')).get('data') or {}).get('post') or {}
            if a.get('status')!=b.get('status'): raise SystemExit(f'STATUS_DRIFT {pid}')
            if a.get('title')!=b.get('title') or a.get('excerpt')!=b.get('excerpt'): raise SystemExit(f'NONCONTENT_DRIFT {pid}')
            bl=href.findall(b.get('content') or ''); expected=[u.replace('https://doctorcura.com/ist-ein-online-rezept-legal-usa/','https://doctorcura.com/ist-ein-online-rezept-legal-deutschland/') for u in bl]; al=href.findall(a.get('content') or '')
            if expected!=al: raise SystemExit(f'LINK_DRIFT {pid}')
            text=html.unescape(re.sub(r'(?s)<[^>]+>',' ',a.get('content') or '')); text=re.sub(r'\s+',' ',text)
            m=banned.search(text)
            if m: raise SystemExit(f'RESIDUAL {pid} {m.group(0)}')
            for node in re.split(r'(<[^>]+>)',a.get('content') or '')[::2]:
              if re.search(r'[ \t]+[,.!?;:]',node): raise SystemExit(f'PUNCTUATION {pid}')
            if pid in changed:
              planned=json.load(open(f'{root}/plan/{pid}.json',encoding='utf-8')).get('content') or ''
              if a.get('content')!=planned: raise SystemExit(f'READBACK_MISMATCH {pid}')
          print('PHASE2_READBACK_OK affected='+str(len(ids))+' changed='+str(len(changed))+' links_preserved=true residual=0')
          PY
          # Rendered production smoke for changed URLs.
          while read -r id; do
            [[ -n "$id" ]] || continue
            url=$(python3 - "$root/after/$id.json" "$site" <<'PY'
          import json,sys,urllib.parse
          p=(json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('post') or {}
          print(p.get('link') or urllib.parse.urljoin(sys.argv[2]+'/',str(p.get('slug') or '')+'/'))
          PY
          )
            for n in $(seq 1 5); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 DoctorCuraPhase2QA' -o "$root/render-$id.html" -w '%{http_code}' "$url" || true)
              [[ "$code" == 200 ]] && break
              sleep 8
            done
            [[ "$code" == 200 ]] || { echo "RENDER_FAIL id=$id HTTP=$code" >&2; exit 1; }
          done < "$root/plan/changed.txt"
          echo PHASE2_COMPLETE
      - name: Upload phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-phase2-eu-residual-cleanup
          path: |
            ${{ runner.temp }}/dc-phase2/plan
            ${{ runner.temp }}/dc-phase2/before
            ${{ runner.temp }}/dc-phase2/after
            ${{ runner.temp }}/dc-phase2/dry
            ${{ runner.temp }}/dc-phase2/write
          retention-days: 7
          if-no-files-found: warn
