name: DoctorCura Phase 4 Evidence Classifier

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/analyze-doctorcura-phase4-evidence.yml'

permissions:
  contents: read
  actions: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download corrected Phase 4 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/Yolol100/wordpressconnector/actions/artifacts/10160734791/zip' \
            --output /tmp/phase4.zip
          mkdir -p /tmp/phase4
          unzip -q /tmp/phase4.zip -d /tmp/phase4
          test -s /tmp/phase4/doctorcura-exhaustive-results.json
          sha256sum /tmp/phase4.zip
      - name: Print remaining high evidence and pagination matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/phase4/doctorcura-exhaustive-results.json',encoding='utf-8'))
          an=d.get('anomalies',[]); rs=d.get('results',[]); by={r.get('url'):r for r in rs}
          highs=[a for a in an if a.get('severity')=='HIGH']
          print(f"SUMMARY results={len(rs)} anomalies={len(an)} highs={len(highs)}")
          for a in highs:
              r=by.get(a.get('url'),{})
              print(f"HIGH\tkind={a.get('kind')}\turl={a.get('url')}\tdetail={a.get('detail','')}\tfirst={r.get('firstStatus')}\tloc={r.get('firstLocation','')}\tfinal={r.get('finalStatus')}\tfinalUrl={r.get('finalUrl','')}\tredirects={r.get('redirects')}\tcanonical={r.get('canonical','')}\trobots={r.get('robots','')}\txrobots={r.get('xRobots','')}\tbodyBytes={r.get('bodyBytes')}")
          print('=== BLOG 16/17 MATRIX ===')
          for lang in ('','fr/','en/'):
              for n in (16,17):
                  u=f'https://doctorcura.com/{lang}blogs/{n}/'
                  r=by.get(u,{})
                  print(f"BLOG\t{u}\tfirst={r.get('firstStatus')}\tloc={r.get('firstLocation','')}\tfinal={r.get('finalStatus')}\tfinalUrl={r.get('finalUrl','')}\tredirects={r.get('redirects')}\tcanonical={r.get('canonical','')}\trobots={r.get('robots','')}\tbodyBytes={r.get('bodyBytes')}")
          print('PHASE4_BLOCKER_INSPECTION_COMPLETE')
          PY
