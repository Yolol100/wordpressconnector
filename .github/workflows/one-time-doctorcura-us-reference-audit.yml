name: One-time DoctorCura US reference audit

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-us-reference-audit/*.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Audit all DoctorCura posts for US references
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          [[ "$site" == 'https://doctorcura.com' ]] || { echo 'Unexpected target.' >&2; exit 1; }
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-us-audit"; mkdir -p "$root"
          health=$(curl -sS -L --connect-timeout 10 --max-time 30 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/health.json" -w '%{http_code}' "$base/health")
          [[ "$health" == 200 ]] || { echo "Health failed HTTP $health" >&2; exit 1; }

          call() {
            suffix="$1"; action="$2"; payload="$3"
            python3 - "$root/r-$suffix.json" "$action" "$payload" <<'PY'
          import json,sys,uuid
          out,action,payload=sys.argv[1:]
          data={'version':1,'request_id':'dc-us-'+uuid.uuid4().hex[:24],'action':action,'dry_run':True,'confirm':False,'payload':json.loads(payload)}
          json.dump(data,open(out,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute")
            [[ "$code" == 200 ]] || return 1
          }

          : > "$root/post-ids.txt"
          for page in $(seq 1 20); do
            payload=$(printf '{"post_type":"post","status":"any","per_page":100,"page":%s}' "$page")
            if ! call "list-$page" post.list "$payload"; then break; fi
            count=$(python3 - "$root/o-list-$page.json" "$root/post-ids.txt" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); items=(d.get('data') or {}).get('items',[])
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              for x in items:
                  if isinstance(x,dict) and isinstance(x.get('id'),int): f.write(str(x['id'])+'\n')
          print(len(items))
          PY
          )
            [[ "$count" -lt 100 ]] && break
          done
          sort -u "$root/post-ids.txt" -o "$root/post-ids.txt"

          mkdir -p "$root/posts"
          while read -r id; do
            [[ -n "$id" ]] || continue
            call "post-$id" post.get "{\"id\":$id}" || continue
            cp "$root/o-post-$id.json" "$root/posts/$id.json"
          done < "$root/post-ids.txt"

          python3 - "$root/posts" "$root/us-reference-report.json" "$root/us-reference-summary.txt" <<'PY'
          import json,sys,re,glob,html
          folder,outf,summary=sys.argv[1:]
          patterns={
            'united_states':r'\bUnited States\b|\bU\.S\.A?\.?\b|\bUSA\b|\bUS[- ](?:market|healthcare|doctor|patient|prescription|pharmacy|law|regulation|system)\b',
            'german_us_terms':r'\bVereinigte Staaten\b|\bUSA\b|\bUS-amerikan(?:isch|ische|ischen|ischer|isches)\b|\bamerikan(?:isch|ische|ischen|ischer|isches)\b',
            'us_regulators':r'\bFDA\b|Food and Drug Administration|\bDEA\b|Drug Enforcement Administration|\bHIPAA\b',
            'us_geography':r'\bNew York\b|\bCalifornia\b|\bTexas\b|\bFlorida\b|\bWashington,? D\.?C\.?\b',
            'us_currency':r'\bUSD\b|US\$|\$\s?\d'
          }
          report=[]
          for p in glob.glob(folder+'/*.json'):
              try: d=json.load(open(p,encoding='utf-8'))
              except: continue
              post=(d.get('data') or {}).get('post') or {}
              content=post.get('content','') if isinstance(post,dict) else ''
              title=post.get('title','') if isinstance(post,dict) else ''
              text=html.unescape(re.sub(r'<[^>]+>',' ',str(content)))
              hits=[]
              for name,pat in patterns.items():
                  ms=list(re.finditer(pat,text,re.I))
                  if ms:
                      hits.append({'type':name,'matches':sorted(set(m.group(0) for m in ms))[:20]})
              if hits:
                  report.append({'id':post.get('id'),'slug':post.get('slug'),'status':post.get('status'),'title':title,'link':post.get('link') or post.get('url'),'hits':hits,'content':content})
          json.dump(report,open(outf,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          with open(summary,'w',encoding='utf-8') as f:
              f.write(f'matching_posts={len(report)}\n')
              for x in report:
                  f.write(f"{x.get('id')}\t{x.get('status')}\t{x.get('slug')}\t{x.get('title')}\t"+','.join(h['type'] for h in x['hits'])+'\n')
          print(f'matching_posts={len(report)}')
          for x in report: print(x.get('id'),x.get('slug'),','.join(h['type'] for h in x['hits']))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-us-reference-audit
          path: |
            ${{ runner.temp }}/dc-us-audit/us-reference-report.json
            ${{ runner.temp }}/dc-us-audit/us-reference-summary.txt
          retention-days: 7
