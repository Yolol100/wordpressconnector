name: Haknes temporary menu post-install read-only QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/haknes-menu-install-qa.yml'
permissions:
  contents: read
jobs:
  menu-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect live public pages and product menu links
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time,html,re
          from html.parser import HTMLParser
          from urllib.parse import urlsplit,parse_qs
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__();self.stack=[];self.links=[];self.seen_ids=set();self.menus=0;self.old_containers=0;self.active=None;self.menuitem_n=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); cl=a.get('class','');id=a.get('data-id','')
                  if id in ('792429c','54d3984'): self.seen_ids.add(id)
                  if 'wa-dpcm7-menu' in cl.split():self.menus+=1
                  if 'old-static-product-menu' in cl.split():self.old_containers+=1
                  if tag=='a':
                      self.active={'href':html.unescape(a.get('href','')),'text':'','classes':cl,'ancestors':[(t,d.get('class','')[:90],d.get('data-id','')) for t,d in self.stack[-7:]]}
                  if tag not in ('br','img','input','link','meta','hr','source','path','use','wbr','area','base'):self.stack.append((tag,a))
              def handle_data(self,data):
                  if self.active:self.active['text']+=data
              def handle_endtag(self,tag):
                  if tag=='a' and self.active:
                      self.active['text']=' '.join(self.active['text'].split());self.links.append(self.active);self.active=None
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:self.stack=self.stack[:i];break
          samples=['/','/winkel/page/3/','/product-categorie/rund/','/product/wudy-worst/','/category/blog/']
          total_old=0;missing=0;total_menus=0
          for path in samples:
              target='https://haknes.nl'+path
              request=urllib.request.Request(target,headers={'User-Agent':'Haknes-post-snippet-readonly-QA/1.0','Cache-Control':'no-cache','Accept':'text/html'})
              start=time.monotonic()
              try:
                  with urllib.request.urlopen(request,timeout=24) as r: status=r.status;ctype=r.headers.get('Content-Type','');page=r.read(1400000).decode('utf-8','replace');headers=dict(r.headers)
              except Exception as e:
                  print('FETCH_ERROR',path,type(e).__name__,str(e)[:130],flush=True);missing+=1;continue
              parser=Audit();parser.feed(page)
              old=[]
              for item in parser.links:
                  qs=parse_qs(urlsplit(item['href']).query)
                  if qs.get('post_type',[''])[0]=='product' and qs.get('p',[''])[0] in ('6550','6687'):old.append(item)
              total_old+=len(old);total_menus+=parser.menus
              print('PAGE',path,'http',status,'ttfb_approx_ms',round((time.monotonic()-start)*1000),
                    'menu_elements',parser.menus,'old_static_containers',parser.old_containers,
                    'old_product_links',len(old),'elementor_ids',sorted(parser.seen_ids),'total_anchor_links',len(parser.links),flush=True)
              for item in old:
                  print('OLD_LINK',path,'label',repr(item['text'][:75]),'href',item['href'][:170],
                       'parents',repr(item['ancestors'][-5:]),flush=True)
              if path=='/':
                  for label in ['Maïskip','Paprika poeder gerookt','Wudy Worst','Rundertong']:
                      hits=[(x['text'],x['href']) for x in parser.links if label.lower() in x['text'].lower()][:7]
                      print('PRODUCT_LINK',label,repr(hits),flush=True)
                  print('SOURCE_MARKERS', 'dynamic_menu_markup','wa-dpcm7-menu' in page,
                       'hide_rule_present','.old-static-product-menu' in page,
                       'shortcode_literal', '[wa_product_category_menu]' in page, flush=True)
          print('TOTAL','pages_ok',len(samples)-missing,'pages_expected',len(samples),'old_product_links',total_old,'dynamic_menu_elements',total_menus,flush=True)
          if missing:raise SystemExit('Some pages unavailable')
          PY

      - name: Check actual product destinations and redirect behavior
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          targets=[
              'https://haknes.nl/?post_type=product&p=6550',
              'https://haknes.nl/?post_type=product&p=6687',
              'https://haknes.nl/product/maiskip-2/',
              'https://haknes.nl/product/wudy-worst/',
              'https://haknes.nl/product/runder-tong/',
              'https://haknes.nl/winkelwagen/',
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          client=urllib.request.build_opener(NoRedirect())
          for url in targets:
              req=urllib.request.Request(url,headers={'User-Agent':'Haknes-readonly-postsnippet-link-QA/1.0'})
              start=time.monotonic()
              try:
                  with client.open(req,timeout=20) as r:
                      status=r.status;location=r.headers.get('Location','');content_type=r.headers.get('Content-Type','')
              except urllib.error.HTTPError as e:
                  status=e.code;location=e.headers.get('Location','');content_type=e.headers.get('Content-Type','')
              except Exception as e:
                  print('DESTINATION_ERROR',url,type(e).__name__,str(e)[:130],flush=True);continue
              print('DESTINATION',url,'http',status,'location',location,'type',content_type.split(';')[0],'elapsed_ms',round((time.monotonic()-start)*1000),flush=True)
          PY
      - name: Checkout pinned read-only browser QA adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yolol100/Designchecker
          ref: 54cb8becc5c15bf3d65e76b7c4b10e18f9e67a27
          path: designchecker
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked browser dependencies
        run: npm ci --prefix designchecker --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium
        run: node designchecker/node_modules/playwright/cli.js install chromium
      - name: Inspect desktop and mobile rendered menu with Chromium
        shell: bash
        run: |
          node - <<'JS'
          const { chromium } = require('./designchecker/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              for (const {mode,width,height} of [
                {mode:'desktop',width:1366,height:850},
                {mode:'mobile',width:390,height:844}
              ]) {
                const page=await browser.newPage({viewport:{width,height},isMobile:mode==='mobile',hasTouch:mode==='mobile'});
                const response=await page.goto('https://haknes.nl/',{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(1400);
                let result=await page.evaluate(() => {
                  const info=(selector)=>{
                    const el=document.querySelector(selector);
                    if(!el)return {present:false};
                    const st=window.getComputedStyle(el),rect=el.getBoundingClientRect();
                    return {present:true,display:st.display,visibility:st.visibility,rect_width:Math.round(rect.width),rect_height:Math.round(rect.height),link_count:el.querySelectorAll('a[href]').length};
                  };
                  return {
                    url:location.href,
                    dynamic_menu_count:document.querySelectorAll('nav.wa-dpcm7-menu').length,
                    dynamic:info('nav.wa-dpcm7-menu'),
                    old_maiskip_widget:info('.elementor-element-792429c'),
                    old_paprika_widget:info('.elementor-element-54d3984'),
                    old_maiskip_href:document.querySelector('.elementor-element-792429c a[href*="6550"]')?.getAttribute('href')||'',
                    old_paprika_href:document.querySelector('.elementor-element-54d3984 a[href*="6687"]')?.getAttribute('href')||'',
                  };
                });
                console.log('BROWSER',mode,'status',response?.status(),'initial',JSON.stringify(result));
                if(mode==='desktop') {
                  try {
                    const open=page.getByText('Ons assortiment',{exact:true}).first();
                    if(await open.count()) {await open.hover({timeout:7000});await page.waitForTimeout(700);}
                  } catch(e) {console.log('BROWSER_HOVER_UNAVAILABLE',String(e).slice(0,120));}
                  const result2=await page.evaluate(()=>{
                    const el=document.querySelector('nav.wa-dpcm7-menu');
                    if(!el)return {present:false};
                    const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                    return {display:s.display,visibility:s.visibility,width:Math.round(r.width),height:Math.round(r.height),links:el.querySelectorAll('a[href]').length};
                  });
                  console.log('BROWSER_DESKTOP_AFTER_HOVER',JSON.stringify(result2));
                }
                await page.close();
              }
            } finally{await browser.close();}
          })().catch(e=>{console.error('BROWSER_FATAL',String(e));process.exit(1);});
          JS

      - name: Test actual dropdown triggers and mobile menu opening
        shell: bash
        run: |
          node - <<'JS'
          const { chromium } = require('./designchecker/node_modules/playwright');
          (async () => {
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              for (const [mode,width,height] of [['desktop',1366,850],['mobile',390,844]]) {
                const page=await browser.newPage({viewport:{width,height},isMobile:mode==='mobile',hasTouch:mode==='mobile'});
                await page.goto('https://haknes.nl/',{waitUntil:'domcontentloaded',timeout:50000});
                await page.waitForTimeout(800);
                const state=async()=>await page.evaluate(()=>{
                  const a=document.querySelector('nav.wa-dpcm7-menu');
                  const w=document.querySelector('.elementor-element-792429c');
                  const p=document.querySelector('.elementor-element-54d3984');
                  const v=(e)=>{if(!e)return null;const r=e.getBoundingClientRect();return {w:Math.round(r.width),h:Math.round(r.height),display:getComputedStyle(e).display}};
                  const hiddenChain=[];let el=a;
                  while(el&&hiddenChain.length<10){const r=el.getBoundingClientRect(),st=getComputedStyle(el);if(st.display==='none'||r.width===0)hiddenChain.push({tag:el.tagName,cls:String(el.className).slice(0,100),display:st.display,width:Math.round(r.width)});el=el.parentElement;}
                  return {dynamic:v(a),mobile_widget1:v(w),mobile_widget2:v(p),hidden_chain:hiddenChain};
                });
                const triggers=await page.evaluate(()=>{
                  return [...document.querySelectorAll('a,button,[role="button"]')].filter(el=>String(el.textContent).toLowerCase().includes('ons assortiment')).slice(0,10).map(e=>{
                    const r=e.getBoundingClientRect();return {tag:e.tagName,text:e.textContent.trim().slice(0,75),class:e.className,href:e.getAttribute('href'),width:Math.round(r.width),height:Math.round(r.height),parent:String(e.parentElement?.className).slice(0,80)};
                  });
                });
                console.log('INTERACTIVE_INITIAL',mode,JSON.stringify(await state()));
                console.log('TRIGGERS',mode,JSON.stringify(triggers));
                const cs=page.locator('a,button,[role="button"]').filter({hasText:/Ons assortiment/i});
                const n=Math.min(await cs.count(),9);
                for(let i=0;i<n;i++){
                  try {
                    const target=cs.nth(i);
                    if(!await target.isVisible())continue;
                    await target.hover({timeout:3500});await page.waitForTimeout(350);
                    const info=await state();console.log('AFTER_TRIGGER_HOVER',mode,'idx',i,JSON.stringify(info));
                    if(info.dynamic?.w>120)break;
                  }catch(e){console.log('TRIGGER_ERROR',mode,i,String(e).slice(0,150));}
                }
                if(mode==='mobile'){
                  const toggle=page.locator('.elementor-menu-toggle:visible,button[aria-label*="menu" i]:visible').first();
                  console.log('MOBILE_TOGGLE_COUNT',await page.locator('.elementor-menu-toggle:visible,button[aria-label*="menu" i]:visible').count());
                  if(await toggle.count()){
                    try {await toggle.click({timeout:5000});await page.waitForTimeout(500);console.log('MOBILE_AFTER_TOGGLE',JSON.stringify(await state()));}
                    catch(e){console.log('MOBILE_TOGGLE_ERROR',String(e).slice(0,200));}
                  }
                }
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error('INTERACTIVE_FATAL',String(e));process.exit(1)});
          JS

      - name: Exercise mobile category submenu without modifying site
        shell: bash
        run: |
          node - <<'JS'
          const { chromium } = require('./designchecker/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await page.goto('https://haknes.nl/',{waitUntil:'domcontentloaded',timeout:50000});
              await page.waitForTimeout(700);
              const state=()=>page.evaluate(()=>{
                const g=(s)=>{let x=document.querySelector(s);if(!x)return null;const r=x.getBoundingClientRect(),st=getComputedStyle(x);return {w:Math.round(r.width),h:Math.round(r.height),display:st.display}};
                return {
                  menu:g('nav.wa-dpcm7-menu'),
                  old_widget_maiskip:g('.elementor-element-792429c'),
                  old_widget_paprika:g('.elementor-element-54d3984'),
                  nav_wrapper:g('.e-n-menu-wrapper'),
                  count_visible_menu_buttons:[...document.querySelectorAll('button.e-n-menu-dropdown-icon')].filter(x=>{const r=x.getBoundingClientRect();return r.width>0}).length
                };
              });
              console.log('MOBILE_START',JSON.stringify(await state()));
              const mainToggle=page.locator('.elementor-menu-toggle:visible,button[aria-label*="menu" i]:visible').first();
              if(await mainToggle.count()){
                await mainToggle.click({timeout:6000});
                await page.waitForTimeout(550);
                console.log('MOBILE_ROOT_OPEN',JSON.stringify(await state()));
              }
              const buttons=page.locator('button.e-n-menu-dropdown-icon:visible');
              const count=await buttons.count();
              console.log('MOBILE_SUBMENU_BUTTONS',count);
              for(let i=0;i<Math.min(count,6);i++){
                try{
                  const b=buttons.nth(i);
                  const parent=await b.evaluate(e=>e.closest('.e-n-menu-item')?.innerText?.slice(0,70)||e.parentElement?.innerText?.slice(0,70));
                  console.log('MOBILE_SUBMENU_CANDIDATE',i,JSON.stringify(parent));
                  if(!String(parent).toLowerCase().includes('ons assortiment'))continue;
                  await b.click({timeout:7000});await page.waitForTimeout(600);
                  console.log('MOBILE_AFTER_ASSORTIMENT_OPEN',JSON.stringify(await state()));
                  break;
                }catch(e){console.log('MOBILE_SUBMENU_ERROR',i,String(e).slice(0,140));}
              }
              await page.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error('MOBILE_FATAL',String(e));process.exit(1)});
          JS
