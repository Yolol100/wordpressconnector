name: Restore DoctorCura SEO Snippet V8.2

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-deep-seo-safe.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Restore V8.2 with guarded readback and rollback
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-v82-restore"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/code-snippets/v1/snippets/43"
          expected_v7='83a05b5734751d01d93488fcfbcd601ce2e245a7f41e6d2675beaf38af1dec7b'
          marker='DoctorCura blog pagination cleanup V8.2'
          changed=0

          put_payload(){
            local payload="$1" out="$2"
            curl --silent --show-error --location --connect-timeout 10 --max-time 45 "${auth[@]}" \
              --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' \
              --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$api"
          }
          make_payload(){
            local codefile="$1" active="$2" outfile="$3"
            php -r '$c=file_get_contents($argv[1]);$a=$argv[2]==="true";file_put_contents($argv[3],json_encode(["code"=>$c,"active"=>$a],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$codefile" "$active" "$outfile"
          }
          make_helper_code(){
            local source="$1" token="$2" outfile="$3"
            cp "$source" "$outfile"
            cat >> "$outfile" <<'PHP'

/* DoctorCura one-time cache purge helper - removed automatically */
add_action('init', function () {
    if (!isset($_GET['doctorcura_seo_purge']) || !hash_equals('__TOKEN__', (string) $_GET['doctorcura_seo_purge'])) {
        return;
    }
    $rocket = function_exists('rocket_clean_domain');
    if ($rocket) {
        rocket_clean_domain();
    }
    if (function_exists('wp_cache_flush')) {
        wp_cache_flush();
    }
    header('X-DoctorCura-SEO-Purge: ' . ($rocket ? 'rocket' : 'object-only'));
}, 1);
PHP
            sed -i "s/__TOKEN__/$token/g" "$outfile"
          }
          purge_with_code(){
            local codefile="$1" label="$2" token payload http restore_payload
            token=$(openssl rand -hex 24)
            make_helper_code "$codefile" "$token" "$tmp/$label-helper.php"
            make_payload "$tmp/$label-helper.php" true "$tmp/$label-helper.json"
            http=$(put_payload "$tmp/$label-helper.json" "$tmp/$label-helper-response.json")
            [[ "$http" == '200' ]] || return 1
            curl --silent --show-error --compressed --connect-timeout 10 --max-time 40 \
              --dump-header "$tmp/$label-purge.h" --output /dev/null "$base/wp-json/?doctorcura_seo_purge=$token"
            grep -Eiq '^x-doctorcura-seo-purge:[[:space:]]*rocket' "$tmp/$label-purge.h" || return 1
          }
          canonical_of(){
            local f="$1" c=''
            c=$(grep -Eio '<link[^>]+rel="canonical"[^>]+href="[^"]+"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true)
            if [[ -z "$c" ]]; then c=$(grep -Eio '<link[^>]+href="[^"]+"[^>]+rel="canonical"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true); fi
            printf '%s' "$c"
          }
          rollback(){
            rc=$?; [[ "$rc" == '0' ]] && return
            echo "V82_RESTORE_ROLLBACK_START exit=$rc" >&2; set +e
            if [[ "$changed" == '1' ]]; then
              purge_with_code "$tmp/original.php" rollback >/dev/null 2>&1 || true
              make_payload "$tmp/original.php" false "$tmp/rollback-final.json"
              put_payload "$tmp/rollback-final.json" "$tmp/rollback-final-response.json" >/dev/null || true
            fi
            echo 'V82_RESTORE_ROLLBACK_ATTEMPTED' >&2
          }
          trap rollback EXIT

          echo '=== READ AND VALIDATE CURRENT V7 STATE ==='
          http=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --output "$tmp/current.json" --write-out '%{http_code}' "$api")
          [[ "$http" == '200' ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if((int)($s["id"]??0)!==43||($s["name"]??"")!=="DoctorCura SEO indexation cleanup"||($s["active"]??true)!==false||hash("sha256",$c)!==$argv[3]||strpos($c,"DoctorCura SEO indexation cleanup V7")===false||strpos($c,"DoctorCura blog pagination cleanup V8.2")!==false||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);file_put_contents($argv[2],$c);echo"validated_v7_inactive hash=".hash("sha256",$c).PHP_EOL;' "$tmp/current.json" "$tmp/original.php" "$expected_v7"

          echo '=== BUILD PROVEN V8.2 ==='
          cp "$tmp/original.php" "$tmp/final.php"
          cat >> "$tmp/final.php" <<'PHP'

/* DoctorCura blog pagination cleanup V8.2 - 2026-09-09 */
add_filter( 'wpseo_canonical', function ( $canonical ) {
    $path = wp_parse_url( isset( $_SERVER['REQUEST_URI'] ) ? (string) $_SERVER['REQUEST_URI'] : '', PHP_URL_PATH );
    if ( ! is_string( $path ) ) return $canonical;
    if ( preg_match( '#^/(?:fr/|en/)?blogs/(4|5)/?$#', $path, $m ) ) {
        $prefix = preg_match( '#^/(fr|en)/#', $path, $lang ) ? '/' . $lang[1] : '';
        return home_url( $prefix . '/blogs/' . (int) $m[1] . '/' );
    }
    return $canonical;
}, 99 );
add_action( 'template_redirect', function () {
    $path = wp_parse_url( isset( $_SERVER['REQUEST_URI'] ) ? (string) $_SERVER['REQUEST_URI'] : '', PHP_URL_PATH );
    if ( ! is_string( $path ) ) return;
    if ( preg_match( '#^/(?:fr/|en/)?blogs/page/5/?$#', $path ) ) {
        $prefix = preg_match( '#^/(fr|en)/#', $path, $lang ) ? '/' . $lang[1] : '';
        wp_safe_redirect( home_url( $prefix . '/blogs/5/' ), 301, 'DoctorCura SEO pagination cleanup' );
        exit;
    }
}, 0 );
PHP
          final_hash=$(sha256sum "$tmp/final.php" | awk '{print $1}')
          echo "built_v82_hash=$final_hash"

          echo '=== ACTIVATE V8.2 AND PURGE PAGE CACHE ==='
          purge_with_code "$tmp/final.php" apply
          changed=1
          make_payload "$tmp/final.php" true "$tmp/final.json"
          [[ "$(put_payload "$tmp/final.json" "$tmp/final-response.json")" == '200' ]]

          echo '=== SNIPPET READBACK ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$api" > "$tmp/readback.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if((int)($s["id"]??0)!==43||empty($s["active"])||strpos($c,$argv[2])===false||strpos($c,"DoctorCura one-time cache purge helper")!==false||hash("sha256",$c)!==$argv[3])exit(2);echo"snippet_readback=active_v82 hash=".hash("sha256",$c).PHP_EOL;' "$tmp/readback.json" "$marker" "$final_hash"

          verify_round(){
            local round="$1" lang prefix p url html result canon alias alias_target alias_result
            echo "=== PAGINATION VERIFY $round ==="
            for lang in base fr en; do
              [[ "$lang" == 'base' ]] && prefix='' || prefix="/$lang"
              for p in 4 5; do
                url="$base$prefix/blogs/$p/"; html="$tmp/$round-$lang-$p.html"
                result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 --output "$html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$url")
                [[ "$result" == $'200\t'"$url"$'\t0' ]] || { echo "$lang page$p result=$result" >&2; return 1; }
                canon=$(canonical_of "$html"); [[ "$canon" == "$url" ]] || { echo "$lang page$p canonical=$canon" >&2; return 1; }
              done
              alias="$base$prefix/blogs/page/5/"; alias_target="$base$prefix/blogs/5/"
              alias_result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 --output "$tmp/$round-$lang-alias.html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$alias")
              [[ "$alias_result" == $'200\t'"$alias_target"$'\t1' ]] || { echo "$lang alias=$alias_result" >&2; return 1; }
              canon=$(canonical_of "$tmp/$round-$lang-alias.html"); [[ "$canon" == "$alias_target" ]] || { echo "$lang alias canonical=$canon" >&2; return 1; }
            done
            echo "V82_PAGINATION_VERIFY_OK $round"
          }

          verify_round one
          sleep 5
          verify_round two
          trap - EXIT
          echo 'V82_RESTORE_SUCCESS active=true marker=V8.2'
