name: Fix DoctorCura Phase 2B Featured Image V2

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-deep-seo-safe.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Apply featured image fix with native Elementor cache clear
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-phase2b-v2"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          wpapi="$base/wp-json/wp/v2"
          redapi="$base/wp-json/redirection/v1"
          elementor_cache="$base/wp-json/elementor/v1/cache"
          clean_slug='welche-medikamente-beeinflussen-die-erektion'
          dup_slug='welche-medikamente-beeinflussen-die-erektion-2'
          clean="$base/$clean_slug/"; dup="$base/$dup_slug/"
          candidate="$base/wp-content/uploads/2026/06/beste-optionen-bei-erektionsstoerungen-featured.webp"
          broken_name='welche-medikamente-beeinflussen-die-erektion-featured.webp'
          changed=0

          post_json(){ local endpoint="$1" payload="$2" outfile="$3"; curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request POST --header 'Content-Type: application/json' --data-binary "@$payload" --output "$outfile" --write-out '%{http_code}' "$endpoint"; }
          canonical_of(){ local f="$1" c=''; c=$(grep -Eio '<link[^>]+rel="canonical"[^>]+href="[^"]+"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true); if [[ -z "$c" ]]; then c=$(grep -Eio '<link[^>]+href="[^"]+"[^>]+rel="canonical"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true); fi; printf '%s' "$c"; }
          clear_elementor(){
            local code
            code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request DELETE --output "$tmp/elementor-cache.json" --write-out '%{http_code}' "$elementor_cache")
            echo "elementor_cache_http=$code"
            [[ "$code" == '200' ]]
          }
          rollback(){
            rc=$?; [[ "$rc" == '0' ]] && return
            echo "PHASE2B_V2_ROLLBACK_START exit=$rc" >&2; set +e
            if [[ "$changed" == '1' ]]; then
              printf '{"featured_media":900069}' > "$tmp/rb.json"
              post_json "$wpapi/posts/900067" "$tmp/rb.json" "$tmp/rb-response.json" >/dev/null
              clear_elementor >/dev/null 2>&1 || true
            fi
            echo 'PHASE2B_V2_ROLLBACK_ATTEMPTED' >&2
          }
          trap rollback EXIT

          echo '=== PREFLIGHT PHASE2A STATE ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900067?context=edit" > "$tmp/keep.json"
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900066?context=edit" > "$tmp/dup.json"
          php -r '$k=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$d=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);if(($k["status"]??"")!=="publish"||($k["slug"]??"")!=="welche-medikamente-beeinflussen-die-erektion"||(int)($k["featured_media"]??0)!==900069)exit(2);if(($d["status"]??"")!=="draft")exit(3);echo"phase2a_state=ok\n";' "$tmp/keep.json" "$tmp/dup.json"
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "filterBy[url]=/$dup_slug/" --data-urlencode 'per_page=20' "$redapi/redirect" > "$tmp/red.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$ok=false;foreach(($d["items"]??[])as$x){if((int)($x["id"]??0)===14&&($x["url"]??"")==="/welche-medikamente-beeinflussen-die-erektion-2/"&&(int)($x["action_code"]??0)===301&&(($x["action_data"]["url"]??"")==="https://doctorcura.com/welche-medikamente-beeinflussen-die-erektion/"))$ok=true;}if(!$ok)exit(2);echo"redirect14=ok\n";' "$tmp/red.json"
          [[ "$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$candidate")" == '200' ]] || { echo 'Candidate image unavailable' >&2; exit 1; }
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/elementor_library/5841?context=edit" > "$tmp/template.json"
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$raw=(string)($p["meta"]["_elementor_data"]??"");$d=json_decode($raw,true,512,JSON_THROW_ON_ERROR);$found=[];$walk=function($els)use(&$walk,&$found){foreach($els as$e){if(($e["id"]??"")==="695868ca")$found[]=$e;if(!empty($e["elements"]))$walk($e["elements"]);}};$walk($d);if(count($found)!==1)exit(2);$w=$found[0];$dyn=$w["settings"]["__dynamic__"]["image"]??"";if(($w["widgetType"]??"")!=="image"||strpos($dyn,"name=\"post-featured-image\"")===false)exit(3);echo"elementor_dynamic_featured=ok\n";' "$tmp/template.json"

          echo '=== UPDATE FEATURED MEDIA ==='
          printf '{"featured_media":5925}' > "$tmp/update.json"
          [[ "$(post_json "$wpapi/posts/900067" "$tmp/update.json" "$tmp/update-response.json")" == '200' ]] || exit 1
          changed=1
          [[ "$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($p["featured_media"]??0);' "$tmp/update-response.json")" == '5925' ]] || exit 1

          echo '=== CLEAR ELEMENTOR FILES AND DATA CACHE ==='
          clear_elementor

          verify_round(){
            local round="$1" lang prefix url html result canon
            echo "=== VERIFY $round ==="
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900067?context=edit" > "$tmp/$round-post.json"
            [[ "$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($p["featured_media"]??0);' "$tmp/$round-post.json")" == '5925' ]] || { echo 'Featured readback failed' >&2; return 1; }
            for lang in base fr en; do
              [[ "$lang" == 'base' ]] && prefix='' || prefix="/$lang"
              url="$base$prefix/$clean_slug/"; html="$tmp/$round-$lang.html"
              result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 --output "$html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$url")
              [[ "$result" == $'200\t'"$url"$'\t0' ]] || { echo "$lang URL failed $result" >&2; return 1; }
              canon=$(canonical_of "$html"); [[ "$canon" == "$url" ]] || { echo "$lang canonical=$canon" >&2; return 1; }
              grep -Eio '<img[^>]+beste-optionen-bei-erektionsstoerungen-featured[^>]*>' "$html" | grep -q . || { echo "$lang replacement image not rendered" >&2; return 1; }
              ! grep -Fq "$broken_name" "$html" || { echo "$lang broken image still rendered" >&2; return 1; }
              grep -Eio '<meta[^>]+property="og:image"[^>]*>' "$html" | grep -Fq "$candidate" || { echo "$lang og:image not candidate" >&2; return 1; }
            done
            result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 --output /dev/null --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$dup")
            [[ "$result" == $'200\t'"$clean"$'\t1' ]] || { echo "Phase2A regression $result" >&2; return 1; }
            echo "PHASE2B_V2_VERIFY_OK $round"
          }

          verify_round one
          sleep 5
          verify_round two
          trap - EXIT
          echo 'PHASE2B_V2_SUCCESS featured_media=5925 elementor_cache=cleared'
