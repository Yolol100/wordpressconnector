name: Fix DoctorCura Deep SEO Safe Corrections V2

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-deep-seo-safe.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Apply guarded redirects, duplicate cleanup, image and HTTPS link fix
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          [[ "$base" == 'https://doctorcura.com' ]] || { echo 'DoctorCura target mismatch' >&2; exit 1; }
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          tmp="$RUNNER_TEMP/dc-deep-fix-v2"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          wpapi="$base/wp-json/wp/v2"
          redapi="$base/wp-json/redirection/v1"
          slug='welche-medikamente-beeinflussen-die-erektion'
          dupslug='welche-medikamente-beeinflussen-die-erektion-2'
          created_ids=()
          page_changed=0
          feature_changed=0
          duplicate_changed=0

          canonical_of(){
            local body="$1" c=''
            c=$(grep -Eio '<link[^>]+rel="canonical"[^>]+href="[^"]+"' "$body" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true)
            if [[ -z "$c" ]]; then
              c=$(grep -Eio '<link[^>]+href="[^"]+"[^>]+rel="canonical"' "$body" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true)
            fi
            printf '%s' "$c"
          }
          post_json(){
            local endpoint="$1" payload="$2" outfile="$3"
            curl --silent --show-error --location --connect-timeout 10 --max-time 45 "${auth[@]}" \
              --request POST --header 'Content-Type: application/json' --data-binary "@$payload" \
              --output "$outfile" --write-out '%{http_code}' "$endpoint"
          }
          create_redirect(){
            local source="$1" target="$2" title="$3" key="$4"
            php -r '$p=["status"=>"enabled","position"=>0,"url"=>$argv[1],"regex"=>false,"match_type"=>"url","match_data"=>["source"=>["flag_query"=>"ignore","flag_case"=>false,"flag_trailing"=>false,"flag_regex"=>false]],"title"=>$argv[3],"group_id"=>1,"action_type"=>"url","action_code"=>301,"action_data"=>["url"=>$argv[2]]];file_put_contents($argv[4],json_encode($p,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$source" "$target" "$title" "$tmp/red-$key.json"
            http=$(curl --silent --show-error --location --connect-timeout 10 --max-time 35 "${auth[@]}" \
              --request POST --header 'Content-Type: application/json' --data-binary "@$tmp/red-$key.json" \
              --output "$tmp/red-$key-response.json" --write-out '%{http_code}' "$redapi/redirect")
            [[ "$http" == '200' ]] || { echo "Redirection create failed source=$source HTTP=$http" >&2; return 1; }
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get \
              --data-urlencode "filterBy[url]=$source" --data-urlencode 'per_page=20' "$redapi/redirect" > "$tmp/red-$key-readback.json"
            id=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$hits=[];foreach(($d["items"]??[])as$x){if(($x["url"]??"")===$argv[2]&&(int)($x["action_code"]??0)===301&&(($x["action_data"]["url"]??"")===$argv[3]))$hits[]=(int)$x["id"];}if(count($hits)!==1)exit(2);echo$hits[0];' "$tmp/red-$key-readback.json" "$source" "$target")
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || return 1
            created_ids+=("$id")
            echo "CREATED_REDIRECT id=$id source=$source target=$target"
          }
          rollback(){
            rc=$?
            [[ "$rc" == '0' ]] && return
            echo "ROLLBACK_START cause_exit=$rc" >&2
            set +e
            if [[ "$duplicate_changed" == '1' ]]; then
              printf '{"status":"publish","slug":"welche-medikamente-beeinflussen-die-erektion-2"}' > "$tmp/rb-dup.json"
              post_json "$wpapi/posts/900066" "$tmp/rb-dup.json" "$tmp/rb-dup-response.json" >/dev/null
            fi
            if [[ "$page_changed" == '1' && -s "$tmp/terms-rollback.json" ]]; then
              post_json "$wpapi/pages/11" "$tmp/terms-rollback.json" "$tmp/rb-terms-response.json" >/dev/null
            fi
            if [[ "$feature_changed" == '1' ]]; then
              printf '{"featured_media":900069}' > "$tmp/rb-feature.json"
              post_json "$wpapi/posts/900067" "$tmp/rb-feature.json" "$tmp/rb-feature-response.json" >/dev/null
            fi
            if ((${#created_ids[@]})); then
              ids=$(IFS=,; echo "${created_ids[*]}")
              printf '{"items":[%s],"global":false}' "$ids" > "$tmp/rb-redirects.json"
              curl --silent --show-error --location --connect-timeout 10 --max-time 35 "${auth[@]}" \
                --request POST --header 'Content-Type: application/json' --data-binary "@$tmp/rb-redirects.json" \
                --output "$tmp/rb-redirects-response.json" "$redapi/bulk/redirect/delete" >/dev/null
            fi
            echo 'ROLLBACK_ATTEMPTED' >&2
          }
          trap rollback EXIT

          echo '=== PREFLIGHT REDIRECTION GROUP AND TARGETS ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$redapi/group?per_page=50" > "$tmp/groups.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$ok=false;foreach(($d["items"]??[])as$x){if((int)($x["id"]??0)===1&&!empty($x["enabled"])&&(int)($x["module_id"]??0)===1)$ok=true;}if(!$ok)exit(2);echo"group1=ok\n";' "$tmp/groups.json"

          sources=( '/datenschutz/' '/product-categorie/gewichtsverlust/' "/$dupslug/" )
          targets=( "$base/privacy-policy/" "$base/product-category/gewichtsverlust/" "$base/$slug/" )
          for i in 0 1 2; do
            source="${sources[$i]}"; target="${targets[$i]}"
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get \
              --data-urlencode "filterBy[url]=$source" --data-urlencode 'per_page=20' "$redapi/redirect" > "$tmp/red-before-$i.json"
            total=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($d["total"]??0);' "$tmp/red-before-$i.json")
            [[ "$total" == '0' ]] || { echo "Redirect pre-exists source=$source" >&2; exit 1; }
            tcode=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output "$tmp/target-$i.html" --write-out '%{http_code}' "$target")
            [[ "$tcode" == '200' && "$(canonical_of "$tmp/target-$i.html")" == "$target" ]] || { echo "Invalid target=$target" >&2; exit 1; }
          done

          echo '=== PREFLIGHT CURRENT ROUTES ==='
          dcode=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$base/datenschutz/")
          [[ "$dcode" == '404' ]] || { echo "Datenschutz expected 404 got=$dcode" >&2; exit 1; }
          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --dump-header "$tmp/weight-old.h" --output /dev/null "$base/product-categorie/gewichtsverlust/"
          wcode=$(awk '/^HTTP\//{code=$2}END{print code}' "$tmp/weight-old.h")
          wloc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$tmp/weight-old.h")
          [[ "$wcode" == '301' && "$wloc" == "$base/gewichtsverlust-medikamente-vergleich/" ]] || { echo "Unexpected legacy weight state=$wcode $wloc" >&2; exit 1; }
          for pair in "$slug:900067" "$dupslug:900066"; do
            path="${pair%%:*}"; expected="${pair##*:}"
            code=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output "$tmp/live-$expected.html" --write-out '%{http_code}' "$base/$path/")
            [[ "$code" == '200' && "$(canonical_of "$tmp/live-$expected.html")" == "$base/$path/" ]] || { echo "Unexpected live route $path" >&2; exit 1; }
            grep -q "\"post\":{\"id\":$expected" "$tmp/live-$expected.html" || { echo "Resolver mismatch path=$path" >&2; exit 1; }
          done

          echo '=== PREFLIGHT POSTS ==='
          for id in 900066 900067; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/$id?context=edit" > "$tmp/post-$id.json"
          done
          php -r '$a=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$b=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);if(($a["status"]??"")!=="publish"||($b["status"]??"")!=="publish")exit(2);if(($a["slug"]??"")!=="welche-medikamente-beeinflussen-die-erektion-2")exit(3);if(($b["slug"]??"")!=="welche-medikamente-beeinflussen-die-erektion")exit(4);foreach([["content","raw"],["title","raw"],["excerpt","raw"]]as$f){if(($a[$f[0]][$f[1]]??"")!==($b[$f[0]][$f[1]]??""))exit(5);}if((int)($a["featured_media"]??0)!==900068||(int)($b["featured_media"]??0)!==900069)exit(6);echo"duplicate_preflight=current_state_identical\n";' "$tmp/post-900066.json" "$tmp/post-900067.json"

          echo '=== PREFLIGHT REPLACEMENT MEDIA AND TERMS ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/media/5925?context=edit" > "$tmp/media5925.json"
          candidate=$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);if((int)($m["id"]??0)!==5925)exit(2);echo(string)($m["source_url"]??"");' "$tmp/media5925.json")
          [[ -n "$candidate" ]] || exit 1
          ccode=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$candidate")
          [[ "$ccode" == '200' ]] || { echo "Replacement media unavailable=$ccode" >&2; exit 1; }
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/pages/11?context=edit" > "$tmp/terms-before.json"
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$raw=(string)($p["content"]["raw"]??"");$needle="href=\"http://www.doctorcura.com\"";if((int)($p["id"]??0)!==11||($p["status"]??"")!=="publish"||substr_count($raw,$needle)!==1)exit(2);$new=str_replace($needle,"href=\"https://doctorcura.com/\"",$raw);file_put_contents($argv[2],json_encode(["content"=>$raw],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));file_put_contents($argv[3],json_encode(["content"=>$new],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));echo"terms_preflight=ok\n";' "$tmp/terms-before.json" "$tmp/terms-rollback.json" "$tmp/terms-update.json"

          echo '=== CREATE EXACT REDIRECTS ==='
          create_redirect '/datenschutz/' "$base/privacy-policy/" 'DoctorCura legacy Datenschutz migration' 'datenschutz'
          create_redirect '/product-categorie/gewichtsverlust/' "$base/product-category/gewichtsverlust/" 'DoctorCura legacy Gewichtsverlust taxonomy migration' 'weight'
          create_redirect "/$dupslug/" "$base/$slug/" 'DoctorCura duplicate article consolidation' 'duplicate'

          echo '=== UPDATE LIVE POST FEATURED IMAGE ==='
          printf '{"featured_media":5925}' > "$tmp/feature-update.json"
          http=$(post_json "$wpapi/posts/900067" "$tmp/feature-update.json" "$tmp/feature-response.json")
          [[ "$http" == '200' ]] || { echo "Featured update failed HTTP=$http" >&2; exit 1; }
          feature_changed=1
          [[ "$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($p["featured_media"]??0);' "$tmp/feature-response.json")" == '5925' ]] || exit 1

          echo '=== FIX TERMS HTTPS LINK ==='
          http=$(post_json "$wpapi/pages/11" "$tmp/terms-update.json" "$tmp/terms-response.json")
          [[ "$http" == '200' ]] || { echo "Terms update failed HTTP=$http" >&2; exit 1; }
          page_changed=1
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$raw=(string)($p["content"]["raw"]??"");if(stripos($raw,"http://www.doctorcura.com")!==false)exit(2);if(substr_count($raw,"href=\"https://doctorcura.com/\"")<1)exit(3);echo"terms_readback=ok\n";' "$tmp/terms-response.json"

          verify_redirect(){
            local path="$1" expected_final="$2" label="$3"
            local first loc follow status final count body
            body="$tmp/$label.html"
            first=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 --header 'Cache-Control: no-cache' --dump-header "$tmp/$label.h" --output /dev/null --write-out '%{http_code}' "$base$path")
            loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$tmp/$label.h" || true)
            [[ "$first" == '301' ]] || { echo "$label first_status=$first location=$loc" >&2; return 1; }
            follow=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 45 --header 'Cache-Control: no-cache' --output "$body" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base$path")
            IFS=$'\t' read -r status final count <<< "$follow"
            [[ "$status" == '200' && "$final" == "$expected_final" && "$count" -ge 1 && "$count" -le 2 ]] || { echo "$label follow=$follow" >&2; return 1; }
            [[ "$(canonical_of "$body")" == "$expected_final" ]] || { echo "$label canonical=$(canonical_of "$body") expected=$expected_final" >&2; return 1; }
            echo "VERIFY_REDIRECT_OK label=$label first=$first location=$loc final=$final redirects=$count"
          }

          echo '=== VERIFY BEFORE DRAFT ==='
          verify_redirect '/datenschutz/' "$base/privacy-policy/" 'pre-datenschutz'
          verify_redirect '/fr/datenschutz/' "$base/fr/privacy-policy/" 'pre-datenschutz-fr'
          verify_redirect '/en/datenschutz/' "$base/en/privacy-policy/" 'pre-datenschutz-en'
          verify_redirect '/product-categorie/gewichtsverlust/' "$base/product-category/gewichtsverlust/" 'pre-weight'
          verify_redirect '/fr/product-categorie/gewichtsverlust/' "$base/fr/product-category/gewichtsverlust/" 'pre-weight-fr'
          verify_redirect '/en/product-categorie/gewichtsverlust/' "$base/en/product-category/gewichtsverlust/" 'pre-weight-en'
          verify_redirect "/$dupslug/" "$base/$slug/" 'pre-duplicate'
          verify_redirect "/fr/$dupslug/" "$base/fr/$slug/" 'pre-duplicate-fr'
          verify_redirect "/en/$dupslug/" "$base/en/$slug/" 'pre-duplicate-en'

          curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 --header 'Cache-Control: no-cache' "$base/$slug/" > "$tmp/live-original.html"
          grep -q '"post":{"id":900067' "$tmp/live-original.html" || { echo 'Original live resolver changed' >&2; exit 1; }
          grep -Fq "$candidate" "$tmp/live-original.html" || { echo 'Replacement featured media not rendered' >&2; exit 1; }
          ! grep -Fq '/wp-content/uploads/2026/09/welche-medikamente-beeinflussen-die-erektion-featured.webp' "$tmp/live-original.html" || { echo 'Broken featured media still rendered' >&2; exit 1; }

          echo '=== DRAFT DUPLICATE POST 900066 ==='
          printf '{"status":"draft"}' > "$tmp/draft-duplicate.json"
          http=$(post_json "$wpapi/posts/900066" "$tmp/draft-duplicate.json" "$tmp/draft-response.json")
          [[ "$http" == '200' ]] || { echo "Duplicate draft failed HTTP=$http" >&2; exit 1; }
          duplicate_changed=1
          [[ "$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(string)($p["status"]??"");' "$tmp/draft-response.json")" == 'draft' ]] || exit 1

          verify_final(){
            local round="$1"
            echo "=== FINAL VERIFY $round ==="
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900066?context=edit" > "$tmp/$round-p66.json"
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900067?context=edit" > "$tmp/$round-p67.json"
            [[ "$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo($p["status"]??"");' "$tmp/$round-p66.json")" == 'draft' ]] || return 1
            php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);if(($p["status"]??"")!=="publish"||($p["slug"]??"")!=="welche-medikamente-beeinflussen-die-erektion"||(int)($p["featured_media"]??0)!==5925)exit(2);' "$tmp/$round-p67.json"

            verify_redirect "/$dupslug/" "$base/$slug/" "$round-duplicate"
            verify_redirect "/fr/$dupslug/" "$base/fr/$slug/" "$round-duplicate-fr"
            verify_redirect "/en/$dupslug/" "$base/en/$slug/" "$round-duplicate-en"
            verify_redirect '/datenschutz/' "$base/privacy-policy/" "$round-datenschutz"
            verify_redirect '/fr/datenschutz/' "$base/fr/privacy-policy/" "$round-datenschutz-fr"
            verify_redirect '/en/datenschutz/' "$base/en/privacy-policy/" "$round-datenschutz-en"
            verify_redirect '/product-categorie/gewichtsverlust/' "$base/product-category/gewichtsverlust/" "$round-weight"
            verify_redirect '/fr/product-categorie/gewichtsverlust/' "$base/fr/product-category/gewichtsverlust/" "$round-weight-fr"
            verify_redirect '/en/product-categorie/gewichtsverlust/' "$base/en/product-category/gewichtsverlust/" "$round-weight-en"

            curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 --header 'Cache-Control: no-cache' "$base/$slug/" > "$tmp/$round-live.html"
            grep -q '"post":{"id":900067' "$tmp/$round-live.html" || return 1
            grep -Fq "$candidate" "$tmp/$round-live.html" || return 1
            ! grep -Fq '/wp-content/uploads/2026/09/welche-medikamente-beeinflussen-die-erektion-featured.webp' "$tmp/$round-live.html" || return 1

            curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 --header 'Cache-Control: no-cache' "$base/post-sitemap.xml" > "$tmp/$round-post-sitemap.xml"
            [[ "$(grep -Fc "<loc>$base/$slug/</loc>" "$tmp/$round-post-sitemap.xml" || true)" == '1' ]] || { echo "$round original sitemap count wrong" >&2; return 1; }
            [[ "$(grep -Fc "<loc>$base/$dupslug/</loc>" "$tmp/$round-post-sitemap.xml" || true)" == '0' ]] || { echo "$round duplicate sitemap remains" >&2; return 1; }

            curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 --header 'Cache-Control: no-cache' "$base/geschaftsbedingungen/" > "$tmp/$round-terms.html"
            ! grep -Fiq 'href="http://www.doctorcura.com"' "$tmp/$round-terms.html" || return 1
            grep -Fiq 'href="https://doctorcura.com/"' "$tmp/$round-terms.html" || return 1
            for lang in fr en; do
              curl --silent --show-error --compressed --connect-timeout 10 --max-time 35 --header 'Cache-Control: no-cache' "$base/$lang/geschaftsbedingungen/" > "$tmp/$round-terms-$lang.html"
              ! grep -Eiq 'href="http://(www\.)?doctorcura\.com/?"' "$tmp/$round-terms-$lang.html" || return 1
            done

            code=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output "$tmp/$round-page16.html" --write-out '%{http_code}' "$base/fr/blogs/16/")
            [[ "$code" == '200' && "$(canonical_of "$tmp/$round-page16.html")" == "$base/fr/blogs/16/" ]] || { echo "$round pagination regression" >&2; return 1; }
            code=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$base/fr/blogs/17/")
            [[ "$code" == '404' ]] || { echo "$round out-of-range pagination regression" >&2; return 1; }
            echo "FINAL_VERIFY_OK $round"
          }

          verify_final round1
          sleep 3
          verify_final round2
          trap - EXIT
          echo "FIX_SUCCESS redirect_ids=$(IFS=,; echo "${created_ids[*]}") canonical_post=900067 duplicate_post=900066_draft featured_media=5925 terms_page=11"
