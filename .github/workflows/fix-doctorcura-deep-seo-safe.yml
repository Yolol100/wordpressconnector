name: Fix DoctorCura Terms Legacy Link

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-deep-seo-safe.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Replace one legacy HTTP www link with guarded rollback
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-terms-link"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          pageapi="$base/wp-json/wp/v2/pages/11"
          snipapi="$base/wp-json/code-snippets/v1/snippets/43"
          expected_hash='2fc561ed59d45aebe0e8b8c770c582c8359560316544f34ab228a9d4f8cabaa8'
          purge_b64=''
          page_changed=0
          helper_written=0

          post_json(){ local endpoint="$1" payload="$2" out="$3"; curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request POST --header 'Content-Type: application/json' --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$endpoint"; }
          put_snippet(){ local payload="$1" out="$2"; curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$snipapi"; }
          make_snippet_payload(){ local codefile="$1" outfile="$2"; php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["code"=>$c,"active"=>true],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$codefile" "$outfile"; }
          restore_snippet(){ make_snippet_payload "$tmp/snippet.php" "$tmp/snippet-restore.json"; [[ "$(put_snippet "$tmp/snippet-restore.json" "$tmp/snippet-restore-response.json")" == '200' ]]; helper_written=0; }
          purge(){
            local label="$1" token ok=0
            token=$(openssl rand -hex 24)
            cp "$tmp/snippet.php" "$tmp/$label-helper.php"
            printf '%s' "$purge_b64" | base64 -d >> "$tmp/$label-helper.php"
            sed -i "s/__TOKEN__/$token/g" "$tmp/$label-helper.php"
            make_snippet_payload "$tmp/$label-helper.php" "$tmp/$label-helper.json"
            [[ "$(put_snippet "$tmp/$label-helper.json" "$tmp/$label-helper-response.json")" == '200' ]]
            helper_written=1
            if curl --silent --show-error --compressed --connect-timeout 10 --max-time 40 --dump-header "$tmp/$label.h" --output /dev/null "$base/wp-json/?doctorcura_seo_purge=$token" && grep -Eiq '^x-doctorcura-seo-purge:[[:space:]]*rocket' "$tmp/$label.h"; then ok=1; fi
            restore_snippet
            [[ "$ok" == '1' ]]
          }
          canonical_of(){ local f="$1"; grep -Eio '<link[^>]+rel="canonical"[^>]+href="[^"]+"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true; }
          rollback(){
            rc=$?; [[ "$rc" == '0' ]] && return
            echo "TERMS_ROLLBACK_START exit=$rc" >&2
            set +e
            if [[ "$helper_written" == '1' ]]; then restore_snippet >/dev/null 2>&1 || true; fi
            if [[ "$page_changed" == '1' ]]; then
              php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["content"=>$c],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$tmp/original-content.html" "$tmp/rollback-page.json"
              post_json "$pageapi" "$tmp/rollback-page.json" "$tmp/rollback-page-response.json" >/dev/null || true
              purge rollback >/dev/null 2>&1 || true
            fi
            restore_snippet >/dev/null 2>&1 || true
            echo 'TERMS_ROLLBACK_ATTEMPTED' >&2
          }
          trap rollback EXIT

          echo '=== PREFLIGHT ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$snipapi" > "$tmp/snippet.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||hash("sha256",$c)!==$argv[3]||strpos($c,"DoctorCura article social image alignment V8.3")===false||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);file_put_contents($argv[2],$c);echo"snippet=exact_v83\n";' "$tmp/snippet.json" "$tmp/snippet.php" "$expected_hash"
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$pageapi?context=edit" > "$tmp/page.json"
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($p["content"]["raw"]??"");if((int)($p["id"]??0)!==11||($p["status"]??"")!=="publish"||substr_count($c,"http://www.doctorcura.com")!==1)exit(2);file_put_contents($argv[2],$c);echo"page_preflight=one_legacy_url\n";' "$tmp/page.json" "$tmp/original-content.html"

          php -r '$c=file_get_contents($argv[1]);$n=str_replace("http://www.doctorcura.com","https://doctorcura.com",$c,$count);if($count!==1)exit(2);file_put_contents($argv[2],json_encode(["content"=>$n],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$tmp/original-content.html" "$tmp/update-page.json"
          echo '=== APPLY ==='
          [[ "$(post_json "$pageapi" "$tmp/update-page.json" "$tmp/update-page-response.json")" == '200' ]]
          page_changed=1
          purge apply

          verify_round(){
            local round="$1" lang url html result canon old
            echo "=== VERIFY $round ==="
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$pageapi?context=edit" > "$tmp/$round-page.json"
            php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($p["content"]["raw"]??"");if(substr_count($c,"http://www.doctorcura.com")!==0||substr_count($c,"https://doctorcura.com")<1)exit(2);echo"raw=clean\n";' "$tmp/$round-page.json"
            for lang in base fr en; do
              if [[ "$lang" == base ]]; then url="$base/geschaftsbedingungen/"; else url="$base/$lang/geschaftsbedingungen/"; fi
              html="$tmp/$round-$lang.html"
              result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 --output "$html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$url")
              canon=$(canonical_of "$html"); old=$(grep -Fco 'http://www.doctorcura.com' "$html" || true)
              echo "$lang result=$result canonical=$canon legacy_count=$old"
              [[ "$result" == $'200\t'"$url"$'\t0' && "$canon" == "$url" && "$old" == '0' ]] || return 1
            done
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$snipapi" > "$tmp/$round-snippet.json"
            php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||hash("sha256",$c)!==$argv[2]||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);' "$tmp/$round-snippet.json" "$expected_hash"
            echo "TERMS_VERIFY_OK $round"
          }

          verify_round one
          sleep 5
          verify_round two
          trap - EXIT
          echo 'TERMS_FIX_SUCCESS page_id=11'
