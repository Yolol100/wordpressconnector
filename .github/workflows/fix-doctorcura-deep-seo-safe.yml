name: Fix DoctorCura Phase 2B Featured Image Scoped

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-deep-seo-safe.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Update featured image and verify the actual Elementor widget
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-phase2b-scoped"; mkdir -p "$tmp"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          wpapi="$base/wp-json/wp/v2"
          snipapi="$base/wp-json/code-snippets/v1/snippets/43"
          redapi="$base/wp-json/redirection/v1"
          elementor_cache="$base/wp-json/elementor/v1/cache"
          expected_snippet_hash='8122c4a08ebf1c6bc29eda1561e38658a2e41bef239cc65102ba7251af83ed35'
          clean_slug='welche-medikamente-beeinflussen-die-erektion'
          dup_slug='welche-medikamente-beeinflussen-die-erektion-2'
          clean="$base/$clean_slug/"
          candidate="$base/wp-content/uploads/2026/06/beste-optionen-bei-erektionsstoerungen-featured.webp"
          candidate_name='beste-optionen-bei-erektionsstoerungen-featured'
          broken_name='welche-medikamente-beeinflussen-die-erektion-featured'
          helper_b64=''
          image_changed=0
          helper_written=0

          post_json(){ local endpoint="$1" payload="$2" outfile="$3"; curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request POST --header 'Content-Type: application/json' --data-binary "@$payload" --output "$outfile" --write-out '%{http_code}' "$endpoint"; }
          put_snippet(){ local payload="$1" outfile="$2"; curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$payload" --output "$outfile" --write-out '%{http_code}' "$snipapi"; }
          make_snippet_payload(){ local codefile="$1" outfile="$2"; php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["code"=>$c,"active"=>true],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$codefile" "$outfile"; }
          restore_snippet(){ make_snippet_payload "$tmp/snippet-code.php" "$tmp/snippet-restore.json"; [[ "$(put_snippet "$tmp/snippet-restore.json" "$tmp/snippet-restore-response.json")" == '200' ]]; helper_written=0; }
          clear_elementor(){ [[ "$(curl --silent --show-error --location --connect-timeout 10 --max-time 40 "${auth[@]}" --request DELETE --output "$tmp/elementor-cache.json" --write-out '%{http_code}' "$elementor_cache")" == '200' ]]; }
          purge_rocket(){
            local label="$1" token http ok=0
            token=$(openssl rand -hex 24)
            cp "$tmp/snippet-code.php" "$tmp/$label-helper.php"
            printf '%s' "$helper_b64" | base64 -d >> "$tmp/$label-helper.php"
            sed -i "s/__TOKEN__/$token/g" "$tmp/$label-helper.php"
            make_snippet_payload "$tmp/$label-helper.php" "$tmp/$label-helper.json"
            http=$(put_snippet "$tmp/$label-helper.json" "$tmp/$label-helper-response.json")
            [[ "$http" == '200' ]] || return 1
            helper_written=1
            if curl --silent --show-error --compressed --connect-timeout 10 --max-time 40 --dump-header "$tmp/$label-purge.h" --output /dev/null "$base/wp-json/?doctorcura_seo_purge=$token" && grep -Eiq '^x-doctorcura-seo-purge:[[:space:]]*rocket' "$tmp/$label-purge.h"; then ok=1; fi
            restore_snippet || return 1
            [[ "$ok" == '1' ]] || return 1
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$snipapi" > "$tmp/$label-snippet-readback.json"
            php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||hash("sha256",$c)!==$argv[2]||strpos($c,"DoctorCura blog pagination cleanup V8.2")===false||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);' "$tmp/$label-snippet-readback.json" "$expected_snippet_hash"
            echo "wp_rocket_purge=$label confirmed"
          }
          canonical_of(){ local f="$1" c=''; c=$(grep -Eio '<link[^>]+rel="canonical"[^>]+href="[^"]+"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true); if [[ -z "$c" ]]; then c=$(grep -Eio '<link[^>]+href="[^"]+"[^>]+rel="canonical"' "$f" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true); fi; printf '%s' "$c"; }
          widget_img(){
            local html="$1" line end
            line=$(grep -n 'data-id="695868ca"' "$html" | head -1 | cut -d: -f1 || true)
            [[ -n "$line" ]] || return 1
            end=$((line+8))
            sed -n "${line},${end}p" "$html" | grep -Eio '<img[^>]*>' | head -1
          }
          rollback(){
            rc=$?; [[ "$rc" == '0' ]] && return
            echo "PHASE2B_SCOPED_ROLLBACK_START exit=$rc" >&2
            set +e
            if [[ "$helper_written" == '1' ]]; then restore_snippet >/dev/null 2>&1 || true; fi
            if [[ "$image_changed" == '1' ]]; then
              printf '{"featured_media":900069}' > "$tmp/rollback-image.json"
              post_json "$wpapi/posts/900067" "$tmp/rollback-image.json" "$tmp/rollback-image-response.json" >/dev/null || true
              clear_elementor >/dev/null 2>&1 || true
              purge_rocket rollback >/dev/null 2>&1 || true
            fi
            restore_snippet >/dev/null 2>&1 || true
            echo 'PHASE2B_SCOPED_ROLLBACK_ATTEMPTED' >&2
          }
          trap rollback EXIT

          echo '=== PREFLIGHT ==='
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$snipapi" > "$tmp/snippet.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if((int)($s["id"]??0)!==43||($s["name"]??"")!=="DoctorCura SEO indexation cleanup"||empty($s["active"])||hash("sha256",$c)!==$argv[3]||strpos($c,"DoctorCura blog pagination cleanup V8.2")===false||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);file_put_contents($argv[2],$c);echo"snippet=ok\n";' "$tmp/snippet.json" "$tmp/snippet-code.php" "$expected_snippet_hash"
          for id in 900067 900066; do curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/$id?context=edit" > "$tmp/post-$id.json"; done
          php -r '$k=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$d=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);if(($k["status"]??"")!=="publish"||(int)($k["featured_media"]??0)!==900069||($d["status"]??"")!=="draft")exit(2);echo"posts=ok\n";' "$tmp/post-900067.json" "$tmp/post-900066.json"
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "filterBy[url]=/$dup_slug/" --data-urlencode 'per_page=20' "$redapi/redirect" > "$tmp/red.json"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$ok=false;foreach(($d["items"]??[])as$x){if((int)($x["id"]??0)===14&&(int)($x["action_code"]??0)===301)$ok=true;}if(!$ok)exit(2);echo"redirect14=ok\n";' "$tmp/red.json"
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/media/5925?context=edit" > "$tmp/media.json"
          php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);if((int)($m["id"]??0)!==5925||($m["source_url"]??"")!==$argv[2])exit(2);echo"media=ok\n";' "$tmp/media.json" "$candidate"
          [[ "$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$candidate")" == '200' ]]
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/elementor_library/5841?context=edit" > "$tmp/template.json"
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$d=json_decode((string)($p["meta"]["_elementor_data"]??""),true,512,JSON_THROW_ON_ERROR);$f=[];$w=function($els)use(&$w,&$f){foreach($els as$e){if(($e["id"]??"")==="695868ca")$f[]=$e;if(!empty($e["elements"]))$w($e["elements"]);}};$w($d);if(count($f)!==1||strpos((string)($f[0]["settings"]["__dynamic__"]["image"]??""),"post-featured-image")===false)exit(2);echo"widget=dynamic_featured\n";' "$tmp/template.json"

          echo '=== APPLY ==='
          printf '{"featured_media":5925}' > "$tmp/update.json"
          [[ "$(post_json "$wpapi/posts/900067" "$tmp/update.json" "$tmp/update-response.json")" == '200' ]]
          image_changed=1
          clear_elementor
          purge_rocket apply

          verify_round(){
            local round="$1" lang prefix url html result canon og img old_img_count old_doc_count
            echo "=== VERIFY $round ==="
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$wpapi/posts/900067?context=edit" > "$tmp/$round-post.json"
            [[ "$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($p["featured_media"]??0);' "$tmp/$round-post.json")" == '5925' ]] || return 1
            for lang in base fr en; do
              [[ "$lang" == 'base' ]] && prefix='' || prefix="/$lang"
              url="$base$prefix/$clean_slug/"; html="$tmp/$round-$lang.html"
              result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 --output "$html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$url")
              [[ "$result" == $'200\t'"$url"$'\t0' ]] || return 1
              canon=$(canonical_of "$html"); [[ "$canon" == "$url" ]] || return 1
              img=$(widget_img "$html" || true)
              printf '%s' "$img" | grep -Fq "$candidate_name" || { echo "$lang widget_img_wrong=$img" >&2; return 1; }
              old_img_count=$( (grep -Eio '<img[^>]+welche-medikamente-beeinflussen-die-erektion-featured[^>]*>' "$html" || true) | wc -l | tr -d ' ' )
              old_doc_count=$( (grep -Fo "$broken_name" "$html" || true) | wc -l | tr -d ' ' )
              echo "$lang widget_img=candidate old_visible_img_count=$old_img_count old_document_refs=$old_doc_count"
              [[ "$old_img_count" == '0' ]] || return 1
              og=$(grep -Eio '<meta[^>]+property="og:image"[^>]*>' "$html" | head -1 || true)
              printf '%s' "$og" | grep -Fq "$candidate" || return 1
            done
            result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 40 --output /dev/null --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base/$dup_slug/")
            [[ "$result" == $'200\t'"$clean"$'\t1' ]] || return 1
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" "$snipapi" > "$tmp/$round-snippet.json"
            php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(empty($s["active"])||hash("sha256",$c)!==$argv[2]||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);' "$tmp/$round-snippet.json" "$expected_snippet_hash"
            echo "PHASE2B_SCOPED_VERIFY_OK $round"
          }

          verify_round one
          sleep 5
          verify_round two
          trap - EXIT
          echo 'PHASE2B_SCOPED_SUCCESS featured_media=5925 visible_widget=fixed'
