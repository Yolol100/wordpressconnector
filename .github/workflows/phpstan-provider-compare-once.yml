name: PHPStan provider correction diagnostic
on:
  push:
    branches: [fix/phpstan-provider-runtime-20261019]
    paths: [.github/workflows/phpstan-provider-compare-once.yml]
permissions:
  contents: read
jobs:
  phpstan-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with: {php-version: '8.3', tools: 'composer:v2', coverage: none}
      - name: Test pinned optional provider API declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stan-provider"
          composer install --working-dir=scripts/phpstan --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          composer validate --no-check-publish --working-dir=scripts/phpstan
          set +e
          scripts/phpstan/vendor/bin/phpstan analyse -c scripts/phpstan/phpstan.neon --no-progress --error-format=json > "$RUNNER_TEMP/stan-provider/results.json" 2> "$RUNNER_TEMP/stan-provider/error.txt"
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/stan-provider/exitcode"
          python3 - <<'PY'
          import json,os,collections,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'stan-provider'
          report=json.loads((directory/'results.json').read_text())
          total=report.get('totals',{}).get('file_errors')
          if not isinstance(total,int): raise SystemExit('No valid PHPStan totals')
          families=collections.Counter()
          for file,entry in report.get('files',{}).items():
            for msg in entry.get('messages',[]):families[msg.get('identifier','unknown')]+=1
          record={'head_sha':os.environ['GITHUB_SHA'],'phpstan_errors':total,'error_families':dict(families.most_common())}
          (directory/'summary.json').write_text(json.dumps(record,indent=2))
          print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: phpstan-provider-analyzer-evidence
          path: ${{ runner.temp }}/stan-provider/
          retention-days: 7
          if-no-files-found: warn
