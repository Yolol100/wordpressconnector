name: DoctorCura Cache Purge and Hreflang Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'doctorcura-cache-check/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-cache-hreflang-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate trusted marker
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.pull_request.base.ref }}" == 'main' ]] || exit 1
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "$GITHUB_REPOSITORY" ]] || exit 1
          actor="${{ github.event.pull_request.user.login }}"
          owner="${{ github.repository_owner }}"
          [[ "$actor" == "$owner" || ( -n "${TRUSTED_REQUEST_ACTOR:-}" && "$actor" == "$TRUSTED_REQUEST_ACTOR" ) ]] || exit 1
          curl --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_REPO_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            > "$RUNNER_TEMP/files.json"
          python3 - "$RUNNER_TEMP/files.json" <<'PY'
          import json, re, sys
          files=json.load(open(sys.argv[1],encoding='utf-8'))
          names=[x.get('filename','') for x in files if isinstance(x,dict)]
          if len(names)!=1 or not re.fullmatch(r'doctorcura-cache-check/[A-Za-z0-9._-]+\.txt',names[0]):
              raise SystemExit('Expected exactly one DoctorCura cache-check marker file.')
          print('Trusted DoctorCura cache-check marker validated.')
          PY

      - name: Purge caches and verify hreflang
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || { echo 'DoctorCura target mismatch.' >&2; exit 1; }
          site="${SITE_URL%/}"
          connector="$site/wp-json/webactueel-wordpress-connector/v1"
          snippets="$site/wp-json/code-snippets/v1/snippets"
          root="$RUNNER_TEMP/doctorcura-cache-hreflang"
          rm -rf "$root" && mkdir -p "$root"

          health_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/health.json" --write-out '%{http_code}' "$connector/health")
          [[ "$health_code" == '200' ]] || { echo "DoctorCura health failed: HTTP $health_code" >&2; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok') or d.get('transport')!='rest': raise SystemExit('DoctorCura health payload invalid.')
          print('DoctorCura health PASS; connector version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          request_id="doctorcura-cache-hreflang-${GITHUB_RUN_ID}"
          python3 - "$root/cache-request.json" "$request_id" <<'PY'
          import json,sys
          json.dump({'request_id':sys.argv[2],'action':'cache.flush','payload':{},'dry_run':False,'confirm':True},open(sys.argv[1],'w',encoding='utf-8'),separators=(',',':'))
          PY
          cache_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 60 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' --header 'Content-Type: application/json' \
            --data-binary "@$root/cache-request.json" --output "$root/cache-result.json" --write-out '%{http_code}' "$connector/execute")
          [[ "$cache_code" == '200' ]] || { echo "WordPress cache.flush failed: HTTP $cache_code" >&2; exit 1; }
          python3 - "$root/cache-result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok'): raise SystemExit('WordPress object cache flush returned ok=false.')
          print('WordPress object cache flush PASS.')
          PY

          temp_name="DoctorCura one-time WP Rocket cache purge"
          list_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/list-before.json" --write-out '%{http_code}' "$snippets?per_page=100&page=1")
          [[ "$list_code" == '200' ]] || exit 1
          python3 - "$root/list-before.json" "$temp_name" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          items=d if isinstance(d,list) else d.get('items',d.get('snippets',[])) if isinstance(d,dict) else []
          if any(isinstance(x,dict) and x.get('name')==sys.argv[2] for x in items): raise SystemExit('Old one-time cache purge snippet already exists; refusing ambiguous execution.')
          PY

          purge_token=$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(24))
          PY
          )
          export PURGE_TOKEN="$purge_token"
          python3 - "$root/purge-snippet.json" "$temp_name" <<'PY'
          import json,os,sys
          token=os.environ['PURGE_TOKEN']
          code="""if ( isset( $_GET['wa_doctorcura_cache_purge'] ) ) {\n    $value = sanitize_text_field( wp_unslash( (string) $_GET['wa_doctorcura_cache_purge'] ) );\n    if ( hash_equals( '%s', $value ) ) {\n        $status = 'wp-rocket-unavailable';\n        if ( function_exists( 'rocket_clean_domain' ) ) {\n            rocket_clean_domain();\n            $status = 'wp-rocket-purged';\n        }\n        if ( ! headers_sent() ) {\n            header( 'X-WA-Cache-Purge: ' . $status, true );\n        }\n    }\n}\n""" % token
          payload={'name':sys.argv[2],'desc':'Temporary one-time WP Rocket page-cache purge. Safe to delete immediately after execution.','code':code,'tags':['temporary','cache','doctorcura'],'scope':'global','active':False,'priority':10}
          json.dump(payload,open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY

          SNIPPET_ID=''
          cleanup_temp() {
            rc=$?
            if [[ -n "${SNIPPET_ID:-}" ]]; then
              curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
                --output "$root/cleanup-deactivate.json" "$snippets/$SNIPPET_ID/deactivate" >/dev/null || true
              del=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request DELETE --header 'Accept: application/json' \
                --output "$root/cleanup-delete.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID" || true)
              if [[ "$del" != '200' && "$del" != '204' ]]; then
                curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                  --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
                  --header 'X-HTTP-Method-Override: DELETE' --header 'Accept: application/json' \
                  --output "$root/cleanup-delete-override.json" "$snippets/$SNIPPET_ID" >/dev/null || true
              fi
            fi
            exit "$rc"
          }
          trap cleanup_temp EXIT

          create_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' --header 'Content-Type: application/json' \
            --data-binary "@$root/purge-snippet.json" --output "$root/create.json" --write-out '%{http_code}' "$snippets")
          [[ "$create_code" == '200' || "$create_code" == '201' ]] || { echo "Temporary purge snippet create failed: HTTP $create_code" >&2; exit 1; }
          SNIPPET_ID=$(python3 - "$root/create.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          sid=item.get('id') if isinstance(item,dict) else None
          if not isinstance(sid,int) or sid<1: raise SystemExit('Temporary purge snippet id missing.')
          print(sid)
          PY
          )
          activate_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
            --output "$root/activate.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID/activate")
          [[ "$activate_code" == '200' || "$activate_code" == '201' ]] || { echo "Temporary purge snippet activate failed: HTTP $activate_code" >&2; exit 1; }

          curl --silent --show-error --location --connect-timeout 10 --max-time 60 \
            --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
            --output /dev/null --dump-header "$root/purge.headers" "$site/?wa_doctorcura_cache_purge=$purge_token"
          grep -Eiq '^X-WA-Cache-Purge:[[:space:]]*wp-rocket-purged[[:space:]]*$' "$root/purge.headers" || { echo 'WP Rocket purge confirmation header missing.' >&2; exit 1; }
          echo 'WP Rocket full page cache purge PASS.'

          curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
            --output "$root/deactivate.json" "$snippets/$SNIPPET_ID/deactivate" >/dev/null
          del_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request DELETE --header 'Accept: application/json' \
            --output "$root/delete.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID" || true)
          if [[ "$del_code" != '200' && "$del_code" != '204' ]]; then
            del_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
              --header 'X-HTTP-Method-Override: DELETE' --header 'Accept: application/json' \
              --output "$root/delete-override.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID" || true)
          fi
          [[ "$del_code" == '200' || "$del_code" == '204' ]] || { echo "Temporary purge snippet delete failed: HTTP $del_code" >&2; exit 1; }
          SNIPPET_ID=''
          trap - EXIT
          echo 'Temporary WP Rocket purge snippet removed.'

          check_token=$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(12))
          PY
          )
          fetch_page() {
            curl --silent --show-error --location --connect-timeout 10 --max-time 60 \
              --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
              --output "$2" --write-out '%{http_code}' "$1"
          }
          de_code=$(fetch_page "$site/product/condyline/?wa_hreflang_check=$check_token" "$root/de.html")
          fr_code=$(fetch_page "$site/fr/product/condyline/?wa_hreflang_check=$check_token" "$root/fr.html")
          en_code=$(fetch_page "$site/en/product/condyline/?wa_hreflang_check=$check_token" "$root/en.html")
          [[ "$de_code" == '200' && "$fr_code" == '200' && "$en_code" == '200' ]] || { echo "Hreflang target HTTP failure: de=$de_code fr=$fr_code en=$en_code" >&2; exit 1; }

          python3 - "$root/de.html" "$root/fr.html" "$root/en.html" <<'PY'
          from html.parser import HTMLParser
          import sys
          expected={
              'de':'https://doctorcura.com/product/condyline/',
              'fr':'https://doctorcura.com/fr/product/condyline/',
              'en':'https://doctorcura.com/en/product/condyline/',
          }
          canon_expected=[expected['de'],expected['fr'],expected['en']]
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.alts={}; self.canon=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()!='link': return
                  a={k.lower():v for k,v in attrs if k and v is not None}
                  rel={x.lower() for x in a.get('rel','').split()}
                  if 'alternate' in rel and a.get('hreflang') and a.get('href'):
                      self.alts[a['hreflang'].lower()]=a['href']
                  if 'canonical' in rel and a.get('href'):
                      self.canon.append(a['href'])
          for i,path in enumerate(sys.argv[1:]):
              p=P(); p.feed(open(path,encoding='utf-8',errors='replace').read())
              missing=[k for k,v in expected.items() if p.alts.get(k,'').rstrip('/')!=v.rstrip('/')]
              if missing: raise SystemExit(f'Hreflang check failed on page {i+1}; missing/incorrect: {missing}; observed={p.alts}')
              if not p.canon or p.canon[0].rstrip('/')!=canon_expected[i].rstrip('/'):
                  raise SystemExit(f'Canonical mismatch on page {i+1}: {p.canon[:3]}')
              print(f'Page {i+1} PASS hreflang='+','.join(sorted(p.alts))+' canonical='+p.canon[0])
          print('HREFLANG_RESULT PASS reciprocal de/fr/en on German, French and English Condyline pages.')
          PY
