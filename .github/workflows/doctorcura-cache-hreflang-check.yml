name: DoctorCura Cache Purge and Hreflang Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'doctorcura-cache-check/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-cache-hreflang-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate trusted marker
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.pull_request.base.ref }}" == 'main' ]] || exit 1
          [[ "${{ github.event.pull_request.head.repo.full_name }}" == "$GITHUB_REPOSITORY" ]] || exit 1
          actor="${{ github.event.pull_request.user.login }}"; owner="${{ github.repository_owner }}"
          [[ "$actor" == "$owner" || ( -n "${TRUSTED_REQUEST_ACTOR:-}" && "$actor" == "$TRUSTED_REQUEST_ACTOR" ) ]] || exit 1
          curl --silent --show-error --location --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_REPO_TOKEN}" --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" > "$RUNNER_TEMP/files.json"
          python3 - "$RUNNER_TEMP/files.json" <<'PY'
          import json,re,sys
          names=[x.get('filename','') for x in json.load(open(sys.argv[1],encoding='utf-8')) if isinstance(x,dict)]
          if len(names)!=1 or not re.fullmatch(r'doctorcura-cache-check/[A-Za-z0-9._-]+\.txt',names[0]):
              raise SystemExit('Expected exactly one cache-check marker.')
          print('Trusted DoctorCura marker PASS.')
          PY

      - name: Purge object and WP Rocket caches, then verify hreflang
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || exit 1
          site="${SITE_URL%/}"
          connector="$site/wp-json/webactueel-wordpress-connector/v1"
          snippets="$site/wp-json/code-snippets/v1/snippets"
          root="$RUNNER_TEMP/doctorcura-cache-hreflang"; rm -rf "$root"; mkdir -p "$root"

          health_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/health.json" --write-out '%{http_code}' "$connector/health")
          [[ "$health_code" == '200' ]] || exit 1
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok') or d.get('transport')!='rest': raise SystemExit('Health failed.')
          print('DoctorCura health PASS; connector='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          temp_name='DoctorCura one-time cache purge'
          curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" \
            --header 'Accept: application/json' "$snippets?per_page=100&page=1" > "$root/list-before.json"
          python3 - "$root/list-before.json" "$temp_name" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); items=d if isinstance(d,list) else d.get('items',d.get('snippets',[])) if isinstance(d,dict) else []
          if any(isinstance(x,dict) and x.get('name')==sys.argv[2] for x in items): raise SystemExit('Existing temporary cache snippet found.')
          PY

          purge_token=$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(24))
          PY
          ); export PURGE_TOKEN="$purge_token"
          python3 - "$root/purge.json" "$temp_name" <<'PY'
          import json,os,sys
          token=os.environ['PURGE_TOKEN']
          code="""if ( isset( $_GET['wa_doctorcura_cache_purge'] ) ) {\n    $value = sanitize_text_field( wp_unslash( (string) $_GET['wa_doctorcura_cache_purge'] ) );\n    if ( hash_equals( '%s', $value ) ) {\n        $object_ok = wp_cache_flush();\n        $rocket_ok = false;\n        if ( function_exists( 'rocket_clean_domain' ) ) { rocket_clean_domain(); $rocket_ok = true; }\n        if ( ! headers_sent() ) {\n            header( 'X-WA-Object-Cache: ' . ( $object_ok ? 'flushed' : 'failed' ), true );\n            header( 'X-WA-WP-Rocket: ' . ( $rocket_ok ? 'purged' : 'unavailable' ), true );\n        }\n    }\n}\n""" % token
          json.dump({'name':sys.argv[2],'desc':'Temporary one-time object/WP Rocket cache purge; delete immediately after execution.','code':code,'tags':['temporary','cache'],'scope':'global','active':False,'priority':10},open(sys.argv[1],'w',encoding='utf-8'),separators=(',',':'))
          PY

          SNIPPET_ID=''
          cleanup() {
            rc=$?
            if [[ -n "${SNIPPET_ID:-}" ]]; then
              curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
                --header 'Accept: application/json' "$snippets/$SNIPPET_ID/deactivate" >/dev/null || true
              del=$(curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request DELETE \
                --header 'Accept: application/json' --output /dev/null --write-out '%{http_code}' "$snippets/$SNIPPET_ID" || true)
              if [[ "$del" != '200' && "$del" != '204' ]]; then
                curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
                  --header 'X-HTTP-Method-Override: DELETE' --header 'Accept: application/json' "$snippets/$SNIPPET_ID" >/dev/null || true
              fi
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          create_code=$(curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
            --header 'Accept: application/json' --header 'Content-Type: application/json' --data-binary "@$root/purge.json" \
            --output "$root/create.json" --write-out '%{http_code}' "$snippets")
          [[ "$create_code" == '200' || "$create_code" == '201' ]] || exit 1
          SNIPPET_ID=$(python3 - "$root/create.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); x=d.get('snippet',d) if isinstance(d,dict) else {}; sid=x.get('id') if isinstance(x,dict) else None
          if not isinstance(sid,int) or sid<1: raise SystemExit('Missing snippet id.')
          print(sid)
          PY
          )
          curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
            --header 'Accept: application/json' "$snippets/$SNIPPET_ID/activate" > "$root/activate.json"

          curl --silent --show-error --location --connect-timeout 10 --max-time 90 --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
            --output /dev/null --dump-header "$root/purge.headers" "$site/?wa_doctorcura_cache_purge=$purge_token"
          grep -Eiq '^X-WA-Object-Cache:[[:space:]]*flushed[[:space:]]*$' "$root/purge.headers" || { echo 'Object cache purge not confirmed.' >&2; exit 1; }
          grep -Eiq '^X-WA-WP-Rocket:[[:space:]]*purged[[:space:]]*$' "$root/purge.headers" || { echo 'WP Rocket purge not confirmed.' >&2; exit 1; }
          echo 'WordPress object cache + WP Rocket page cache purge PASS.'

          curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
            "$snippets/$SNIPPET_ID/deactivate" >/dev/null
          del=$(curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request DELETE --header 'Accept: application/json' \
            --output /dev/null --write-out '%{http_code}' "$snippets/$SNIPPET_ID" || true)
          if [[ "$del" != '200' && "$del" != '204' ]]; then
            del=$(curl --silent --show-error --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
              --header 'X-HTTP-Method-Override: DELETE' --header 'Accept: application/json' --output /dev/null --write-out '%{http_code}' "$snippets/$SNIPPET_ID" || true)
          fi
          [[ "$del" == '200' || "$del" == '204' ]] || { echo "Temporary snippet delete failed: HTTP $del" >&2; exit 1; }
          SNIPPET_ID=''; trap - EXIT
          echo 'Temporary cache-purge snippet removed.'

          nonce=$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(12))
          PY
          )
          fetch() { curl --silent --show-error --location --connect-timeout 10 --max-time 60 --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' --output "$2" --write-out '%{http_code}' "$1"; }
          de=$(fetch "$site/product/condyline/?wa_hreflang_check=$nonce" "$root/de.html")
          fr=$(fetch "$site/fr/product/condyline/?wa_hreflang_check=$nonce" "$root/fr.html")
          en=$(fetch "$site/en/product/condyline/?wa_hreflang_check=$nonce" "$root/en.html")
          [[ "$de" == 200 && "$fr" == 200 && "$en" == 200 ]] || { echo "HTTP check failed de=$de fr=$fr en=$en" >&2; exit 1; }

          python3 - "$root/de.html" "$root/fr.html" "$root/en.html" <<'PY'
          from html.parser import HTMLParser
          import sys
          expected={'de':'https://doctorcura.com/product/condyline/','fr':'https://doctorcura.com/fr/product/condyline/','en':'https://doctorcura.com/en/product/condyline/'}
          canon=[expected['de'],expected['fr'],expected['en']]
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.a={}; self.c=[]
              def handle_starttag(self,t,attrs):
                  if t.lower()!='link': return
                  d={k.lower():v for k,v in attrs if k and v is not None}; rel={x.lower() for x in d.get('rel','').split()}
                  if 'alternate' in rel and d.get('hreflang') and d.get('href'): self.a[d['hreflang'].lower()]=d['href']
                  if 'canonical' in rel and d.get('href'): self.c.append(d['href'])
          for i,f in enumerate(sys.argv[1:]):
              p=P(); p.feed(open(f,encoding='utf-8',errors='replace').read())
              bad=[k for k,v in expected.items() if p.a.get(k,'').rstrip('/')!=v.rstrip('/')]
              if bad: raise SystemExit(f'Page {i+1} hreflang missing/incorrect {bad}; observed={p.a}')
              if not p.c or p.c[0].rstrip('/')!=canon[i].rstrip('/'): raise SystemExit(f'Page {i+1} canonical mismatch {p.c[:2]}')
              print(f'Page {i+1} PASS languages='+','.join(sorted(p.a))+' canonical='+p.c[0])
          print('HREFLANG_RESULT PASS reciprocal de/fr/en + self-canonical on all three Condyline variants.')
          PY
