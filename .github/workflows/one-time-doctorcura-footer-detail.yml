name: One-time DoctorCura footer string inspect

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-footer-detail/*.json'

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect footer strings
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-footer"; mkdir -p "$root"
          python3 - "$root/request.json" <<'PY'
          import json,uuid,sys
          json.dump({'version':1,'request_id':'dc-footer-'+uuid.uuid4().hex[:20],'action':'elementor.inspect','dry_run':True,'confirm':False,'payload':{'id':95}},open(sys.argv[1],'w'),separators=(',',':'))
          PY
          curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Content-Type: application/json' --data-binary "@$root/request.json" -o "$root/result.json" "$base/execute"
          python3 - "$root/result.json" <<'PY'
          import json,sys,re
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          data=(d.get('data') or {}).get('document') or {}
          def walk(v,path='root'):
              if isinstance(v,dict):
                  for k,x in v.items(): walk(x,path+'.'+str(k))
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,path+f'[{i}]')
              elif isinstance(v,str):
                  low=v.lower()
                  if any(t in low for t in ['contact@doctorcura.com','keizer','amsterdam','550','505','tel:','phone','telefon','adres','address','adresse']):
                      print(path,repr(v))
          walk(data)
          PY
