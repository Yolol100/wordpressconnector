name: Audit Hardening Apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-booleans]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact hardening revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Apply exact strict-boolean replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
                  text = text.replace(old, new)
              p.write_text(text)

          input_import = "use Webactueel\\WordPressConnector\\Support\\Input;\n"

          patch('plugin/wordpressconnector/includes/Adapters/GutenbergAdapter.php', [
              ("use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n", "use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n" + input_import),
              ("$replaceAttrs = ! empty($payload['replace_attrs']);", "$replaceAttrs = Input::bool($payload, 'replace_attrs');"),
          ])

          patch('plugin/wordpressconnector/includes/Adapters/WooCommerceAdapter.php', [
              ("use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n", "use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n" + input_import),
              ("if (isset($payload['has_archives'])) $args['has_archives'] = (bool) $payload['has_archives'];", "if (array_key_exists('has_archives', $payload)) $args['has_archives'] = Input::bool($payload, 'has_archives');"),
          ])

          patch('plugin/wordpressconnector/includes/Adapters/ElementorAdapter.php', [
              ("use Webactueel\\WordPressConnector\\Support\\Json;\n", "use Webactueel\\WordPressConnector\\Support\\Json;\n" + input_import),
              ("$replaceSettings = ! empty($payload['replace_settings']);", "$replaceSettings = Input::bool($payload, 'replace_settings');"),
          ])

          patch('plugin/wordpressconnector/includes/Adapters/PluginPackageAdapter.php', [
              ("use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n", "use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n" + input_import),
              ("$overwrite = ! empty($payload['overwrite']);\n        $activate = ! empty($payload['activate']);\n        $networkWide = ! empty($payload['network_wide']);", "$overwrite = Input::bool($payload, 'overwrite');\n        $activate = Input::bool($payload, 'activate');\n        $networkWide = Input::bool($payload, 'network_wide');"),
          ])

          patch('plugin/wordpressconnector/includes/Adapters/CoreAdapter.php', [
              ("use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n", "use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n" + input_import),
              ("'hide_empty' => isset($payload['hide_empty']) ? (bool) $payload['hide_empty'] : false,", "'hide_empty' => Input::bool($payload, 'hide_empty'),"),
              ("$append = ! empty($payload['append']);", "$append = Input::bool($payload, 'append');"),
              ("update_option($name, $value, isset($payload['autoload']) ? (bool) $payload['autoload'] : null);", "update_option($name, $value, array_key_exists('autoload', $payload) ? Input::bool($payload, 'autoload') : null);"),
          ])

          patch('plugin/wordpressconnector/includes/Adapters/SystemAdapter.php', [
              ("use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n", "use Webactueel\\WordPressConnector\\Support\\Fingerprint;\n" + input_import),
              ("if (is_int($cap)) $role->add_cap((string) $grant, true); else $role->add_cap((string) $cap, (bool) $grant);", "if (is_int($cap)) $role->add_cap((string) $grant, true); else $role->add_cap((string) $cap, Input::boolValue($grant, 'payload.add.' . (string) $cap));"),
              ("$before = is_plugin_active($file);\n        if (! empty($context['dry_run'])) return array('before_active' => $before, 'after_active' => true, '_current_fingerprint' => Fingerprint::make($before));\n        $result = activate_plugin($file, '', ! empty($payload['network_wide']), true);", "$before = is_plugin_active($file);\n        $networkWide = Input::bool($payload, 'network_wide');\n        if (! empty($context['dry_run'])) return array('before_active' => $before, 'after_active' => true, 'network_wide' => $networkWide, '_current_fingerprint' => Fingerprint::make($before));\n        $result = activate_plugin($file, '', $networkWide, true);"),
              ("return array('file' => $file, 'active' => true, '_rollback' => array('action' => 'plugin.deactivate', 'payload' => array('file' => $file, 'network_wide' => ! empty($payload['network_wide']))));", "return array('file' => $file, 'active' => true, '_rollback' => array('action' => 'plugin.deactivate', 'payload' => array('file' => $file, 'network_wide' => $networkWide)));"),
              ("$before = is_plugin_active($file);\n        if (! empty($context['dry_run'])) return array('before_active' => $before, 'after_active' => false, '_current_fingerprint' => Fingerprint::make($before));\n        deactivate_plugins($file, false, ! empty($payload['network_wide']));", "$before = is_plugin_active($file);\n        $networkWide = Input::bool($payload, 'network_wide');\n        if (! empty($context['dry_run'])) return array('before_active' => $before, 'after_active' => false, 'network_wide' => $networkWide, '_current_fingerprint' => Fingerprint::make($before));\n        deactivate_plugins($file, false, $networkWide);"),
              ("return array('file' => $file, 'active' => false, '_rollback' => $before ? array('action' => 'plugin.activate', 'payload' => array('file' => $file, 'network_wide' => ! empty($payload['network_wide']))) : null);", "return array('file' => $file, 'active' => false, '_rollback' => $before ? array('action' => 'plugin.activate', 'payload' => array('file' => $file, 'network_wide' => $networkWide)) : null);"),
              ("if (! empty($context['dry_run'])) return array('would_flush' => true, '_current_fingerprint' => Fingerprint::make(get_option('rewrite_rules', array())));\n        flush_rewrite_rules(! empty($payload['hard']));", "$hard = Input::bool($payload, 'hard');\n        if (! empty($context['dry_run'])) return array('would_flush' => true, 'hard' => $hard, '_current_fingerprint' => Fingerprint::make(get_option('rewrite_rules', array())));\n        flush_rewrite_rules($hard);"),
              ("if ('' === $domain) throw new RuntimeException('domain is required.');\n        if (! empty($context['dry_run'])) return array('would_create' => compact('domain', 'path'), '_current_fingerprint' => Fingerprint::make(array('new_site' => $domain . $path)));\n        $siteId = wp_insert_site(array('domain' => $domain, 'path' => $path, 'network_id' => isset($payload['network_id']) ? (int) $payload['network_id'] : get_current_network_id(), 'public' => isset($payload['public']) ? (int) (bool) $payload['public'] : 1));", "if ('' === $domain) throw new RuntimeException('domain is required.');\n        $public = Input::bool($payload, 'public', true);\n        if (! empty($context['dry_run'])) return array('would_create' => compact('domain', 'path', 'public'), '_current_fingerprint' => Fingerprint::make(array('new_site' => $domain . $path)));\n        $siteId = wp_insert_site(array('domain' => $domain, 'path' => $path, 'network_id' => isset($payload['network_id']) ? (int) $payload['network_id'] : get_current_network_id(), 'public' => (int) $public));"),
              ("foreach (array('public', 'archived', 'mature', 'spam', 'deleted') as $field) if (array_key_exists($field, $payload)) $data[$field] = (int) (bool) $payload[$field];", "foreach (array('public', 'archived', 'mature', 'spam', 'deleted') as $field) if (array_key_exists($field, $payload)) $data[$field] = (int) Input::bool($payload, $field);"),
          ])
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin/wordpressconnector/includes/Adapters
          git commit -m 'Use strict booleans across semantic payloads'
          git push origin HEAD:main
