name: WordPress Connector PHPStan provider diagnostic

on:
  push:
    branches:
      - fix/phpstan-provider-stubs-20261019
    paths:
      - '.github/workflows/phpstan-provider-diagnostic.yml'

permissions:
  contents: write

jobs:
  provider-type-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Resolve pinned optional-provider analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/phpstan-provider-stubs-20261019"
          mkdir -p qa-provider
          composer validate --no-check-publish --working-dir=tools/phpstan
          composer update --working-dir=tools/phpstan --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          sha256sum tools/phpstan/composer.lock > qa-provider/lock.sha256
          composer show --working-dir=tools/phpstan --locked > qa-provider/dependencies.txt
      - name: PHPStan with real provider API signatures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          tools/phpstan/vendor/bin/phpstan analyse -c tools/phpstan/phpstan.neon --no-progress --error-format=json > qa-provider/phpstan.json 2> qa-provider/stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > qa-provider/exit-code.txt
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          result_file=Path('qa-provider/phpstan.json')
          if not result_file.exists() or not result_file.stat().st_size:
              raise SystemExit('PHPStan did not produce JSON; inspect stderr.txt')
          report=json.loads(result_file.read_text())
          totals=report.get('totals',{})
          counts=collections.Counter()
          reasons=collections.Counter()
          for path,info in report.get('files',{}).items():
              messages=info.get('messages',[])
              counts[path]=len(messages)
              for msg in messages:
                  reasons[str(msg.get('identifier', msg.get('message', 'unknown')))]+=1
          lines=['# PHPStan with pinned WordPress/WooCommerce/ACF stubs',
                 'Totals: '+json.dumps(totals,sort_keys=True),
                 '## Files']
          lines.extend(f'{count}: {path}' for path,count in counts.most_common())
          lines.append('## Error families')
          lines.extend(f'{count}: {code}' for code,count in reasons.most_common())
          Path('qa-provider/summary.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines[:45]))
          PY
      - name: Commit reproducible lockfile only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- tools/phpstan/composer.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Lockfile already pinned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(qa): lock WordPress WooCommerce ACF static-analysis providers'
          git push origin HEAD:fix/phpstan-provider-stubs-20261019
      - name: Upload full machine-readable analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpressconnector-phpstan-provider-evidence
          path: qa-provider/
          if-no-files-found: warn
          retention-days: 14
