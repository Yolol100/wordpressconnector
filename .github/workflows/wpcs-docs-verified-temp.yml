# Temporary bounded branch workflow; delete before PR.
name: Temporary WPCS PHPDoc Alignment Verified
on:
  push:
    branches:
      - fix/wpcs-docs-contracts-20261115
permissions:
  contents: write
jobs:
  docs:
    if: >-
      github.repository == 'Yolol100/wordpressconnector' &&
      !startsWith(github.event.head_commit.message, 'style(wpcs): document guarded connector contracts')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout bounded branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/wpcs-docs-contracts-20261115
          persist-credentials: true
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xmlreader, xml, dom
          coverage: none
      - name: Produce and validate comment-only WPCS candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Yolol100/wordpressconnector'
          test "$GITHUB_REF" = 'refs/heads/fix/wpcs-docs-contracts-20261115'
          test -z "$(git status --porcelain)"
          tools_dir="$RUNNER_TEMP/wpcs-doc-tools"
          mkdir -p "$tools_dir"
          cat > "$tools_dir/composer.json" <<'JSON'
          {"name":"webactueel/wpcs-docs-check","require-dev":{"squizlabs/php_codesniffer":"3.13.6","wp-coding-standards/wpcs":"3.4.1"},"config":{"allow-plugins":{"dealerdirect/phpcodesniffer-composer-installer":true}}}
          JSON
          composer install --working-dir="$tools_dir" --prefer-dist --no-interaction --no-progress
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/before.json" || true
          python3 scripts/wpcs-docs-clean-temp.py "$RUNNER_TEMP/before.json"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('plugin/wordpressconnector/includes/Security/Policy.php')
          source=p.read_text()
          old='private static bool $request_confirmed          = false;'
          assert source.count(old)==1, 'Expected Policy property alignment line missing'
          p.write_text(source.replace(old,'private static bool $request_confirmed = false;',1))
          PY
          php <<'PHP'
          <?php
          $names=trim((string)shell_exec('git diff --name-only -- plugin/wordpressconnector'));
          if ($names==='')throw new RuntimeException('Expected PHPDoc corrections');
          foreach(explode("\n",$names) as $file){
              if(!preg_match('~^plugin/wordpressconnector/[a-zA-Z0-9/_-]+\.php$~D',$file))throw new RuntimeException('Unexpected path '.$file);
              $prior=shell_exec('git show HEAD:'.escapeshellarg($file));
              $after=file_get_contents($file);
              if(!is_string($prior)||!is_string($after))throw new RuntimeException('Invalid source');
              $tokens=function($source){
                 $out=[];
                 foreach(token_get_all($source,TOKEN_PARSE) as $token){
                    if(is_array($token)){
                       if(in_array($token[0],[T_COMMENT,T_DOC_COMMENT,T_WHITESPACE],true))continue;
                       $out[]=[$token[0],$token[1]];
                    }else $out[]=$token;
                 }
                 return $out;
              };
              if($tokens($prior)!==$tokens($after))throw new RuntimeException('Non-comment code changed: '.$file);
          }
          echo "Verified identical noncomment PHP tokens in ".count(explode("\n",$names))." files.\n";
          PHP
          find plugin/wordpressconnector -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/lint.log"
          git add plugin/wordpressconnector
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(wpcs): document guarded connector contracts'
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1 || { tail -n 70 "$RUNNER_TEMP/contracts.log"; exit 1; }
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/after.json" || true
          python3 - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]))
          print('WPCS_BEFORE',a['totals'],'WPCS_AFTER',b['totals'],'files',len(b['files']))
          assert len(b['files'])==57
          assert a['totals']['errors']>=2127
          assert b['totals']['errors']<a['totals']['errors']-50
          assert b['totals']['warnings']<=a['totals']['warnings']
          PY
          git push origin 'HEAD:refs/heads/fix/wpcs-docs-contracts-20261115'
          echo "verified_sha=$(git rev-parse HEAD)"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: temporary-wpcs-docs-audit-diff
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/contracts.log
          retention-days: 1
