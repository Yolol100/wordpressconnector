name: DoctorCura SEO Snippet V7 Execute

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-seo-snippet-v7-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Revalidate trusted DoctorCura V7 request
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,99}$ ]] || exit 1
          pr="$RUNNER_TEMP/pr.json"
          code=$(curl --silent --show-error --location --output "$pr" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_REPO_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [[ "$code" == '200' ]] || exit 1
          python3 - "$pr" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          repo=os.environ['GITHUB_REPOSITORY']; owner=os.environ['REPOSITORY_OWNER']; trusted=os.environ.get('TRUSTED_REQUEST_ACTOR',''); expected=os.environ['EXPECTED_HEAD_SHA']
          actor=(p.get('user') or {}).get('login','')
          ok=(p.get('state')=='open' and actor and actor in {owner,trusted} and (p.get('head') or {}).get('sha')==expected and ((p.get('head') or {}).get('repo') or {}).get('full_name')==repo and ((p.get('base') or {}).get('repo') or {}).get('full_name')==repo and (p.get('base') or {}).get('ref')=='main')
          if not ok: raise SystemExit('Trusted DoctorCura V7 request validation failed.')
          PY

      - name: Upsert, activate and verify DoctorCura SEO snippet V7
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || { echo 'DoctorCura target mismatch.' >&2; exit 1; }

          root="$RUNNER_TEMP/doctorcura-seo-snippet-v7"
          rm -rf "$root" && mkdir -p "$root"
          site="${SITE_URL%/}"
          connector="$site/wp-json/webactueel-wordpress-connector/v1"
          snippets="$site/wp-json/code-snippets/v1/snippets"
          snippet_name='DoctorCura SEO indexation cleanup'

          health_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/health.json" --write-out '%{http_code}' "$connector/health")
          [[ "$health_code" == '200' ]] || { echo "DoctorCura connector health failed: HTTP $health_code" >&2; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok') or d.get('transport')!='rest': raise SystemExit('DoctorCura connector health payload invalid.')
          print('DoctorCura target/auth health OK; connector version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          cat > "$root/snippet.php" <<'PHP'
          /**
           * DoctorCura SEO indexation cleanup V7.
           * Keeps technical endpoints functional while discouraging indexing and
           * consolidates WooCommerce variation parameter canonicals.
           * Redirects are intentionally owned outside this snippet.
           */

          if ( ! function_exists( 'wa_doctorcura_request_path' ) ) {
              function wa_doctorcura_request_path(): string {
                  $request_uri = isset( $_SERVER['REQUEST_URI'] )
                      ? wp_unslash( (string) $_SERVER['REQUEST_URI'] )
                      : '';

                  return (string) wp_parse_url( $request_uri, PHP_URL_PATH );
              }
          }

          if ( ! function_exists( 'wa_doctorcura_should_send_noindex_header' ) ) {
              function wa_doctorcura_should_send_noindex_header(): bool {
                  $path = wa_doctorcura_request_path();

                  if ( false !== strpos( $path, '/wc-api/' ) ) {
                      return true;
                  }

                  if ( isset( $_GET['wc-ajax'] ) ) {
                      return true;
                  }

                  if ( '/shop/feed' === untrailingslashit( $path ) ) {
                      return true;
                  }

                  return 1 === preg_match( '~/feed/?$~i', $path );
              }
          }

          add_filter(
              'wp_headers',
              static function ( $headers ) {
                  if ( wa_doctorcura_should_send_noindex_header() ) {
                      $headers['X-Robots-Tag'] = 'noindex, follow';
                  }

                  return $headers;
              },
              100
          );

          add_action(
              'send_headers',
              static function (): void {
                  if ( ! headers_sent() && wa_doctorcura_should_send_noindex_header() ) {
                      header( 'X-Robots-Tag: noindex, follow', true );
                  }
              },
              100
          );

          add_filter(
              'rest_post_dispatch',
              static function ( $response, $server, $request ) {
                  $response = rest_ensure_response( $response );

                  if ( $response instanceof WP_REST_Response ) {
                      $response->header( 'X-Robots-Tag', 'noindex, follow' );
                  }

                  return $response;
              },
              100,
              3
          );

          add_filter(
              'wpseo_canonical',
              static function ( $canonical ) {
                  if ( ! function_exists( 'is_product' ) || ! is_product() ) {
                      return $canonical;
                  }

                  foreach ( array_keys( $_GET ) as $key ) {
                      if ( 0 !== strpos( (string) $key, 'attribute_' ) ) {
                          continue;
                      }

                      $product_id = get_queried_object_id();
                      $permalink  = $product_id ? get_permalink( $product_id ) : false;

                      return $permalink ? $permalink : $canonical;
                  }

                  return $canonical;
              },
              20
          );
          PHP

          php -r '$c=file_get_contents($argv[1]); $f=tempnam(sys_get_temp_dir(),"dcseo-v7-").".php"; file_put_contents($f,"<?php\n".$c); passthru("php -l ".escapeshellarg($f),$rc); @unlink($f); exit($rc);' "$root/snippet.php"

          list_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/list.json" --write-out '%{http_code}' "$snippets?per_page=100&page=1")
          [[ "$list_code" == '200' ]] || { echo "Code Snippets list failed: HTTP $list_code" >&2; exit 1; }

          python3 - "$root/list.json" "$root/state.env" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          items=d if isinstance(d,list) else d.get('items',d.get('snippets',[])) if isinstance(d,dict) else []
          matches=[x for x in items if isinstance(x,dict) and x.get('name')=='DoctorCura SEO indexation cleanup']
          if len(matches)>1: raise SystemExit('Multiple matching DoctorCura SEO snippets exist; refusing ambiguous write.')
          with open(sys.argv[2],'w',encoding='utf-8') as f:
              if matches:
                  item=matches[0]
                  sid=int(item.get('id') or 0)
                  if sid<1: raise SystemExit('Existing DoctorCura snippet has invalid id.')
                  f.write(f'EXISTS=true\nSNIPPET_ID={sid}\n')
              else:
                  f.write('EXISTS=false\nSNIPPET_ID=\n')
          PY
          source "$root/state.env"

          was_active=false
          rollback_ready=false
          mutated=false

          rollback() {
            rc=$?
            if [[ "$rc" -ne 0 && "$mutated" == 'true' ]]; then
              echo 'V7 verification failed; attempting bounded snippet rollback.' >&2
              if [[ "$rollback_ready" == 'true' ]]; then
                curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                  --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
                  --header 'Accept: application/json' --header 'Content-Type: application/json' \
                  --data-binary "@$root/rollback.json" --output "$root/rollback-update.json" \
                  "$snippets/$SNIPPET_ID" >/dev/null || true
                if [[ "$was_active" == 'true' ]]; then
                  curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                    --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
                    --output "$root/rollback-activate.json" "$snippets/$SNIPPET_ID/activate" >/dev/null || true
                else
                  curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                    --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
                    --output "$root/rollback-deactivate.json" "$snippets/$SNIPPET_ID/deactivate" >/dev/null || true
                fi
              else
                [[ -n "${SNIPPET_ID:-}" ]] && curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                  --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
                  --output "$root/rollback-created-deactivate.json" "$snippets/$SNIPPET_ID/deactivate" >/dev/null || true
              fi
            fi
            exit "$rc"
          }
          trap rollback EXIT

          if [[ "$EXISTS" == 'true' ]]; then
            get_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
              --output "$root/before.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID")
            [[ "$get_code" == '200' ]] || { echo "Snippet preflight failed: HTTP $get_code" >&2; exit 1; }
            python3 - "$root/before.json" "$root/rollback.json" "$root/before-state.env" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          if item.get('name')!='DoctorCura SEO indexation cleanup': raise SystemExit('Snippet identity mismatch.')
          code=str(item.get('code') or '').replace('\r\n','\n').strip()
          payload={
              'name':item.get('name') or 'DoctorCura SEO indexation cleanup',
              'desc':item.get('desc') or '',
              'code':item.get('code') or '',
              'tags':item.get('tags') if isinstance(item.get('tags'),list) else ['seo','indexation','doctorcura'],
              'scope':item.get('scope') or 'global',
              'active':False,
              'priority':int(item.get('priority') or 10),
          }
          json.dump(payload,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          with open(sys.argv[3],'w',encoding='utf-8') as f:
              f.write('WAS_ACTIVE='+('true' if bool(item.get('active')) else 'false')+'\n')
          print('Existing snippet baseline OK; code_sha256='+hashlib.sha256(code.encode()).hexdigest())
          PY
            source "$root/before-state.env"
            was_active="$WAS_ACTIVE"
            rollback_ready=true
          fi

          python3 - "$root/snippet.php" "$root/v7.json" <<'PY'
          import json,sys
          payload={
              'name':'DoctorCura SEO indexation cleanup',
              'desc':'V7 indexation cleanup for technical endpoints and WooCommerce variation canonicals; redirects are managed separately.',
              'code':open(sys.argv[1],encoding='utf-8').read(),
              'tags':['seo','indexation','doctorcura'],
              'scope':'global',
              'active':False,
              'priority':10,
          }
          json.dump(payload,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY

          if [[ "$EXISTS" == 'true' ]]; then
            update_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
              --header 'Accept: application/json' --header 'Content-Type: application/json' \
              --data-binary "@$root/v7.json" --output "$root/upsert-result.json" --write-out '%{http_code}' \
              "$snippets/$SNIPPET_ID")
            [[ "$update_code" == '200' ]] || { echo "Snippet V7 update failed: HTTP $update_code" >&2; exit 1; }
            mutated=true
          else
            create_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
              --header 'Accept: application/json' --header 'Content-Type: application/json' \
              --data-binary "@$root/v7.json" --output "$root/upsert-result.json" --write-out '%{http_code}' "$snippets")
            [[ "$create_code" == '200' || "$create_code" == '201' ]] || { echo "Snippet V7 create failed: HTTP $create_code" >&2; exit 1; }
            SNIPPET_ID=$(python3 - "$root/upsert-result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          sid=item.get('id') if isinstance(item,dict) else None
          if not isinstance(sid,int) or sid<1: raise SystemExit('Created snippet response missing valid id.')
          print(sid)
          PY
          )
            mutated=true
          fi

          read_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/readback-inactive.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID")
          [[ "$read_code" == '200' ]] || { echo "Snippet V7 readback failed: HTTP $read_code" >&2; exit 1; }
          python3 - "$root/readback-inactive.json" "$root/snippet.php" "$SNIPPET_ID" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          expected=open(sys.argv[2],encoding='utf-8').read().replace('\r\n','\n').strip(); actual=str(item.get('code') or '').replace('\r\n','\n').strip()
          if int(item.get('id',0))!=int(sys.argv[3]) or item.get('name')!='DoctorCura SEO indexation cleanup' or actual!=expected: raise SystemExit('Snippet V7 exact-source readback mismatch.')
          if bool(item.get('active')): raise SystemExit('Snippet V7 unexpectedly active before explicit activation.')
          print('Snippet V7 inactive exact readback PASS; code_sha256='+hashlib.sha256(actual.encode()).hexdigest())
          PY

          activate_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
            --output "$root/activate.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID/activate" || true)
          echo "Code Snippets activate HTTP ${activate_code:-transport-error}; verifying by readback."

          active_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/readback-active.json" --write-out '%{http_code}' "$snippets/$SNIPPET_ID")
          [[ "$active_code" == '200' ]] || { echo "Active snippet V7 readback failed: HTTP $active_code" >&2; exit 1; }
          python3 - "$root/readback-active.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          if not bool(item.get('active')): raise SystemExit('Snippet V7 is not active after activation.')
          print('Snippet V7 active readback PASS; id='+str(item.get('id')))
          PY

          fetch_headers() {
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' --output /dev/null --dump-header "$2" "$1"
          }
          fetch_html() {
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' --output "$2" --write-out '%{http_code}' "$1"
          }

          # Round 1: primary regression checks.
          fetch_headers "$site/" "$root/r1-home.headers"
          fetch_headers "$site/wp-json/" "$root/r1-rest.headers"
          fetch_headers "$site/shop/feed/?wa_dcseo_v7=$REQUEST_ID" "$root/r1-shop-feed.headers"
          fetch_headers "$site/?wc-ajax=%25%25endpoint%25%25" "$root/r1-wcajax.headers"
          fetch_headers "$site/?wa_probe=%2Fwc-api%2Fnot-a-route" "$root/r1-false-positive.headers"
          variation1="$site/product/epipen/?attribute_pa_wirkstarke=150mcg&attribute_pa_menge=3&attribute_pa_medikament=epipen"
          variation1_code=$(fetch_html "$variation1" "$root/r1-variation.html")

          python3 - "$root" "$variation1_code" <<'PY'
          import os,re,sys
          root=sys.argv[1]; variation_code=sys.argv[2]
          def raw(n): return open(os.path.join(root,n),encoding='iso-8859-1',errors='replace').read()
          def statuses(n): return [int(x) for x in re.findall(r'^HTTP/\S+\s+(\d{3})',raw(n),re.M|re.I)]
          def last(n):
              v=statuses(n); return v[-1] if v else 0
          def noindex(n): return bool(re.search(r'^X-Robots-Tag:\s*[^\r\n]*\bnoindex\b',raw(n),re.M|re.I))
          if last('r1-home.headers')!=200 or noindex('r1-home.headers'): raise SystemExit('Round1 home regression failed.')
          if last('r1-rest.headers')>=500 or not noindex('r1-rest.headers'): raise SystemExit('Round1 REST noindex failed.')
          if last('r1-shop-feed.headers')>=500 or not noindex('r1-shop-feed.headers'): raise SystemExit('Round1 shop feed noindex failed.')
          if last('r1-wcajax.headers')>=500 or not noindex('r1-wcajax.headers'): raise SystemExit('Round1 wc-ajax noindex failed.')
          if last('r1-false-positive.headers')!=200 or noindex('r1-false-positive.headers'): raise SystemExit('Round1 wc-api query false-positive hardening failed.')
          if variation_code!='200': raise SystemExit('Round1 variation HTTP failed: '+variation_code)
          html=open(os.path.join(root,'r1-variation.html'),encoding='utf-8',errors='replace').read()
          cs=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',html,re.I) or re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',html,re.I)
          if not cs or cs[0].rstrip('/')!='https://doctorcura.com/product/epipen': raise SystemExit('Round1 variation canonical failed: '+repr(cs[:2]))
          print('V7 regression round 1 PASS.')
          PY

          # Round 2: independent localized/feed/product examples plus clean shop-feed readback.
          fetch_headers "$site/fr/wp-json/" "$root/r2-rest-fr.headers"
          fetch_headers "$site/product-category/alle-medikamente/feed/?wa_dcseo_v7_round2=$REQUEST_ID" "$root/r2-category-feed.headers"
          fetch_headers "$site/shop/feed/" "$root/r2-shop-feed-clean.headers"
          fetch_headers "$site/product/champix/" "$root/r2-product.headers"
          variation2="$site/product/champix/?attribute_pa_medication-strength=startverpakking&attribute_pa_medication=generic&attribute_pa_amount=53"
          variation2_code=$(fetch_html "$variation2" "$root/r2-variation.html")

          python3 - "$root" "$variation2_code" <<'PY'
          import os,re,sys
          root=sys.argv[1]; variation_code=sys.argv[2]
          def raw(n): return open(os.path.join(root,n),encoding='iso-8859-1',errors='replace').read()
          def statuses(n): return [int(x) for x in re.findall(r'^HTTP/\S+\s+(\d{3})',raw(n),re.M|re.I)]
          def last(n):
              v=statuses(n); return v[-1] if v else 0
          def noindex(n): return bool(re.search(r'^X-Robots-Tag:\s*[^\r\n]*\bnoindex\b',raw(n),re.M|re.I))
          if last('r2-rest-fr.headers')>=500 or not noindex('r2-rest-fr.headers'): raise SystemExit('Round2 localized REST noindex failed.')
          if last('r2-category-feed.headers')>=500 or not noindex('r2-category-feed.headers'): raise SystemExit('Round2 category feed noindex failed.')
          if last('r2-product.headers')!=200 or noindex('r2-product.headers'): raise SystemExit('Round2 base product regression failed.')
          if variation_code!='200': raise SystemExit('Round2 variation HTTP failed: '+variation_code)
          html=open(os.path.join(root,'r2-variation.html'),encoding='utf-8',errors='replace').read()
          cs=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',html,re.I) or re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',html,re.I)
          if not cs or cs[0].rstrip('/')!='https://doctorcura.com/product/champix': raise SystemExit('Round2 variation canonical failed: '+repr(cs[:2]))
          clean_shop_noindex=noindex('r2-shop-feed-clean.headers')
          print('V7 regression round 2 PASS; clean_shop_feed_noindex='+('true' if clean_shop_noindex else 'false'))
          PY

          mutated=false
          trap - EXIT
          echo "DOCTORCURA_SNIPPET_V7_RESULT request_id=$REQUEST_ID snippet_id=$SNIPPET_ID active=true source_rounds=2 rollback=armed-and-not-needed"
