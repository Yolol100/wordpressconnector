name: Temporary additional AST-safe WordPress style fixes
on:
  push:
    branches: [fix/release-readiness-guarded-wpcs-20261019]
    paths: [.github/workflows/wpcs-secondary-guarded-once.yml]
permissions:
  contents: write
jobs:
  secondary-formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install pinned second formatter and official WordPressCS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/format-tools"
          cd "$RUNNER_TEMP/format-tools"
          composer init --no-interaction --name wordpressconnector/second-wpcs --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress \
            friendsofphp/php-cs-fixer:3.95.27 nikic/php-parser:5.9.0 \
            squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 \
            dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Format selected files; enforce AST and full contract tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/release-readiness-guarded-wpcs-20261019'
          mkdir -p "$RUNNER_TEMP/style-evidence"
          cat > "$RUNNER_TEMP/format-tools/fixer.php" <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          return (new PhpCsFixer\Config())
            ->setRules(array(
              'no_multiple_statements_per_line' => true,
              'control_structure_braces' => true,
              'braces_position' => array(
                'functions_opening_brace' => 'same_line',
                'classes_opening_brace' => 'same_line',
                'control_structures_opening_brace' => 'same_line',
              ),
              'statement_indentation' => true,
            ))
            ->setIndent("\t")
            ->setLineEnding("\n")
            ->setFinder((new PhpCsFixer\Finder())->in(getcwd())->name('*.php'));
          PHP
          cat > "$RUNNER_TEMP/format-tools/compare.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/vendor/autoload.php';
          use PhpParser\Node;
          use PhpParser\ParserFactory;
          function ast($x) {
            if ($x instanceof Node) {
              $out=array();
              foreach ($x->getSubNodeNames() as $k) $out[$k]=ast($x->$k);
              return array(get_class($x),$out);
            }
            return is_array($x) ? array_map('ast',$x) : $x;
          }
          function comments(string $source): array {
            $out=array();
            foreach(token_get_all($source) as $token)
              if(is_array($token) && in_array($token[0],array(T_COMMENT,T_DOC_COMMENT),true))
                $out[]=array($token[0],preg_replace('/\s+/', ' ',$token[1]));
            return $out;
          }
          $before=file_get_contents($argv[1]);$after=file_get_contents($argv[2]);
          if(!is_string($before)||!is_string($after)) exit(1);
          $parser=(new ParserFactory())->createForHostVersion();
          if(ast($parser->parse($before))!==ast($parser->parse($after))||comments($before)!==comments($after)) exit(1);
          PHP
          targets=(
            plugin/wordpressconnector/includes/Adapters/AcfAdapter.php
            plugin/wordpressconnector/includes/Adapters/AbilitiesAdapter.php
            plugin/wordpressconnector/includes/Runtime/Runner.php
            plugin/wordpressconnector/includes/Admin/ElementorJsonExport.php
            plugin/wordpressconnector/includes/Adapters/PluginSettingsAdapter.php
            plugin/wordpressconnector/includes/Adapters/ElementorCapabilitiesAdapter.php
            plugin/wordpressconnector/includes/Adapters/WooCommerceFulfillmentAdapter.php
            plugin/wordpressconnector/includes/MCP/Controller.php
          )
          scanner="$RUNNER_TEMP/format-tools/vendor/bin/phpcs"
          fixer="$RUNNER_TEMP/format-tools/vendor/bin/php-cs-fixer"
          "$scanner" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/style-evidence/before.txt" 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          accepted=0
          rejected=0
          for file in "${targets[@]}"; do
            name="$(basename "$file" .php)"
            original="$RUNNER_TEMP/style-evidence/$name.before.php"
            cp "$file" "$original"
            "$scanner" --standard=WordPress --report=json "$file" > "$RUNNER_TEMP/style-evidence/$name.before.json" 2>/dev/null || true
            PHP_CS_FIXER_IGNORE_ENV=1 "$fixer" fix "$file" --config="$RUNNER_TEMP/format-tools/fixer.php" --path-mode=override --using-cache=no --allow-risky=no --quiet > "$RUNNER_TEMP/style-evidence/$name.fixer.log" 2>&1 || true
            "$scanner" --standard=WordPress --report=json "$file" > "$RUNNER_TEMP/style-evidence/$name.after.json" 2>/dev/null || true
            valid=true
            php "$RUNNER_TEMP/format-tools/compare.php" "$original" "$file" > "$RUNNER_TEMP/style-evidence/$name.ast.log" 2>&1 || valid=false
            php -l "$file" >> "$RUNNER_TEMP/style-evidence/$name.ast.log" 2>&1 || valid=false
            git diff --check -- "$file" > "$RUNNER_TEMP/style-evidence/$name.diffcheck.txt" 2>&1 || valid=false
            before="$(jq -r '.totals.errors + .totals.warnings' "$RUNNER_TEMP/style-evidence/$name.before.json" 2>/dev/null || echo -1)"
            after="$(jq -r '.totals.errors + .totals.warnings' "$RUNNER_TEMP/style-evidence/$name.after.json" 2>/dev/null || echo -1)"
            if test "$valid" != true || test "$before" -lt 0 || test "$after" -lt 0 || test "$after" -ge "$before"; then
              cp "$original" "$file"
              rejected=$((rejected+1))
              echo "$name REJECT AST/syntax/WPCS: $before to $after" >> "$RUNNER_TEMP/style-evidence/decisions.txt"
              continue
            fi
            if ! bash scripts/run-contracts.sh > "$RUNNER_TEMP/style-evidence/$name.contracts.txt" 2>&1; then
              cp "$original" "$file"
              rejected=$((rejected+1))
              echo "$name REJECT contract: $before to $after" >> "$RUNNER_TEMP/style-evidence/decisions.txt"
              continue
            fi
            git add -- "$file"
            git diff --cached --check
            git commit -m "style(wpcs): AST-equivalent compact structure in $name"
            accepted=$((accepted+1))
            echo "$name ACCEPT: $before to $after" >> "$RUNNER_TEMP/style-evidence/decisions.txt"
          done
          "$scanner" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/style-evidence/after.txt" 2>&1 || true
          printf 'accepted=%s rejected=%s\\n' "$accepted" "$rejected" | tee "$RUNNER_TEMP/style-evidence/totals.txt"
          if test "$accepted" -gt 0; then git push origin HEAD:fix/release-readiness-guarded-wpcs-20261019; fi
      - name: Archive all decisions for source review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpcs-secondary-ast-safe-review
          path: ${{ runner.temp }}/style-evidence/
          retention-days: 7
          if-no-files-found: warn
