name: One-time DoctorCura market country alignment

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-market-country-fix/*.json'

permissions:
  contents: read

concurrency:
  group: doctorcura-market-country-fix
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Restrict WooCommerce selling markets to Germany France and United Kingdom
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-market-fix"; rm -rf "$root"; mkdir -p "$root"
          call(){
            suffix="$1"; action="$2"; dry="$3"; confirm="$4"; payload="$5"
            python3 - "$root/r-$suffix.json" "$action" "$dry" "$confirm" "$payload" <<'PY'
          import json,sys,uuid
          out,action,dry,confirm,payload=sys.argv[1:]
          req={'version':1,'request_id':'dc-marketfix-'+uuid.uuid4().hex[:20],'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':json.load(open(payload,encoding='utf-8'))}
          json.dump(req,open(out,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            for attempt in $(seq 1 8); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 90 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute" || true)
              if [[ "$code" == 200 ]] && python3 - "$root/o-$suffix.json" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1],encoding='utf-8'))
          except: raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') else 1)
          PY
              then return 0; fi
              [[ "$code" == 503 ]] && sleep 10 && continue
              cat "$root/o-$suffix.json" >&2 || true; return 1
            done
            return 1
          }
          # Preflight current values.
          for key in woocommerce_allowed_countries woocommerce_specific_allowed_countries woocommerce_all_except_countries woocommerce_ship_to_countries woocommerce_specific_ship_to_countries; do
            printf '{"name":"%s"}' "$key" > "$root/p.json"; call "before-${key//_/-}" option.get true false "$root/p.json"
          done
          # User-stated markets: Germany, France, England/UK. WooCommerce country code for the UK is GB.
          printf '%s' '{"name":"woocommerce_allowed_countries","value":"specific"}' > "$root/p1.json"
          printf '%s' '{"name":"woocommerce_specific_allowed_countries","value":["DE","FR","GB"]}' > "$root/p2.json"
          printf '%s' '{"name":"woocommerce_all_except_countries","value":[]}' > "$root/p3.json"
          printf '%s' '{"name":"woocommerce_ship_to_countries","value":""}' > "$root/p4.json"
          printf '%s' '{"name":"woocommerce_specific_ship_to_countries","value":[]}' > "$root/p5.json"
          call set-allowed option.update false true "$root/p1.json"
          call set-specific option.update false true "$root/p2.json"
          call clear-except option.update false true "$root/p3.json"
          call ship-same option.update false true "$root/p4.json"
          call clear-ship-specific option.update false true "$root/p5.json"
          # Readback.
          for key in woocommerce_allowed_countries woocommerce_specific_allowed_countries woocommerce_all_except_countries woocommerce_ship_to_countries woocommerce_specific_ship_to_countries; do
            printf '{"name":"%s"}' "$key" > "$root/p.json"; call "after-${key//_/-}" option.get true false "$root/p.json"
          done
          python3 - "$root" <<'PY'
          import json,os,sys
          root=sys.argv[1]
          def val(key):
              d=json.load(open(root+'/o-after-'+key.replace('_','-')+'.json',encoding='utf-8'))
              x=d.get('data') or {}; return x.get('value')
          assert val('woocommerce_allowed_countries')=='specific'
          assert val('woocommerce_specific_allowed_countries')==['DE','FR','GB']
          assert val('woocommerce_all_except_countries')==[]
          assert val('woocommerce_ship_to_countries')==''
          assert val('woocommerce_specific_ship_to_countries')==[]
          report={'selling_mode':val('woocommerce_allowed_countries'),'selling_countries':val('woocommerce_specific_allowed_countries'),'shipping_mode':'same_as_selling_countries','verified':True}
          json.dump(report,open(root+'/market-fix-report.json','w',encoding='utf-8'),indent=2)
          print('MARKET_COUNTRIES_OK selling=DE,FR,GB shipping=same_as_selling')
          PY

      - name: Upload market alignment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-market-country-fix
          path: ${{ runner.temp }}/dc-market-fix/market-fix-report.json
          retention-days: 7
          if-no-files-found: warn
