name: DoctorCura WordPress Execute

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: DoctorCura runtime request PR number
        required: true
        type: string
      expected_head_sha:
        description: Exact validated request head SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: doctorcura-wordpress-execute-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Revalidate DoctorCura request
        id: preflight
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          root="$RUNNER_TEMP/doctorcura-request"
          rm -rf "$root" && mkdir -p "$root/trusted/scripts" "$root/doctorcura-receipts"
          headers=(--header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_REPO_TOKEN}" --header 'X-GitHub-Api-Version: 2026-03-10')
          curl --silent --show-error --location "${headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$root/pr.json"
          metadata=$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); $repo=getenv("GITHUB_REPOSITORY"); $owner=getenv("REPOSITORY_OWNER"); $trusted=getenv("TRUSTED_REQUEST_ACTOR")?:""; $expected=getenv("EXPECTED_HEAD_SHA"); $actor=(string)($p["user"]["login"]??""); $headRepo=(string)($p["head"]["repo"]["full_name"]??""); $headSha=(string)($p["head"]["sha"]??""); $headRef=(string)($p["head"]["ref"]??""); $baseRepo=(string)($p["base"]["repo"]["full_name"]??""); $baseRef=(string)($p["base"]["ref"]??""); $baseSha=(string)($p["base"]["sha"]??""); $state=(string)($p["state"]??""); $allowed=($actor===$owner||($trusted!==""&&hash_equals($trusted,$actor))); if($state!=="open"||!$allowed||$headRepo!==$repo||$baseRepo!==$repo||$baseRef!=="main"||!hash_equals($expected,$headSha)){exit(1);} echo $baseSha."\t".$headSha."\t".$headRef;' "$root/pr.json")
          IFS=$'\t' read -r base_sha head_sha head_ref <<< "$metadata"
          cd "$root"
          git init repo >/dev/null && cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" fetch --depth=1 origin main
          git branch trusted-main FETCH_HEAD
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" fetch --depth=1 origin "$base_sha"
          git branch request-base FETCH_HEAD
          git -c url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf="https://github.com/" fetch --depth=1 origin "$head_sha"
          git branch request-head FETCH_HEAD
          mapfile -t changed < <(git diff --name-only request-base request-head)
          request_count=0; request_path=''
          for path in "${changed[@]}"; do
            case "$path" in
              doctorcura-requests/*.json) ((request_count+=1)); request_path="$path" ;;
              doctorcura-receipts/*.json) ;;
              *) echo "Disallowed DoctorCura runtime path: $path" >&2; exit 1 ;;
            esac
          done
          (( request_count == 1 )) || exit 1
          git show "trusted-main:scripts/validate-request.php" > "$root/trusted/scripts/validate-request.php"
          git show "trusted-main:scripts/validate-public-request.php" > "$root/trusted/scripts/validate-public-request.php"
          git show "trusted-main:scripts/build-public-receipt.php" > "$root/trusted/scripts/build-public-receipt.php"
          git show "request-head:$request_path" > "$root/request.json"
          php "$root/trusted/scripts/validate-request.php" "$root/request.json"
          php "$root/trusted/scripts/validate-public-request.php" "$root/request.json"
          request_id=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $d["request_id"];' "$root/request.json")
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Verify DoctorCura authenticated HTTPS health
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || { echo 'DoctorCura site target mismatch.' >&2; exit 1; }
          health="$RUNNER_TEMP/doctorcura-request/health.json"
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' --output "$health" --write-out '%{http_code}' "${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1/health")
          [[ "$code" == '200' ]] || { echo "DoctorCura health HTTP $code" >&2; exit 1; }
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); if(empty($d["ok"])||($d["transport"]??"")!=="rest"){exit(1);} echo "DoctorCura REST connector health OK; version=".(string)($d["version"]??$d["connector_version"]??"unknown").PHP_EOL;' "$health"

      - name: Execute DoctorCura connector request
        id: request
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
          REQUEST_ID: ${{ steps.preflight.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/doctorcura-request"
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 180 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' --header 'Content-Type: application/json' --data-binary "@$root/request.json" --output "$root/result.json" --write-out '%{http_code}' "${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1/execute")
          [[ "$code" == '200' ]] || { echo "DoctorCura execute HTTP $code" >&2; exit 1; }
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); if(($d["request_id"]??"")!==$argv[2]){exit(1);}' "$root/result.json" "$REQUEST_ID"

      - name: Build and commit sanitized DoctorCura receipt
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.preflight.outputs.request_id }}
          PR_HEAD_REF: ${{ steps.preflight.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/doctorcura-request"
          [[ -s "$root/result.json" ]] || exit 0
          php "$root/trusted/scripts/build-public-receipt.php" "$root/request.json" "$root/result.json" "$root/receipt.json"
          work="$RUNNER_TEMP/doctorcura-receipt-push"
          git clone "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work" >/dev/null 2>&1
          cd "$work" && git checkout "$PR_HEAD_REF" >/dev/null 2>&1
          [[ "$(git rev-parse HEAD)" == "$PR_HEAD_SHA" ]] || { echo 'Request branch moved; refusing receipt write.' >&2; exit 1; }
          mkdir -p doctorcura-receipts
          cp "$root/receipt.json" "doctorcura-receipts/${REQUEST_ID}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "doctorcura-receipts/${REQUEST_ID}.json"
          git commit -m "Add sanitized DoctorCura receipt ${REQUEST_ID}" >/dev/null || exit 0
          git push origin HEAD:"$PR_HEAD_REF" >/dev/null

      - name: Validate DoctorCura connector result
        if: steps.request.outcome == 'success'
        env:
          REQUEST_ID: ${{ steps.preflight.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); if(empty($d["ok"])){fwrite(STDERR,"DoctorCura connector returned ok=false.\n"); exit(1);} echo "DoctorCura connector receipt verified.\n";' "$RUNNER_TEMP/doctorcura-request/receipt.json"

      - name: Fail if DoctorCura execution failed
        if: steps.request.outcome == 'failure'
        shell: bash
        run: exit 1
