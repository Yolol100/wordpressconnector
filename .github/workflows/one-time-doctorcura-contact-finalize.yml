name: One-time DoctorCura contact finalization

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-contact-finalize/*.json'

permissions:
  contents: read

concurrency:
  group: doctorcura-contact-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Finalize and verify DoctorCura contact details everywhere relevant
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          [[ "$site" == 'https://doctorcura.com' ]] || { echo 'Unexpected target.' >&2; exit 1; }
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          snippets="$site/wp-json/code-snippets/v1/snippets"
          root="$RUNNER_TEMP/dc-contact-finalize"; rm -rf "$root"; mkdir -p "$root"

          wait_health() {
            for attempt in $(seq 1 12); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 30 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/health.json" -w '%{http_code}' "$base/health" || true)
              if [[ "$code" == 200 ]]; then return 0; fi
              echo "Health attempt $attempt HTTP $code; retrying"
              sleep 15
            done
            return 1
          }
          wait_health || { echo 'DoctorCura did not leave maintenance/unavailable state in time.' >&2; exit 1; }

          call() {
            suffix="$1"; action="$2"; dry="$3"; confirm="$4"; payload_file="$5"
            python3 - "$root/r-$suffix.json" "$action" "$dry" "$confirm" "$payload_file" <<'PY'
          import json,sys,uuid
          path,action,dry,confirm,payload_file=sys.argv[1:]
          payload=json.load(open(payload_file,encoding='utf-8'))
          req={'version':1,'request_id':'dc-final-'+uuid.uuid4().hex[:24],'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':payload}
          json.dump(req,open(path,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            for attempt in $(seq 1 8); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 150 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute" || true)
              if [[ "$code" == 200 ]]; then
                if python3 - "$root/o-$suffix.json" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') else 1)
          PY
                then return 0; fi
              fi
              if [[ "$code" == 503 ]]; then echo "$action attempt $attempt hit maintenance HTTP 503; retrying"; sleep 15; continue; fi
              echo "$action failed HTTP $code" >&2; cat "$root/o-$suffix.json" >&2 || true; return 1
            done
            echo "$action exhausted retries" >&2; return 1
          }

          # Record active runtime/plugins so plugin-owned contact settings can be assessed.
          printf '{}' > "$root/empty.json"
          call discover connector.discover true false "$root/empty.json" || true
          call plugins plugin.list true false "$root/empty.json" || true

          cat > "$root/replacements.json" <<'JSON'
          {
            "address_variants": [
              "Keizersgracht 241, 1016 EA Amsterdam, Netherlands",
              "Keizersgracht 241, 1016 EA Amsterdam, The Netherlands",
              "Keizersgracht 241, 1016 EA Amsterdam, Niederlande",
              "Keizersgracht 241, 1016 EA, Amsterdam, Netherlands",
              "Keizersgracht 241, 1016 EA, Amsterdam, The Netherlands",
              "Keizersgracht 241, 1016 EA, Amsterdam, Niederlande",
              "Keizersgracht 241<br>1016 EA Amsterdam, Netherlands",
              "Keizersgracht 241<br>1016 EA Amsterdam, The Netherlands",
              "Keizersgracht 241<br>1016 EA Amsterdam, Niederlande",
              "Keizersgracht 241<br />1016 EA Amsterdam, Netherlands",
              "Keizersgracht 241<br />1016 EA Amsterdam, The Netherlands",
              "Keizersgracht 241<br />1016 EA Amsterdam, Niederlande",
              "Keizersgracht%20241%2C%201016%20EA%20Amsterdam%2C%20The%20Netherlands",
              "Keizersgracht%20241%2C%201016%20EA%20Amsterdam%2C%20Netherlands",
              "Keizersgracht+241%2C+1016+EA+Amsterdam%2C+The+Netherlands",
              "Keizersgracht+241%2C+1016+EA+Amsterdam%2C+Netherlands"
            ],
            "phone_variants": [
              "08 550 55 433",
              "085 505 5433",
              "0855055433",
              "+31 (0)85 505 5433",
              "+31 85 505 5433",
              "+31855055433"
            ]
          }
          JSON

          : > "$root/objects.tsv"
          for type in page post product elementor_library wp_block; do
            for page in $(seq 1 30); do
              printf '{"post_type":"%s","status":"any","per_page":100,"page":%s}' "$type" "$page" > "$root/list.json"
              if ! call "list-$type-$page" post.list true false "$root/list.json"; then break; fi
              count=$(python3 - "$root/o-list-$type-$page.json" "$root/objects.tsv" "$type" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); items=(d.get('data') or {}).get('items',[]); typ=sys.argv[3]
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              for x in items:
                  if isinstance(x,dict) and isinstance(x.get('id'),int): f.write(f"{x['id']}\t{typ}\n")
          print(len(items))
          PY
          )
              [[ "$count" -lt 100 ]] && break
            done
          done
          sort -u "$root/objects.tsv" -o "$root/objects.tsv"

          changed_posts=0; changed_elementor=0
          while IFS=$'\t' read -r id type; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "get-$id" post.get true false "$root/id.json" || continue
            call "el-$id" elementor.inspect true false "$root/id.json" || true
            python3 - "$root/o-get-$id.json" "$root/o-el-$id.json" "$root/replacements.json" "$root/post-$id.json" "$root/el-$id.json" <<'PY'
          import json,os,sys,urllib.parse
          postf,elf,repf,postout,elout=sys.argv[1:]
          r=json.load(open(repf,encoding='utf-8'))
          def rep(s):
              originals=r['address_variants']
              for old in originals:
                  if old not in s: continue
                  if '%20' in old or '%2C' in old:
                      new='Veldbloemlaan%2093%2C%203452CK%20Vleuten%2C%20The%20Netherlands'
                  elif '+' in old and '%2C' in old:
                      new='Veldbloemlaan+93%2C+3452CK+Vleuten%2C+The+Netherlands'
                  elif '<br />' in old:
                      new='Veldbloemlaan 93<br />3452CK Vleuten, The Netherlands'
                  elif '<br>' in old:
                      new='Veldbloemlaan 93<br>3452CK Vleuten, The Netherlands'
                  else:
                      new='Veldbloemlaan 93, 3452CK Vleuten, The Netherlands'
                  s=s.replace(old,new)
              for old in r['phone_variants']:
                  if old==' +31855055433': continue
                  s=s.replace(old,'+31 85 505 54 33')
              s=s.replace('tel:0855055433','tel:+31855055433').replace('tel:+31 85 505 54 33','tel:+31855055433')
              return s
          def walk(v):
              if isinstance(v,str): return rep(v)
              if isinstance(v,list): return [walk(x) for x in v]
              if isinstance(v,dict): return {k:walk(x) for k,x in v.items()}
              return v
          pd=json.load(open(postf,encoding='utf-8')); post=(pd.get('data') or {}).get('post') or {}
          content=post.get('content','') if isinstance(post,dict) else ''
          ncontent=rep(content)
          json.dump({'id':int(post.get('id',0)),'content':ncontent,'status':post.get('status','publish')},open(postout,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          open(postout+'.changed','w').write('1' if ncontent!=content else '0')
          if os.path.exists(elf):
              try:
                  ed=json.load(open(elf,encoding='utf-8')); doc=(ed.get('data') or {}).get('document') or {}
                  data=doc.get('data',[]); settings=doc.get('page_settings',{})
                  nd=walk(data); ns=walk(settings)
                  json.dump({'id':int(post.get('id',0)),'data':nd,'page_settings':ns},open(elout,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
                  open(elout+'.changed','w').write('1' if nd!=data or ns!=settings else '0')
              except Exception: open(elout+'.changed','w').write('0')
          else: open(elout+'.changed','w').write('0')
          PY
            if [[ "$(cat "$root/post-$id.json.changed")" == 1 ]]; then call "write-post-$id" post.update false true "$root/post-$id.json"; changed_posts=$((changed_posts+1)); fi
            if [[ "$(cat "$root/el-$id.json.changed")" == 1 ]]; then call "write-el-$id" elementor.replace_document false true "$root/el-$id.json"; changed_elementor=$((changed_elementor+1)); fi
          done < "$root/objects.tsv"

          # WooCommerce canonical business/store address.
          declare -A woovalues=(
            [woocommerce_store_address]='Veldbloemlaan 93'
            [woocommerce_store_address_2]=''
            [woocommerce_store_city]='Vleuten'
            [woocommerce_store_postcode]='3452CK'
            [woocommerce_default_country]='NL'
          )
          changed_woo=0
          for key in "${!woovalues[@]}"; do
            printf '{"name":"%s","value":"%s"}' "$key" "${woovalues[$key]}" > "$root/opt-write.json"
            call "optwrite-${key//_/-}" option.update false true "$root/opt-write.json"
            changed_woo=$((changed_woo+1))
          done

          # Code Snippets: exact legacy values only.
          changed_snippets=0
          scode=$(curl -sS -L --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/snippets.json" -w '%{http_code}' "$snippets?per_page=100&page=1" || true)
          if [[ "$scode" == 200 ]]; then
            python3 - "$root/snippets.json" "$root/replacements.json" "$root/snippet-updates" <<'PY'
          import json,os,sys
          sf,rf,outdir=sys.argv[1:]; os.makedirs(outdir,exist_ok=True); d=json.load(open(sf,encoding='utf-8')); r=json.load(open(rf,encoding='utf-8'))
          items=d if isinstance(d,list) else d.get('items',d.get('snippets',[])) if isinstance(d,dict) else []
          def rep(s):
              for old in r['address_variants']:
                  if '%20' in old or '%2C' in old: new='Veldbloemlaan%2093%2C%203452CK%20Vleuten%2C%20The%20Netherlands'
                  elif '+' in old and '%2C' in old: new='Veldbloemlaan+93%2C+3452CK+Vleuten%2C+The+Netherlands'
                  elif '<br />' in old: new='Veldbloemlaan 93<br />3452CK Vleuten, The Netherlands'
                  elif '<br>' in old: new='Veldbloemlaan 93<br>3452CK Vleuten, The Netherlands'
                  else: new='Veldbloemlaan 93, 3452CK Vleuten, The Netherlands'
                  s=s.replace(old,new)
              for old in r['phone_variants']: s=s.replace(old,'+31 85 505 54 33')
              return s.replace('tel:0855055433','tel:+31855055433').replace('tel:+31 85 505 54 33','tel:+31855055433')
          for x in items:
              if not isinstance(x,dict) or not isinstance(x.get('id'),int): continue
              code=x.get('code',''); n=rep(code) if isinstance(code,str) else code
              if n==code: continue
              payload={k:x[k] for k in ('name','desc','tags','scope','priority','active') if k in x}; payload['code']=n
              json.dump(payload,open(os.path.join(outdir,str(x['id'])+'.json'),'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            shopt -s nullglob
            for f in "$root/snippet-updates"/*.json; do
              sid=$(basename "$f" .json)
              for attempt in $(seq 1 8); do
                code=$(curl -sS -L --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$f" -o "$root/snippet-$sid.json" -w '%{http_code}' "$snippets/$sid" || true)
                [[ "$code" == 200 ]] && break
                [[ "$code" == 503 ]] && sleep 15 && continue
                echo "Snippet $sid update HTTP $code" >&2; exit 1
              done
              [[ "$code" == 200 ]] || exit 1
              changed_snippets=$((changed_snippets+1))
            done
          fi

          # Known DoctorCura Core source that can emit contact details.
          printf '%s' '{"path":"wp-content/plugins/doctorcura-core/includes/extra-request-form.php"}' > "$root/fs-read.json"
          changed_file=0
          if call fsread filesystem.read_text true false "$root/fs-read.json"; then
            python3 - "$root/o-fsread.json" "$root/replacements.json" "$root/fs-write.json" "$root/fs-needed" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); r=json.load(open(sys.argv[2],encoding='utf-8')); data=d.get('data') or {}; content=data.get('content',''); state=data.get('file') or {}; s=content
          for old in r['address_variants']: s=s.replace(old,'Veldbloemlaan 93, 3452CK Vleuten, The Netherlands')
          for old in r['phone_variants']: s=s.replace(old,'+31 85 505 54 33')
          s=s.replace('tel:0855055433','tel:+31855055433').replace('tel:+31 85 505 54 33','tel:+31855055433')
          json.dump({'path':'wp-content/plugins/doctorcura-core/includes/extra-request-form.php','content':s,'expected_sha256':state.get('sha256','')},open(sys.argv[3],'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          open(sys.argv[4],'w').write('1' if s!=content else '0')
          PY
            if [[ "$(cat "$root/fs-needed")" == 1 ]]; then if call fswrite filesystem.write_text false true "$root/fs-write.json"; then changed_file=1; fi; fi
          fi

          call regen elementor.regenerate false true "$root/empty.json" || true
          call cache cache.flush false true "$root/empty.json" || true

          # Full readback over CMS/Elementor plus map widgets and KvK references.
          : > "$root/verify.jsonl"
          while IFS=$'\t' read -r id type; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "vget-$id" post.get true false "$root/id.json" || continue
            call "vel-$id" elementor.inspect true false "$root/id.json" || true
            python3 - "$root/o-vget-$id.json" "$root/o-vel-$id.json" "$id" "$type" >> "$root/verify.jsonl" <<'PY'
          import json,os,sys
          pf,ef,pid,typ=sys.argv[1:]
          out={'id':int(pid),'type':typ,'post':json.load(open(pf,encoding='utf-8')).get('data')}
          if os.path.exists(ef):
              try: out['elementor']=json.load(open(ef,encoding='utf-8')).get('data')
              except: pass
          print(json.dumps(out,ensure_ascii=False))
          PY
          done < "$root/objects.tsv"

          for key in woocommerce_store_address woocommerce_store_address_2 woocommerce_store_city woocommerce_store_postcode woocommerce_default_country; do
            printf '{"name":"%s"}' "$key" > "$root/opt-get.json"
            call "verify-${key//_/-}" option.get true false "$root/opt-get.json"
          done

          python3 - "$root" <<'PY'
          import glob,html,json,os,re,sys,urllib.parse,urllib.request,xml.etree.ElementTree as ET
          root=sys.argv[1]
          legacy=[r'Keizersgracht\s*241',r'1016\s*EA\s*,?\s*Amsterdam',r'08\s*550\s*55\s*433',r'085\s*505\s*5433',r'0855055433',r'\+31\s*\(0\)\s*85\s*505\s*5433',r'\+31\s*85\s*505\s*5433']
          hits=[]; maps=[]; kvk=[]
          for line in open(os.path.join(root,'verify.jsonl'),encoding='utf-8'):
              try: obj=json.loads(line)
              except: continue
              raw=json.dumps(obj,ensure_ascii=False)
              for pat in legacy:
                  if re.search(pat,raw,re.I): hits.append({'id':obj['id'],'type':obj['type'],'pattern':pat})
              if re.search(r'google.?maps|maps\.google|google_maps|map',raw,re.I):
                  vals=[]
                  def walk(v,path=''):
                      if isinstance(v,str):
                          if re.search(r'map|Keizersgracht|Veldbloemlaan|Amsterdam|Vleuten',v,re.I): vals.append((path,v[:800]))
                      elif isinstance(v,list):
                          for i,x in enumerate(v): walk(x,f'{path}[{i}]')
                      elif isinstance(v,dict):
                          for k,x in v.items(): walk(x,f'{path}.{k}' if path else str(k))
                  walk(obj)
                  if vals: maps.append({'id':obj['id'],'type':obj['type'],'values':vals[:80]})
              if re.search(r'\bKvK\b|Kamer van Koophandel|Chamber of Commerce|Handelsregister',raw,re.I): kvk.append({'id':obj['id'],'type':obj['type']})
          woo={}
          for p in glob.glob(os.path.join(root,'o-verify-woocommerce-*.json')):
              try:
                  d=json.load(open(p,encoding='utf-8')); woo[os.path.basename(p)]=(d.get('data') or {})
              except: pass
          # Snippets final residual scan.
          snippet_hits=[]
          sp=os.path.join(root,'snippets.json')
          if os.path.exists(sp):
              try:
                  d=json.load(open(sp,encoding='utf-8')); items=d if isinstance(d,list) else d.get('items',d.get('snippets',[])) if isinstance(d,dict) else []
                  for x in items:
                      raw=json.dumps(x,ensure_ascii=False)
                      if any(re.search(pat,raw,re.I) for pat in legacy): snippet_hits.append(x.get('id'))
              except: pass
          report={'legacy_hits':hits,'map_candidates':maps,'kvk_objects':kvk,'woocommerce':woo,'snippet_legacy_hits':snippet_hits}
          json.dump(report,open(os.path.join(root,'contact-final-report.json'),'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          if hits or snippet_hits:
              print('LEGACY_CONTACT_VALUES_REMAIN',len(hits),len(snippet_hits)); print(json.dumps((hits[:20]+[{'snippet':x} for x in snippet_hits[:20]]),ensure_ascii=False)); raise SystemExit(2)
          # Exact Woo readback, parse any nested value field by JSON text because action response shape is stable but may wrap data.
          expected={'woocommerce_store_address':'Veldbloemlaan 93','woocommerce_store_address_2':'','woocommerce_store_city':'Vleuten','woocommerce_store_postcode':'3452CK','woocommerce_default_country':'NL'}
          for key,val in expected.items():
              p=os.path.join(root,'o-verify-'+key.replace('_','-')+'.json'); d=json.load(open(p,encoding='utf-8')); raw=json.dumps(d.get('data'),ensure_ascii=False)
              if json.dumps(val,ensure_ascii=False) not in raw: raise SystemExit('Woo readback mismatch '+key+' raw='+raw[:500])
          print('CONTACT_FINAL_VERIFY_OK maps=',len(maps),'kvk_objects=',len(kvk))
          PY

          echo "CONTACT_FINALIZE_OK posts=$changed_posts elementor=$changed_elementor woo=$changed_woo snippets=$changed_snippets plugin_file=$changed_file"

      - name: Upload final contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-contact-final-evidence
          path: |
            ${{ runner.temp }}/dc-contact-finalize/contact-final-report.json
            ${{ runner.temp }}/dc-contact-finalize/o-discover.json
            ${{ runner.temp }}/dc-contact-finalize/o-plugins.json
          retention-days: 7
          if-no-files-found: warn
