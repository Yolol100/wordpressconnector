name: Temporary DoctorCura Pagination Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-pagination-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public pagination URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dc-pagination"
          python3 - "$RUNNER_TEMP/dc-pagination/result.json" <<'PY'
          import hashlib, json, os, re, subprocess, sys, tempfile
          out=sys.argv[1]
          urls=[
            'https://doctorcura.com/fr/blogs/',
            'https://doctorcura.com/fr/blogs/4/',
            'https://doctorcura.com/fr/blogs/5/',
            'https://doctorcura.com/fr/blogs/6/',
            'https://doctorcura.com/fr/blogs/page/5/',
          ]
          def probe(url):
              td=tempfile.mkdtemp(prefix='dc-page-')
              hdr=os.path.join(td,'headers.txt'); body=os.path.join(td,'body.html')
              cmd=['curl','--silent','--show-error','--location','--compressed','--connect-timeout','8','--max-time','25','--user-agent','Mozilla/5.0 (compatible; DoctorCuraPaginationAudit/1.0)','--dump-header',hdr,'--output',body,'--write-out','%{http_code}\t%{url_effective}\t%{content_type}',url]
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=30)
              parts=p.stdout.strip().split('\t',2)
              status=int(parts[0]) if parts and parts[0].isdigit() else 0
              final=parts[1] if len(parts)>1 else ''
              ctype=parts[2] if len(parts)>2 else ''
              data=open(body,'rb').read().decode('utf-8','ignore') if os.path.exists(body) else ''
              raw=open(hdr,'rb').read().decode('iso-8859-1','replace') if os.path.exists(hdr) else ''
              blocks=[b for b in re.split(r'\r?\n\r?\n',raw) if b.strip().startswith('HTTP/')]
              last=blocks[-1] if blocks else ''
              headers={}
              for line in last.splitlines()[1:]:
                  if ':' in line:
                      k,v=line.split(':',1); headers.setdefault(k.lower().strip(),[]).append(v.strip())
              def one(pattern):
                  m=re.search(pattern,data,re.I|re.S); return m.group(1).strip() if m else None
              canonical=one(r'<link[^>]+rel=["\'][^"\']*canonical[^"\']*["\'][^>]+href=["\']([^"\']+)') or one(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\'][^"\']*canonical[^"\']*["\']')
              robots=one(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)') or one(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']robots["\']')
              title=one(r'<title[^>]*>(.*?)</title>')
              hrefs=[]
              for h in re.findall(r'href=["\']([^"\']+)',data,re.I):
                  if h.startswith('/'):
                      h='https://doctorcura.com'+h
                  if h.startswith('https://doctorcura.com/fr/blogs/') and h not in hrefs:
                      hrefs.append(h)
              visible=re.sub(r'<script\b.*?</script>|<style\b.*?</style>',' ',data,flags=re.I|re.S)
              visible=re.sub(r'<[^>]+>',' ',visible)
              visible=re.sub(r'\s+',' ',visible).strip()
              return {
                'url':url,'status':status,'final_url':final,'content_type':ctype,
                'x_robots':', '.join(headers.get('x-robots-tag',[])) or None,
                'canonical':canonical,'meta_robots':robots,'title':title,
                'body_sha256':hashlib.sha256(data.encode('utf-8')).hexdigest(),
                'visible_text_sha256':hashlib.sha256(visible.encode('utf-8')).hexdigest(),
                'visible_text_length':len(visible),'blog_links':hrefs[:80],
                'curl_error':None if p.returncode==0 else (p.stderr.strip() or 'curl_'+str(p.returncode))
              }
          rows=[]
          for u in urls:
              try: rows.append(probe(u))
              except Exception as e: rows.append({'url':u,'status':0,'error':type(e).__name__+': '+str(e)})
          with open(out,'w',encoding='utf-8') as f: json.dump(rows,f,ensure_ascii=False,indent=2)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
          cp "$RUNNER_TEMP/dc-pagination/result.json" ./doctorcura-pagination-result.json

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-pagination-probe
          path: doctorcura-pagination-result.json
          if-no-files-found: error
          retention-days: 1
