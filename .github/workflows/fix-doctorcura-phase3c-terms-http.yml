name: DoctorCura Phase 3C Terms HTTP Link Fix

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-phase3c-terms-http.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Apply byte-scoped page content correction with rollback
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          page_api="$base/wp-json/wp/v2/pages/11?context=edit"
          page_write="$base/wp-json/wp/v2/pages/11"
          snippet_api="$base/wp-json/code-snippets/v1/snippets/43"
          elementor_cache="$base/wp-json/elementor/v1/cache"
          tmp="$RUNNER_TEMP/dc-phase3c"; mkdir -p "$tmp"
          old='http://www.doctorcura.com'
          replacement='https://doctorcura.com/'
          expected_raw_hash='890f2cca24c5e0de3ab501cb83fb2fe0e54a4fff076b0520ab4de9144e0933c6'
          expected_snippet_hash='e6e303d0d24b55a97088f4cde4151130a7a17414037c0a626427a39f1c0aa946'
          page_changed=0; helper=0

          canonical_of(){
            python3 - "$1" <<'PY'
          import sys
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.c=''
              def handle_starttag(self,t,a):
                  if t.lower()!='link' or self.c:return
                  d={str(k).lower():str(v or '') for k,v in a}
                  if 'canonical' in d.get('rel','').lower().split() and d.get('href'): self.c=d['href']
          p=P();p.feed(open(sys.argv[1],encoding='utf-8',errors='ignore').read());print(p.c,end='')
          PY
          }
          old_count(){ python3 - "$1" "$old" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read();print(s.count(sys.argv[2]),end='')
          PY
          }
          make_page_payload(){
            php -r '$raw=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["content"=>$raw],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$1" "$2"
          }
          write_page(){
            local rawfile label payload out http
            rawfile="$1"; label="$2"; payload="$tmp/$label-page-payload.json"; out="$tmp/$label-page-response.json"
            make_page_payload "$rawfile" "$payload"
            http=$(curl "${c[@]}" --location "${auth[@]}" --request POST --header 'Content-Type: application/json' --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$page_write")
            echo "PAGE_WRITE label=$label http=$http"; [[ "$http" == 200 ]]
          }
          make_snippet_payload(){ php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["code"=>$c,"active"=>true],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$1" "$2"; }
          put_snippet(){
            local src label payload out http
            src="$1"; label="$2"; payload="$tmp/$label-snippet-payload.json"; out="$tmp/$label-snippet-response.json"
            make_snippet_payload "$src" "$payload"
            http=$(curl "${c[@]}" --location "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$payload" --output "$out" --write-out '%{http_code}' "$snippet_api")
            echo "SNIPPET_WRITE label=$label http=$http"; [[ "$http" == 200 ]]
          }
          purge(){
            local label="$1" token helperfile ok=0
            token=$(openssl rand -hex 24); helperfile="$tmp/$label-helper.php"; cp "$tmp/snippet-original.php" "$helperfile"
            cat >> "$helperfile" <<PHP

          /* DoctorCura one-time cache purge helper */
          add_action( 'init', function () {
              if ( ! isset( \$_GET['doctorcura_phase3c_purge'] ) || ! hash_equals( '$token', (string) \$_GET['doctorcura_phase3c_purge'] ) ) return;
              if ( function_exists( 'rocket_clean_domain' ) ) rocket_clean_domain();
              if ( function_exists( 'wp_cache_flush' ) ) wp_cache_flush();
              header( 'X-DoctorCura-Phase3C-Purge: done' );
          }, 1 );
          PHP
            put_snippet "$helperfile" "$label-install"; helper=1
            if curl "${c[@]}" --compressed --dump-header "$tmp/$label.h" --output /dev/null "$base/wp-json/?doctorcura_phase3c_purge=$token"; then
              grep -Eiq '^x-doctorcura-phase3c-purge:[[:space:]]*done' "$tmp/$label.h" && ok=1 || true
            fi
            put_snippet "$tmp/snippet-original.php" "$label-remove"; helper=0
            ehttp=$(curl "${c[@]}" --location "${auth[@]}" --request DELETE --output "$tmp/$label-elementor.json" --write-out '%{http_code}' "$elementor_cache" || true)
            echo "CACHE_PURGE label=$label wp_rocket=$ok elementor_http=$ehttp"
            [[ "$ok" == 1 ]]
          }
          rollback(){
            local rc=$?; [[ "$rc" == 0 ]] && return
            echo "PHASE3C_ROLLBACK_START rc=$rc" >&2; set +e
            if [[ "$helper" == 1 ]]; then put_snippet "$tmp/snippet-original.php" rollback-helper-remove >/dev/null 2>&1 || true; helper=0; fi
            if [[ "$page_changed" == 1 ]]; then
              write_page "$tmp/original.raw" rollback-page >/dev/null 2>&1 || true
              purge rollback-purge >/dev/null 2>&1 || true
            fi
            curl "${c[@]}" --location "${auth[@]}" --output "$tmp/rb-page.json" "$page_api" >/dev/null 2>&1 || true
            curl "${c[@]}" --location "${auth[@]}" --output "$tmp/rb-snippet.json" "$snippet_api" >/dev/null 2>&1 || true
            if [[ -s "$tmp/rb-page.json" ]]; then php -r '$p=json_decode(file_get_contents($argv[1]),true);$r=(string)(($p["content"]??[])["raw"]??"");echo "ROLLBACK_PAGE hash=".hash("sha256",$r)." old_count=".substr_count($r,$argv[2]).PHP_EOL;' "$tmp/rb-page.json" "$old" || true; fi
            if [[ -s "$tmp/rb-snippet.json" ]]; then php -r '$s=json_decode(file_get_contents($argv[1]),true);$c=(string)($s["code"]??"");echo "ROLLBACK_SNIPPET hash=".hash("sha256",$c)." helper=".(strpos($c,"DoctorCura one-time cache purge helper")===false?"absent":"present").PHP_EOL;' "$tmp/rb-snippet.json" || true; fi
            echo PHASE3C_ROLLBACK_ATTEMPTED >&2
          }
          trap rollback EXIT

          echo '=== PREFLIGHT PAGE + SNIPPET + HOMEPAGE ==='
          ph=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/page.json" --write-out '%{http_code}' "$page_api"); [[ "$ph" == 200 ]]
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$r=(string)(($p["content"]??[])["raw"]??"");$link=(string)($p["link"]??"");if((int)($p["id"]??0)!==11||($p["status"]??"")!=="publish"||hash("sha256",$r)!==$argv[3]||substr_count($r,$argv[4])!==1)exit(2);file_put_contents($argv[2],$r);echo "PAGE id=11 status=publish hash=".hash("sha256",$r)." old_count=1 link=$link".PHP_EOL;' "$tmp/page.json" "$tmp/original.raw" "$expected_raw_hash" "$old"
          terms=$(php -r '$p=json_decode(file_get_contents($argv[1]),true);echo(string)($p["link"]??"");' "$tmp/page.json")
          [[ "$terms" == "$base/"* ]]

          sh=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/snippet.json" --write-out '%{http_code}' "$snippet_api"); [[ "$sh" == 200 ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if((int)($s["id"]??0)!==43||empty($s["active"])||hash("sha256",$c)!==$argv[3]||strpos($c,"DoctorCura gewichtsverlust legacy final redirect V8.4b")===false||strpos($c,"DoctorCura datenschutz root-only migration V8.4c")===false||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);file_put_contents($argv[2],$c);echo "SNIPPET hash=".hash("sha256",$c)." helper=absent".PHP_EOL;' "$tmp/snippet.json" "$tmp/snippet-original.php" "$expected_snippet_hash"

          hs=$(curl "${c[@]}" --compressed --output "$tmp/home.html" --write-out '%{http_code}' "$base/"); hcan=$(canonical_of "$tmp/home.html")
          echo "HOME status=$hs canonical=$hcan"; [[ "$hs" == 200 && "$hcan" == "$replacement" ]]

          before_status=$(curl "${c[@]}" --compressed --output "$tmp/terms-before.html" --write-out '%{http_code}' "${terms}?doctorcura_phase3c_preflight=$(date +%s%N)")
          before_can=$(canonical_of "$tmp/terms-before.html"); before_old=$(old_count "$tmp/terms-before.html")
          echo "TERMS_BEFORE status=$before_status canonical=$before_can old_count=$before_old"
          [[ "$before_status" == 200 && "$before_can" == "$terms" && "$before_old" == 1 ]]

          echo '=== BUILD EXACT ONE-STRING REPLACEMENT ==='
          python3 - "$tmp/original.raw" "$tmp/new.raw" "$old" "$replacement" <<'PY'
          import hashlib,sys
          src,dst,old,new=sys.argv[1:]
          raw=open(src,encoding='utf-8').read()
          if raw.count(old)!=1: raise SystemExit('old occurrence count changed')
          changed=raw.replace(old,new,1)
          if changed.replace(new,old,1)!=raw: raise SystemExit('roundtrip diff guard failed')
          open(dst,'w',encoding='utf-8',newline='').write(changed)
          print('NEW_RAW hash='+hashlib.sha256(changed.encode()).hexdigest()+' old_count='+str(changed.count(old)))
          PY
          new_raw_hash=$(sha256sum "$tmp/new.raw" | awk '{print $1}')

          echo '=== WRITE + READBACK ==='
          write_page "$tmp/new.raw" apply; page_changed=1
          purge apply-purge
          curl "${c[@]}" --location "${auth[@]}" --output "$tmp/after-page.json" "$page_api"
          php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$r=(string)(($p["content"]??[])["raw"]??"");$want=file_get_contents($argv[2]);if($r!==$want||hash("sha256",$r)!==$argv[3]||substr_count($r,$argv[4])!==0)exit(2);echo "PAGE_READBACK hash=".hash("sha256",$r)." old_count=0 byte_exact=yes".PHP_EOL;' "$tmp/after-page.json" "$tmp/new.raw" "$new_raw_hash" "$old"
          curl "${c[@]}" --location "${auth[@]}" --output "$tmp/after-snippet.json" "$snippet_api"
          ash=$(php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");if(strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);echo hash("sha256",$c);' "$tmp/after-snippet.json")
          echo "SNIPPET_READBACK hash=$ash helper=absent"; [[ "$ash" == "$expected_snippet_hash" ]]

          echo '=== TWO ORIGIN ROUNDS ==='
          path=$(python3 - "$terms" <<'PY'
          import sys,urllib.parse
          print(urllib.parse.urlparse(sys.argv[1]).path,end='')
          PY
          )
          for round in 1 2; do
            probe="${terms}?doctorcura_phase3c_verify=$round-$(date +%s%N)"
            status=$(curl "${c[@]}" --compressed --output "$tmp/terms-$round.html" --write-out '%{http_code}' "$probe")
            can=$(canonical_of "$tmp/terms-$round.html"); cnt=$(old_count "$tmp/terms-$round.html")
            [[ "$status" == 200 && "$can" == "$terms" && "$cnt" == 0 ]] || { echo "TERMS_VERIFY_FAIL round=$round status=$status canonical=$can old_count=$cnt" >&2; exit 1; }
            for lang in fr en; do
              lurl="$base/$lang$path"; lstatus=$(curl "${c[@]}" --compressed --output "$tmp/$lang-$round.html" --write-out '%{http_code}' "$lurl?doctorcura_phase3c_verify=$round-$lang-$(date +%s%N)"); lcnt=$(old_count "$tmp/$lang-$round.html")
              [[ "$lstatus" == 200 && "$lcnt" == 0 ]] || { echo "TRANSLATED_TERMS_FAIL round=$round lang=$lang status=$lstatus old_count=$lcnt" >&2; exit 1; }
            done
            w="$base/product-categorie/gewichtsverlust/?doctorcura_phase3c_weight=$round-$(date +%s%N)"; wh="$tmp/w-$round.h"; curl "${c[@]}" --compressed --max-redirs 0 --dump-header "$wh" --output /dev/null "$w" || true
            wcode=$(awk '/^HTTP\//{print $2;exit}' "$wh"); wloc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$wh")
            [[ "$wcode" == 301 && "$wloc" == "$base/product-category/gewichtsverlust/" ]] || exit 1
            dh="$tmp/d-$round.h"; curl "${c[@]}" --compressed --max-redirs 0 --dump-header "$dh" --output /dev/null "$base/datenschutz/?doctorcura_phase3c_datenschutz=$round-$(date +%s%N)" || true
            dcode=$(awk '/^HTTP\//{print $2;exit}' "$dh"); dloc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$dh")
            [[ "$dcode" == 301 && "$dloc" == "$base/privacy-policy/" ]] || exit 1
            dup=$(curl "${c[@]}" --location --compressed --output /dev/null --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base/welche-medikamente-beeinflussen-die-erektion-2/")
            [[ "$dup" == $'200\t'"$base/welche-medikamente-beeinflussen-die-erektion/"$'\t1' ]] || exit 1
            echo "ROUND_OK round=$round terms=green translations=green p3a=green p3b=green duplicate=green"
          done

          echo '=== CLEAN EDGE READBACK INFORMATIONAL ==='
          estatus=$(curl "${c[@]}" --compressed --output "$tmp/terms-edge.html" --write-out '%{http_code}' "$terms"); ecan=$(canonical_of "$tmp/terms-edge.html"); ecnt=$(old_count "$tmp/terms-edge.html")
          echo "EDGE_READBACK status=$estatus canonical=$ecan old_count=$ecnt"
          trap - EXIT
          if [[ "$estatus" == 200 && "$ecan" == "$terms" && "$ecnt" == 0 ]]; then
            echo "PHASE3C_ORIGIN_AND_EDGE_GREEN page_raw_hash=$new_raw_hash"
          else
            echo "PHASE3C_ORIGIN_GREEN_EDGE_CACHE_PENDING page_raw_hash=$new_raw_hash"
          fi
