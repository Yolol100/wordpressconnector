name: DoctorCura Cache Ownership Diagnostics

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-cache-routes.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect installed cache tooling read only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 2
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 40 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          tmp="$RUNNER_TEMP/dc-cache-tools"; mkdir -p "$tmp"
          code=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/plugins.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/plugins?per_page=100")
          echo "PLUGINS_HTTP=$code"
          [[ "$code" == 200 ]]
          python3 - "$tmp/plugins.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          print('PLUGIN_TOTAL='+str(len(data) if isinstance(data,list) else 0))
          for p in data if isinstance(data,list) else []:
              slug=str(p.get('plugin') or ''); name=str(p.get('name') or '')
              if any(t in (slug+' '+name).lower() for t in ['hostinger','litespeed','cache','rocket','cdn']):
                  print(f"CACHE_TOOL plugin={slug} name={name} status={p.get('status')} version={p.get('version','unknown')}")
          PY
          echo CACHE_TOOLING_READBACK_COMPLETE
