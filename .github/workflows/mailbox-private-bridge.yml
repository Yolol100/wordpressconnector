name: Mailbox Private Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  bridge:
    if: >-
      github.event.repository.private == true &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[mailbox-store]') ||
       startsWith(github.event.issue.title, '[mailbox-result]') ||
       startsWith(github.event.issue.title, '[mailbox-clear]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: https://andrewbaeten.nl
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Resolve private mailbox transport command
        id: request
        env:
          EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mailbox-private"
          rm -rf "$root"
          mkdir -p "$root"
          chmod 700 "$root"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          repository = event.get("repository") or {}
          if repository.get("private") is not True:
              raise SystemExit("mailbox private transport requires a private repository")

          issue = event.get("issue") or {}
          title = str(issue.get("title") or "")
          body = str(issue.get("body") or "")

          if title.startswith("[mailbox-store]"):
              mode = "store"
          elif title.startswith("[mailbox-result]"):
              mode = "result"
          elif title.startswith("[mailbox-clear]"):
              mode = "clear"
          else:
              raise SystemExit("unsupported mailbox transport command")

          try:
              payload = json.loads(body)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"issue body must be valid JSON: {exc}")
          if not isinstance(payload, dict):
              raise SystemExit("issue body must be a JSON object")

          request_id = payload.get("request_id")
          if not isinstance(request_id, str) or not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._-]{7,99}", request_id
          ):
              raise SystemExit("invalid request_id")

          root = Path(os.environ["RUNNER_TEMP"]) / "mailbox-private"

          if mode == "store":
              if set(payload) - {"request_id", "request", "ttl"}:
                  raise SystemExit("unsupported store payload key")
              request = payload.get("request")
              if not isinstance(request, dict):
                  raise SystemExit("request must be a JSON object")

              if "ttl" in payload:
                  ttl = payload["ttl"]
                  if isinstance(ttl, bool) or not isinstance(ttl, int):
                      raise SystemExit("ttl must be a JSON integer")
              else:
                  ttl = 3600
              if not 60 <= ttl <= 86400:
                  raise SystemExit("ttl must be 60-86400")

              store = {"request": request, "ttl": ttl}
              encoded = json.dumps(store, ensure_ascii=False, separators=(",", ":"))
              if len(encoded.encode("utf-8")) > 300000:
                  raise SystemExit("mailbox store request is too large")
              path = root / "store.json"
              path.write_text(encoded + "\n", encoding="utf-8")
              path.chmod(0o600)
          elif set(payload) != {"request_id"}:
              raise SystemExit("result/clear payload must contain only request_id")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"mode={mode}\n")
              out.write(f"request_id={request_id}\n")
          print(f"MAILBOX_PRIVATE_TRANSPORT=green mode={mode}")
          PY

      - name: Store private mailbox request
        if: steps.request.outputs.mode == 'store'
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mailbox-private"
          base="${SITE_URL%/}/wp-json/webactueel-mailbox-bridge/v1"
          audience=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$base")
          token_json=$(curl --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")
          token=$(TOKEN_JSON="$token_json" python3 -c 'import json,os; print(json.loads(os.environ["TOKEN_JSON"])["value"])')
          unset token_json
          echo "::add-mask::$token"

          response="$root/store-response.json"
          code=$(curl --silent --show-error --output "$response" --write-out '%{http_code}'             --connect-timeout 10 --max-time 60             --header 'Accept: application/json'             --header 'Content-Type: application/json'             --header "X-Webactueel-GitHub-OIDC: ${token}"             --data-binary "@$root/store.json"             "$base/requests/$REQUEST_ID")
          unset token
          [[ "$code" == 201 ]]

          python3 - "$response" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit("mailbox request store acknowledgement failed")
          print("MAILBOX_PRIVATE_STORE=green")
          PY

      - name: Redact private mailbox store issue
        if: always() && startsWith(github.event.issue.title, '[mailbox-store]')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --body '{"redacted":true}'

      - name: Read private mailbox result
        if: steps.request.outputs.mode == 'result'
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mailbox-private"
          base="${SITE_URL%/}/wp-json/webactueel-mailbox-bridge/v1"
          audience=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$base")
          token_json=$(curl --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")
          token=$(TOKEN_JSON="$token_json" python3 -c 'import json,os; print(json.loads(os.environ["TOKEN_JSON"])["value"])')
          unset token_json
          echo "::add-mask::$token"

          result="$root/result.json"
          code=$(curl --silent --show-error --output "$result" --write-out '%{http_code}'             --connect-timeout 10 --max-time 60             --header 'Accept: application/json'             --header "X-Webactueel-GitHub-OIDC: ${token}"             "$base/results/$REQUEST_ID")
          unset token
          [[ "$code" == 200 ]]

          python3 - "$result" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          if payload.get("ready") is not True or not isinstance(payload.get("result"),dict):
              raise SystemExit("mailbox result is not ready")
          print("MAILBOX_PRIVATE_RESULT=green")
          PY
          chmod 600 "$result"

      - name: Upload private mailbox result
        if: steps.request.outputs.mode == 'result'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailbox-result-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/mailbox-private/result.json
          if-no-files-found: error
          retention-days: 1

      - name: Clear private mailbox state
        if: steps.request.outputs.mode == 'clear'
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mailbox-private"
          base="${SITE_URL%/}/wp-json/webactueel-mailbox-bridge/v1"
          audience=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$base")
          token_json=$(curl --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")
          token=$(TOKEN_JSON="$token_json" python3 -c 'import json,os; print(json.loads(os.environ["TOKEN_JSON"])["value"])')
          unset token_json
          echo "::add-mask::$token"

          response="$root/clear-response.json"
          code=$(curl --silent --show-error --output "$response" --write-out '%{http_code}'             --connect-timeout 10 --max-time 60             --request DELETE             --header 'Accept: application/json'             --header "X-Webactueel-GitHub-OIDC: ${token}"             "$base/state/$REQUEST_ID")
          unset token
          [[ "$code" == 200 ]]

          python3 - "$response" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          if payload.get("ok") is not True or payload.get("cleared") is not True:
              raise SystemExit("mailbox clear acknowledgement failed")
          print("MAILBOX_PRIVATE_CLEAR=green")
          PY

      - name: Close private mailbox command
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODE: ${{ steps.request.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == result ]]; then
            message="Mailbox result is available as a private one-day workflow artifact."
          else
            message="Mailbox transport command completed."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$message"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Remove private mailbox residue
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/mailbox-private"
