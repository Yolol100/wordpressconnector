name: Audit DoctorCura Exhaustive SEO Matrix

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - 'doctorcura-audits/deep-seo-20260910-audit.mjs'
      - 'doctorcura-audits/deep-seo-20260910-gsc-urls.txt'
      - '.github/workflows/audit-doctorcura-exhaustive-matrix.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare conservative-concurrency audit copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('doctorcura-audits/deep-seo-20260910-audit.mjs').read_text()
          pairs=[
            ('mapLimit([...universe], 12, auditUrl)','mapLimit([...universe], 4, auditUrl)'),
            ('mapLimit(discoveredList, 12, auditUrl)','mapLimit(discoveredList, 4, auditUrl)'),
          ]
          for old,new in pairs:
              if src.count(old)!=1: raise SystemExit(f'expected one concurrency token: {old}')
              src=src.replace(old,new,1)
          Path('/tmp/doctorcura-final-audit.mjs').write_text(src)
          print('FINAL_AUDIT_CONCURRENCY=4')
          PY
      - name: Run exhaustive public SEO and migration audit
        run: node /tmp/doctorcura-final-audit.mjs
      - name: Publish concise summary
        if: always()
        run: |
          if [ -f doctorcura-exhaustive-summary.txt ]; then
            cat doctorcura-exhaustive-summary.txt
            {
              echo '## DoctorCura exhaustive SEO audit'
              echo '```text'
              head -n 80 doctorcura-exhaustive-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-exhaustive-seo-evidence
          path: |
            doctorcura-exhaustive-results.json
            doctorcura-exhaustive-summary.txt
            doctorcura-exhaustive-anomalies.tsv
          if-no-files-found: error
          retention-days: 7

# Phase 6 final read-only crawl; conservative concurrency=4
