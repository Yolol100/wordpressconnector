name: WPCS token-equivalent batch

on:
  push:
    branches:
      - fix/wpcs-token-safe-batch-20261019
    paths:
      - .github/workflows/connector-wpcs-safe-batch.yml

permissions:
  contents: write

jobs:
  safe-formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install exact coding standards tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formatter"
          cd "$RUNNER_TEMP/formatter"
          composer init --no-interaction --name wordpressconnector/wpcs-batch --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Generate candidate and revert all non-equivalent changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/review"
          cp -a plugin/wordpressconnector "$RUNNER_TEMP/original/wordpressconnector"
          set +e
          "$RUNNER_TEMP/formatter/vendor/bin/phpcbf" --standard=WordPress --extensions=php plugin/wordpressconnector > "$RUNNER_TEMP/review/phpcbf.log" 2>&1
          set -e
          cat > "$RUNNER_TEMP/token-guard.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function equivalentTokens(string $a, string $b): bool {
              $read = static function (string $file): array {
                  $out = array();
                  $tokens = token_get_all(file_get_contents($file));
                  foreach ($tokens as $i => $token) {
                      if (is_array($token) && in_array($token[0], array(T_WHITESPACE, T_COMMENT, T_DOC_COMMENT), true)) {
                          continue;
                      }
                      $out[] = is_array($token) ? array($token[0], $token[1]) : $token;
                  }
                  $clean = array();
                  foreach ($out as $i => $token) {
                      if (',' === $token && isset($out[$i+1]) && in_array($out[$i+1], array(')', ']'), true)) {
                          continue;
                      }
                      $clean[] = $token;
                  }
                  return $clean;
              };
              return $read($a) === $read($b);
          }
          $original = getenv('RUNNER_TEMP') . '/original/wordpressconnector';
          $current = getcwd() . '/plugin/wordpressconnector';
          // Scope this first batch to low-risk support and runtime owners.
          $approved = array(
              '/includes/Runtime/Diagnostics.php',
              '/includes/Runtime/ProcessedStore.php',
              '/includes/Runtime/Request.php',
              '/includes/Runtime/Result.php',
              '/includes/Runtime/SnapshotStore.php',
              '/includes/Support/Fingerprint.php',
              '/includes/Support/Input.php',
              '/includes/Support/Json.php',
              '/includes/Security/SitePairing.php',
          );
          $safe = array(); $reverted = array(); $unchanged = array();
          foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($original)) as $file) {
              if (!$file->isFile() || 'php' !== strtolower((string) pathinfo($file->getFilename(), PATHINFO_EXTENSION))) {
                  continue;
              }
              $relative = substr($file->getPathname(), strlen($original));
              $target = $current . $relative;
              if (! is_file($target)) {
                  throw new RuntimeException('Plugin PHP file vanished: ' . $relative);
              }
              if (hash_file('sha256', $target) === hash_file('sha256', $file->getPathname())) {
                  $unchanged[] = $relative;
                  continue;
              }
              if (! in_array($relative, $approved, true) || ! equivalentTokens($file->getPathname(), $target)) {
                  if (! copy($file->getPathname(), $target)) {
                      throw new RuntimeException('Failed to revert unsafe formatting in ' . $relative);
                  }
                  $reverted[] = $relative;
                  continue;
              }
              $safe[] = $relative;
          }
          if (count($safe) !== count($approved) || count($reverted) < 40) {
              throw new RuntimeException('Unexpected formatter selection; manual review required.');
          }
          file_put_contents(getenv('RUNNER_TEMP') . '/review/selection.json', json_encode(array(
              'commit' => getenv('GITHUB_SHA'), 'safe_count' => count($safe),
              'reverted_count' => count($reverted), 'safe' => $safe,
              'reverted' => $reverted, 'unchanged' => $unchanged
          ), JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          echo count($safe) . " token-equivalent files; " . count($reverted) . " reverted unsafe files.\n";
          PHP
          php "$RUNNER_TEMP/token-guard.php"
          find plugin/wordpressconnector -name '*.php' -type f -print0 | xargs -0 -n 1 php -l > "$RUNNER_TEMP/review/php-lint.txt"
          git diff --check
          git diff --stat -- plugin/wordpressconnector > "$RUNNER_TEMP/review/format-stat.txt"
          git diff -- plugin/wordpressconnector > "$RUNNER_TEMP/review/safe-format.diff"
          set +e
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/review/contract-results.txt" 2>&1
          contract_exit=$?
          set -e
          echo "contracts_exit=$contract_exit" >> "$RUNNER_TEMP/review/contract-results.txt"
          if [ "$contract_exit" -ne 0 ]; then
            echo "Source-dependent contract failure. No commit performed." >&2
            exit 8
          fi
      - name: Upload audited safe formatter results, even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpcs-token-safe-batch
          path: ${{ runner.temp }}/review/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit only if all contracts remain green
        if: success() && github.ref == 'refs/heads/fix/wpcs-token-safe-batch-20261019'
        shell: bash
        run: |
          set -euo pipefail
          git add -- plugin/wordpressconnector
          if git diff --cached --quiet; then
            echo "No safe formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(wpcs): token-equivalent formatting only (guarded batch)"
          git push origin HEAD:fix/wpcs-token-safe-batch-20261019
