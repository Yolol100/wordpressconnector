name: WPCS phase 4 guarded Core PluginSettings Abilities

on:
  push:
    branches:
      - fix/wpcs-phase4-safe-five-files-20261019
    paths:
      - .github/workflows/wpcs-phase4-guarded.yml
      - tests/mutation-lock-contract.php

permissions:
  contents: write

jobs:
  safe-formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install pinned WPCS formatter in temporary tools directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs-tools"
          cd "$RUNNER_TEMP/wpcs-tools"
          composer init --no-interaction --name wordpressconnector/wpcs-phase4 --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Format scoped three files and validate token identity and contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs-review/original" "$RUNNER_TEMP/wpcs-review/reports"
          targets=(
            plugin/wordpressconnector/includes/Adapters/CoreAdapter.php
            plugin/wordpressconnector/includes/Adapters/PluginSettingsAdapter.php
            plugin/wordpressconnector/includes/Adapters/AbilitiesAdapter.php
          )
          for target in "${targets[@]}"; do
            test -f "$target"
            php -l "$target"
            cp "$target" "$RUNNER_TEMP/wpcs-review/original/$(basename "$target")"
          done
          set +e
          "$RUNNER_TEMP/wpcs-tools/vendor/bin/phpcs" --standard=WordPress --report=summary "${targets[@]}" > "$RUNNER_TEMP/wpcs-review/reports/before.txt" 2>&1
          "$RUNNER_TEMP/wpcs-tools/vendor/bin/phpcbf" --standard=WordPress --sniffs=Generic.WhiteSpace.DisallowSpaceIndent "${targets[@]}" > "$RUNNER_TEMP/wpcs-review/reports/phpcbf.log" 2>&1
          fixer_exit=$?
          "$RUNNER_TEMP/wpcs-tools/vendor/bin/phpcs" --standard=WordPress --report=summary "${targets[@]}" > "$RUNNER_TEMP/wpcs-review/reports/after.txt" 2>&1
          set -e
          echo "phpcbf exit: $fixer_exit" >> "$RUNNER_TEMP/wpcs-review/reports/phpcbf.log"
          set +e
          "$RUNNER_TEMP/wpcs-tools/vendor/bin/phpcs" --standard=WordPress --report=source "${targets[@]}" > "$RUNNER_TEMP/wpcs-review/reports/sniff-sources.txt" 2>&1
          set -e
          cat > "$RUNNER_TEMP/wpcs-review/token-guard.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function meaningfulTokens(string $path): array {
              $tokens = token_get_all(file_get_contents($path));
              $kept = array();
              foreach ($tokens as $token) {
                  if (is_array($token) && in_array($token[0], array(T_WHITESPACE, T_COMMENT, T_DOC_COMMENT), true)) {
                      continue;
                  }
                  $kept[] = is_array($token) ? array($token[0], $token[1]) : $token;
              }
              $result = array();
              foreach ($kept as $i => $token) {
                  if (',' === $token && isset($kept[$i+1]) && in_array($kept[$i+1], array(')', ']'), true)) {
                      continue;
                  }
                  $result[] = $token;
              }
              return $result;
          }
          $names = array('CoreAdapter.php', 'PluginSettingsAdapter.php', 'AbilitiesAdapter.php');
          $safe = array();
          $reverted = array();
          foreach ($names as $name) {
              $relative = 'plugin/wordpressconnector/includes/Adapters/' . $name;
              $before = getenv('RUNNER_TEMP') . '/wpcs-review/original/' . $name;
              $after = getcwd() . '/' . $relative;
              $first = meaningfulTokens($before);
              $second = meaningfulTokens($after);
              if ($first !== $second) {
                  $limit = min(count($first), count($second));
                  $mismatch = $limit;
                  for ($i = 0; $i < $limit; ++$i) {
                      if ($first[$i] !== $second[$i]) { $mismatch = $i; break; }
                  }
                  echo 'Rejected meaningful change in ' . $name . ' at token ' . $mismatch . PHP_EOL;
                  if (! copy($before, $after)) {
                      throw new RuntimeException('Could not restore unsafe formatted file ' . $name);
                  }
                  $reverted[] = $relative;
                  continue;
              }
              if (hash_file('sha256', $before) !== hash_file('sha256', $after)) {
                  echo 'Token-equivalent: ' . $name . PHP_EOL;
                  $safe[] = $relative;
              }
          }
          file_put_contents(getenv('RUNNER_TEMP') . '/wpcs-review/reports/selection.json', json_encode(
              array('safe' => $safe, 'reverted' => $reverted),
              JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES
          ));
          if (count($safe) < 1) {
              throw new RuntimeException('All proposed files were unsafe; no commit permitted.');
          }
          PHP
          php "$RUNNER_TEMP/wpcs-review/token-guard.php"
          for target in "${targets[@]}"; do php -l "$target"; done
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(jq -r '.safe[]' "$RUNNER_TEMP/wpcs-review/reports/selection.json" | sort)
          test "$changed" = "$expected" || { echo "Unexpected file changes"; echo "$changed"; exit 1; }
          git diff --stat > "$RUNNER_TEMP/wpcs-review/reports/change-stat.txt"
          git diff -- plugin/wordpressconnector > "$RUNNER_TEMP/wpcs-review/reports/format.diff"
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/wpcs-review/reports/contracts.txt" 2>&1 || { tail -n 60 "$RUNNER_TEMP/wpcs-review/reports/contracts.txt"; exit 1; }
          echo "Only token-equivalent plugin files were retained; full contracts passed."
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpcs-phase4-token-reviewed
          path: ${{ runner.temp }}/wpcs-review/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit only validated formatter results
        if: success() && github.ref == 'refs/heads/fix/wpcs-phase4-safe-five-files-20261019'
        shell: bash
        run: |
          set -euo pipefail
          git add -- plugin/wordpressconnector/includes/Adapters/CoreAdapter.php plugin/wordpressconnector/includes/Adapters/PluginSettingsAdapter.php plugin/wordpressconnector/includes/Adapters/AbilitiesAdapter.php
          git diff --cached --quiet && { echo "No changes needed."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(wpcs): token-safe phase4 for Core Settings and Abilities adapters"
          git push origin HEAD:fix/wpcs-phase4-safe-five-files-20261019
