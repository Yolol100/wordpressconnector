name: One-time DoctorCura contact location inspect

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-contact-inspect/*.json'

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate legal pages and contact strings
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SITE_URL%/}" == 'https://doctorcura.com' ]]
          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-inspect"; mkdir -p "$root"
          call() {
            suffix="$1"; action="$2"; payload="$3"
            python3 - "$root/r-$suffix.json" "$action" "$payload" <<'PY'
          import json,sys,uuid
          path,action,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':'dc-inspect-'+uuid.uuid4().hex[:20],'action':action,'dry_run':True,'confirm':False,'payload':json.loads(payload)},open(path,'w'),separators=(',',':'))
          PY
            code=$(curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute")
            [[ "$code" == '200' ]]
          }
          call pages post.list '{"post_type":"page","status":"publish","per_page":100,"page":1}'
          call templates post.list '{"post_type":"elementor_library","status":"any","per_page":100,"page":1}'
          python3 - "$root/o-pages.json" "$root/o-templates.json" <<'PY'
          import json,sys
          for label,path in [('PAGE',sys.argv[1]),('TEMPLATE',sys.argv[2])]:
              d=json.load(open(path))
              items=(d.get('data') or {}).get('items',[])
              print(label+'_COUNT',len(items))
              for x in items:
                  print(label, x.get('id'), repr(x.get('slug')), repr(x.get('title')), repr(x.get('status')))
          PY
