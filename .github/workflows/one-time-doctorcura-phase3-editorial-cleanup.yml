name: One-time DoctorCura phase 3 editorial cleanup

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-phase3-editorial-cleanup/*.json'

permissions:
  contents: read

concurrency:
  group: doctorcura-phase3-editorial-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - group: a
            ids: '900050 6037 6035 6018 6001'
          - group: b
            ids: '5997 5988 5984 5926 5920'
          - group: c
            ids: '5902 5900 5866'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
      IDS: ${{ matrix.ids }}
      GROUP: ${{ matrix.group }}
    steps:
      - name: Checkout exact cleanup helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preflight dry-run apply and readback batch
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || { echo 'Unexpected target' >&2; exit 1; }
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-phase3-$GROUP"; rm -rf "$root"; mkdir -p "$root/before" "$root/yb" "$root/after" "$root/ya" "$root/p" "$root/y" "$root/dry" "$root/write"
          call(){
            suffix="$1"; action="$2"; dry="$3"; confirm="$4"; payload="$5"
            python3 - "$root/r-$suffix.json" "$action" "$dry" "$confirm" "$payload" <<'PY'
          import json,sys,uuid
          out,action,dry,confirm,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':'dc-p3-'+uuid.uuid4().hex[:20],'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':json.load(open(payload,encoding='utf-8'))},open(out,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            for n in $(seq 1 8); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 150 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute" || true)
              if [[ "$code" == 200 ]] && python3 - "$root/o-$suffix.json" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') else 1)
          PY
              then return 0; fi
              [[ "$code" == 000 || "$code" == 429 || "$code" == 503 ]] && { echo "RETRY $n action=$action HTTP=$code"; sleep 12; continue; }
              echo "ACTION_FAIL action=$action HTTP=$code" >&2; cat "$root/o-$suffix.json" >&2 || true; return 1
            done
            return 1
          }

          health_ok=0
          for n in $(seq 1 8); do
            hc=$(curl -sS -L --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -o "$root/health.json" -w '%{http_code}' "$base/health" || true)
            [[ "$hc" == 200 ]] && { health_ok=1; break; }
            sleep 12
          done
          [[ "$health_ok" == 1 ]] || { echo 'HEALTH_UNAVAILABLE' >&2; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok') and d.get('transport')=='rest',d
          print('PHASE3_HEALTH_OK version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          for id in $IDS; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "b-$id" post.get true false "$root/id.json"; cp "$root/o-b-$id.json" "$root/before/$id.json"
            call "yb-$id" yoast.inspect true false "$root/id.json"; cp "$root/o-yb-$id.json" "$root/yb/$id.json"
          done

          python3 scripts/doctorcura_phase3_editorial_cleanup.py "$root" $IDS

          # Every planned post write must pass dry-run before this batch mutates production.
          for id in $IDS; do
            call "dry-post-$id" post.update true false "$root/p/$id.json"; cp "$root/o-dry-post-$id.json" "$root/dry/post-$id.json"
            if python3 - "$root/y/$id.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          raise SystemExit(0 if (d.get('fields') or {}) else 1)
          PY
            then
              call "dry-yoast-$id" yoast.update true false "$root/y/$id.json"; cp "$root/o-dry-yoast-$id.json" "$root/dry/yoast-$id.json"
            fi
          done
          echo "PHASE3_BATCH_DRYRUN_OK group=$GROUP ids=$IDS"

          # Apply exactly the dry-run-approved batch.
          for id in $IDS; do
            call "write-post-$id" post.update false true "$root/p/$id.json"; cp "$root/o-write-post-$id.json" "$root/write/post-$id.json"
            if python3 - "$root/y/$id.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          raise SystemExit(0 if (d.get('fields') or {}) else 1)
          PY
            then
              call "write-yoast-$id" yoast.update false true "$root/y/$id.json"; cp "$root/o-write-yoast-$id.json" "$root/write/yoast-$id.json"
            fi
          done
          printf '{}' > "$root/empty.json"; call cache cache.flush false true "$root/empty.json" || true

          # Exact production readback.
          for id in $IDS; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "a-$id" post.get true false "$root/id.json"; cp "$root/o-a-$id.json" "$root/after/$id.json"
            call "ya-$id" yoast.inspect true false "$root/id.json"; cp "$root/o-ya-$id.json" "$root/ya/$id.json"
          done

          python3 - "$root" $IDS <<'PY'
          import json,os,re,sys
          root=sys.argv[1]; ids=[int(x) for x in sys.argv[2:]]
          exp=json.load(open(root+'/expected.json',encoding='utf-8'))
          for pid in ids:
              b=(json.load(open(f'{root}/before/{pid}.json',encoding='utf-8')).get('data') or {}).get('post') or {}
              a=(json.load(open(f'{root}/after/{pid}.json',encoding='utf-8')).get('data') or {}).get('post') or {}
              e=exp[str(pid)]
              if a.get('status')!=e['status'] or b.get('status')!=e['status']: raise SystemExit(f'STATUS_DRIFT {pid}')
              if a.get('title')!=e['new_title']: raise SystemExit(f'TITLE_READBACK_FAIL {pid}')
              if a.get('excerpt')!=e['new_excerpt']: raise SystemExit(f'EXCERPT_READBACK_FAIL {pid}')
              if a.get('content')!=e['content']: raise SystemExit(f'CONTENT_READBACK_FAIL {pid}')
              links=re.findall(r'href=["\']([^"\']+)',a.get('content') or '',re.I)
              if links!=e['links']: raise SystemExit(f'LINK_DRIFT {pid}')
              y=(json.load(open(f'{root}/ya/{pid}.json',encoding='utf-8')).get('data') or {}).get('fields') or {}
              for k,v in e['yoast_fields'].items():
                  if y.get(k)!=v: raise SystemExit(f'YOAST_READBACK_FAIL {pid} {k}')
          print('PHASE3_BATCH_READBACK_OK group='+os.environ.get('GROUP','')+' ids='+','.join(map(str,ids)))
          PY

          # Public rendered smoke for every mutated target in this batch.
          for id in $IDS; do
            url=$(python3 - "$root/after/$id.json" "$site" <<'PY'
          import json,sys,urllib.parse
          p=(json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('post') or {}
          print(p.get('link') or urllib.parse.urljoin(sys.argv[2]+'/',str(p.get('slug') or '')+'/'))
          PY
            )
            ok=0
            for n in $(seq 1 5); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 DoctorCuraPhase3QA' -o "$root/render-$id.html" -w '%{http_code}' "$url" || true)
              [[ "$code" == 200 ]] && { ok=1; break; }
              sleep 8
            done
            [[ "$ok" == 1 ]] || { echo "RENDER_FAIL id=$id HTTP=$code" >&2; exit 1; }
          done
          echo "PHASE3_BATCH_COMPLETE group=$GROUP ids=$IDS"
