name: DoctorCura Phase 3C Elementor Isolation

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-phase3c-elementor-isolation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Run in-memory content filter isolation and restore snippet
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/code-snippets/v1/snippets/43"; tmp="$RUNNER_TEMP/p3c-elementor"; mkdir -p "$tmp"
          baseline='939d9bc10b33e053c1c668b58f13491b2ac6a87c9673bd9ae76ade739bc77c40'
          marker='DoctorCura one-time Elementor isolation diagnostic'; token=$(openssl rand -hex 24); helper=0
          make_payload(){ php -r '$c=file_get_contents($argv[1]);file_put_contents($argv[2],json_encode(["code"=>$c,"active"=>true],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));' "$1" "$2"; }
          put(){ local src="$1" label="$2" http; make_payload "$src" "$tmp/$label.json"; http=$(curl "${c[@]}" --location "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$tmp/$label.json" --output "$tmp/$label-out.json" --write-out '%{http_code}' "$api"); [[ "$http" == 200 ]]; }
          cleanup(){ local rc=$?; set +e; if [[ "$helper" == 1 ]]; then put "$tmp/original.php" cleanup >/dev/null 2>&1 || true; fi; curl "${c[@]}" --location "${auth[@]}" --output "$tmp/rb.json" "$api" >/dev/null 2>&1 || true; if [[ -s "$tmp/rb.json" ]]; then php -r '$s=json_decode(file_get_contents($argv[1]),true);$c=(string)($s["code"]??"");echo "FINAL hash=".hash("sha256",$c)." marker=".(strpos($c,$argv[2])===false?"absent":"present").PHP_EOL;' "$tmp/rb.json" "$marker"; fi; exit "$rc"; }
          trap cleanup EXIT
          curl "${c[@]}" --location "${auth[@]}" --output "$tmp/current.json" "$api"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$code=(string)($s["code"]??"");if(hash("sha256",$code)!==$argv[3]||strpos($code,$argv[4])!==false)exit(2);file_put_contents($argv[2],$code);' "$tmp/current.json" "$tmp/original.php" "$baseline" "$marker"
          cp "$tmp/original.php" "$tmp/helper.php"
          cat >> "$tmp/helper.php" <<PHP

          /* DoctorCura one-time Elementor isolation diagnostic */
          add_action( 'template_redirect', function () {
              if ( ! isset( \$_GET['doctorcura_elementor_isolation'] ) || ! hash_equals( '$token', (string) \$_GET['doctorcura_elementor_isolation'] ) ) return;
              if ( ! is_page( 11 ) ) wp_send_json( array( 'error' => 'wrong-page' ), 409 );
              \$old = 'http://www.doctorcura.com'; \$new = 'https://doctorcura.com/';
              \$raw = (string) get_post_field( 'post_content', 11, 'raw' );
              \$test = str_replace( \$old, \$new, \$raw, \$n );
              \$result = array( 'input_old' => substr_count( \$test, \$old ), 'input_new' => substr_count( \$test, \$new ), 'replace_count' => \$n );
              \$full = apply_filters( 'the_content', \$test );
              \$result['full_old'] = substr_count( \$full, \$old ); \$result['full_new'] = substr_count( \$full, \$new );
              global \$wp_filter; \$removed = array();
              if ( isset( \$wp_filter['the_content'] ) && is_object( \$wp_filter['the_content'] ) && isset( \$wp_filter['the_content']->callbacks ) ) {
                  foreach ( \$wp_filter['the_content']->callbacks as \$priority => \$callbacks ) {
                      foreach ( \$callbacks as \$cb ) {
                          \$fn = \$cb['function'] ?? null; \$name = '';
                          if ( is_array( \$fn ) && count( \$fn ) >= 2 ) \$name = ( is_object( \$fn[0] ) ? get_class( \$fn[0] ) : (string) \$fn[0] ) . '::' . (string) \$fn[1];
                          if ( false !== strpos( \$name, 'Elementor\\Frontend::apply_builder_in_content' ) || false !== strpos( \$name, 'ElementorPro\\Modules\\ThemeBuilder\\Classes\\Locations_Manager::builder_wrapper' ) ) {
                              remove_filter( 'the_content', \$fn, \$priority ); \$removed[] = array( \$fn, \$priority, \$name );
                          }
                      }
                  }
              }
              \$without = apply_filters( 'the_content', \$test );
              \$result['without_elementor_old'] = substr_count( \$without, \$old ); \$result['without_elementor_new'] = substr_count( \$without, \$new );
              \$result['removed'] = array_map( function( \$r ){ return array( 'priority' => \$r[1], 'name' => \$r[2] ); }, \$removed );
              foreach ( \$removed as \$r ) add_filter( 'the_content', \$r[0], \$r[1] );
              wp_send_json( \$result );
          }, 0 );
          PHP
          put "$tmp/helper.php" install; helper=1
          curl "${c[@]}" --compressed --output "$tmp/result.json" "$base/geschaftsbedingungen/?doctorcura_elementor_isolation=$token"
          python3 - "$tmp/result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('ISOLATION '+json.dumps(d,separators=(',',':')))
          PY
          put "$tmp/original.php" remove; helper=0
          curl "${c[@]}" --location "${auth[@]}" --output "$tmp/final.json" "$api"
          php -r '$s=json_decode(file_get_contents($argv[1]),true);$c=(string)($s["code"]??"");if(hash("sha256",$c)!==$argv[3]||strpos($c,$argv[2])!==false)exit(2);echo "FINAL hash=".hash("sha256",$c)." marker=absent".PHP_EOL;' "$tmp/final.json" "$marker" "$baseline"
          trap - EXIT
          echo PHASE3C_ELEMENTOR_ISOLATION_COMPLETE
