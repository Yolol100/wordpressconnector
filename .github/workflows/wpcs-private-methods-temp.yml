# Temporary one-time refactor, delete before PR. No production contact.
name: Temporary WPCS Private Method Candidate
on:
  push:
    branches:
      - fix/wpcs-private-methods-20261115
permissions:
  contents: write
jobs:
  private-only:
    if: >-
      github.repository == 'Yolol100/wordpressconnector' &&
      !startsWith(github.event.head_commit.message, 'style(wpcs): rename isolated private-only method symbols')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/wpcs-private-methods-20261115
          persist-credentials: true
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xmlreader, xml, dom
          coverage: none
      - name: Generate private-only patch and verify PHP contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Yolol100/wordpressconnector'
          test "$GITHUB_REF" = 'refs/heads/fix/wpcs-private-methods-20261115'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          tools_dir="$RUNNER_TEMP/wpcs-method-tools"
          mkdir -p "$tools_dir"
          cat > "$tools_dir/composer.json" <<'JSON'
          {"name":"webactueel/wpcs-private-methods-audit","require-dev":{"squizlabs/php_codesniffer":"3.13.6","wp-coding-standards/wpcs":"3.4.1"},"config":{"allow-plugins":{"dealerdirect/phpcodesniffer-composer-installer":true}}}
          JSON
          composer install --working-dir="$tools_dir" --prefer-dist --no-interaction --no-progress
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/before.json" || true
          python3 scripts/wpcs-private-methods-temp.py plugin/wordpressconnector > "$RUNNER_TEMP/private-methods.log"
          tail -n 4 "$RUNNER_TEMP/private-methods.log"
          php <<'PHP'
          <?php
          $paths=trim((string)shell_exec('git diff --name-only -- plugin/wordpressconnector'));
          if($paths==='')throw new RuntimeException('No private method source changes');
          foreach(explode("\n",$paths) as $path){
            if(!preg_match('~^plugin/wordpressconnector/[a-zA-Z0-9/_-]+\.php$~D',$path))throw new RuntimeException('Unexpected path');
            $before=shell_exec('git show HEAD:'.escapeshellarg($path));
            $after=file_get_contents($path);
            if(!is_string($before)||!is_string($after))throw new RuntimeException('Missing source');
            $normalized=function($src){
              $out=[];
              foreach(token_get_all($src,TOKEN_PARSE) as $tok) {
                if(is_array($tok)){
                  if(in_array($tok[0],[T_WHITESPACE,T_COMMENT,T_DOC_COMMENT],true))continue;
                  $out[]=[$tok[0],$tok[1]];
                }else $out[]=$tok;
              }
              return $out;
            };
            $old=$normalized($before);$new=$normalized($after);
            if(count($old)!==count($new))throw new RuntimeException('Token count changed '.$path);
            foreach($old as $i=>$token){
              $other=$new[$i];
              if(!is_array($token)||!is_array($other)){
                if($token!==$other)throw new RuntimeException('Symbol changed '.$path);
                continue;
              }
              if($token[0]!==$other[0])throw new RuntimeException('Token type changed '.$path);
              if($token[1]===$other[1])continue;
              if($token[0]!==T_STRING)throw new RuntimeException('Only method T_STRING tokens may change '.$path);
              $name=preg_replace('/([A-Z]+)([A-Z][a-z])/','$1_$2',$token[1]);
              $name=preg_replace('/([a-z0-9])([A-Z])/','$1_$2',$name);
              if(strtolower($name)!==$other[1])throw new RuntimeException('Unexpected method identifier rename '.$path);
            }
          }
          echo "Private-only method token parity verified.\n";
          PHP
          find plugin/wordpressconnector -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/lint.log"
          git add plugin/wordpressconnector
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(wpcs): rename isolated private-only method symbols'
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1 || { tail -n 70 "$RUNNER_TEMP/contracts.log"; exit 1; }
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/after.json" || true
          python3 - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" <<'PY'
          import sys,json
          a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]))
          print('WPCS_PRIVATE_METHODS_BEFORE',a['totals'],'AFTER',b['totals'],'files',len(b['files']))
          assert len(b['files'])==57
          assert a['totals']['errors']==1737
          assert b['totals']['errors']<=a['totals']['errors']-100
          assert b['totals']['warnings']<=a['totals']['warnings']
          PY
          git push origin 'HEAD:refs/heads/fix/wpcs-private-methods-20261115'
          echo "verified_sha=$(git rev-parse HEAD)"

      - name: Archive one-time source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: temporary-wpcs-private-methods-evidence
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/contracts.log
            ${{ runner.temp }}/private-methods.log
            ${{ runner.temp }}/lint.log
          retention-days: 1
