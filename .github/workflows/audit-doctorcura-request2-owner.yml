name: DoctorCura FR Request-2 Owner Proof

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-request2-owner.yml'

permissions:
  contents: read

jobs:
  owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect current page owner, hreflang and redirect records read only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          tmp="$RUNNER_TEMP/dc-request2-owner"; mkdir -p "$tmp"

          curl "${c[@]}" --location "${auth[@]}" "$base/wp-json/code-snippets/v1/snippets/43" > "$tmp/s43.json"
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");echo "SNIPPET id=".(int)($s["id"]??0)." active=".(!empty($s["active"])?"yes":"no")." hash=".hash("sha256",$c)." v84e=".substr_count($c,"DoctorCura GSC-proven legacy category redirects V8.4e")." helper=".substr_count($c,"DoctorCura one-time cache purge helper").PHP_EOL;if(hash("sha256",$c)!=="85f7ba66ed973660925a865279244be844c952a534fb34a06bf1cfa56c6267b3"||substr_count($c,"DoctorCura GSC-proven legacy category redirects V8.4e")!==1||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);' "$tmp/s43.json"

          for slug in anfrage-1 anfrage-2 request-1 request-2; do
            out="$tmp/page-$slug.json"
            code=$(curl "${c[@]}" --location "${auth[@]}" --get --data-urlencode "slug=$slug" --data-urlencode 'context=edit' --data-urlencode 'per_page=20' --output "$out" --write-out '%{http_code}' "$base/wp-json/wp/v2/pages")
            echo "PAGE_QUERY slug=$slug http=$code"
            [[ "$code" == 200 ]]
            php -r '$a=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);foreach($a as $p){echo "PAGE slug=".(string)($p["slug"]??"")." id=".(int)($p["id"]??0)." status=".(string)($p["status"]??"")." parent=".(int)($p["parent"]??0)." modified=".(string)($p["modified_gmt"]??"")." link=".(string)($p["link"]??"")." title=".trim(strip_tags((string)(($p["title"]["raw"]??$p["title"]["rendered"]??"")))).PHP_EOL;}' "$out"
          done

          curl "${c[@]}" --location "${auth[@]}" --get --data-urlencode 'search=Request' --data-urlencode 'context=edit' --data-urlencode 'per_page=100' "$base/wp-json/wp/v2/pages" > "$tmp/search-request.json"
          curl "${c[@]}" --location "${auth[@]}" --get --data-urlencode 'search=Anfrage' --data-urlencode 'context=edit' --data-urlencode 'per_page=100' "$base/wp-json/wp/v2/pages" > "$tmp/search-anfrage.json"
          php -r 'foreach(["request"=>$argv[1],"anfrage"=>$argv[2]] as $q=>$f){$a=json_decode(file_get_contents($f),true);echo "SEARCH term=$q count=".count($a).PHP_EOL;foreach($a as $p){echo "SEARCH_PAGE term=$q id=".(int)($p["id"]??0)." slug=".(string)($p["slug"]??"")." status=".(string)($p["status"]??"")." link=".(string)($p["link"]??"").PHP_EOL;}}' "$tmp/search-request.json" "$tmp/search-anfrage.json"

          for q in request-2 anfrage-2; do
            out="$tmp/redir-$q.json"
            code=$(curl "${c[@]}" --location "${auth[@]}" --get --data-urlencode "filterBy[url]=$q" --data-urlencode 'per_page=100' --output "$out" --write-out '%{http_code}' "$base/wp-json/redirection/v1/redirect")
            echo "REDIRECTION_QUERY term=$q http=$code"
            [[ "$code" == 200 ]]
            php -r '$d=json_decode(file_get_contents($argv[1]),true);$items=is_array($d)&&isset($d["items"])&&is_array($d["items"])?$d["items"]:[];echo "REDIRECTION term=".$argv[2]." count=".count($items).PHP_EOL;foreach($items as $r){echo "REDIRECT id=".(int)($r["id"]??0)." status=".(string)($r["status"]??"")." source=".(string)($r["url"]??"")." target=".(string)(($r["action_data"]["url"]??$r["action_data"]??"")).PHP_EOL;}' "$out" "$q"
          done

          for path in /anfrage-2/ /fr/anfrage-2/ /en/anfrage-2/ /fr/request-2/; do
            key=$(echo "$path" | tr '/-' '__'); h="$tmp/$key.h"; b="$tmp/$key.html"
            code=$(curl "${c[@]}" --compressed --max-redirs 0 --dump-header "$h" --output "$b" --write-out '%{http_code}' "$base$path")
            echo "PUBLIC path=$path code=$code bytes=$(wc -c < "$b")"
            if [[ "$code" == 200 ]]; then
              python3 - "$b" "$path" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); path=sys.argv[2]
          title=''; m=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
          if m: title=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>','',m.group(1)))).strip()
          can=''; tags=[]
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
              rel=re.search(r'rel=["\']([^"\']+)',tag,re.I); href=re.search(r'href=["\']([^"\']+)',tag,re.I); lang=re.search(r'hreflang=["\']([^"\']+)',tag,re.I)
              if rel and href and 'canonical' in rel.group(1).lower(): can=html.unescape(href.group(1))
              if lang and href: tags.append((lang.group(1),html.unescape(href.group(1))))
          print(f"HTML path={path} title={title} canonical={can} hreflang_count={len(tags)}")
          for l,u in tags: print(f"HREFLANG path={path} lang={l} href={u}")
          PY
            fi
          done

          id=$(php -r '$a=json_decode(file_get_contents($argv[1]),true);echo (int)($a[0]["id"]??0);' "$tmp/page-anfrage-2.json")
          echo "ANFRAGE2_ID=$id"
          if [[ "$id" -gt 0 ]]; then
            rh=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/revisions.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/pages/$id/revisions?context=edit&per_page=100")
            echo "REVISIONS_HTTP=$rh"
            if [[ "$rh" == 200 ]]; then
              php -r '$a=json_decode(file_get_contents($argv[1]),true);echo "REVISIONS count=".count($a).PHP_EOL;foreach($a as $r){$t=trim(strip_tags((string)(($r["title"]["raw"]??$r["title"]["rendered"]??""))));echo "REV id=".(int)($r["id"]??0)." date=".(string)($r["date_gmt"]??"")." modified=".(string)($r["modified_gmt"]??"")." slug=".(string)($r["slug"]??"")." title=$t".PHP_EOL;}' "$tmp/revisions.json"
            fi
          fi
          echo REQUEST2_OWNER_PROOF_COMPLETE
