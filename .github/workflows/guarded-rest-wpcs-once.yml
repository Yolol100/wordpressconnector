name: Guarded REST WPCS whitespace cleanup
on:
  push:
    branches:
      - fix/release-risk-triage-sql-contract-20261019
    paths:
      - .github/workflows/guarded-rest-wpcs-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install pinned official WPCS tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs"
          cd "$RUNNER_TEMP/wpcs"
          composer init --no-interaction --name wordpressconnector/rest-style --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Apply only token-parity and full-contract-safe REST formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/release-risk-triage-sql-contract-20261019
          mkdir -p "$RUNNER_TEMP/rest-format"
          cat > "$RUNNER_TEMP/rest-format/compare.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function tokens(string $file): array {
            $src=file_get_contents($file);
            if (!is_string($src)) throw new RuntimeException('Unreadable source');
            $out=array();
            foreach(token_get_all($src) as $tok) {
              if(is_array($tok) && T_WHITESPACE === $tok[0]) continue;
              $out[]=is_array($tok) ? array($tok[0],$tok[1]) : $tok;
            }
            return $out;
          }
          if(tokens($argv[1])!==tokens($argv[2])) {
            fwrite(STDERR, "Meaningful PHP token or comment changed\n");
            exit(1);
          }
          PHP
          bin="$RUNNER_TEMP/wpcs/vendor/bin"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          accepted=0
          for file in plugin/wordpressconnector/includes/REST/AssetStore.php plugin/wordpressconnector/includes/REST/Controller.php; do
            name="$(basename "$file" .php)"
            old="$RUNNER_TEMP/rest-format/$name.old.php"
            cp "$file" "$old"
            "$bin/phpcs" --standard=WordPress --report=json "$file" > "$RUNNER_TEMP/rest-format/$name.before.json" 2>/dev/null || true
            pass=0
            for sniffs in 'Generic.WhiteSpace,WordPress.WhiteSpace' 'Generic.WhiteSpace.DisallowSpaceIndent'; do
              cp "$old" "$file"
              "$bin/phpcbf" --standard=WordPress --sniffs="$sniffs" "$file" > "$RUNNER_TEMP/rest-format/$name.fix.txt" 2>&1 || true
              if ! php "$RUNNER_TEMP/rest-format/compare.php" "$old" "$file" > "$RUNNER_TEMP/rest-format/$name.parity.txt" 2>&1; then continue; fi
              if ! php -l "$file" >/dev/null 2>&1 || ! git diff --check -- "$file"; then continue; fi
              "$bin/phpcs" --standard=WordPress --report=json "$file" > "$RUNNER_TEMP/rest-format/$name.after.json" 2>/dev/null || true
              before="$(jq -r '.totals.errors' "$RUNNER_TEMP/rest-format/$name.before.json")"
              after="$(jq -r '.totals.errors' "$RUNNER_TEMP/rest-format/$name.after.json")"
              if test "$after" -ge "$before"; then continue; fi
              if ! bash scripts/run-contracts.sh > "$RUNNER_TEMP/rest-format/$name.contracts.log" 2>&1; then continue; fi
              pass=1
              echo "$name ACCEPT WPCS $before -> $after" >> "$RUNNER_TEMP/rest-format/decisions.txt"
              break
            done
            if test "$pass" -ne 1; then
              cp "$old" "$file"
              echo "$name REJECT token or contract gate" >> "$RUNNER_TEMP/rest-format/decisions.txt"
              continue
            fi
            git add -- "$file"
            git diff --cached --check
            git commit -m "style(wpcs): token-identical REST whitespace for $name"
            accepted=$((accepted+1))
          done
          "$bin/phpcs" --standard=WordPress --report=summary --extensions=php plugin/wordpressconnector > "$RUNNER_TEMP/rest-format/full-after.txt" 2>&1 || true
          echo "accepted=$accepted" > "$RUNNER_TEMP/rest-format/summary.txt"
          if test "$accepted" -gt 0; then git push origin HEAD:fix/release-risk-triage-sql-contract-20261019; fi
      - name: Save reproducible token and contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rest-wpcs-evidence
          path: ${{ runner.temp }}/rest-format/
          retention-days: 7
          if-no-files-found: warn
