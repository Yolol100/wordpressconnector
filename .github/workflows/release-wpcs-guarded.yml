name: Guarded WPCS release cleanup
# Third and final bounded pass after fixing the public CSS contract's exact spacing assumption.
on:
  push:
    branches: [fix/release-readiness-guarded-wpcs-20261019]
    paths: [.github/workflows/release-wpcs-guarded.yml]
permissions:
  contents: write
jobs:
  clean-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install pinned WordPress Coding Standards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs"
          cd "$RUNNER_TEMP/wpcs"
          composer init --no-interaction --name wordpressconnector/formatter --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Apply token-identical changes with four-file test gates
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/release-readiness-guarded-wpcs-20261019'
          mkdir -p "$RUNNER_TEMP/wpcs-proof/original" "$RUNNER_TEMP/wpcs-proof/reports"
          cat > "$RUNNER_TEMP/wpcs-proof/compare.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function meaningfulTokens(string $file): array {
              $source = file_get_contents($file);
              if (!is_string($source)) { throw new RuntimeException('Unreadable PHP'); }
              $result = array();
              foreach (token_get_all($source) as $token) {
                  if (is_array($token) && T_WHITESPACE === $token[0]) { continue; }
                  $result[] = is_array($token) ? array($token[0], $token[1]) : $token;
              }
              return $result;
          }
          if (meaningfulTokens($argv[1]) !== meaningfulTokens($argv[2])) {
              fwrite(STDERR, 'PHP tokens, comments or literal content changed' . PHP_EOL);
              exit(1);
          }
          PHP
          scanner="$RUNNER_TEMP/wpcs/vendor/bin/phpcs"
          fixer="$RUNNER_TEMP/wpcs/vendor/bin/phpcbf"
          "$scanner" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/wpcs-proof/reports/before.txt" 2>&1 || true
          mapfile -d '' -t files < <(find plugin/wordpressconnector -type f -name '*.php' -print0 | sort -z)
          test "${#files[@]}" -eq 57
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          accepted=0
          rejected=0
          skipped=0
          batch_number=0
          batch=()
          format_file() {
            local file="$1"
            local original="$RUNNER_TEMP/wpcs-proof/original/$file"
            local profile rc
            mkdir -p "$(dirname "$original")"
            cp "$file" "$original"
            for profile in full whitespace indent; do
              cp "$original" "$file"
              set +e
              case "$profile" in
                full) "$fixer" --standard=WordPress "$file" > "$RUNNER_TEMP/wpcs-proof/reports/formatter-last.txt" 2>&1 ;;
                whitespace) "$fixer" --standard=WordPress --sniffs=Generic.WhiteSpace,WordPress.WhiteSpace "$file" > "$RUNNER_TEMP/wpcs-proof/reports/formatter-last.txt" 2>&1 ;;
                indent) "$fixer" --standard=WordPress --sniffs=Generic.WhiteSpace.DisallowSpaceIndent "$file" > "$RUNNER_TEMP/wpcs-proof/reports/formatter-last.txt" 2>&1 ;;
              esac
              rc=$?
              set -e
              if test "$rc" -gt 2; then continue; fi
              sed -i -E 's/[[:blank:]]+$//' "$file"
              if ! php "$RUNNER_TEMP/wpcs-proof/compare.php" "$original" "$file" >/dev/null 2>&1; then continue; fi
              if ! php -l "$file" >/dev/null 2>&1; then continue; fi
              if ! git diff --check -- "$file" >/dev/null 2>&1; then continue; fi
              if cmp -s "$original" "$file"; then
                skipped=$((skipped+1))
                echo "$file NO_CHANGE" >> "$RUNNER_TEMP/wpcs-proof/reports/selection.txt"
              else
                batch+=("$file")
                echo "$file CANDIDATE=$profile" >> "$RUNNER_TEMP/wpcs-proof/reports/selection.txt"
              fi
              return 0
            done
            cp "$original" "$file"
            rejected=$((rejected+1))
            echo "$file REJECTED token guard" >> "$RUNNER_TEMP/wpcs-proof/reports/selection.txt"
          }
          flush_batch() {
            test "${#batch[@]}" -gt 0 || return 0
            batch_number=$((batch_number+1))
            if bash scripts/run-contracts.sh > "$RUNNER_TEMP/wpcs-proof/reports/contracts-$batch_number.log" 2>&1; then
              git add -- "${batch[@]}"
              git diff --cached --check
              git commit -m "style(wpcs): token-identical formatting batch $batch_number"
              accepted=$((accepted+${#batch[@]}))
              echo "batch=$batch_number accepted=${#batch[@]}" >> "$RUNNER_TEMP/wpcs-proof/reports/batches.txt"
            else
              echo "batch=$batch_number rejected: contract regression" >> "$RUNNER_TEMP/wpcs-proof/reports/batches.txt"
              # Restore the entire group; no regression reaches git.
              for file in "${batch[@]}"; do
                cp "$RUNNER_TEMP/wpcs-proof/original/$file" "$file"
                rejected=$((rejected+1))
              done
            fi
            batch=()
          }
          for file in "${files[@]}"; do
            format_file "$file"
            if test "${#batch[@]}" -ge 4; then flush_batch; fi
          done
          flush_batch
          "$scanner" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/wpcs-proof/reports/after.txt" 2>&1 || true
          git log -25 --oneline > "$RUNNER_TEMP/wpcs-proof/reports/commits.txt"
          echo "accepted=$accepted rejected=$rejected skipped=$skipped" | tee "$RUNNER_TEMP/wpcs-proof/reports/counts.txt"
          git diff --check
          if test "$accepted" -gt 0; then
            git push origin HEAD:fix/release-readiness-guarded-wpcs-20261019
          fi
      - name: Upload all decisions and full WPCS before-after summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guarded-release-wpcs-formatting
          path: ${{ runner.temp }}/wpcs-proof/reports/
          retention-days: 14
          if-no-files-found: warn
