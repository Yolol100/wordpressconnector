name: Temporary DoctorCura Legacy URL Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-redirection-inspect.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Verify rollback and historical URL state
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/redirection/v1/redirect"
          for source in '/fr/product-categorie/sexual-problems/' '/product-categorie/sexual-problems/'; do
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "filterBy[url]=$source" --data-urlencode 'per_page=20' "$api" > "$RUNNER_TEMP/rule.json"
            total=$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);echo(int)($d["total"]??0);' "$RUNNER_TEMP/rule.json")
            echo "RULE source=$source total=$total"
            [[ "$total" == '0' ]] || exit 1
          done

          curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 "$base/product_cat-sitemap.xml" > "$RUNNER_TEMP/product-cat.xml"
          echo 'MENSTRUATION_SITEMAP_MATCHES:'
          grep -Eo '<loc>[^<]*[Mm]enstru[^<]*' "$RUNNER_TEMP/product-cat.xml" | sed 's#<loc>##' || true
          echo 'SEXUAL_SITEMAP_MATCHES:'
          grep -Eo '<loc>[^<]*(sex|Sex|sexuell)[^<]*' "$RUNNER_TEMP/product-cat.xml" | sed 's#<loc>##' || true

          check(){
            local path="$1" label="$2" hdr="$RUNNER_TEMP/$2.h" body="$RUNNER_TEMP/$2.b" out location canonical hcdn gt
            out=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output "$body" --dump-header "$hdr" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base$path")
            location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$hdr" || true)
            canonical=$(grep -Eio '<link[^>]+rel="canonical"[^>]+href="[^"]+"' "$body" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true)
            if [[ -z "$canonical" ]]; then canonical=$(grep -Eio '<link[^>]+href="[^"]+"[^>]+rel="canonical"' "$body" | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p' || true); fi
            hcdn=$(awk 'BEGIN{IGNORECASE=1}/^x-hcdn-cache-status:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$hdr" || true)
            gt=$(awk 'BEGIN{IGNORECASE=1}/^x-gt-/{gsub(/\r/,"");printf "%s;",$0}' "$hdr" || true)
            printf 'URL\t%s\t%s\t%s\tlocation=%s\tcanonical=%s\thcdn=%s\tgt=%s\n' "$label" "$path" "$out" "${location:-}" "${canonical:-}" "${hcdn:-}" "${gt:-}"
          }
          check '/de/' de-root
          check '/de/about-us/' de-about
          check '/about-us/' base-about
          check '/fr/product-categorie/menstruation-verschieben/' fr-old-menstruation
          check '/product-categorie/menstruation-verschieben/' base-old-menstruation
          check '/product-category/menstruation-verschieben/' base-new-menstruation
          check '/fr/product-category/menstruation-verschieben/' fr-new-menstruation
          check '/fr/product-categorie/sexual-problems/' fr-old-sexual
          check '/product-categorie/sexual-problems/' base-old-sexual
          check '/product-category/sexuelle-probleme/' base-new-sexual
          check '/fr/product-category/sexuelle-probleme/' fr-new-sexual
          check '/product/epipen/?attribute_pa_medication-strength=300mcg&attribute_pa_amount=3&attribute_pa_medication=epipen' epipen-param
