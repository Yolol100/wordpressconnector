name: Temporary DoctorCura Redirect Layer Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-redirection-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Verify rollback and identify origin path
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/redirection/v1/redirect"
          for source in '/fr/product-categorie/sexual-problems/' '/product-categorie/sexual-problems/'; do
            enc=$(printf '%s' "$source" | tr '/' '_')
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 "${auth[@]}" --get --data-urlencode "filterBy[url]=$source" --data-urlencode 'per_page=20' "$api" > "$RUNNER_TEMP/$enc.json"
            php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo "RULE source=".$argv[2]." total=".(int)($d["total"]??0).PHP_EOL; foreach(($d["items"]??[]) as $x){echo "  id=".(int)($x["id"]??0)." url=".(string)($x["url"]??"")." code=".(int)($x["action_code"]??0)." target=".(string)($x["action_data"]["url"]??"").PHP_EOL;}' "$RUNNER_TEMP/$enc.json" "$source"
          done
          for path in '/fr/product-categorie/sexual-problems/' '/product-categorie/sexual-problems/' '/product-category/sexuelle-probleme/'; do
            hdr="$RUNNER_TEMP/h"; body="$RUNNER_TEMP/b"
            out=$(curl --silent --show-error --compressed --connect-timeout 10 --max-time 30 --output "$body" --dump-header "$hdr" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base$path")
            location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$hdr" || true)
            gt=$(awk 'BEGIN{IGNORECASE=1}/^x-gt-/{gsub(/\r/,"");printf "%s;",$0}' "$hdr" || true)
            printf 'URL path=%s out=%s location=%s gt=%s\n' "$path" "$out" "${location:-}" "${gt:-}"
          done
