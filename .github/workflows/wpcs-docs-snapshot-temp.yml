# ONE-TIME branch-only WPCS documentation workflow. Delete before creating a PR.
name: Temporary WPCS Docs Verification
on:
  push:
    branches:
      - fix/wpcs-docs-contracts-20261115
    paths:
      - .github/workflows/wpcs-docs-snapshot-temp.yml
permissions:
  contents: write
jobs:
  documentation-only:
    if: github.repository == 'Yolol100/wordpressconnector'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/wpcs-docs-contracts-20261115
          persist-credentials: true
      - name: Prepare PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xmlreader, xml, dom
          coverage: none
      - name: Apply doc-only fixes, verify all contract tests, report full PHPCS
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Yolol100/wordpressconnector'
          test "$GITHUB_REF" = 'refs/heads/fix/wpcs-docs-contracts-20261115'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          tools_dir="$RUNNER_TEMP/wpcs-tools"
          mkdir -p "$tools_dir"
          cat > "$tools_dir/composer.json" <<'JSON'
          {
            "name": "webactueel/wpcs-docs-temporary",
            "require-dev": {
              "squizlabs/php_codesniffer": "3.13.6",
              "wp-coding-standards/wpcs": "3.4.1"
            },
            "config": {
              "allow-plugins": {
                "dealerdirect/phpcodesniffer-composer-installer": true
              }
            }
          }
          JSON
          composer install --working-dir="$tools_dir" --prefer-dist --no-interaction --no-progress
          report_before="$RUNNER_TEMP/wpcs-docs-before.json"
          report_after="$RUNNER_TEMP/wpcs-docs-after.json"
          scan=0
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$report_before" || scan=$?
          python3 scripts/wpcs-docblock-temp.py "$report_before" > "$RUNNER_TEMP/docfix-results.txt"
          cat "$RUNNER_TEMP/docfix-results.txt"
          find plugin/wordpressconnector -type f -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/php-lint-results.txt"
          git diff --check
          git add plugin/wordpressconnector
          test -n "$(git diff --cached --name-only)"
          while IFS= read -r p; do
              case "$p" in plugin/wordpressconnector/*.php) ;; *) echo "Unexpected changed path: $p"; exit 1 ;; esac
          done < <(git diff --cached --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(wpcs): annotate connector PHP methods and properties without runtime changes'
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1 || { tail -n 55 "$RUNNER_TEMP/contracts.log"; exit 1; }
          scan=0
          "$tools_dir/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$report_after" || scan=$?
          python3 - "$report_before" "$report_after" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]))
          x=a['totals'];y=b['totals']
          print('BEFORE',x,'AFTER',y,'FILES',len(b['files']))
          assert len(a['files'])==len(b['files'])==57, 'Scan coverage must remain complete'
          assert x['errors']==2127 and x['warnings']==150, 'Baseline changed'
          assert y['errors']<=x['errors']-40, 'Insufficient improvement'
          assert y['warnings']<=x['warnings'], 'New warnings introduced'
          PY
          git push origin 'HEAD:refs/heads/fix/wpcs-docs-contracts-20261115'
          echo "candidate=$(git rev-parse HEAD)"
      - name: Store exact audit and tests for independent review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: temporary-wpcs-docfix-evidence
          path: |
            ${{ runner.temp }}/wpcs-docs-before.json
            ${{ runner.temp }}/wpcs-docs-after.json
            ${{ runner.temp }}/docfix-results.txt
            ${{ runner.temp }}/php-lint-results.txt
            ${{ runner.temp }}/contracts.log
          retention-days: 1
