name: DoctorCura Gap Closure Read-Only QA

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-gap-closure-20260911.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Verify snippet 43 identity and frozen markers
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          [[ "$base" == 'https://doctorcura.com' ]]
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          tmp="$RUNNER_TEMP/dc-gap-closure"; mkdir -p "$tmp"
          expected='77f76f8dce012e8122d25243b9e60a020253c85236165f2bf7c5d237ed6d9270'
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' --output "$tmp/snippet.json" --write-out '%{http_code}' "$base/wp-json/code-snippets/v1/snippets/43")
          [[ "$code" == 200 ]]
          python3 - "$tmp/snippet.json" "$expected" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          c=str(d.get('code') or '')
          assert bool(d.get('active')), 'snippet 43 inactive'
          assert hashlib.sha256(c.encode()).hexdigest()==sys.argv[2], 'snippet hash drift'
          assert 'DoctorCura one-time cache purge helper' not in c, 'cache helper present'
          for marker in [
              'DoctorCura article social image alignment V8.3',
              'DoctorCura gewichtsverlust legacy final redirect V8.4b',
              'DoctorCura datenschutz root-only migration V8.4c',
              'DoctorCura product variation hreflang cleanup V8.4d',
              'DoctorCura GSC-proven legacy category redirects V8.4e',
              'DoctorCura French request-2 migration V8.4f',
          ]:
              assert c.count(marker)==1, f'marker count drift: {marker}'
          print('SNIPPET_43_GREEN hash='+sys.argv[2])
          PY

      - name: Verify exact redirects and Phase 2B image
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          tmp="$RUNNER_TEMP/dc-gap-closure"; mkdir -p "$tmp"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          assert_redirect() {
            src="$1"; expected="$2"; hdr="$tmp/h-$(echo "$src" | tr '/?&=' '____').txt"
            status=$(curl "${c[@]}" --dump-header "$hdr" --output /dev/null --write-out '%{http_code}' "$src")
            [[ "$status" == 301 ]]
            loc=$(python3 - "$hdr" <<'PY'
          import sys
          loc=''
          for line in open(sys.argv[1],encoding='iso-8859-1'):
              if line.lower().startswith('location:'): loc=line.split(':',1)[1].strip()
          print(loc)
          PY
          )
            python3 - "$src" "$loc" "$expected" <<'PY'
          import sys,urllib.parse
          got=urllib.parse.urljoin(sys.argv[1],sys.argv[2])
          norm=lambda u:u.rstrip('/')+'/'
          assert norm(got)==norm(sys.argv[3]), f'{got} != {sys.argv[3]}'
          PY
          }
          assert_status() {
            expected="$1"; url="$2"
            status=$(curl "${c[@]}" --output /dev/null --write-out '%{http_code}' "$url")
            [[ "$status" == "$expected" ]]
          }
          assert_redirect "$base/welche-medikamente-beeinflussen-die-erektion-2/" "$base/welche-medikamente-beeinflussen-die-erektion/"
          assert_redirect "$base/product-categorie/gewichtsverlust/" "$base/product-category/gewichtsverlust/"
          assert_redirect "$base/product-categorie/hiv-praevention-prep/" "$base/product-category/hiv-praevention-prep/"
          assert_redirect "$base/product-categorie/quit-smoking/" "$base/product-category/rauchstopp/"
          assert_redirect "$base/product-categorie/schlafprobleme/" "$base/product-category/schlafprobleme/"
          assert_redirect "$base/datenschutz/" "$base/privacy-policy/"
          assert_redirect "$base/fr/request-2/" "$base/fr/anfrage-2/"
          assert_status 404 "$base/request-2/"
          assert_status 404 "$base/en/request-2/"
          assert_status 404 "$base/fr/datenschutz/"
          assert_status 404 "$base/en/datenschutz/"

          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          code=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/post900067.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/posts/900067?context=edit&_fields=id,status,link,featured_media")
          [[ "$code" == 200 ]]
          code=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/media5925.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/media/5925?_fields=id,source_url")
          [[ "$code" == 200 ]]
          curl "${c[@]}" --location --compressed --output "$tmp/article.html" "$base/welche-medikamente-beeinflussen-die-erektion/"
          python3 - "$tmp/post900067.json" "$tmp/media5925.json" "$tmp/article.html" <<'PY'
          import json,os,re,sys,urllib.parse
          p=json.load(open(sys.argv[1],encoding='utf-8')); m=json.load(open(sys.argv[2],encoding='utf-8')); s=open(sys.argv[3],encoding='utf-8',errors='ignore').read()
          assert p.get('status')=='publish' and int(p.get('featured_media') or 0)==5925
          tags=re.findall(r'<meta\b[^>]*>',s,re.I)
          og=''
          for tag in tags:
              if re.search(r'(?:property|name)=["\']og:image["\']',tag,re.I):
                  mm=re.search(r'content=["\']([^"\']+)',tag,re.I)
                  if mm: og=mm.group(1); break
          assert og, 'og:image missing'
          def stem(u):
              b=os.path.basename(urllib.parse.urlsplit(u).path); x=os.path.splitext(b)[0]; return re.sub(r'-\d+x\d+$','',x)
          assert stem(og)==stem(str(m.get('source_url') or '')), f'og:image not media 5925: {og}'
          print('PHASE_2B_GREEN og='+og)
          PY
          echo REDIRECTS_AND_PHASE2B_GREEN

      - name: Verify terms Epipen pagination and sitemap
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          tmp="$RUNNER_TEMP/dc-gap-closure"; mkdir -p "$tmp"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')

          code=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/page11.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/pages/11?context=edit&_fields=id,status,content")
          [[ "$code" == 200 ]]
          curl "${c[@]}" --location --compressed --output "$tmp/terms.html" "$base/geschaftsbedingungen/?dc_gap_closure=$(date +%s%N)"
          python3 - "$tmp/page11.json" "$tmp/terms.html" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); raw=str((p.get('content') or {}).get('raw') or '')
          public=open(sys.argv[2],encoding='utf-8',errors='ignore').read()
          assert raw.count('http://www.doctorcura.com')==0
          assert public.count('http://www.doctorcura.com')==0
          print('TERMS_GREEN')
          PY

          var="$base/product/epipen/?attribute_pa_wirkstarke=150mcg&dc_gap_closure=$(date +%s%N)"
          status=$(curl "${c[@]}" --location --compressed --output "$tmp/epipen-var.html" --write-out '%{http_code}' "$var")
          [[ "$status" == 200 ]]
          python3 - "$tmp/epipen-var.html" "$base/product/epipen/" <<'PY'
          import html,re,sys,urllib.parse
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); expected=sys.argv[2].rstrip('/')
          canonical=''; alts=[]
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
              rel=re.search(r'rel=["\']([^"\']+)',tag,re.I); href=re.search(r'href=["\']([^"\']+)',tag,re.I)
              if rel and href and 'canonical' in rel.group(1).lower(): canonical=html.unescape(href.group(1))
              if rel and href and 'alternate' in rel.group(1).lower():
                  hm=re.search(r'hreflang=["\']([^"\']+)',tag,re.I)
                  if hm: alts.append((hm.group(1),html.unescape(href.group(1))))
          bad=[u for _,u in alts if any(k.startswith('attribute_pa_') for k in urllib.parse.parse_qs(urllib.parse.urlsplit(u).query))]
          assert canonical.rstrip('/')==expected, canonical
          assert len(alts)>=3, len(alts)
          assert not bad, bad
          print('EPIPEN_GREEN hreflangs='+str(len(alts)))
          PY

          status=$(curl "${c[@]}" --location --compressed --output "$tmp/blog16.html" --write-out '%{http_code}' "$base/blogs/16/")
          [[ "$status" == 200 ]]
          python3 - "$tmp/blog16.html" "$base/blogs/16/" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); expected=sys.argv[2].rstrip('/')
          can=''
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
              if re.search(r'rel=["\'][^"\']*canonical',tag,re.I):
                  m=re.search(r'href=["\']([^"\']+)',tag,re.I)
                  if m: can=html.unescape(m.group(1)); break
          assert can.rstrip('/')==expected, can
          print('BLOG16_GREEN')
          PY
          status=$(curl "${c[@]}" --compressed --output "$tmp/blog17.html" --write-out '%{http_code}' "$base/blogs/17/?dc_gap_closure=$(date +%s%N)")
          [[ "$status" == 404 ]]
          grep -Eiq '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex|<meta[^>]+content=["'"'][^"'"']*noindex[^"'"']*["'"'][^>]+name=["'"']robots' "$tmp/blog17.html"

          curl "${c[@]}" --location --compressed --output "$tmp/sitemap-index.xml" "$base/sitemap_index.xml"
          python3 - "$tmp/sitemap-index.xml" "$tmp/children.txt" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); urls=[]
          for e in root.iter():
              if e.tag.split('}')[-1]=='loc' and e.text: urls.append(e.text.strip())
          assert urls, 'no child sitemaps'
          open(sys.argv[2],'w',encoding='utf-8').write('\n'.join(urls))
          PY
          : > "$tmp/urlsets.txt"
          n=0
          while IFS= read -r child; do
            n=$((n+1)); f="$tmp/child-$n.xml"
            curl "${c[@]}" --location --compressed --output "$f" "$child"
            echo "$f" >> "$tmp/urlsets.txt"
          done < "$tmp/children.txt"
          python3 - "$tmp/urlsets.txt" <<'PY'
          import sys,xml.etree.ElementTree as ET
          urls=[]
          for path in open(sys.argv[1],encoding='utf-8'):
              path=path.strip()
              if not path: continue
              root=ET.parse(path).getroot()
              for e in root.iter():
                  if e.tag.split('}')[-1]=='loc' and e.text and any(x.tag.split('}')[-1]=='url' for x in [root] if False): pass
              for u in root.iter():
                  if u.tag.split('}')[-1]=='url':
                      for c in u:
                          if c.tag.split('}')[-1]=='loc' and c.text: urls.append(c.text.strip()); break
          assert len(set(urls))==176, f'sitemap URL count={len(set(urls))}'
          print('SITEMAP_GREEN urls=176')
          PY
          echo CORE_PUBLIC_QA_GREEN

      - name: Inspect de about-us redirect chain without changing it
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          tmp="$RUNNER_TEMP/dc-gap-closure"; mkdir -p "$tmp"
          result=$(curl --silent --show-error --location --compressed --connect-timeout 10 --max-time 45 --max-redirs 10 --dump-header "$tmp/about-headers.txt" --output "$tmp/about.html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base/de/about-us/")
          echo "ABOUT_US_RESULT=$result"
          python3 - "$tmp/about-headers.txt" "$tmp/about.html" <<'PY'
          import html,re,sys
          hs=open(sys.argv[1],encoding='iso-8859-1',errors='ignore').read(); s=open(sys.argv[2],encoding='utf-8',errors='ignore').read()
          locations=[line.split(':',1)[1].strip() for line in hs.splitlines() if line.lower().startswith('location:')]
          print('ABOUT_US_LOCATIONS='+' -> '.join(locations))
          can=''
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
              if re.search(r'rel=["\'][^"\']*canonical',tag,re.I):
                  m=re.search(r'href=["\']([^"\']+)',tag,re.I)
                  if m: can=html.unescape(m.group(1)); break
          print('ABOUT_US_FINAL_CANONICAL='+can)
          PY
          status=${result%%$'\t'*}
          [[ "$status" == 200 ]]
          echo ABOUT_US_READ_ONLY_INSPECTION_COMPLETE

      - name: Closure marker
        shell: bash
        run: |
          echo DOCTORCURA_GAP_CLOSURE_GREEN
