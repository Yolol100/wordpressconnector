name: DoctorCura Phase 3 Deep Owner Diagnostics

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-phase3-owner-deep.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect redirect content and hreflang owners read only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          tmp="$RUNNER_TEMP/dc-owner-deep"; mkdir -p "$tmp"
          c=(--silent --show-error --connect-timeout 10 --max-time 40 --retry 2 --retry-delay 2 --retry-all-errors)

          echo '=== SNIPPET 43 STATE ==='
          curl "${c[@]}" --location "${auth[@]}" "$base/wp-json/code-snippets/v1/snippets/43" > "$tmp/s43.json"
          python3 - "$tmp/s43.json" <<'PY'
          import hashlib,json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8')); code=str(s.get('code') or '')
          print(f"SNIPPET id={s.get('id')} active={bool(s.get('active'))} hash={hashlib.sha256(code.encode()).hexdigest()} chars={len(code)}")
          for token in ['DoctorCura gewichtsverlust legacy canonical migration V8.4a','DoctorCura one-time cache purge helper','hreflang','gtranslate','attribute_pa','redirect_canonical','product-categorie']:
              print(f"SNIPPET_TOKEN token={token} count={code.lower().count(token.lower())}")
          PY

          echo '=== WEIGHT REDIRECT OWNER HEADERS ==='
          for lang in base fr en; do
            [[ "$lang" == base ]] && prefix='' || prefix="/$lang"
            for variant in normal bust; do
              source="$base$prefix/product-categorie/gewichtsverlust/"
              [[ "$variant" == bust ]] && source="$source?doctorcura_owner_probe=20260910"
              h="$tmp/weight-$lang-$variant.h"
              curl "${c[@]}" --compressed --max-redirs 0 --header 'Cache-Control: no-cache' --dump-header "$h" --output /dev/null "$source" || true
              code=$(awk '/^HTTP\//{print $2; exit}' "$h")
              loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$h")
              xrb=$(awk 'BEGIN{IGNORECASE=1}/^x-redirect-by:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$h")
              echo "WEIGHT_HEADER lang=$lang variant=$variant code=${code:-} location=${loc:-} x_redirect_by=${xrb:-none}"
              awk 'BEGIN{IGNORECASE=1}/^(server|age|cache-control|x-hcdn-|x-cache|x-litespeed|cf-cache-status|vary):/{gsub(/\r/,"");print "WEIGHT_META " $0}' "$h" || true
            done
          done

          echo '=== REDIRECTION RULES RELEVANT TO WEIGHT ==='
          curl "${c[@]}" --location "${auth[@]}" --get --data-urlencode 'per_page=200' "$base/wp-json/redirection/v1/redirect" > "$tmp/redirs.json"
          python3 - "$tmp/redirs.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          items=d.get('items') if isinstance(d,dict) else d
          if not isinstance(items,list): items=[]
          hits=[]
          for r in items:
              blob=' '.join(str(r.get(k,'') or '') for k in ['url','action_data','match_url','title']).lower()
              if any(t in blob for t in ['gewichtsverlust','product-categorie','product-category']):
                  hits.append(r)
          print(f"REDIR_TOTAL_PAGE={len(items)} REDIR_RELEVANT={len(hits)}")
          for r in hits[:40]:
              print('REDIR id={id} url={url} target={target} regex={regex} status={status} match_type={match_type} action_type={action_type}'.format(
                  id=r.get('id'),url=r.get('url'),target=r.get('action_data'),regex=r.get('regex'),status=r.get('status'),match_type=r.get('match_type'),action_type=r.get('action_type')))
          PY

          echo '=== ACTIVE PLUGINS RELEVANT TO OWNERSHIP ==='
          plugin_http=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/plugins.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/plugins?status=active&per_page=100" || true)
          echo "PLUGINS_HTTP=$plugin_http"
          if [[ "$plugin_http" == '200' ]]; then
            python3 - "$tmp/plugins.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          for p in data if isinstance(data,list) else []:
              slug=str(p.get('plugin') or '')
              if any(t in slug.lower() for t in ['gtranslate','woocommerce','wordpress-seo','yoast','redirection','wp-rocket','code-snippets']):
                  print(f"PLUGIN plugin={slug} status={p.get('status')} version={p.get('version','unknown')}")
          PY
          fi

          echo '=== ALL SNIPPETS RELEVANT TO WEIGHT ==='
          snippets_http=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/snippets.json" --write-out '%{http_code}' "$base/wp-json/code-snippets/v1/snippets?per_page=100" || true)
          echo "SNIPPETS_HTTP=$snippets_http"
          if [[ "$snippets_http" == '200' ]]; then
            python3 - "$tmp/snippets.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          items=d.get('data') if isinstance(d,dict) else d
          if not isinstance(items,list): items=d.get('snippets',[]) if isinstance(d,dict) else []
          if not isinstance(items,list): items=[]
          for s in items:
              code=str(s.get('code') or '')
              name=str(s.get('name') or '')
              if any(t in (name+' '+code).lower() for t in ['gewichtsverlust','product-categorie']):
                  print(f"SNIPPET_HIT id={s.get('id')} active={bool(s.get('active'))} name={name[:120]}")
          PY
          fi

          echo '=== TERMS EXACT OLD HTTP URL ==='
          page_http=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/page11.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/pages/11?context=edit" || true)
          echo "PAGE11_HTTP=$page_http"
          [[ "$page_http" == '200' ]] || exit 1
          python3 - "$tmp/page11.json" <<'PY'
          import hashlib,json,re,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          raw=str((p.get('content') or {}).get('raw') or '')
          hits=re.findall(r'https?://www\.doctorcura\.com[^\s"\'<>)]*',raw,re.I)
          old=[u for u in hits if u.lower().startswith('http://www.doctorcura.com')]
          print(f"PAGE11_RAW_HASH={hashlib.sha256(raw.encode()).hexdigest()} OLD_HTTP_COUNT={len(old)}")
          for u in old: print('OLD_HTTP_URL='+u)
          PY

          echo '=== EPIPEN ALTERNATE TAGS AND OWNER TOKENS ==='
          url="$base/product/epipen/?attribute_pa_medication-strength=300mcg&attribute_pa_amount=3&attribute_pa_medication=epipen"
          curl "${c[@]}" --location --compressed --header 'Cache-Control: no-cache' --output "$tmp/epipen.html" "$url"
          python3 - "$tmp/epipen.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          tags=re.findall(r'<link\b[^>]*hreflang=[^>]*>',s,re.I)
          print('ALT_TAG_COUNT='+str(len(tags)))
          for t in tags[:10]: print('ALT_TAG '+re.sub(r'\s+',' ',t)[:700])
          lower=s.lower()
          for token in ['gtranslate','yoast','hreflang','translate.google','gt_switcher','attribute_pa_']:
              print(f"HTML_TOKEN {token} count={lower.count(token.lower())}")
          PY
          echo PHASE3_DEEP_OWNER_DIAGNOSTICS_V2_COMPLETE
