name: DoctorCura Phase 3 Deep Owner Diagnostics

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-phase3-owner-deep.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect cache render and hreflang ownership read only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          tmp="$RUNNER_TEMP/dc-owner-deep-v3"; mkdir -p "$tmp"
          old='http://www.doctorcura.com'
          expected_snippet='e6e303d0d24b55a97088f4cde4151130a7a17414037c0a626427a39f1c0aa946'
          expected_page='890f2cca24c5e0de3ab501cb83fb2fe0e54a4fff076b0520ab4de9144e0933c6'

          canonical(){ python3 - "$1" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          m=re.search(r'<link[^>]+rel=["\'][^"\']*canonical[^"\']*["\'][^>]+href=["\']([^"\']+)',s,re.I)
          if not m: m=re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\'][^"\']*canonical',s,re.I)
          print(m.group(1) if m else '',end='')
          PY
          }
          old_count(){ python3 - "$1" "$old" <<'PY'
          import sys
          print(open(sys.argv[1],encoding='utf-8',errors='ignore').read().count(sys.argv[2]),end='')
          PY
          }
          headers(){
            local h="$1"
            awk 'BEGIN{IGNORECASE=1}/^(server|age|cache-control|expires|etag|vary|x-hcdn-|x-cache|x-litespeed|x-rocket|x-powered-by|x-redirect-by|cf-cache-status):/{gsub(/\r/,"");print "HEADER " $0}' "$h" || true
          }

          echo '=== BASELINE STATE ==='
          curl "${c[@]}" --location "${auth[@]}" "$base/wp-json/code-snippets/v1/snippets/43" > "$tmp/s43.json"
          python3 - "$tmp/s43.json" "$expected_snippet" <<'PY'
          import hashlib,json,sys
          s=json.load(open(sys.argv[1],encoding='utf-8')); code=str(s.get('code') or ''); h=hashlib.sha256(code.encode()).hexdigest()
          print(f"SNIPPET id={s.get('id')} active={bool(s.get('active'))} hash={h} expected={h==sys.argv[2]}")
          for token in ['DoctorCura gewichtsverlust legacy final redirect V8.4b','DoctorCura datenschutz root-only migration V8.4c','DoctorCura one-time cache purge helper']:
              print(f"SNIPPET_TOKEN token={token} count={code.count(token)}")
          if h!=sys.argv[2] or code.count('DoctorCura one-time cache purge helper')!=0: raise SystemExit(2)
          PY

          curl "${c[@]}" --location "${auth[@]}" "$base/wp-json/wp/v2/pages/11?context=edit" > "$tmp/page11.json"
          python3 - "$tmp/page11.json" "$old" "$expected_page" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); c=p.get('content') or {}; raw=str(c.get('raw') or ''); rendered=str(c.get('rendered') or '')
          rh=hashlib.sha256(raw.encode()).hexdigest()
          print(f"PAGE11 status={p.get('status')} link={p.get('link')} modified={p.get('modified_gmt')} raw_hash={rh} expected={rh==sys.argv[3]} raw_old={raw.count(sys.argv[2])} rendered_old={rendered.count(sys.argv[2])} rendered_bytes={len(rendered.encode())}")
          if rh!=sys.argv[3] or raw.count(sys.argv[2])!=1: raise SystemExit(2)
          PY
          terms=$(python3 - "$tmp/page11.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8')).get('link',''),end='')
          PY
          )

          echo '=== TERMS PUBLIC CACHE LAYERS ==='
          for mode in clean random no_cache pragma; do
            url="$terms"
            args=()
            [[ "$mode" == random ]] && url="${terms}?doctorcura_owner_v3=$(date +%s%N)"
            [[ "$mode" == no_cache ]] && { url="${terms}?doctorcura_owner_v3_nc=$(date +%s%N)"; args+=(--header 'Cache-Control: no-cache'); }
            [[ "$mode" == pragma ]] && { url="${terms}?doctorcura_owner_v3_p=$(date +%s%N)"; args+=(--header 'Cache-Control: no-store, no-cache, must-revalidate' --header 'Pragma: no-cache'); }
            h="$tmp/terms-$mode.h"; b="$tmp/terms-$mode.html"
            status=$(curl "${c[@]}" --compressed "${args[@]}" --dump-header "$h" --output "$b" --write-out '%{http_code}' "$url")
            can=$(canonical "$b"); cnt=$(old_count "$b")
            cache=$(awk 'BEGIN{IGNORECASE=1}/^x-hcdn-cache-status:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$h")
            age=$(awk 'BEGIN{IGNORECASE=1}/^age:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' "$h")
            echo "TERMS mode=$mode status=$status canonical=$can old_count=$cnt hcdn=${cache:-none} age=${age:-none} bytes=$(wc -c < "$b")"
            headers "$h"
          done

          echo '=== REST ROUTE OWNERS ==='
          curl "${c[@]}" --location "$base/wp-json/" > "$tmp/index.json"
          python3 - "$tmp/index.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); routes=d.get('routes',{})
          keys=sorted(routes)
          for needle in ['hostinger','cache','rocket','elementor','gtranslate','translate']:
              hits=[k for k in keys if needle in k.lower()]
              print(f"ROUTES needle={needle} count={len(hits)}")
              for k in hits[:30]: print('ROUTE '+k)
          PY

          echo '=== ACTIVE PLUGIN OWNERS ==='
          ph=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/plugins.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/plugins?status=active&per_page=100" || true)
          echo "PLUGINS_HTTP=$ph"
          if [[ "$ph" == 200 ]]; then
            python3 - "$tmp/plugins.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          for p in d if isinstance(d,list) else []:
              blob=' '.join(str(p.get(k,'') or '') for k in ['plugin','name','author','description']).lower()
              if any(x in blob for x in ['gtranslate','hostinger','rocket','elementor','redirection','yoast','woocommerce','code snippets']):
                  print(f"PLUGIN plugin={p.get('plugin')} status={p.get('status')} name={p.get('name')} version={p.get('version','unknown')}")
          PY
          fi

          echo '=== SETTINGS KEY OWNERS ==='
          sh=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/settings.json" --write-out '%{http_code}' "$base/wp-json/wp/v2/settings" || true)
          echo "SETTINGS_HTTP=$sh"
          if [[ "$sh" == 200 ]]; then
            python3 - "$tmp/settings.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          keys=[k for k in d if any(x in k.lower() for x in ['gtranslate','hostinger','rocket','cache','translate'])]
          print('SETTINGS_MATCH_KEYS='+','.join(sorted(keys)))
          PY
          fi

          echo '=== REDIRECTION ROOT PRIVACY RESIDUE ==='
          curl "${c[@]}" --location "${auth[@]}" --get --data-urlencode 'filterBy[url]=/datenschutz/' --data-urlencode 'per_page=20' "$base/wp-json/redirection/v1/redirect" > "$tmp/redir.json"
          python3 - "$tmp/redir.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); items=d.get('items',[]) if isinstance(d,dict) else []
          print('DATENSCHUTZ_REDIR_EXACT='+str(sum(1 for r in items if r.get('url')=='/datenschutz/')))
          PY

          echo '=== EPIPEN HREFLANG QUERY MATRIX ==='
          ep="$base/product/epipen/"
          var='attribute_pa_medication-strength=300mcg&attribute_pa_amount=3&attribute_pa_medication=epipen'
          for lang in base fr en; do
            [[ "$lang" == base ]] && prefix='' || prefix="/$lang"
            for kind in clean variation utm random; do
              url="$base$prefix/product/epipen/"
              [[ "$kind" == variation ]] && url="${url}?$var"
              [[ "$kind" == utm ]] && url="${url}?utm_source=doctorcura-owner-v3"
              [[ "$kind" == random ]] && url="${url}?doctorcura_owner_v3=$(date +%s%N)"
              h="$tmp/ep-$lang-$kind.h"; b="$tmp/ep-$lang-$kind.html"
              status=$(curl "${c[@]}" --compressed --header 'Cache-Control: no-cache' --dump-header "$h" --output "$b" --write-out '%{http_code}' "$url")
              python3 - "$b" "$lang" "$kind" "$status" <<'PY'
          import html,re,sys,urllib.parse
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); lang,kind,status=sys.argv[2:]
          c=''; m=re.search(r'<link\b[^>]*rel=["\'][^"\']*canonical[^"\']*["\'][^>]*>',s,re.I)
          if m:
              hm=re.search(r'href=["\']([^"\']+)',m.group(0),re.I); c=html.unescape(hm.group(1)) if hm else ''
          alts=[]
          for tag in re.findall(r'<link\b[^>]*hreflang=[^>]*>',s,re.I):
              hm=re.search(r'href=["\']([^"\']+)',tag,re.I); lm=re.search(r'hreflang=["\']([^"\']+)',tag,re.I)
              if hm: alts.append((lm.group(1) if lm else '',html.unescape(hm.group(1))))
          q=sum(1 for _,u in alts if urllib.parse.urlsplit(u).query)
          print(f"EPIPEN lang={lang} kind={kind} status={status} canonical={c} alt_count={len(alts)} alt_query_count={q}")
          for l,u in alts[:6]: print(f"EPIPEN_ALT lang={lang} kind={kind} hreflang={l} href={u}")
          PY
            done
          done
          echo PHASE3_DEEP_OWNER_DIAGNOSTICS_V3_COMPLETE
