name: Bootstrap connector materialization

on:
  push:
    branches:
      - feature/full-wordpress-bridge
    paths:
      - bootstrap-manifest.json

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path sha; do
            test -n "$path"
            test -n "$sha"
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}")"
            returned_sha="$(jq -r '.sha' <<<"${response}")"
            test "${returned_sha}" = "${sha}"
            mkdir -p "$(dirname "${path}")"
            jq -r '.content' <<<"${response}" | tr -d '\n' | base64 --decode > "${path}"
            actual_sha="$(git hash-object "${path}")"
            test "${actual_sha}" = "${sha}"
            git add -- "${path}"
          done < <(jq -r '.files | to_entries[] | [.key,.value] | @tsv' bootstrap-manifest.json)

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- bootstrap-manifest.json
          git commit -m "[bootstrap-complete] Materialize reviewed WordPress connector"
          git push origin "HEAD:${GITHUB_REF_NAME}"
