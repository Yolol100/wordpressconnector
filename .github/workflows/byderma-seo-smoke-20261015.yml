name: Byderma Read-only SEO Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/byderma-seo-smoke-20261015.yml'
      - 'tests/read-only-byderma-seo-smoke-20261015.py'
permissions:
  contents: read
jobs:
  public-seo-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect bounded public endpoints without authentication
        run: python3 tests/read-only-byderma-seo-smoke-20261015.py
