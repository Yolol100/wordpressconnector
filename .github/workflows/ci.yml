name: Connector CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'requests/**'
      - 'results/**'
      - 'receipts/**'
      - 'assets/inbox/**'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Zero-config policy contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/policy-contract.php
      - name: GitHub OIDC contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/github-oidc-contract.php
      - name: Zero-config REST contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/rest-transport-contract.php
      - name: Zero-config request workflow contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/request-workflow-contract.php
      - name: Zero-config execute workflow contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/execute-workflow-contract.php
      - name: Zero-config workflow security contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/workflow-security-contract.php
      - name: Zero-config repository hygiene contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/repository-hygiene.php
      - name: Zero-config single-plugin contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/single-plugin-contract.php

      - name: Validate PHP and complete contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-contracts.sh
          git diff --check HEAD^ HEAD 2>/dev/null || git diff --check

      - name: Build reproducible package twice
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git log -1 --format=%H -- plugin/wordpressconnector)"
          source_epoch="$(git show -s --format=%ct "$source_sha")"
          python3 scripts/build-release-package.py \
            --source plugin/wordpressconnector \
            --zip "$RUNNER_TEMP/wordpressconnector-a.zip" \
            --sbom "$RUNNER_TEMP/wordpressconnector-a.spdx.json" \
            --source-commit "$source_sha" \
            --source-date-epoch "$source_epoch"
          python3 scripts/build-release-package.py \
            --source plugin/wordpressconnector \
            --zip "$RUNNER_TEMP/wordpressconnector-b.zip" \
            --sbom "$RUNNER_TEMP/wordpressconnector-b.spdx.json" \
            --source-commit "$source_sha" \
            --source-date-epoch "$source_epoch"
          cmp "$RUNNER_TEMP/wordpressconnector-a.zip" "$RUNNER_TEMP/wordpressconnector-b.zip"
          cmp "$RUNNER_TEMP/wordpressconnector-a.spdx.json" "$RUNNER_TEMP/wordpressconnector-b.spdx.json"
          unzip -t "$RUNNER_TEMP/wordpressconnector-a.zip"
          unzip -Z1 "$RUNNER_TEMP/wordpressconnector-a.zip" | grep -qx 'wordpressconnector/wordpressconnector.php'
          if unzip -Z1 "$RUNNER_TEMP/wordpressconnector-a.zip" | grep -Eq '(^|/)(\.git|\.github|tests|node_modules|__pycache__)(/|$)'; then
            echo 'Development-only content leaked into plugin ZIP.' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/wordpressconnector-a.zip" "$RUNNER_TEMP/wordpressconnector-a.spdx.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          zip_path = Path(sys.argv[1])
          sbom = json.loads(Path(sys.argv[2]).read_text())
          package = sbom['packages'][0]
          if package.get('filesAnalyzed') is not True:
              raise SystemExit('SPDX filesAnalyzed must be true.')
          code = package.get('packageVerificationCode', {}).get('packageVerificationCodeValue', '')
          sha1_values = []
          for entry in sbom.get('files', []):
              checksums = {item['algorithm']: item['checksumValue'] for item in entry.get('checksums', [])}
              if 'SHA1' not in checksums or 'SHA256' not in checksums:
                  raise SystemExit('Every SPDX file requires SHA1 and SHA256.')
              sha1_values.append(checksums['SHA1'])
          expected = hashlib.sha1(''.join(sorted(sha1_values)).encode('ascii')).hexdigest()
          if code != expected:
              raise SystemExit('SPDX packageVerificationCode is invalid.')
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          package_checksums = {item['algorithm']: item['checksumValue'] for item in package.get('checksums', [])}
          if package_checksums.get('SHA256') != zip_sha256:
              raise SystemExit('SPDX package checksum does not match ZIP bytes.')
          PY
          python3 -m json.tool "$RUNNER_TEMP/wordpressconnector-a.spdx.json" >/dev/null
          sha256sum "$RUNNER_TEMP/wordpressconnector-a.zip"
          sha256sum "$RUNNER_TEMP/wordpressconnector-a.spdx.json"

      - name: Reject dangerous execution primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.php' '\b(eval|shell_exec|passthru|proc_open|popen)\s*\(' plugin; then
            echo 'Forbidden execution primitive found.' >&2
            exit 1
          fi
          forbidden_event="pull_request""_target"
          if grep -RIn "$forbidden_event" .github/workflows; then
            echo 'Privileged pull-request event is forbidden for this repository.' >&2
            exit 1
          fi

  php-compatibility:
    name: PHP ${{ matrix.php }} contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run complete contract suite
        shell: bash
        run: bash scripts/run-contracts.sh

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run official WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: plugin/wordpressconnector
          checks: |
            php_error_reporting
            code_obfuscation
            minified_files
            direct_file_access
            safe_redirect
            setting_sanitization
            no_unfiltered_uploads

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate