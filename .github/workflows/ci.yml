name: Connector CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'requests/**'
      - 'results/**'
      - 'receipts/**'
      - 'assets/inbox/**'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Zero-config policy contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/policy-contract.php
      - name: GitHub OIDC contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/github-oidc-contract.php
      - name: Zero-config REST contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/rest-transport-contract.php
      - name: Zero-config request workflow contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/request-workflow-contract.php
      - name: Zero-config execute workflow contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/execute-workflow-contract.php
      - name: Zero-config workflow security contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/workflow-security-contract.php
      - name: Zero-config repository hygiene contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/repository-hygiene.php
      - name: Zero-config single-plugin contract
        run: php -d auto_prepend_file=tests/php-compat.php tests/single-plugin-contract.php

      - name: Validate PHP and complete contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-contracts.sh
          git diff --check HEAD^ HEAD 2>/dev/null || git diff --check

      - name: Build reproducible package twice
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git log -1 --format=%H -- plugin/wordpressconnector)"
          source_epoch="$(git show -s --format=%ct "$source_sha")"
          python3 scripts/build-release-package.py \
            --source plugin/wordpressconnector \
            --zip "$RUNNER_TEMP/wordpressconnector-a.zip" \
            --sbom "$RUNNER_TEMP/wordpressconnector-a.spdx.json" \
            --source-commit "$source_sha" \
            --source-date-epoch "$source_epoch"
          python3 scripts/build-release-package.py \
            --source plugin/wordpressconnector \
            --zip "$RUNNER_TEMP/wordpressconnector-b.zip" \
            --sbom "$RUNNER_TEMP/wordpressconnector-b.spdx.json" \
            --source-commit "$source_sha" \
            --source-date-epoch "$source_epoch"
          cmp "$RUNNER_TEMP/wordpressconnector-a.zip" "$RUNNER_TEMP/wordpressconnector-b.zip"
          cmp "$RUNNER_TEMP/wordpressconnector-a.spdx.json" "$RUNNER_TEMP/wordpressconnector-b.spdx.json"
          unzip -t "$RUNNER_TEMP/wordpressconnector-a.zip"
          unzip -Z1 "$RUNNER_TEMP/wordpressconnector-a.zip" | grep -qx 'wordpressconnector/wordpressconnector.php'
          if unzip -Z1 "$RUNNER_TEMP/wordpressconnector-a.zip" | grep -Eq '(^|/)(\.git|\.github|tests|node_modules|__pycache__)(/|$)'; then
            echo 'Development-only content leaked into plugin ZIP.' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/wordpressconnector-a.zip" "$RUNNER_TEMP/wordpressconnector-a.spdx.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          zip_path = Path(sys.argv[1])
          sbom = json.loads(Path(sys.argv[2]).read_text())
          package = sbom['packages'][0]
          if package.get('filesAnalyzed') is not True:
              raise SystemExit('SPDX filesAnalyzed must be true.')
          code = package.get('packageVerificationCode', {}).get('packageVerificationCodeValue', '')
          sha1_values = []
          for entry in sbom.get('files', []):
              checksums = {item['algorithm']: item['checksumValue'] for item in entry.get('checksums', [])}
              if 'SHA1' not in checksums or 'SHA256' not in checksums:
                  raise SystemExit('Every SPDX file requires SHA1 and SHA256.')
              sha1_values.append(checksums['SHA1'])
          expected = hashlib.sha1(''.join(sorted(sha1_values)).encode('ascii')).hexdigest()
          if code != expected:
              raise SystemExit('SPDX packageVerificationCode is invalid.')
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          package_checksums = {item['algorithm']: item['checksumValue'] for item in package.get('checksums', [])}
          if package_checksums.get('SHA256') != zip_sha256:
              raise SystemExit('SPDX package checksum does not match ZIP bytes.')
          PY
          python3 -m json.tool "$RUNNER_TEMP/wordpressconnector-a.spdx.json" >/dev/null
          sha256sum "$RUNNER_TEMP/wordpressconnector-a.zip"
          sha256sum "$RUNNER_TEMP/wordpressconnector-a.spdx.json"

      - name: Stage reproducible plugin candidate for review
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/wordpressconnector-a.zip" "$RUNNER_TEMP/wordpressconnector.zip"
          (cd "$RUNNER_TEMP" && sha256sum wordpressconnector.zip > wordpressconnector.zip.sha256)
          (cd "$RUNNER_TEMP" && sha256sum -c wordpressconnector.zip.sha256)

      - name: Upload plugin candidate (not a production release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpressconnector-qa-candidate
          path: |
            ${{ runner.temp }}/wordpressconnector.zip
            ${{ runner.temp }}/wordpressconnector.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Reject dangerous execution primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.php' '\b(eval|shell_exec|passthru|proc_open|popen)\s*\(' plugin; then
            echo 'Forbidden execution primitive found.' >&2
            exit 1
          fi
          forbidden_event="pull_request""_target"
          if grep -RIn "$forbidden_event" .github/workflows; then
            echo 'Privileged pull-request event is forbidden for this repository.' >&2
            exit 1
          fi

  php-compatibility:
    name: PHP ${{ matrix.php }} contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run complete contract suite
        shell: bash
        run: bash scripts/run-contracts.sh

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run official WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: plugin/wordpressconnector
          exclude-checks: |
            plugin_review_phpcs
            plugin_updater
            trademarks
            late_escaping
            performant_wp_query_params

  wordpress-runtime:
    name: WordPress ${{ matrix.wordpress }} / WooCommerce ${{ matrix.woocommerce }} / ${{ matrix.storage }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.4.12'
            woocommerce: 'none'
            storage: 'core'
            hpos: 'none'
            elementor: 'none'
          - wordpress: '6.9.10'
            woocommerce: 'none'
            storage: 'abilities'
            hpos: 'none'
            elementor: 'none'
          - wordpress: '7.0.6'
            woocommerce: '10.9.4'
            storage: 'legacy'
            hpos: 'no'
            elementor: 'none'
          - wordpress: '7.0.6'
            woocommerce: '10.9.4'
            storage: 'hpos'
            hpos: 'yes'
            elementor: 'none'
          - wordpress: '7.1.3'
            woocommerce: '11.2.1'
            storage: 'legacy'
            hpos: 'no'
            elementor: 'none'
          - wordpress: '7.1.3'
            woocommerce: '11.2.1'
            storage: 'hpos'
            hpos: 'yes'
            elementor: 'none'
          - wordpress: '7.1.3'
            woocommerce: 'none'
            storage: 'elementor-mcp'
            hpos: 'none'
            elementor: '4.3.4'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
          tools: wp-cli:2.12.0

      - name: Install WordPress runtime
        shell: bash
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          wp core download --version="$WP_VERSION" --path="$root" --force
          wp config create --path="$root" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$root" --url=http://wordpress.test --title='Connector Runtime' --admin_user=admin --admin_password='runtime-test-password' --admin_email=admin@example.test --skip-email
          mkdir -p "$root/wp-content/plugins/wordpressconnector"
          cp -a plugin/wordpressconnector/. "$root/wp-content/plugins/wordpressconnector/"
          wp plugin activate wordpressconnector --path="$root"
          wp plugin is-active wordpressconnector --path="$root"
          wp eval 'if (!defined("WPCONNECTOR_VERSION")) { throw new RuntimeException("WordPress Connector did not bootstrap."); } echo WPCONNECTOR_VERSION . PHP_EOL;' --path="$root"
          wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-system-doctor-runtime.php" --user=admin --path="$root"

      - name: Test WordPress role previews and capability writes
        if: matrix.wordpress == '7.1.3' && matrix.woocommerce == 'none'
        run: |
          root="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-user-role-runtime.php" --user=admin --path="$root"

      - name: Test WordPress Abilities bridge runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          WPCONNECTOR_ALLOW_WRITES=1 \
          WPCONNECTOR_ALLOW_PRIVILEGED=1 \
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-abilities-runtime.php" --path="$root"

      - name: Test native Yoast SEO 28.7 Abilities with WordPress
        if: matrix.storage == 'abilities'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          wp plugin install wordpress-seo --version=28.7 --activate --path="$root"
          wp plugin is-active wordpress-seo --path="$root"
          # Disposable sandbox: grant explicit Yoast roles for native Ability
          # permission checks. Never change role capabilities on a live site.
          wp cap add administrator wpseo_edit_advanced_metadata --path="$root"
          wp cap add administrator wpseo_manage_options --path="$root"
          WPCONNECTOR_ALLOW_PRIVILEGED=1 \
          WPCONNECTOR_ALLOW_WRITES=1 \
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-yoast-native-runtime.php" --user=admin --path="$root"

      - name: Verify REST plugin capability discovery without endpoint calls
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          WPCONNECTOR_ALLOW_PRIVILEGED=1 \
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-rest-discovery-runtime.php" --user=admin --path="$root"

      - name: Install and test Elementor MCP runtime
        if: matrix.elementor != 'none'
        shell: bash
        env:
          ELEMENTOR_VERSION: ${{ matrix.elementor }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          wp option update elementor_mcp_enabled 1 --path="$root"
          wp plugin install elementor --version="$ELEMENTOR_VERSION" --activate --path="$root"
          wp plugin is-active elementor --path="$root"
          WPCONNECTOR_ALLOW_WRITES=1 \
          WPCONNECTOR_ALLOW_PRIVILEGED=1 \
            wp eval-file "$GITHUB_WORKSPACE/tests/elementor-mcp-runtime.php" --user=admin --path="$root"

      - name: Install and test WooCommerce runtime
        if: matrix.woocommerce != 'none'
        shell: bash
        env:
          WC_VERSION: ${{ matrix.woocommerce }}
          HPOS: ${{ matrix.hpos }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          wp plugin install woocommerce --version="$WC_VERSION" --activate --path="$root"
          wp option update woocommerce_custom_orders_table_data_sync_enabled yes --path="$root"
          wp option update woocommerce_custom_orders_table_enabled "$HPOS" --path="$root"
          WPC_RUNTIME_EXPECT_HPOS="$HPOS" \
          WPCONNECTOR_ALLOW_PRIVILEGED=1 \
          WPCONNECTOR_ALLOW_SENSITIVE=1 \
            wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-woocommerce-runtime.php" --path="$root"

      - name: Test guarded Code Snippets preset against installed provider and WooCommerce
        if: matrix.wordpress == '7.1.3' && matrix.woocommerce == '11.2.1'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          wp plugin install code-snippets --version=3.10.2 --activate --path="$root"
          WPC_CATALOG_RUNTIME_MODE=create wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-code-snippets-catalog-runtime.php" --user=admin --path="$root"
          WPC_CATALOG_RUNTIME_MODE=verify wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-code-snippets-catalog-runtime.php" --user=admin --path="$root"
          WPC_CATALOG_RUNTIME_MODE=undo wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-code-snippets-catalog-runtime.php" --user=admin --path="$root"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect dependency manifest changes
        id: dependency_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      # This public repository currently has no GitHub Dependency Graph API.
      # Audit the exact committed lockfiles instead of falsely declaring an
      # unavailable remote review action successful or skipping advisories.
      - name: Set up pinned dependency audit runtime
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate and audit changed dependency lockfiles
        if: steps.dependency_changes.outputs.changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          mapfile -t composer_dirs < <(printf '%s\n' "$changed" | grep -E '(^|/)composer\.(json|lock)$' | xargs -r -n1 dirname | sort -u)
          mapfile -t node_dirs < <(printf '%s\n' "$changed" | grep -E '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json)$' | xargs -r -n1 dirname | sort -u)
          for dir in "${composer_dirs[@]}"; do
            if test -f "$dir/composer.json"; then
              test -s "$dir/composer.lock" || { echo "Missing Composer lockfile in $dir" >&2; exit 1; }
              composer validate --no-check-publish --working-dir="$dir"
              composer audit --locked --no-interaction --working-dir="$dir"
            fi
          done
          for dir in "${node_dirs[@]}"; do
            if test -f "$dir/package.json"; then
              test -f "$dir/package-lock.json" -o -f "$dir/npm-shrinkwrap.json" || { echo "Missing npm lockfile in $dir" >&2; exit 1; }
              (cd "$dir" && npm audit --package-lock-only --audit-level=moderate)
            fi
          done
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(pnpm-lock\.yaml|yarn\.lock)$'; then
            echo "A changed pnpm/yarn lockfile requires a dedicated locked package-manager audit." >&2
            exit 1
          fi
          echo 'Available exact dependency lockfiles passed security advisory checks.'

      - name: Dependency review not required
        if: steps.dependency_changes.outputs.changed != 'true'
        run: echo 'No dependency manifest or lockfile changed in this pull request.'
