name: Connector CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate PHP and contracts
        shell: bash
        run: |
          set -euo pipefail
          find plugin/wordpressconnector tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/policy-contract.php
          php tests/action-catalog.php
          php tests/custom-css-contract.php
          php tests/elementor-inventory-contract.php
          php tests/elementor-forms-contract.php
          php tests/elementor-json-export-runtime.php
          php tests/elementor-json-import-contract.php
          php tests/state-token-contract.php
          php tests/plugin-control-contract.php
          php tests/plugin-package-contract.php
          php tests/strict-input-contract.php
          php tests/filesystem-control-contract.php
          php tests/repository-hygiene.php
          php tests/rest-transport-contract.php
          php tests/mutation-lock-contract.php
          php tests/single-plugin-contract.php
          git diff --check HEAD^ HEAD 2>/dev/null || git diff --check

      - name: Build and verify installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd plugin
          zip -qr "$RUNNER_TEMP/wordpressconnector.zip" wordpressconnector
          cd "$GITHUB_WORKSPACE"
          unzip -t "$RUNNER_TEMP/wordpressconnector.zip"
          unzip -Z1 "$RUNNER_TEMP/wordpressconnector.zip" | grep -qx 'wordpressconnector/wordpressconnector.php'
          if unzip -Z1 "$RUNNER_TEMP/wordpressconnector.zip" | grep -Eq '(^|/)(\.git|\.github|tests|node_modules|__pycache__)(/|$)'; then
            echo 'Development-only content leaked into plugin ZIP.' >&2
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/wordpressconnector.zip"

      - name: Reject dangerous execution primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.php' '\b(eval|shell_exec|passthru|proc_open|popen)\s*\(' plugin; then
            echo 'Forbidden execution primitive found.' >&2
            exit 1
          fi
          forbidden_event="pull_request""_target"
          if grep -RIn "$forbidden_event" .github/workflows; then
            echo 'Privileged pull-request event is forbidden for this repository.' >&2
            exit 1
          fi
