name: One-time DoctorCura duplicate pair audit

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-duplicate-pair-audit/*.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Compare posts 900066 and 900067 read-only
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-dup-pair"; rm -rf "$root"; mkdir -p "$root"
          for id in 900066 900067; do
            ok=0
            for n in $(seq 1 6); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 60 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/$id.json" -w '%{http_code}' "$site/wp-json/wp/v2/posts/$id?context=edit" || true)
              [[ "$code" == 200 ]] && { ok=1; break; }
              sleep 10
            done
            [[ "$ok" == 1 ]] || { echo "FETCH_FAIL id=$id HTTP=$code" >&2; exit 1; }
          done
          python3 - "$root" <<'PY'
          import difflib,hashlib,html,json,re,sys,os
          root=sys.argv[1]
          def clean(s):
              s=re.sub(r'(?is)<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>',' ',s or '')
              s=html.unescape(re.sub(r'(?s)<[^>]+>',' ',s))
              return re.sub(r'\s+',' ',s).strip()
          rows={}
          for id in (900066,900067):
              p=json.load(open(os.path.join(root,f'{id}.json'),encoding='utf-8'))
              text=clean((p.get('content') or {}).get('raw') or '')
              paras=[clean(x) for x in re.findall(r'(?is)<p\b[^>]*>(.*?)</p>',(p.get('content') or {}).get('raw') or '')]
              yh=p.get('yoast_head_json') or {}
              rows[id]={
                'id':id,'status':p.get('status'),'slug':p.get('slug'),'link':p.get('link'),'date':p.get('date'),'modified':p.get('modified'),
                'title':html.unescape((p.get('title') or {}).get('raw') or ''),'excerpt':clean((p.get('excerpt') or {}).get('raw') or ''),
                'word_count':len(re.findall(r'\b\w+\b',text,re.U)),'paragraphs':len([x for x in paras if x]),
                'text_sha256':hashlib.sha256(text.encode()).hexdigest(),'yoast_title':html.unescape(str(yh.get('title') or '')),
                'yoast_description':html.unescape(str(yh.get('description') or '')),'canonical':yh.get('canonical') or '',
                'text':text,'paras':paras
              }
              print('PAIR_POST '+json.dumps({k:v for k,v in rows[id].items() if k not in ('text','paras')},ensure_ascii=False,separators=(',',':')))
          a,b=rows[900066],rows[900067]
          ratio=difflib.SequenceMatcher(None,a['text'],b['text'],autojunk=False).ratio()
          sa=set(x for x in a['paras'] if len(x)>=80); sb=set(x for x in b['paras'] if len(x)>=80)
          inter=sa&sb; union=sa|sb
          print('PAIR_COMPARE '+json.dumps({
            'full_text_equal':a['text']==b['text'],'sequence_similarity':round(ratio,6),
            'shared_long_paragraphs':len(inter),'long_paragraph_union':len(union),
            'paragraph_jaccard':round(len(inter)/len(union),6) if union else 0,
            'same_title':a['title']==b['title'],'same_excerpt':a['excerpt']==b['excerpt'],'same_canonical':bool(a['canonical']) and a['canonical']==b['canonical']
          },ensure_ascii=False,separators=(',',':')))
          PY
