name: DoctorCura GSC Legacy Redirect Preflight

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-gsc-legacy-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Read active snippet identity only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          out="$RUNNER_TEMP/snippet.json"
          http=$(curl --silent --show-error --location --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' --output "$out" --write-out '%{http_code}' "$base/wp-json/code-snippets/v1/snippets/43")
          [[ "$http" == 200 ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");echo "SNIPPET id=".(int)($s["id"]??0)." name=".(string)($s["name"]??"")." active=".(!empty($s["active"])?"yes":"no")." hash=".hash("sha256",$c)." bytes=".strlen($c).PHP_EOL;preg_match_all("/[^\r\n]*DoctorCura[^\r\n]*/i",$c,$m);foreach(array_values(array_unique($m[0])) as $line){$line=trim($line);if($line!=="")echo "MARKER ".$line.PHP_EOL;}echo "HELPER_COUNT=".substr_count($c,"DoctorCura one-time cache purge helper").PHP_EOL;' "$out"
          echo SNIPPET_IDENTITY_READ_COMPLETE
