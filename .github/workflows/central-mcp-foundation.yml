name: Central MCP foundation

on:
  push:
    paths:
      - 'central-mcp/**'
      - '.github/workflows/central-mcp-foundation.yml'
  pull_request:
    paths:
      - 'central-mcp/**'
      - '.github/workflows/central-mcp-foundation.yml'

permissions:
  contents: read

jobs:
  isolated-security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream commit
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream commit
        with:
          node-version: '22'
      - name: Require complete central MCP source tree
        shell: bash
        run: |
          set -euo pipefail
          for file in central-mcp/package.json central-mcp/auth/package.json central-mcp/src/worker.mjs central-mcp/auth/src/worker.mjs central-mcp/schema.sql; do
            if ! test -s "$file"; then
              echo "::error::Required central MCP source missing: $file"
              exit 1
            fi
          done
      - name: Node policy and registry contracts
        run: node --test central-mcp/test/*.test.mjs
      - name: Compile OAuth-protected stateless MCP Worker without deployment
        working-directory: central-mcp
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm ci --prefix auth --no-audit --no-fund
          npm run build:auth
          # Cloudflare CLI dry-run sends no API requests, has no credentials and deploys nothing.
          ./node_modules/.bin/cf deploy --dry-run --no-provision
          (cd auth && ../node_modules/.bin/cf deploy --dry-run --no-provision)
      - name: SQLite tenant isolation
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(":memory:")
          connection.executescript(Path("central-mcp/schema.sql").read_text())
          connection.execute(
              "INSERT INTO central_sites(id,tenant_id,canonical_origin,label,status,origin_verified) VALUES (?,?,?,?,?,?)",
              ("site-acdrive","team-webactueel","https://example.com","ACDrive","active",1),
          )
          connection.execute(
              "INSERT INTO central_site_grants(site_id,tenant_id,subject,read_granted) VALUES (?,?,?,?)",
              ("site-acdrive","team-webactueel","user-admin",1),
          )
          try:
              connection.execute(
                  "INSERT INTO central_site_grants(site_id,tenant_id,subject,read_granted) VALUES (?,?,?,?)",
                  ("site-acdrive","other-tenant","user-other",1),
              )
          except sqlite3.IntegrityError:
              print("Cross-tenant foreign key guard PASS")
          else:
              raise AssertionError("Cross-tenant grant accepted")
          PY
