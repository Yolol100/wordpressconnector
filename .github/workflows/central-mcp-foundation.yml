name: Central MCP foundation

on:
  push:
    paths:
      - 'central-mcp/**'
      - '.github/workflows/central-mcp-foundation.yml'
  pull_request:
    paths:
      - 'central-mcp/**'
      - '.github/workflows/central-mcp-foundation.yml'

permissions:
  contents: read

jobs:
  isolated-security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify central MCP source exists or is not yet bootstrapped
        id: source
        shell: bash
        run: |
          if test -f central-mcp/package.json && test -f central-mcp/auth/package.json; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif test ! -e central-mcp; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap-only PR: central MCP source has not been merged yet.'
          else
            echo '::error::Partial or invalid central MCP source tree.'
            exit 1
          fi
      - name: Node policy and registry contracts
        if: steps.source.outputs.present == 'true'
        run: node --test central-mcp/test/*.test.mjs
      - name: Compile OAuth-protected stateless MCP Worker without deployment
        if: steps.source.outputs.present == 'true'
        working-directory: central-mcp
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm install --prefix auth --no-audit --no-fund
          npm run build:auth
      - name: SQLite tenant isolation
        if: steps.source.outputs.present == 'true'
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(":memory:")
          connection.executescript(Path("central-mcp/schema.sql").read_text())
          connection.execute(
              "INSERT INTO central_sites(id,tenant_id,canonical_origin,label,status,origin_verified) VALUES (?,?,?,?,?,?)",
              ("site-acdrive","team-webactueel","https://example.com","ACDrive","active",1),
          )
          connection.execute(
              "INSERT INTO central_site_grants(site_id,tenant_id,subject,read_granted) VALUES (?,?,?,?)",
              ("site-acdrive","team-webactueel","user-admin",1),
          )
          try:
              connection.execute(
                  "INSERT INTO central_site_grants(site_id,tenant_id,subject,read_granted) VALUES (?,?,?,?)",
                  ("site-acdrive","other-tenant","user-other",1),
              )
          except sqlite3.IntegrityError:
              print("Cross-tenant foreign key guard PASS")
          else:
              raise AssertionError("Cross-tenant grant accepted")
          PY
