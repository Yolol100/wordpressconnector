name: DoctorCura Phase 6 Post-Cache QA

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/qa-doctorcura-phase6-post-cache.yml'
      - 'doctorcura-audits/phase6-post-cache-qa.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable Phase 6 SEO migration contract after cache purge
        shell: bash
        run: bash doctorcura-audits/phase6-post-cache-qa.sh

