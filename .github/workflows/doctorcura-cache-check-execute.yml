name: DoctorCura Hreflang Readback Execute

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-hreflang-readback-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Revalidate trusted DoctorCura request
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          pr="$RUNNER_TEMP/pr.json"
          code=$(curl --silent --show-error --location --output "$pr" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_REPO_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [[ "$code" == '200' ]] || exit 1
          python3 - "$pr" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          repo=os.environ['GITHUB_REPOSITORY']; owner=os.environ['REPOSITORY_OWNER']; trusted=os.environ.get('TRUSTED_REQUEST_ACTOR',''); expected=os.environ['EXPECTED_HEAD_SHA']
          actor=(p.get('user') or {}).get('login','')
          ok=(p.get('state')=='open' and actor and actor in {owner,trusted} and (p.get('head') or {}).get('sha')==expected and ((p.get('head') or {}).get('repo') or {}).get('full_name')==repo and ((p.get('base') or {}).get('repo') or {}).get('full_name')==repo and (p.get('base') or {}).get('ref')=='main')
          if not ok: raise SystemExit('Trusted DoctorCura request validation failed.')
          PY

      - name: Verify clean hreflang and canonicals
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SITE_URL:-}" == 'https://doctorcura.com' || "${SITE_URL:-}" == 'https://doctorcura.com/' ]] || { echo 'DoctorCura target mismatch.' >&2; exit 1; }
          site="${SITE_URL%/}"
          root="$RUNNER_TEMP/doctorcura-hreflang-readback"
          rm -rf "$root" && mkdir -p "$root"

          fetch_page() {
            curl --silent --show-error --location --connect-timeout 10 --max-time 60 \
              --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
              --output "$2" --write-out '%{http_code}' "$1"
          }

          check_family() {
            slug="$1"; prefix="$2"
            de=$(fetch_page "$site/product/$slug/" "$root/${prefix}-de.html")
            fr=$(fetch_page "$site/fr/product/$slug/" "$root/${prefix}-fr.html")
            en=$(fetch_page "$site/en/product/$slug/" "$root/${prefix}-en.html")
            [[ "$de" == '200' && "$fr" == '200' && "$en" == '200' ]] || { echo "$slug HTTP failure de=$de fr=$fr en=$en" >&2; exit 1; }
          }

          check_family 'condyline' 'condyline'
          check_family 'champix' 'champix'

          python3 - "$root" <<'PY'
          from html.parser import HTMLParser
          import os,sys
          root=sys.argv[1]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.alts={}; self.canon=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()!='link': return
                  a={k.lower():v for k,v in attrs if k and v is not None}
                  rel={x.lower() for x in a.get('rel','').split()}
                  if 'alternate' in rel and a.get('hreflang') and a.get('href'):
                      self.alts[a['hreflang'].lower()]=a['href']
                  if 'canonical' in rel and a.get('href'):
                      self.canon.append(a['href'])

          for slug in ('condyline','champix'):
              expected={
                  'de':f'https://doctorcura.com/product/{slug}/',
                  'fr':f'https://doctorcura.com/fr/product/{slug}/',
                  'en':f'https://doctorcura.com/en/product/{slug}/',
              }
              for lang in ('de','fr','en'):
                  path=os.path.join(root,f'{slug}-{lang}.html')
                  p=Parser(); p.feed(open(path,encoding='utf-8',errors='replace').read())
                  print(f'Observed {slug}/{lang} hreflang={p.alts} canonical={p.canon[:2]}')
                  bad=[k for k,v in expected.items() if p.alts.get(k,'').rstrip('/')!=v.rstrip('/')]
                  if bad:
                      raise SystemExit(f'{slug}/{lang} hreflang missing/incorrect: {bad}')
                  if not p.canon or p.canon[0].rstrip('/')!=expected[lang].rstrip('/'):
                      raise SystemExit(f'{slug}/{lang} canonical mismatch: {p.canon[:2]}')
                  for href in (p.alts.get('de',''),p.alts.get('fr',''),p.alts.get('en','')):
                      if '?' in href or '#' in href:
                          raise SystemExit(f'{slug}/{lang} hreflang URL is not clean: {href}')
                  print(f'{slug}/{lang} PASS')
          print('HREFLANG_CLEAN_RESULT PASS reciprocal clean de/fr/en + self-canonical on six product-language pages.')
          PY

          echo "DOCTORCURA_HREFLANG_READBACK request_id=$REQUEST_ID result=pass pages=6"
