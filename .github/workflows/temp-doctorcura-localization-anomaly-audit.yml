name: Temporary DoctorCura localization anomaly audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-doctorcura-localization-anomaly-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inventory every remaining German localization anomaly
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; base="$site/wp-json/webactueel-wordpress-connector/v1"; root="$RUNNER_TEMP/dcanom"; mkdir -p "$root"
          call(){ suf="$1"; action="$2"; payload="$3"; python3 - "$root/r-$suf.json" "$action" "$payload" <<'PY'
          import json,sys,uuid
          p,a,payload=sys.argv[1:]; json.dump({'version':1,'request_id':'dc-anom-'+uuid.uuid4().hex[:20],'action':a,'dry_run':True,'confirm':False,'payload':json.loads(payload)},open(p,'w'),separators=(',',':'))
          PY
            code=$(curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Content-Type: application/json' --data-binary "@$root/r-$suf.json" -o "$root/o-$suf.json" -w '%{http_code}' "$base/execute"); [[ "$code" == 200 ]]; }
          : > "$root/posts.tsv"; page=1
          while (( page <= 20 )); do
            call "list-$page" post.list "{\"post_type\":\"post\",\"status\":\"publish\",\"per_page\":100,\"page\":$page}"
            python3 - "$root/o-list-$page.json" >> "$root/posts.tsv" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); data=d.get('data') or {}
          for p in data.get('items',[]):
              if isinstance(p,dict) and isinstance(p.get('id'),int): print(f"{p['id']}\t{p.get('slug','')}")
          PY
            pages=$(python3 - "$root/o-list-$page.json" <<'PY'
          import json,sys
          print(int((json.load(open(sys.argv[1])).get('data') or {}).get('pages') or 1))
          PY
            ); (( page >= pages )) && break; page=$((page+1))
          done
          hits=0
          while IFS=$'\t' read -r id slug; do
            call "p-$id" post.get "{\"id\":$id}"
            if python3 - "$root/o-p-$id.json" "$id" "$slug" <<'PY'
          import html,json,re,sys
          d=json.load(open(sys.argv[1])); p=(d.get('data') or {}).get('post') or {}; text=' '.join(str(p.get(k,'')) for k in ('title','excerpt','content')); text=html.unescape(re.sub(r'<[^>]+>',' ',text)); text=re.sub(r'\s+',' ',text)
          pats=[
            r'\bden Deutschland\b',r'\bder Deutschland\b',r'\bdem Deutschland\b',r'\bdes Deutschland\b',r'\bdie Deutschland\b',
            r'\bin den Deutschland\b',r'\baus den Deutschland\b',r'\bvon den Deutschland\b',r'\bfür den Deutschland\b',
            r'je\s+nach\s+Deutschland',r'einzelnen\s+Deutschland',r'Ihrem\s+Deutschland',r'Ihren\s+Deutschland',r'Ihres\s+Deutschland',r'jeweiligen\s+Deutschland',r'jedem\s+Deutschland',
            r'\bDeutschland-(?:Markt|Patient\w*|Adresse\w*|Bundesstaat\w*|Apothek\w*|Gesundheit\w*|Krankenversicherung\w*)',
            r'\b(?:ein|eine|einem|einen|einer)\s+Deutschland\b',r'\bDeutschland\s+zugelassene[nr]?\s+(?:Arzt|Ärztin)',
            r'\bStaat(?:en|es|e|s)?\b',r'\bbundesstaatlich\w*\b',r'\bföderal\w*\b'
          ]
          found=[]
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  ctx=text[max(0,m.start()-360):min(len(text),m.end()+650)]
                  found.append((m.group(0),ctx))
          if found:
              print('ANOMALY id='+sys.argv[2]+' slug='+sys.argv[3])
              seen=set()
              for term,ctx in found:
                  if ctx in seen: continue
                  seen.add(ctx); print('TERM='+term); print('CONTEXT='+ctx)
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then hits=$((hits+1)); fi
          done < "$root/posts.tsv"
          echo "ANOMALY_AUDIT_COMPLETE posts=$(wc -l < "$root/posts.tsv" | tr -d ' ') hit_posts=$hits"
