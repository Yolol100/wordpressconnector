name: One-time DoctorCura content closure audit v3

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-content-closure-audit-v3/*.json'

permissions:
  contents: read

concurrency:
  group: doctorcura-content-closure-audit-v3
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Full 92-post content and metadata closure audit
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || { echo 'Unexpected target' >&2; exit 1; }
          root="$RUNNER_TEMP/dc-content-closure-v3"; rm -rf "$root"; mkdir -p "$root/pages"

          get200(){
            url="$1"; out="$2"
            for n in $(seq 1 8); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 75 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$out" -w '%{http_code}' "$url" || true)
              [[ "$code" == 200 ]] && return 0
              [[ "$code" == 000 || "$code" == 429 || "$code" == 503 ]] && { echo "RETRY $n HTTP=$code"; sleep 12; continue; }
              echo "HTTP_FAIL=$code $url" >&2; return 1
            done
            return 1
          }

          get200 "$site/wp-json/webactueel-wordpress-connector/v1/health" "$root/health.json"
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') and d.get('transport')=='rest',d
          print('CONTENT_CLOSURE_HEALTH_OK version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          page=1
          while (( page <= 20 )); do
            get200 "$site/wp-json/wp/v2/posts?context=edit&per_page=100&page=$page&status=any" "$root/pages/$page.json"
            count=$(python3 - "$root/pages/$page.json" <<'PY'
          import json,sys
          print(len(json.load(open(sys.argv[1],encoding='utf-8'))))
          PY
          )
            (( count < 100 )) && break
            page=$((page+1))
          done
          jq -s 'add' "$root"/pages/*.json > "$root/all-posts.json"

          python3 - "$root/all-posts.json" "$site" <<'PY'
          import collections,concurrent.futures,html,json,re,sys,urllib.parse,urllib.request
          posts=json.load(open(sys.argv[1],encoding='utf-8')); site=sys.argv[2].rstrip('/')
          expected_titles={
            900050:'GLP-1-Therapie für Einsteiger: Was vor dem Start zählt',
            6037:'Wegovy-Behandlung richtig anfragen in 5 Schritten',
            6001:'Schlafmittel online auf Rezept anfragen',
            5988:'Mounjaro-Rezept online ärztlich anfragen',
            5984:'Wann wird ein Online-Rezept abgelehnt – und warum?',
            5926:'Wie schnell kommen rezeptpflichtige Medikamente nach Hause?',
            5902:'Unterschied zwischen Mounjaro und Wegovy erklärt',
            5866:'Wegovy-Rezept online beantragen – so geht es',
          }
          expected_excerpts={
            900050:'GLP-1-Therapie für Einsteiger: So laufen ärztliche Prüfung, Behandlungsbeginn und medizinische Begleitung beim Gewichtsmanagement ab.',
            6037:'Wegovy-Behandlung richtig anfragen: Voraussetzungen, relevante Gesundheitsangaben und Ablauf der ärztlichen Online-Prüfung.',
            6001:'Schlafmittel online auf Rezept anfragen: So läuft die ärztliche Prüfung ab, welche Risiken zählen und wann eine Behandlung infrage kommen kann.',
            5997:'Potenzmittel online auf Rezept anfragen: So laufen ärztliche Prüfung, mögliche Verordnung und Arzneimittelversand ab.',
            5988:'Mounjaro-Rezept online anfragen: Ablauf, ärztliche Prüfung, mögliche Risiken, Kosten und wichtige Voraussetzungen für die Behandlung.',
            5984:'Wann wird ein Online-Rezept abgelehnt? Lesen Sie, welche medizinischen und rechtlichen Gründe eine Rolle spielen und welche Angaben für die ärztliche Prüfung wichtig sind.',
            5926:'Wie schnell rezeptpflichtige Medikamente geliefert werden können, hängt von ärztlicher Prüfung, Verfügbarkeit in der Apotheke und Versand ab.',
            5902:'Unterschied zwischen Mounjaro und Wegovy: Wirkstoffe, Anwendung, Nebenwirkungen und wichtige Kriterien für die ärztliche Auswahl.',
            5866:'Wegovy-Rezept online beantragen: So läuft die ärztliche Prüfung ab, welche Angaben wichtig sind und wann eine Behandlung infrage kommen kann.',
          }
          target_ids=set([900050,6037,6035,6018,6001,5997,5988,5984,5926,5920,5902,5900,5866])
          residue_families={
            'explicit_us':[
              r'\bUSA\b',r'United\s+States(?:\s+of\s+America)?',r'\bU\.\s*S\.\s*A?\.?\b',
              r'\bVereinigte\s+Staaten\b',r'\bUS-amerikan\w*\b',r'\bAmerika(?:nisch\w*)?\b',r'\bAmerican(?:s|er|e|en|em|es)?\b'
            ],
            'us_regulatory_health_system':[
              r'\bFDA\b',r'Food\s+and\s+Drug\s+Administration',r'\bDEA\b',r'\bHIPAA\b',r'\bMedicare\b',r'\bMedicaid\b',
              r'Pharmacy\s+Benefit(?:\s+Plan|\s+Manager)?',r'Primary[- ]Care(?:\s+Provider|-Anbieter)?',r'\bZepbound\b'
            ],
            'us_emergency_geo_currency':[
              r'\b911\b',r'\b988\b',r'1-800-222-1222',r'Suicide\s*&\s*Crisis\s*Lifeline',
              r'\bCalifornia\b',r'\bTexas\b',r'\bFlorida\b',r'\bNew\s+York\b',r'Washington,?\s+D\.?C\.?',r'\bUSD\b',r'US\$',r'\bUS[- ]Dollar\w*\b'
            ],
            'state_federal_context':[
              r'\bBundesstaat\w*\b',r'\bbundesstaatlich\w*\b',r'\bföderal\w*\b',r'\bfederal(?:e|en|er|es|em)?\b',r'\bstate\s+(?:law|laws|regulation|regulations|requirements)\b'
            ],
            'broken_german_localization':[
              r'\bin\s+den\s+Deutschland\b',r'\baus\s+den\s+Deutschland\b',r'\bvon\s+den\s+Deutschland\b',r'\bfür\s+den\s+Deutschland\b',
              r'\bje\s+nach\s+Deutschland\b',r'\bEbene\s+der\s+Deutschland\b',r'\bin\s+meinem\s+Deutschland\b',r'\bin\s+dem\s+Deutschland\b',
              r'\bim\s+Deutschland\b',r'\beinem\s+Deutschland\b',r'\beiner\s+Deutschland\b'
            ],
            'phase3_editorial_residue':[
              r'\bGLP1\b',r'\bWegovy\s+Rezept\b',r'\bMounjaro\s+Rezept\b',r'\bSchlafmittel\s+online\s+Rezept\b',r'\bpotenzmittel\s+online\s+rezept\b',
              r'\bRezeptmedizin\b',r'\bmounjaro\s+oder\s+wegovy\s+unterschied\b',r'\bDie\s+beste\s+online\s+Behandlungen\b',
              r'\bgewichtstherapie\s+mit\s+glp1\s+medikamenten\b',r'consultation\s+included',r'doctor\s+review',r'shipping\s+included'
            ]
          }
          us_hosts=('fda.gov','dea.gov','hhs.gov','cms.gov','medicare.gov','medicaid.gov','988lifeline.org')
          href_rx=re.compile(r'href=["\']([^"\']+)',re.I)
          def strip_markup(s):
              s=re.sub(r'(?is)<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>',' ',s or '')
              return re.sub(r'\s+',' ',html.unescape(re.sub(r'(?s)<[^>]+>',' ',s))).strip()
          by_id={int(p.get('id')):p for p in posts if isinstance(p.get('id'),int)}
          failures=[]; hits=[]; all_internal=[]; public_targets=[]
          for pid in sorted(target_ids):
              p=by_id.get(pid)
              if not p: failures.append(('target_missing',pid,'')); continue
              if p.get('status')!='publish': failures.append(('target_not_published',pid,p.get('status')))
              if pid in expected_titles:
                  got=html.unescape((p.get('title') or {}).get('raw') or '')
                  if got!=expected_titles[pid]: failures.append(('title_mismatch',pid,got))
              if pid in expected_excerpts:
                  got=strip_markup((p.get('excerpt') or {}).get('raw') or '')
                  if got!=expected_excerpts[pid]: failures.append(('excerpt_mismatch',pid,got))
              public_targets.append((pid,p.get('link') or urllib.parse.urljoin(site+'/',str(p.get('slug') or '')+'/')))
          paragraph_bank=collections.defaultdict(set)
          for p in posts:
              pid=int(p.get('id') or 0); yh=p.get('yoast_head_json') or {}
              fields={
                'title':html.unescape((p.get('title') or {}).get('raw') or ''),
                'excerpt':strip_markup((p.get('excerpt') or {}).get('raw') or ''),
                'content':strip_markup((p.get('content') or {}).get('raw') or ''),
                'yoast_title':html.unescape(str(yh.get('title') or '')),
                'yoast_description':html.unescape(str(yh.get('description') or '')),
                'yoast_og_title':html.unescape(str(yh.get('og_title') or '')),
                'yoast_og_description':html.unescape(str(yh.get('og_description') or '')),
              }
              for field,text in fields.items():
                  for family,patterns in residue_families.items():
                      for pat in patterns:
                          m=re.search(pat,text,re.I)
                          if m: hits.append((family,pid,field,m.group(0)))
              raw=(p.get('content') or {}).get('raw') or ''
              for node in re.split(r'(<[^>]+>)',raw)[::2]:
                  decoded=html.unescape(node)
                  m=re.search(r'[ \t]+[,.!?;:]',decoded)
                  if m: hits.append(('raw_punctuation_spacing',pid,'content',m.group(0))); break
              for u in href_rx.findall(raw):
                  u=html.unescape(u.strip())
                  if not u or u.startswith(('#','mailto:','tel:','javascript:','data:')): continue
                  absu=urllib.parse.urljoin(p.get('link') or site+'/',u)
                  host=urllib.parse.urlparse(absu).netloc.lower()
                  if any(host==x or host.endswith('.'+x) for x in us_hosts): hits.append(('us_href',pid,'href',absu))
                  if host==urllib.parse.urlparse(site).netloc.lower(): all_internal.append((pid,absu))
              for para in re.findall(r'(?is)<p\b[^>]*>(.*?)</p>',raw):
                  txt=strip_markup(para)
                  if len(txt)>=180: paragraph_bank[txt].add(pid)
          if hits:
              for h in hits[:200]: print('CLOSURE_HIT',json.dumps(h,ensure_ascii=False))
              failures.append(('residue_hits',len(hits),hits[:20]))
          exact_cross=[(txt,sorted(ids)) for txt,ids in paragraph_bank.items() if len(ids)>=2]
          print('EXACT_CROSS_POST_PARAGRAPHS',len(exact_cross))
          for txt,ids in exact_cross[:20]: print('CROSS_PARAGRAPH',ids,txt[:300])

          def check_url(item):
              pid,u=item
              for attempt in range(3):
                  for method in ('HEAD','GET'):
                      try:
                          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 DoctorCuraContentClosure/1.0'},method=method)
                          with urllib.request.urlopen(req,timeout=20) as r:return pid,u,r.status,r.geturl()
                      except Exception as e:
                          code=int(getattr(e,'code',0) or 0)
                          if code in (405,): continue
                  if attempt<2:
                      import time; time.sleep(3)
              return pid,u,code,u
          unique_internal=[]; seen=set()
          for item in all_internal+public_targets:
              key=item[1]
              if key not in seen:seen.add(key);unique_internal.append(item)
          broken=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for pid,u,code,final in ex.map(check_url,unique_internal):
                  if not (200<=code<400): broken.append((pid,code,u))
          for b in broken[:100]: print('BROKEN_INTERNAL',json.dumps(b,ensure_ascii=False))
          if broken: failures.append(('broken_internal_links',len(broken),broken[:20]))

          summary={
            'posts_checked':len(posts),'target_posts_checked':len(target_ids),'residue_hits':len(hits),
            'internal_urls_checked':len(unique_internal),'broken_internal_urls':len(broken),
            'exact_cross_post_paragraphs':len(exact_cross),'failures':len(failures)
          }
          print('CONTENT_CLOSURE_SUMMARY '+json.dumps(summary,ensure_ascii=False,separators=(',',':')))
          if failures:
              for f in failures: print('CLOSURE_FAILURE '+json.dumps(f,ensure_ascii=False))
              raise SystemExit(1)
          print('CONTENT_CLOSURE_OK')
          PY
