name: One-time DoctorCura final master recheck

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-final-master-recheck/*.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Recheck all DoctorCura work read-only
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          base="$site/wp-json/webactueel-wordpress-connector/v1"
          root="$RUNNER_TEMP/dc-master-recheck"; rm -rf "$root"; mkdir -p "$root/posts" "$root/yoast" "$root/pages" "$root/elementor" "$root/options"

          code=$(curl -sS -L --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/health.json" -w '%{http_code}' "$base/health" || true)
          [[ "$code" == 200 ]] || { echo "HEALTH_HTTP=$code"; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok') and d.get('transport')=='rest',d
          print('HEALTH_OK version=',d.get('version') or d.get('connector_version'))
          PY

          call(){
            suffix="$1"; action="$2"; payload="$3"
            python3 - "$root/r-$suffix.json" "$action" "$payload" <<'PY'
          import json,sys,uuid
          out,action,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':'dc-master-'+uuid.uuid4().hex[:20],'action':action,'dry_run':True,'confirm':False,'payload':json.load(open(payload,encoding='utf-8'))},open(out,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            for attempt in $(seq 1 8); do
              code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Content-Type: application/json' --data-binary "@$root/r-$suffix.json" -o "$root/o-$suffix.json" -w '%{http_code}' "$base/execute" || true)
              if [[ "$code" == 200 ]] && python3 - "$root/o-$suffix.json" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1],encoding='utf-8'))
          except:raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') else 1)
          PY
              then return 0; fi
              [[ "$code" == 503 || "$code" == 000 ]] && { sleep 10; continue; }
              echo "$action failed HTTP=$code" >&2; cat "$root/o-$suffix.json" >&2 || true; return 1
            done
            return 1
          }

          # WooCommerce business address and market restrictions.
          for key in woocommerce_store_address woocommerce_store_address_2 woocommerce_store_city woocommerce_store_postcode woocommerce_default_country woocommerce_allowed_countries woocommerce_specific_allowed_countries woocommerce_all_except_countries woocommerce_ship_to_countries woocommerce_specific_ship_to_countries; do
            printf '{"name":"%s"}' "$key" > "$root/p.json"
            call "opt-${key//_/-}" option.get "$root/p.json"
            cp "$root/o-opt-${key//_/-}.json" "$root/options/$key.json"
          done

          # Inventory all relevant objects, then read them. Elementor is additionally inspected for pages/templates.
          : > "$root/objects.tsv"
          for type in page post product elementor_library wp_block; do
            for page in $(seq 1 25); do
              printf '{"post_type":"%s","status":"any","per_page":100,"page":%s}' "$type" "$page" > "$root/list.json"
              if ! call "list-$type-$page" post.list "$root/list.json"; then break; fi
              count=$(python3 - "$root/o-list-$type-$page.json" "$root/objects.tsv" "$type" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); items=(d.get('data') or {}).get('items',[]); typ=sys.argv[3]
          with open(sys.argv[2],'a',encoding='utf-8') as f:
              for x in items:
                  if isinstance(x,dict) and isinstance(x.get('id'),int): f.write(f"{x['id']}\t{typ}\n")
          print(len(items))
          PY
          )
              [[ "$count" -lt 100 ]] && break
            done
          done
          sort -u "$root/objects.tsv" -o "$root/objects.tsv"

          while IFS=$'\t' read -r id type; do
            printf '{"id":%s}' "$id" > "$root/id.json"
            call "get-$id" post.get "$root/id.json" || continue
            cp "$root/o-get-$id.json" "$root/posts/$id.json"
            if [[ "$type" == post ]]; then
              call "yoast-$id" yoast.inspect "$root/id.json" || true
              [[ -f "$root/o-yoast-$id.json" ]] && cp "$root/o-yoast-$id.json" "$root/yoast/$id.json"
            fi
            if [[ "$type" == page || "$type" == elementor_library ]]; then
              if call "el-$id" elementor.inspect "$root/id.json"; then cp "$root/o-el-$id.json" "$root/elementor/$id.json"; fi
            fi
          done < "$root/objects.tsv"

          # Code Snippets and DoctorCura Core contact source are part of the contact-address surface.
          scode=$(curl -sS -L --connect-timeout 10 --max-time 60 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/snippets.json" -w '%{http_code}' "$site/wp-json/code-snippets/v1/snippets?per_page=100&page=1" || true)
          echo "SNIPPETS_HTTP=$scode"
          printf '%s' '{"path":"wp-content/plugins/doctorcura-core/includes/extra-request-form.php"}' > "$root/fs.json"
          call core-contact filesystem.read_text "$root/fs.json" || true

          # Public WordPress page list and rendered page snapshots, including contact/privacy/footer output.
          pcode=$(curl -sS -L --connect-timeout 10 --max-time 60 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/pages.json" -w '%{http_code}' "$site/wp-json/wp/v2/pages?per_page=100&context=edit&status=publish")
          [[ "$pcode" == 200 ]] || exit 1
          python3 - "$root" "$site" <<'PY'
          import concurrent.futures,html,json,os,re,sys,urllib.parse,urllib.request
          root,site=sys.argv[1:]
          pages=json.load(open(root+'/pages.json',encoding='utf-8'))
          def fetch(p):
              u=p.get('link') or urllib.parse.urljoin(site+'/',str(p.get('slug',''))+'/')
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 DoctorCuraFinalRecheck'})
                  with urllib.request.urlopen(req,timeout=25) as r:return p.get('id'),p.get('slug'),u,r.status,r.read().decode('utf-8','replace')
              except Exception as e:return p.get('id'),p.get('slug'),u,int(getattr(e,'code',0) or 0),''
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for row in ex.map(fetch,pages):out.append(row)
          for pid,slug,u,code,body in out:
              open(f'{root}/pages/{pid}.html','w',encoding='utf-8').write(body)
          json.dump([{'id':a,'slug':b,'url':c,'status':d} for a,b,c,d,_ in out],open(root+'/rendered-pages.json','w',encoding='utf-8'),indent=2)
          PY

          # Final assertions and evidence report.
          python3 - "$root" "$site" <<'PY'
          import concurrent.futures,html,json,os,re,sys,urllib.parse,urllib.request
          from html.parser import HTMLParser
          root,site=sys.argv[1:]
          expected_phone='+31 85 505 54 33'; expected_tel='tel:+31855055433'
          expected_addr='Veldbloemlaan 93, 3452CK Vleuten, The Netherlands'
          old_contact=re.compile(r'Keizersgracht\s*241|1016\s*EA\s*,?\s*Amsterdam|\b08\s*550\s*55\s*433\b|\b085\s*505\s*5433\b|\b0855055433\b|\+31\s*\(0\)\s*85\s*505\s*5433\b|\+31\s+85\s+505\s+5433\b|\+31\s+85\s+505\s+54(?!\s*33)(?=\s|<|$)|tel:\+318550554(?!33)',re.I)
          us_visible=re.compile(r'\b(?:USA|United States|Vereinigte Staaten|Bundesstaat(?:s|en)?|FDA|DEA|HIPAA|Zepbound|Medicare|Medicaid|USD|California|Texas|Florida|New York)\b|Suicide\s*&\s*Crisis\s*Lifeline|\bUS-amerikan\w*\b',re.I)
          awkward=re.compile(r'in den Deutschland|von ein entsprechend zugelassener|eines ärztlichen Rückfragens|variieren kosten|Mounjaro enthält wie Mounjaro|Gewichtsverlust Medikamente Vergleich|Behandlung erektile Dysfunktion online|Potenzbehandlung digital beantragen leicht|\bsofort Rezept online\b|medikamente aus EU apotheke sicher|Viagra Wirkung Review|Mounjaro Bewertung',re.I)
          targets={900060,900048,900043,6050,6048,6046,6044,6042,6033,6020,6008,5999,5995,5993,5990,5986,5904,5896,5892}
          class Txt(HTMLParser):
              def __init__(self):super().__init__();self.x=[]
              def handle_data(self,d):self.x.append(d)
              def handle_endtag(self,t):
                  if t in {'p','li','h1','h2','h3','h4','h5','h6','br','div'}:self.x.append('\n')
              def text(self):return re.sub(r'[ \t]+',' ',html.unescape(''.join(self.x))).strip()
          def visible(s):
              p=Txt();
              try:p.feed(s or '')
              except:pass
              return p.text()
          def walk(v):
              if isinstance(v,str):yield v
              elif isinstance(v,list):
                  for x in v:yield from walk(x)
              elif isinstance(v,dict):
                  for x in v.values():yield from walk(x)
          # Options.
          def oval(k):
              d=json.load(open(f'{root}/options/{k}.json',encoding='utf-8'));return (d.get('data') or {}).get('value')
          assert oval('woocommerce_store_address')=='Veldbloemlaan 93'
          assert oval('woocommerce_store_address_2')==''
          assert oval('woocommerce_store_city')=='Vleuten'
          assert oval('woocommerce_store_postcode')=='3452CK'
          assert oval('woocommerce_default_country')=='NL'
          assert oval('woocommerce_allowed_countries')=='specific'
          assert oval('woocommerce_specific_allowed_countries')==['DE','FR','GB']
          assert oval('woocommerce_all_except_countries')==[]
          assert oval('woocommerce_ship_to_countries')==''
          assert oval('woocommerce_specific_ship_to_countries')==[]

          contact_hits=[]; new_contact_locations=[]; post_us=[]; target_quality=[]; target_links=[]; kvk_seen=False
          type_by_id={}
          for line in open(root+'/objects.tsv',encoding='utf-8'):
              i,t=line.rstrip('\n').split('\t');type_by_id[int(i)]=t
          for fn in os.listdir(root+'/posts'):
              pid=int(fn[:-5]);d=json.load(open(root+'/posts/'+fn,encoding='utf-8')); p=(d.get('data') or {}).get('post') or {}
              blob=' '.join(str(p.get(k) or '') for k in ('title','excerpt','content'))
              if old_contact.search(blob):contact_hits.append(('post',pid,old_contact.search(blob).group(0)))
              if 'Veldbloemlaan 93' in blob or expected_phone in blob:new_contact_locations.append(('post',pid))
              if type_by_id.get(pid)=='post':
                  text=' '.join([str(p.get('title') or ''),str(p.get('excerpt') or ''),visible(str(p.get('content') or ''))])
                  y={}
                  yp=f'{root}/yoast/{pid}.json'
                  if os.path.exists(yp):y=(json.load(open(yp,encoding='utf-8')).get('data') or {}).get('fields') or {}
                  meta=' '.join(str(y.get(k) or '') for k in ('title','description','focus_keyphrase','breadcrumb_title','opengraph_title','opengraph_description','twitter_title','twitter_description'))
                  m=us_visible.search(text+' '+meta)
                  if m:post_us.append((pid,m.group(0)))
                  if pid in targets:
                      am=awkward.search(text+' '+meta)
                      if am:target_quality.append((pid,'awkward',am.group(0)))
                      if re.search(r'[ \t]+[,.!?;:]',text):target_quality.append((pid,'punctuation','spacing'))
                      links=re.findall(r'href=["\']([^"\']+)',str(p.get('content') or ''),re.I)
                      target_links.extend((pid,urllib.parse.urljoin(site+'/',html.unescape(u))) for u in links if u.startswith(('http://','https://','/')))
          for fn in os.listdir(root+'/elementor'):
              pid=int(fn[:-5]);d=json.load(open(root+'/elementor/'+fn,encoding='utf-8'));data=d.get('data')
              strings=list(walk(data))
              joined='\n'.join(strings)
              m=old_contact.search(joined)
              if m:contact_hits.append(('elementor',pid,m.group(0)))
              if 'Veldbloemlaan' in joined or expected_phone in joined:new_contact_locations.append(('elementor',pid))
              if re.search(r'\bKvK\b|\bKVK\b',joined):kvk_seen=True
          # Exact Contact / footer surfaces.
          c9=json.load(open(root+'/elementor/9.json',encoding='utf-8')).get('data') if os.path.exists(root+'/elementor/9.json') else None
          f3285=json.load(open(root+'/elementor/3285.json',encoding='utf-8')).get('data') if os.path.exists(root+'/elementor/3285.json') else None
          assert c9 is not None and f3285 is not None,'Missing Contact or footer Elementor evidence'
          cstr='\n'.join(walk(c9)); fstr='\n'.join(walk(f3285))
          assert expected_phone in cstr,'Contact visible phone missing'
          assert expected_tel in cstr,'Contact tel link missing'
          assert 'Veldbloemlaan 93' in cstr and '3452CK Vleuten' in cstr,'Contact address missing'
          assert 'Veldbloemlaan 93' in fstr and '3452CK Vleuten' in fstr,'Footer address missing'
          maps=[]
          def maps_walk(v):
              if isinstance(v,dict):
                  if v.get('widgetType')=='google_maps' and isinstance(v.get('settings'),dict):maps.append(v['settings'].get('address'))
                  for x in v.values():maps_walk(x)
              elif isinstance(v,list):
                  for x in v:maps_walk(x)
          maps_walk(c9)
          assert expected_addr in maps,('Google Maps mismatch',maps)
          # Snippets and core file.
          if os.path.exists(root+'/snippets.json'):
              s=json.load(open(root+'/snippets.json',encoding='utf-8'));items=s if isinstance(s,list) else s.get('items',s.get('snippets',[])) if isinstance(s,dict) else []
              for x in items:
                  if isinstance(x,dict) and isinstance(x.get('code'),str):
                      m=old_contact.search(x['code'])
                      if m:contact_hits.append(('snippet',x.get('id'),m.group(0)))
          if os.path.exists(root+'/o-core-contact.json'):
              d=json.load(open(root+'/o-core-contact.json',encoding='utf-8'));txt=str((d.get('data') or {}).get('content') or '')
              m=old_contact.search(txt)
              if m:contact_hits.append(('doctorcura-core',0,m.group(0)))
          # Rendered pages: old contact values nowhere; contact page exact; privacy surfaces present if published.
          rendered=json.load(open(root+'/rendered-pages.json',encoding='utf-8'));privacy=[]; contact_rendered=None
          for r in rendered:
              if r['status']!=200:raise SystemExit('PUBLIC_PAGE_HTTP '+repr(r))
              body=open(f"{root}/pages/{r['id']}.html",encoding='utf-8',errors='replace').read()
              m=old_contact.search(body)
              if m:contact_hits.append(('rendered-page',r['id'],m.group(0)))
              if re.search(r'privacy|datenschutz|privacybeleid',str(r.get('slug') or ''),re.I):privacy.append(r)
              if str(r.get('slug') or '').lower()=='contact':contact_rendered=body
              if re.search(r'\bKvK\b|\bKVK\b',visible(body)):kvk_seen=True
          assert contact_rendered and 'Veldbloemlaan 93' in visible(contact_rendered) and expected_phone in visible(contact_rendered),'Rendered contact mismatch'
          assert privacy,'No published privacy/datenschutz page found'
          if contact_hits:raise SystemExit('LEGACY_CONTACT '+repr(contact_hits[:20]))
          if post_us:raise SystemExit('US_REFERENCES '+repr(post_us[:30]))
          if target_quality:raise SystemExit('TARGET_LANGUAGE '+repr(target_quality[:30]))
          # Current link health on all 19 affected posts.
          def chk(x):
              pid,u=x;last=None
              for method in ('HEAD','GET'):
                  try:
                      q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 DoctorCuraMasterQA'},method=method)
                      with urllib.request.urlopen(q,timeout=18) as r:return pid,u,r.status,r.geturl()
                  except Exception as e:last=e
              return pid,u,int(getattr(last,'code',0) or 0),u
          broken=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for pid,u,code,final in ex.map(chk,target_links):
                  internal=urllib.parse.urlparse(u).netloc.lower().endswith('doctorcura.com')
                  bad=(not 200<=code<400) if internal else (code==0 or code>=500 or code==404)
                  if bad:broken.append((pid,code,u))
          if broken:raise SystemExit('BROKEN_LINKS '+repr(broken[:20]))
          # Old USA slug must redirect to German canonical URL.
          old=site+'/ist-ein-online-rezept-legal-usa/'
          try:
              req=urllib.request.Request(old,headers={'User-Agent':'Mozilla/5.0 DoctorCuraMasterQA'})
              with urllib.request.urlopen(req,timeout=25) as r: old_final=r.geturl(); old_code=r.status
          except Exception as e: old_final=old; old_code=int(getattr(e,'code',0) or 0)
          assert old_code==200 and old_final==site+'/ist-ein-online-rezept-legal-deutschland/',(old_code,old_final)
          report={
            'health':'ok','woocommerce':{'store_address':'Veldbloemlaan 93','postcode':'3452CK','city':'Vleuten','country':'NL','selling':['DE','FR','GB'],'shipping':'same_as_selling'},
            'contact':{'phone':expected_phone,'tel':expected_tel,'google_maps':expected_addr,'legacy_hits':0,'new_contact_locations':len(new_contact_locations),'kvk_seen':kvk_seen},
            'content':{'all_posts_us_reference_hits':0,'affected_posts_checked':len(targets),'language_regex_hits':0,'links_checked':len(target_links),'broken_links':0},
            'public_pages':{'checked':len(rendered),'privacy_pages':privacy},
            'old_usa_slug_redirect':old_final
          }
          json.dump(report,open(root+'/master-report.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('MASTER_RECHECK_OK posts_us=0 affected=19 links=',len(target_links),'broken=0 legacy_contact=0 pages=',len(rendered),'privacy=',len(privacy),'kvk_seen=',kvk_seen)
          PY

      - name: Upload master recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-final-master-recheck
          path: ${{ runner.temp }}/dc-master-recheck
          retention-days: 7
          if-no-files-found: warn
