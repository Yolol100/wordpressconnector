name: One-time DoctorCura Redirection existing rule inspect 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-redirection-rule-inspect-20260911.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List all existing Redirection rules
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          out="$RUNNER_TEMP/rules.json"
          code=$(curl -sS --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --get --data-urlencode 'per_page=200' -H 'Accept: application/json' -o "$out" -w '%{http_code}' "$site/wp-json/redirection/v1/redirect" || true)
          echo "HTTP=$code"
          [[ "$code" == 200 ]]
          python3 - "$out" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          items=d.get('items') or []
          print('TOTAL='+str(len(items)))
          for i in items:
              print('RULE '+json.dumps({k:i.get(k) for k in ['id','url','match_url','match_data','match_type','action_type','action_code','action_data','title','regex','status','enabled','group_id','position']},ensure_ascii=False,separators=(',',':')))
          PY
