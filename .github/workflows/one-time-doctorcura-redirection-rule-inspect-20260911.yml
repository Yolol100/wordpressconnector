name: One-time DoctorCura Redirection API schema inspect 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-redirection-rule-inspect-20260911.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Redirection groups, endpoint schema and nested rules
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1

          groups="$RUNNER_TEMP/groups.json"
          code=$(curl -sS --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$groups" -w '%{http_code}' "$site/wp-json/redirection/v1/group?per_page=200" || true)
          echo "GROUPS_HTTP=$code"
          python3 - "$groups" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('GROUPS='+json.dumps(d,ensure_ascii=False,separators=(',',':'))[:12000])
          PY

          schema="$RUNNER_TEMP/schema.json"
          code=$(curl -sS -X OPTIONS --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$schema" -w '%{http_code}' "$site/wp-json/redirection/v1/redirect" || true)
          echo "SCHEMA_HTTP=$code"
          python3 - "$schema" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('SCHEMA='+json.dumps(d,ensure_ascii=False,separators=(',',':'))[:20000])
          PY

          for term in '/en/ch/' '/fr/ch/'; do
            out="$RUNNER_TEMP/rules.json"
            code=$(curl -sS --connect-timeout 10 --max-time 45 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --get --data-urlencode "filterBy[url]=$term" --data-urlencode 'per_page=200' -H 'Accept: application/json' -o "$out" -w '%{http_code}' "$site/wp-json/redirection/v1/redirect" || true)
            echo "RULES_HTTP term=$term http=$code"
            python3 - "$out" "$term" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); term=sys.argv[2]
          items=d.get('items') if isinstance(d,dict) else []
          print('RULE_COUNT term=%s count=%d'%(term,len(items or [])))
          for i in items or []:
              print('RULE '+json.dumps({k:i.get(k) for k in ['id','url','match_url','action_type','action_code','action_data','title','regex','status','group_id']},ensure_ascii=False,separators=(',',':')))
          PY
          done
