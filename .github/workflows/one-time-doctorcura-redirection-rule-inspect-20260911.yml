name: One-time DoctorCura nested redirect cache-bust verify 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-redirection-rule-inspect-20260911.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify existing canary bypassing page cache
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          source_path='/en/ch/gewichtsmanagement/'
          target_url='https://doctorcura.com/en/gewichtsmanagement/'
          test_url="$site${source_path}?redirectcheck=${GITHUB_RUN_ID}"
          headers="$RUNNER_TEMP/headers.txt"
          code=$(curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o /dev/null --max-redirs 0 -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' "$test_url" || true)
          loc=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
          echo "VERIFY_BUST_INITIAL http=$code location=$loc"
          grep -Ei '^(server|cache-control|x-redirect-by|x-cache|cf-cache-status|location):' "$headers" || true
          [[ "$code" == 301 && "$loc" == "$target_url" ]]
          final=$(curl -sS --connect-timeout 10 --max-time 45 -L --max-redirs 5 -H 'Cache-Control: no-cache, no-store' -o /dev/null -w '%{http_code}|%{url_effective}' "$test_url" || true)
          echo "VERIFY_BUST_FINAL=$final"
          [[ "$final" == "200|$target_url" ]]
          echo 'CACHE_BUST_CANARY_SUCCESS'
