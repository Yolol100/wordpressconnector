name: WPCS exact PHP semantics probe
on:
  push:
    branches: [fix/release-readiness-guarded-wpcs-20261019]
    paths: [.github/workflows/wpcs-safe-semantic-probe.yml]
permissions:
  contents: read
jobs:
  compare-fixer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install official WPCS in disposable tools directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs"
          cd "$RUNNER_TEMP/wpcs"
          composer init --no-interaction --name wordpressconnector/semantic-probe --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Diagnose safe token parity for the worst remaining source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs-semantic"
          cat > "$RUNNER_TEMP/wpcs-semantic/compare.php" <<'PHP'
          <?php
          declare(strict_types=1);
          function normalizedTokens(string $file): array {
              $source = file_get_contents($file);
              if (!is_string($source)) { throw new RuntimeException('Unreadable source'); }
              $t = token_get_all($source);
              $tokens = array();
              foreach ($t as $token) {
                  if (is_array($token)) {
                      if (T_WHITESPACE === $token[0]) { continue; }
                      if (in_array($token[0], array(T_COMMENT, T_DOC_COMMENT), true)) {
                          // Do not allow insertion/removal of comments or new directives.
                          $tokens[] = array($token[0], preg_replace('/[ \t\r\n]+/', ' ', $token[1]));
                      } else {
                          $tokens[] = array($token[0], $token[1]);
                      }
                  } else { $tokens[] = $token; }
              }
              $filtered = array();
              for ($i = 0, $n = count($tokens); $i < $n; ++$i) {
                  // PHP 7.4 supports trailing commas in argument and array lists.
                  if (',' === $tokens[$i] && isset($tokens[$i+1]) && in_array($tokens[$i+1], array(')', ']'), true)) { continue; }
                  $filtered[] = $tokens[$i];
              }
              return $filtered;
          }
          $before=normalizedTokens($argv[1]);
          $after=normalizedTokens($argv[2]);
          $mismatch=0;
          while ($mismatch<min(count($before),count($after)) && $before[$mismatch]===$after[$mismatch]) { ++$mismatch; }
          echo json_encode(array(
             'before_tokens'=>count($before),'after_tokens'=>count($after),
             'semantic_token_equal'=>$before===$after,
             'mismatch_at'=>$mismatch,
             'before_token'=>$before[$mismatch]??null,
             'after_token'=>$after[$mismatch]??null,
          ), JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL;
          PHP
          candidates=(
            plugin/wordpressconnector/includes/Adapters/AcfAdapter.php
            plugin/wordpressconnector/includes/Adapters/CoreAdapter.php
            plugin/wordpressconnector/includes/Adapters/ConnectorUpdateAdapter.php
            plugin/wordpressconnector/includes/Adapters/WooCommerceAdapter.php
          )
          for candidate in "${candidates[@]}"; do
            id="$(basename "$candidate" .php)"
            cp "$candidate" "$RUNNER_TEMP/wpcs-semantic/$id.before.php"
            "$RUNNER_TEMP/wpcs/vendor/bin/phpcs" --standard=WordPress --report=summary "$candidate" > "$RUNNER_TEMP/wpcs-semantic/$id.before.txt" 2>&1 || true
            "$RUNNER_TEMP/wpcs/vendor/bin/phpcbf" --standard=WordPress "$candidate" > "$RUNNER_TEMP/wpcs-semantic/$id.fixer.txt" 2>&1 || true
            php -l "$candidate" >> "$RUNNER_TEMP/wpcs-semantic/$id.fixer.txt" 2>&1 || true
            "$RUNNER_TEMP/wpcs/vendor/bin/phpcs" --standard=WordPress --report=summary "$candidate" > "$RUNNER_TEMP/wpcs-semantic/$id.after.txt" 2>&1 || true
            php "$RUNNER_TEMP/wpcs-semantic/compare.php" "$RUNNER_TEMP/wpcs-semantic/$id.before.php" "$candidate" > "$RUNNER_TEMP/wpcs-semantic/$id.token-diff.json" 2>&1 || true
            git diff -- "$candidate" > "$RUNNER_TEMP/wpcs-semantic/$id.patch"
            cp "$RUNNER_TEMP/wpcs-semantic/$id.before.php" "$candidate"
          done
          git diff --exit-code
      - name: Archive probe for human review; no plugin source is pushed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpcs-semantic-probe
          path: ${{ runner.temp }}/wpcs-semantic/
          retention-days: 14
          if-no-files-found: warn
