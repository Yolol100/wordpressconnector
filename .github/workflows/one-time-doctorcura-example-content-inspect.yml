name: One-time DoctorCura example content inspect

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-example-content-inspect/*.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect rezept-online-erhalten source and rendered page
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]]
          root="$RUNNER_TEMP/dc-example"; mkdir -p "$root"
          url="$site/en/rezept-online-erhalten/"
          curl -sS -L --connect-timeout 10 --max-time 40 "$url" -o "$root/rendered.html"
          for type in posts pages; do
            curl -sS -L --connect-timeout 10 --max-time 40 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' "$site/wp-json/wp/v2/$type?slug=rezept-online-erhalten&context=edit&per_page=100" -o "$root/$type.json" || true
            curl -sS -L --connect-timeout 10 --max-time 40 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' "$site/wp-json/wp/v2/$type?search=rezept%20online%20erhalten&context=edit&per_page=100" -o "$root/$type-search.json" || true
          done
          python3 - "$root" <<'PY'
          import html,json,os,re,sys
          root=sys.argv[1]
          for name in ['posts.json','pages.json','posts-search.json','pages-search.json']:
              p=os.path.join(root,name)
              try: d=json.load(open(p,encoding='utf-8'))
              except Exception as e: print(name,'parse_error',e); continue
              if isinstance(d,dict): print(name,'dict_error',d.get('code'),d.get('message')); continue
              print(name,'count',len(d))
              for x in d:
                  c=((x.get('content') or {}).get('raw') or (x.get('content') or {}).get('rendered') or '')
                  text=html.unescape(re.sub(r'<[^>]+>',' ',c)); text=re.sub(r'\s+',' ',text)
                  terms=re.findall(r'(?i)United States|U\.S\.A?\.?|\bUSA\b|\bAmerican\w*|\bAmerica\b|Vereinigte Staaten|US-amerikan\w*|amerikan\w*|\bFDA\b|\bDEA\b|\bHIPAA\b|New York|California|Texas|Florida|\bUSD\b|\$\s?\d+',text)
                  print('OBJECT',x.get('id'),x.get('status'),x.get('slug'),(x.get('title') or {}).get('raw') or (x.get('title') or {}).get('rendered'),'link=',x.get('link'),'terms=',sorted(set(terms),key=str.lower))
                  for term in sorted(set(terms),key=str.lower):
                      i=text.lower().find(term.lower()); print('CONTEXT',text[max(0,i-250):i+len(term)+450])
          raw=open(os.path.join(root,'rendered.html'),encoding='utf-8',errors='replace').read()
          text=html.unescape(re.sub(r'(?is)<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>|<[^>]+>',' ',raw)); text=re.sub(r'\s+',' ',text)
          terms=re.findall(r'(?i)United States|U\.S\.A?\.?|\bUSA\b|\bAmerican\w*|\bAmerica\b|Vereinigte Staaten|US-amerikan\w*|amerikan\w*|\bFDA\b|\bDEA\b|\bHIPAA\b|New York|California|Texas|Florida|\bUSD\b|\$\s?\d+',text)
          print('RENDERED terms=',sorted(set(terms),key=str.lower))
          for term in sorted(set(terms),key=str.lower):
              i=text.lower().find(term.lower()); print('RENDERED_CONTEXT',text[max(0,i-250):i+len(term)+450])
          PY

      - name: Upload example evidence
        uses: actions/upload-artifact@v4
        with:
          name: doctorcura-example-content
          path: |
            ${{ runner.temp }}/dc-example/posts.json
            ${{ runner.temp }}/dc-example/pages.json
            ${{ runner.temp }}/dc-example/posts-search.json
            ${{ runner.temp }}/dc-example/pages-search.json
            ${{ runner.temp }}/dc-example/rendered.html
          retention-days: 7
