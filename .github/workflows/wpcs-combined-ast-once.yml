name: Guarded PHP CS and WPCS combined pass
on:
  push:
    branches: [fix/release-readiness-guarded-wpcs-20261019]
    paths: [.github/workflows/wpcs-combined-ast-once.yml]
permissions:
  contents: write
jobs:
  validated-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: true}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with: {php-version: '8.3', tools: 'composer:v2', coverage: none}
      - name: Install pinned formatter and AST tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/style-tools"
          cd "$RUNNER_TEMP/style-tools"
          composer init --no-interaction --name wordpressconnector/combo --type project
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress friendsofphp/php-cs-fixer:3.95.27 nikic/php-parser:5.9.0 squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1 dealerdirect/phpcodesniffer-composer-installer:1.2.1
      - name: Run two compatible formatters and accept only AST/comment-identical tested files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/release-readiness-guarded-wpcs-20261019'
          mkdir -p "$RUNNER_TEMP/combo"
          cat > "$RUNNER_TEMP/style-tools/config.php" <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          return (new PhpCsFixer\Config())->setRules(array(
            'no_multiple_statements_per_line' => true,
            'control_structure_braces' => true,
            'braces_position' => array(
              'functions_opening_brace' => 'same_line',
              'classes_opening_brace' => 'same_line',
              'control_structures_opening_brace' => 'same_line',
            ),
            'statement_indentation' => true,
          ))->setIndent("\t")->setLineEnding("\n")
          ->setFinder((new PhpCsFixer\Finder())->in(getcwd())->name('*.php'));
          PHP
          cat > "$RUNNER_TEMP/style-tools/equal.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/vendor/autoload.php';
          use PhpParser\Node;
          use PhpParser\ParserFactory;
          function nodes($v) {
            if($v instanceof Node) {
              $p=array();
              foreach($v->getSubNodeNames() as $k)$p[$k]=nodes($v->$k);
              return array(get_class($v),$p);
            }
            return is_array($v)?array_map('nodes',$v):$v;
          }
          function comments(string $s):array {
            $x=array();foreach(token_get_all($s) as $t) {
              if(is_array($t)&&in_array($t[0],array(T_COMMENT,T_DOC_COMMENT),true)){
                $x[]=array($t[0],preg_replace('/\s+/',' ',$t[1]));
              }
            }return $x;
          }
          $b=file_get_contents($argv[1]);$a=file_get_contents($argv[2]);
          if(!is_string($b)||!is_string($a))exit(1);
          $parser=(new ParserFactory())->createForHostVersion();
          if(nodes($parser->parse($b))!==nodes($parser->parse($a))||comments($b)!==comments($a))exit(1);
          PHP
          files=(
            plugin/wordpressconnector/includes/Adapters/AbilitiesAdapter.php
            plugin/wordpressconnector/includes/Adapters/AcfAdapter.php
            plugin/wordpressconnector/includes/Adapters/ElementorCapabilitiesAdapter.php
            plugin/wordpressconnector/includes/Adapters/WooCommerceFulfillmentAdapter.php
            plugin/wordpressconnector/includes/MCP/Controller.php
            plugin/wordpressconnector/includes/Runtime/Runner.php
            plugin/wordpressconnector/includes/Adapters/PluginSettingsAdapter.php
            plugin/wordpressconnector/includes/Adapters/SystemAdapter.php
            plugin/wordpressconnector/includes/Admin/ElementorJsonExport.php
          )
          wpcs="$RUNNER_TEMP/style-tools/vendor/bin/phpcs"
          phpcbf="$RUNNER_TEMP/style-tools/vendor/bin/phpcbf"
          csfix="$RUNNER_TEMP/style-tools/vendor/bin/php-cs-fixer"
          "$wpcs" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/combo/before.txt" 2>&1 || true
          accepted=0; rejected=0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in "${files[@]}";do
            base="$(basename "$file" .php)"
            cp "$file" "$RUNNER_TEMP/combo/$base.original.php"
            "$wpcs" --standard=WordPress --report=json "$file" > "$RUNNER_TEMP/combo/$base.before.json" 2>/dev/null || true
            # One prior safe structural formatter, then official WordPress whitespace rules.
            PHP_CS_FIXER_IGNORE_ENV=1 "$csfix" fix "$file" --config="$RUNNER_TEMP/style-tools/config.php" --path-mode=override --using-cache=no --allow-risky=no --quiet >/dev/null 2>&1 || true
            "$phpcbf" --standard=WordPress "$file" > "$RUNNER_TEMP/combo/$base.phptool.txt" 2>&1 || true
            "$wpcs" --standard=WordPress --report=json "$file" > "$RUNNER_TEMP/combo/$base.after.json" 2>/dev/null || true
            valid=true
            php "$RUNNER_TEMP/style-tools/equal.php" "$RUNNER_TEMP/combo/$base.original.php" "$file" > "$RUNNER_TEMP/combo/$base.ast.txt" 2>&1 || valid=false
            php -l "$file" >> "$RUNNER_TEMP/combo/$base.ast.txt" 2>&1 || valid=false
            git diff --check -- "$file" > "$RUNNER_TEMP/combo/$base.diffcheck.txt" 2>&1 || valid=false
            bef="$(jq -r '.totals.errors + .totals.warnings' "$RUNNER_TEMP/combo/$base.before.json" || echo 0)"
            aft="$(jq -r '.totals.errors + .totals.warnings' "$RUNNER_TEMP/combo/$base.after.json" || echo 999999)"
            if test "$valid" != true || test "$aft" -ge "$bef" || cmp -s "$RUNNER_TEMP/combo/$base.original.php" "$file"; then
              cp "$RUNNER_TEMP/combo/$base.original.php" "$file"
              rejected=$((rejected+1))
              echo "$base REJECT AST/WPCS $bef -> $aft" >> "$RUNNER_TEMP/combo/decisions.txt"
              continue
            fi
            if ! bash scripts/run-contracts.sh > "$RUNNER_TEMP/combo/$base.contracts.log" 2>&1;then
              cp "$RUNNER_TEMP/combo/$base.original.php" "$file"
              rejected=$((rejected+1))
              echo "$base REJECT contracts $bef -> $aft" >> "$RUNNER_TEMP/combo/decisions.txt"
              continue
            fi
            git add -- "$file"
            git diff --cached --check
            git commit -m "style(wpcs): equivalent combined format $base"
            accepted=$((accepted+1))
            echo "$base ACCEPT $bef -> $aft" >> "$RUNNER_TEMP/combo/decisions.txt"
          done
          "$wpcs" --standard=WordPress --extensions=php --report=summary plugin/wordpressconnector > "$RUNNER_TEMP/combo/after.txt" 2>&1 || true
          printf 'accepted=%s rejected=%s\\n' "$accepted" "$rejected" > "$RUNNER_TEMP/combo/summary.txt"
          if test "$accepted" -gt 0;then git push origin HEAD:fix/release-readiness-guarded-wpcs-20261019;fi
      - name: Archive formatter proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpcs-combined-ast-proof
          path: ${{ runner.temp }}/combo/
          retention-days: 5
          if-no-files-found: warn
