name: DoctorCura Phase 3C Elementor Source Fix V2

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/fix-doctorcura-phase3c-elementor-source-v2.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse proven dual-source fix with corrected canary parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/fix-doctorcura-phase3c-elementor-source.yml').read_text()
          marker='        run: |\n'
          if marker not in src:
              raise SystemExit('source run block missing')
          block=src.split(marker,1)[1]
          lines=[]
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  break
          script='\n'.join(lines)+'\n'
          bad="""    ep=\"$base/product/epipen/?attribute_pa_medication-strength=300mcg&attribute_pa_amount=3&attribute_pa_medication=epipen\"; curl \"${c[@]}\" --compressed --header 'Cache-Control: no-cache' --output \"$tmp/ep-$round.html\" \"$ep\"; ! grep -Eiq 'hreflang=[^>]+href=[\"\\'][^\"\\']*attribute_pa_' \"$tmp/ep-$round.html\""""
          good="""    ep=\"$base/product/epipen/?attribute_pa_medication-strength=300mcg&attribute_pa_amount=3&attribute_pa_medication=epipen\"
    curl \"${c[@]}\" --compressed --header 'Cache-Control: no-cache' --output \"$tmp/ep-$round.html\" \"$ep\"
    python3 - \"$tmp/ep-$round.html\" <<'PYCANARY'
import html,re,sys,urllib.parse
s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
for tag in re.findall(r'<link\\b[^>]*hreflang=[^>]*>',s,re.I):
    m=re.search(r'href=[\"\\\']([^\"\\\']+)',tag,re.I)
    if m and any(k.startswith('attribute_pa_') for k in urllib.parse.parse_qs(urllib.parse.urlsplit(html.unescape(m.group(1))).query,keep_blank_values=True)):
        raise SystemExit(1)
PYCANARY"""
          if bad not in script:
              raise SystemExit('target harness line not found')
          script=script.replace(bad,good,1)
          Path('/tmp/doctorcura-p3c-v2.sh').write_text(script)
          PY
          bash -n /tmp/doctorcura-p3c-v2.sh
          bash /tmp/doctorcura-p3c-v2.sh
