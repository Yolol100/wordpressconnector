name: One-time DoctorCura full text editorial review export

on:
  push:
    branches: [main]
    paths:
      - 'doctorcura-full-text-review-export/*.json'

permissions:
  contents: read

jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: a
            ids: '900060 900048 900043 6050 6048'
          - group: b
            ids: '6046 6044 6042 6033 6020'
          - group: c
            ids: '6008 5999 5995 5993 5990'
          - group: d
            ids: '5986 5904 5896 5892'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
      IDS: ${{ matrix.ids }}
    steps:
      - name: Export clean article text for editorial review
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-full-text"; mkdir -p "$root"
          for id in $IDS; do
            code=$(curl -sS -L --connect-timeout 10 --max-time 60 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/$id.json" -w '%{http_code}' "$site/wp-json/wp/v2/posts/$id?context=edit")
            [[ "$code" == 200 ]] || exit 1
          done
          python3 - "$root" $IDS <<'PY'
          import html,json,re,sys,os
          root=sys.argv[1]; ids=[int(x) for x in sys.argv[2:]]
          def clean(content):
              s=content or ''
              s=re.sub(r'(?is)<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>',' ',s)
              s=re.sub(r'(?is)<h([1-6])\b[^>]*>(.*?)</h\1>',lambda m:'\n\n### '+html.unescape(re.sub(r'<[^>]+>',' ',m.group(2))).strip()+'\n',s)
              s=re.sub(r'(?i)<br\s*/?>','\n',s)
              s=re.sub(r'(?i)</p>|</li>|</div>','\n',s)
              s=html.unescape(re.sub(r'(?s)<[^>]+>',' ',s))
              s=re.sub(r'[ \t]+',' ',s); s=re.sub(r'\n\s*\n\s*\n+','\n\n',s)
              return s.strip()
          for id in ids:
              p=json.load(open(os.path.join(root,f'{id}.json'),encoding='utf-8'))
              title=html.unescape((p.get('title') or {}).get('raw') or '')
              desc=html.unescape((p.get('yoast_head_json') or {}).get('description') or '')
              print('\n\n==================== ARTICLE',id,'====================')
              print('TITLE:',title)
              print('SLUG:',p.get('slug'))
              print('META:',desc)
              print('TEXT-BEGIN')
              print(clean((p.get('content') or {}).get('raw') or ''))
              print('TEXT-END')
          PY
