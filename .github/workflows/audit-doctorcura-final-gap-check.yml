name: DoctorCura Datenschutz Translation Cache-Key Fix

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-final-gap-check.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Vary only datenschutz routing by GTranslate language header
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 40 --retry 2 --retry-delay 1 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          api="$base/wp-json/code-snippets/v1/snippets/43"; tmp="$RUNNER_TEMP/dc-vary"; mkdir -p "$tmp"
          expected='77f76f8dce012e8122d25243b9e60a020253c85236165f2bf7c5d237ed6d9270'; changed=0

          make_payload(){ python3 - "$1" "$2" <<'PY'
          import json,sys
          code=open(sys.argv[1],encoding='utf-8').read()
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps({'code':code,'active':True},ensure_ascii=False,separators=(',',':')))
          PY
          }
          put(){ local f="$1" l="$2" h; make_payload "$f" "$tmp/$l-payload.json"; h=$(curl "${c[@]}" --location "${auth[@]}" --request POST --header 'X-HTTP-Method-Override: PUT' --header 'Content-Type: application/json' --data-binary "@$tmp/$l-payload.json" --output "$tmp/$l-out.json" --write-out '%{http_code}' "$api"); echo "WRITE $l http=$h"; [[ "$h" == 200 ]]; }
          get(){ curl "${c[@]}" --location "${auth[@]}" --output "$1" --write-out '%{http_code}' "$api"; }
          hash_json(){ python3 - "$1" <<'PY'
          import hashlib,json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8')); c=str(x.get('code',''))
          print(hashlib.sha256(c.encode()).hexdigest())
          PY
          }
          rollback(){ local rc=$?; [[ "$rc" == 0 ]] && return; echo "ROLLBACK_START rc=$rc" >&2; set +e; if [[ "$changed" == 1 ]]; then put "$tmp/original.php" rollback >/dev/null 2>&1 || true; fi; get "$tmp/rb.json" >/dev/null 2>&1 || true; if [[ -s "$tmp/rb.json" ]]; then echo "ROLLBACK_HASH=$(hash_json "$tmp/rb.json")"; fi; echo ROLLBACK_ATTEMPTED >&2; }
          trap rollback EXIT

          echo '=== PREFLIGHT ==='
          h=$(get "$tmp/before.json"); [[ "$h" == 200 ]]
          python3 - "$tmp/before.json" "$tmp/original.php" "$expected" <<'PY'
          import hashlib,json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8')); c=str(x.get('code','')); h=hashlib.sha256(c.encode()).hexdigest()
          print(f"BEFORE hash={h} active={'yes' if x.get('active') else 'no'}")
          assert h==sys.argv[3] and bool(x.get('active'))
          assert c.count('DoctorCura datenschutz root-only migration V8.4c')==1
          assert 'Vary: X-GT-Lang' not in c
          open(sys.argv[2],'w',encoding='utf-8',newline='').write(c)
          PY

          python3 - "$tmp/original.php" "$tmp/new.php" <<'PY'
          import hashlib,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          old="""/* DoctorCura datenschutz root-only migration V8.4c - 2026-09-10 */
          add_action( 'template_redirect', function () {
              if ( isset( $_SERVER['HTTP_X_GT_LANG'] ) && '' !== (string) $_SERVER['HTTP_X_GT_LANG'] ) {
                  return;
              }
              $request_uri = isset( $_SERVER['REQUEST_URI'] ) ? (string) $_SERVER['REQUEST_URI'] : '';
              $path = wp_parse_url( $request_uri, PHP_URL_PATH );
              if ( '/datenschutz/' !== $path ) {
                  return;
              }
              wp_safe_redirect( home_url( '/privacy-policy/' ), 301, 'DoctorCura migration' );
              exit;
          }, 0 );"""
          new="""/* DoctorCura datenschutz root-only migration V8.4c - 2026-09-10 */
          add_action( 'template_redirect', function () {
              $request_uri = isset( $_SERVER['REQUEST_URI'] ) ? (string) $_SERVER['REQUEST_URI'] : '';
              $path = wp_parse_url( $request_uri, PHP_URL_PATH );
              $translated = isset( $_SERVER['HTTP_X_GT_LANG'] ) && '' !== (string) $_SERVER['HTTP_X_GT_LANG'];
              if ( '/datenschutz/' === $path || '/fr/datenschutz/' === $path || '/en/datenschutz/' === $path || $translated ) {
                  header( 'Vary: X-GT-Lang', false );
              }
              if ( $translated ) {
                  return;
              }
              if ( '/datenschutz/' !== $path ) {
                  return;
              }
              wp_safe_redirect( home_url( '/privacy-policy/' ), 301, 'DoctorCura migration' );
              exit;
          }, 0 );"""
          assert s.count(old)==1, 'V8.4c identity mismatch'
          out=s.replace(old,new,1)
          open(sys.argv[2],'w',encoding='utf-8',newline='').write(out)
          print('NEW_HASH='+hashlib.sha256(out.encode()).hexdigest())
          PY
          newhash=$(sha256sum "$tmp/new.php" | awk '{print $1}')

          echo '=== WRITE + EXACT READBACK ==='
          put "$tmp/new.php" apply; changed=1
          h=$(get "$tmp/after.json"); [[ "$h" == 200 ]]
          python3 - "$tmp/after.json" "$tmp/new.php" "$newhash" <<'PY'
          import hashlib,json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8')); c=str(x.get('code','')); want=open(sys.argv[2],encoding='utf-8').read(); h=hashlib.sha256(c.encode()).hexdigest()
          print(f"AFTER hash={h} active={'yes' if x.get('active') else 'no'}")
          assert c==want and h==sys.argv[3] and bool(x.get('active')) and c.count('Vary: X-GT-Lang')==1
          PY

          echo '=== SAME-TOKEN CACHE KEY TESTS ==='
          for n in 1 2 3; do
            token="dc_vary=$n-$(date +%s%N)"
            for spec in "root:$base/datenschutz/" "fr:$base/fr/datenschutz/" "en:$base/en/datenschutz/" "fr2:$base/fr/datenschutz/" "root2:$base/datenschutz/"; do
              label=${spec%%:*}; url=${spec#*:}; hh="$tmp/$label-$n.h"
              meta=$(curl "${c[@]}" --header 'Cache-Control: no-cache' --dump-header "$hh" --output /dev/null --write-out '%{http_code}\t%{redirect_url}' "$url?$token")
              vary=$(grep -i '^vary:' "$hh" | tr -d '\r' | paste -sd '|' - || true); cache=$(grep -i '^x-hcdn-cache-status:' "$hh" | tr -d '\r' | paste -sd '|' - || true)
              echo "$label/$n $meta VARY=$vary CACHE=$cache"
              [[ "$vary" == *X-GT-Lang* ]]
              status=${meta%%$'\t'*}; location=${meta#*$'\t'}
              if [[ "$label" == root* ]]; then [[ "$status" == 301 && "$location" == "$base/privacy-policy/" ]]; else [[ "$status" == 404 && -z "$location" ]]; fi
            done
          done

          echo '=== OTHER FIX CANARIES ==='
          check301(){ local u="$1" d="$2" l="$3" x; x=$(curl "${c[@]}" --output /dev/null --write-out '%{http_code}\t%{redirect_url}' "$u"); echo "$l $x"; [[ "$x" == $'301\t'"$d" ]]; }
          check301 "$base/product-categorie/gewichtsverlust/?dc_vary_canary=$(date +%s%N)" "$base/product-category/gewichtsverlust/" WEIGHT
          check301 "$base/fr/request-2/?dc_vary_canary=$(date +%s%N)" "$base/fr/anfrage-2/" REQUEST2
          check301 "$base/welche-medikamente-beeinflussen-die-erektion-2/?dc_vary_canary=$(date +%s%N)" "$base/welche-medikamente-beeinflussen-die-erektion/" DUPLICATE

          changed=0
          echo "NEW_EXPECTED_SNIPPET_HASH=$newhash"
          echo DATENSCHUTZ_VARY_FIX_GREEN