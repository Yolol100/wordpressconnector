name: DoctorCura Datenschutz Regression Read-Only Audit

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-final-gap-check.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Diagnose translated datenschutz routing
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          tmp="$RUNNER_TEMP/dc-datenschutz-diag"; mkdir -p "$tmp"
          c=(--silent --show-error --connect-timeout 10 --max-time 35 --retry 2 --retry-delay 1 --retry-all-errors)

          echo '=== LIVE SNIPPET V8.4c ==='
          h=$(curl "${c[@]}" --location --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' --output "$tmp/s43.json" --write-out '%{http_code}' "$base/wp-json/code-snippets/v1/snippets/43"); [[ "$h" == 200 ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");echo "hash=".hash("sha256",$c)." active=".(!empty($s["active"])?"yes":"no").PHP_EOL;file_put_contents($argv[2],$c);' "$tmp/s43.json" "$tmp/s43.php"
          nl -ba "$tmp/s43.php" | sed -n '283,296p'

          probe(){
            local path="$1" label="$2" suffix="$3"
            local url="$base$path"
            [[ "$suffix" == clean ]] || { if [[ "$url" == *'?'* ]]; then url="$url&dc_diag=$suffix"; else url="$url?dc_diag=$suffix"; fi; }
            curl "${c[@]}" --dump-header "$tmp/$label-$suffix.h" --output "$tmp/$label-$suffix.body" --write-out "$label/$suffix FIRST=%{http_code} REDIRECT=%{redirect_url} EFFECTIVE=%{url_effective}\n" "$url"
            grep -iE '^(HTTP/|location:|x-redirect-by:|x-hcdn-cache-status:|age:|cache-control:|vary:|server:)' "$tmp/$label-$suffix.h" || true
            curl "${c[@]}" --location --compressed --output "$tmp/$label-$suffix-follow.body" --write-out "$label/$suffix FOLLOW=%{http_code} FINAL=%{url_effective} REDIRS=%{num_redirects}\n" "$url"
            python3 - "$tmp/$label-$suffix-follow.body" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); can=''
          for t in re.findall(r'<link\b[^>]*>',s,re.I):
              if re.search(r'rel=["\'][^"\']*canonical',t,re.I):
                  m=re.search(r'href=["\']([^"\']+)',t,re.I)
                  if m: can=html.unescape(m.group(1)); break
          print('FINAL_CANONICAL='+can)
          PY
          }

          for suffix in clean "bust-$(date +%s%N)"; do
            probe '/datenschutz/' root "$suffix"
            probe '/fr/datenschutz/' fr "$suffix"
            probe '/en/datenschutz/' en "$suffix"
          done
          echo DATENSCHUTZ_DIAGNOSTIC_COMPLETE