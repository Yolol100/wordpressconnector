name: DoctorCura Final Exact Read-Only Audit

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-final-gap-check.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Verify exact production state
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          tmp="$RUNNER_TEMP/dc-final-exact"; mkdir -p "$tmp"
          expected='77f76f8dce012e8122d25243b9e60a020253c85236165f2bf7c5d237ed6d9270'

          echo '=== SNIPPET EXACT IDENTITY AND FINAL MAPPINGS ==='
          h=$(curl "${c[@]}" --location "${auth[@]}" --output "$tmp/s43.json" --write-out '%{http_code}' "$base/wp-json/code-snippets/v1/snippets/43"); [[ "$h" == 200 ]]
          php -r '$s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$c=(string)($s["code"]??"");echo "SNIPPET hash=".hash("sha256",$c)." active=".(!empty($s["active"])?"yes":"no")." helper=".(strpos($c,"DoctorCura one-time cache purge helper")===false?"absent":"present").PHP_EOL;if(hash("sha256",$c)!==$argv[2]||empty($s["active"])||strpos($c,"DoctorCura one-time cache purge helper")!==false)exit(2);file_put_contents($argv[3],$c);' "$tmp/s43.json" "$expected" "$tmp/s43.php"
          nl -ba "$tmp/s43.php" | sed -n '290,390p' | grep -E 'V8\.4[def]|request-2|product-categorie|product-category|attribute_pa_|hreflang|anfrage-2' || true

          echo '=== TERMS CLEAN PUBLIC READBACK ==='
          result=$(curl "${c[@]}" --location --compressed --output "$tmp/terms.html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$base/geschaftsbedingungen/")
          old=$(python3 - "$tmp/terms.html" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          print(s.count('http://www.doctorcura.com'))
          PY
          )
          echo "TERMS result=$result old_http_count=$old"
          [[ "$result" == $'200\thttps://doctorcura.com/geschaftsbedingungen/\t0' && "$old" == 0 ]]

          echo '=== EPIPEN EXACT VARIATION READBACK ==='
          variation="$base/product/epipen/?attribute_pa_wirkstarke=150mcg"
          for round in normal no-cache; do
            extra=(); [[ "$round" == no-cache ]] && extra=(--header 'Cache-Control: no-cache' --header 'Pragma: no-cache')
            result=$(curl "${c[@]}" "${extra[@]}" --location --compressed --output "$tmp/epipen-$round.html" --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}' "$variation")
            python3 - "$tmp/epipen-$round.html" "$result" <<'PY'
          import html,re,sys,urllib.parse
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); result=sys.argv[2]
          canonical=''
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
              rel=re.search(r'rel=["\']([^"\']+)',tag,re.I); href=re.search(r'href=["\']([^"\']+)',tag,re.I)
              if rel and href and 'canonical' in rel.group(1).lower(): canonical=html.unescape(href.group(1)); break
          alts={}
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
              if not re.search(r'rel=["\'][^"\']*alternate',tag,re.I): continue
              hm=re.search(r'hreflang=["\']([^"\']+)',tag,re.I); um=re.search(r'href=["\']([^"\']+)',tag,re.I)
              if hm and um: alts[hm.group(1).lower()]=html.unescape(um.group(1))
          expected={
              'de':'https://doctorcura.com/product/epipen/',
              'en':'https://doctorcura.com/en/product/epipen/',
              'fr':'https://doctorcura.com/fr/product/epipen/'
          }
          print('EPIPEN_RESULT='+result)
          print('EPIPEN_CANONICAL='+canonical)
          print('EPIPEN_HREFLANG_COUNT='+str(len(alts)))
          for k in sorted(alts): print('EPIPEN_HREFLANG '+k+'='+alts[k])
          bad=[u for u in alts.values() if urllib.parse.urlsplit(u).query or 'attribute_pa_' in u]
          print('EPIPEN_HREFLANG_QUERY_COUNT='+str(len(bad)))
          if not result.startswith('200\thttps://doctorcura.com/product/epipen/?attribute_pa_wirkstarke=150mcg\t0'): raise SystemExit(3)
          if canonical!='https://doctorcura.com/product/epipen/': raise SystemExit(4)
          if alts!=expected: raise SystemExit(5)
          if bad: raise SystemExit(6)
          PY
          done

          echo '=== CRITICAL REDIRECT CANARIES ==='
          check_redirect() {
            local src="$1" expected="$2" label="$3"
            local out
            out=$(curl "${c[@]}" --output /dev/null --write-out '%{http_code}\t%{redirect_url}' "$src")
            echo "$label $out"
            [[ "$out" == $'301\t'"$expected" ]]
          }
          check_redirect "$base/product-categorie/gewichtsverlust/" "$base/product-category/gewichtsverlust/" WEIGHT
          check_redirect "$base/datenschutz/" "$base/privacy-policy/" DATENSCHUTZ
          check_redirect "$base/fr/request-2/" "$base/fr/anfrage-2/" FR_REQUEST2
          echo FINAL_EXACT_AUDIT_GREEN