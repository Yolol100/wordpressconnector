name: DoctorCura Phase 3C Source Context

on:
  push:
    branches:
      - audit/doctorcura-deep-seo-20260910
    paths:
      - '.github/workflows/audit-doctorcura-phase3c-source-context.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Compare raw rendered and public occurrence context read only
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"; [[ "$base" == 'https://doctorcura.com' ]] || exit 1
          test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          c=(--silent --show-error --connect-timeout 10 --max-time 45 --retry 3 --retry-delay 2 --retry-all-errors)
          auth=(--user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json')
          tmp="$RUNNER_TEMP/p3c-context"; mkdir -p "$tmp"
          old='http://www.doctorcura.com'
          curl "${c[@]}" --location "${auth[@]}" "$base/wp-json/wp/v2/pages/11?context=edit" > "$tmp/page.json"
          terms=$(python3 - "$tmp/page.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8')).get('link',''),end='')
          PY
          )
          curl "${c[@]}" --compressed --dump-header "$tmp/public.h" --output "$tmp/public.html" "${terms}?doctorcura_context=$(date +%s%N)"
          python3 - "$tmp/page.json" "$tmp/public.html" "$old" <<'PY'
          import html,json,re,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); old=sys.argv[3]
          docs={
            'raw':str((p.get('content') or {}).get('raw') or ''),
            'rest_rendered':str((p.get('content') or {}).get('rendered') or ''),
            'public':open(sys.argv[2],encoding='utf-8',errors='ignore').read(),
          }
          def norm(s): return re.sub(r'\s+',' ',html.unescape(s)).strip()
          for name,s in docs.items():
            print(f"DOC {name} old_count={s.count(old)} bytes={len(s.encode())}")
            pos=s.find(old)
            if pos>=0:
              lo=max(0,pos-350); hi=min(len(s),pos+len(old)+350)
              ctx=norm(s[lo:hi]).replace('\n',' ')
              print(f"CONTEXT {name} {ctx}")
              tag_start=s.rfind('<a',0,pos); tag_end=s.find('>',pos)
              if tag_start>=0 and tag_end>=0 and pos-tag_start<800:
                print(f"ANCHOR {name} {norm(s[tag_start:tag_end+1])}")
          r=norm(docs['raw']); rr=norm(docs['rest_rendered']); pub=norm(docs['public'])
          needle=old
          def window(s):
            pos=s.find(needle); return s[max(0,pos-120):pos+len(needle)+120] if pos>=0 else ''
          wr, wrr, wp = map(window,(r,rr,pub))
          print('RAW_RENDERED_WINDOW_EQUAL='+str(wr==wrr))
          print('RAW_PUBLIC_WINDOW_EQUAL='+str(wr==wp))
          PY
          echo '=== CACHE SIGNATURES ==='
          grep -Eio 'WP Rocket|rocket-[A-Za-z0-9_-]+|cached page generated by[^<]*|hostinger[^<]{0,120}|litespeed[^<]{0,120}' "$tmp/public.html" | head -n 30 || true
          awk 'BEGIN{IGNORECASE=1}/^(server|age|cache-control|expires|etag|vary|x-hcdn-|x-cache|x-litespeed|x-rocket):/{gsub(/\r/,"");print}' "$tmp/public.h" || true
          echo PHASE3C_CONTEXT_COMPLETE
