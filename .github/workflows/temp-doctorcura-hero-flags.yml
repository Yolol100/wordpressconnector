name: Temp DoctorCura Hero Flags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-hero-flags.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - name: Inspect exact DoctorCura hero container settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || exit 1
          root="$RUNNER_TEMP/dc"; mkdir -p "$root"
          base="${SITE_URL%/}/wp-json/webactueel-wordpress-connector/v1"
          call_action(){ suffix="$1"; action="$2"; payload="$3"; req="$root/r-$suffix.json"; out="$root/o-$suffix.json"; python3 - "$req" "$suffix" "$action" "$payload" <<'PY'
          import json,sys
          p,s,a,x=sys.argv[1:]; json.dump({'version':1,'request_id':'dc-hero-settings-'+s,'action':a,'dry_run':True,'confirm':False,'payload':json.loads(x)},open(p,'w'),separators=(',',':'))
          PY
            code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$req" -o "$out" -w '%{http_code}' "$base/execute"); [[ "$code" == 200 ]]; }
          call_action front option.get '{"name":"page_on_front"}'
          page_id=$(python3 - "$root/o-front.json" <<'PY'
          import json,sys; print(int((json.load(open(sys.argv[1])).get('data') or {}).get('value')))
          PY
          )
          call_action el elementor.inspect "{\"id\":$page_id}"
          python3 - "$root/o-el.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); doc=(d.get('data') or {}).get('document') or {}; nodes=doc.get('data') or []
          ids={'4a5ba936','7bc7e6ad','198df693','6f15141e'}
          def walk(a):
            for e in a if isinstance(a,list) else []:
              if isinstance(e,dict):
                if e.get('id') in ids:
                  print('NODE '+e.get('id')+' '+json.dumps({'elType':e.get('elType'),'widgetType':e.get('widgetType'),'settings':e.get('settings') or {},'child_ids':[x.get('id') for x in e.get('elements') or [] if isinstance(x,dict)]},ensure_ascii=False,separators=(',',':')))
                walk(e.get('elements') or [])
          walk(nodes)
          print('fingerprint='+str((d.get('data') or {}).get('fingerprint','')))
          print('page_id='+str(doc.get('post_id','')))
          PY
