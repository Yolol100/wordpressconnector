name: One-time DoctorCura CH SEO template link 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-flat-language-fix-20260911.yml'

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Detect existing Elementor SEO template, add CH page conditions, verify
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-seo-link"; rm -rf "$root"; mkdir -p "$root"
          originals=(900448 900449 900450 900451 900452 900453)
          clones=(900512 900514 900516 900518 900520 900522)
          slugs=(gewichtsmanagement akne-behandlung schlafberatung erektionsprobleme haarausfall online-arzt)

          make_req() {
            python3 - "$1" "$2" "$3" "$4" "$5" "$6" <<'PY'
          import json,sys
          out,rid,action,dry,confirm,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':rid,'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':json.loads(payload)},open(out,'w'),separators=(',',':'))
          PY
          }
          call() {
            code=$(curl -sS -L --connect-timeout 12 --max-time 180 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$1" -o "$2" -w '%{http_code}' "$site/wp-json/webactueel-wordpress-connector/v1/execute")
            [[ "$code" == 200 ]] || { echo "HTTP=$code"; cat "$2"; exit 1; }
            python3 - "$2" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('ok'),d
          PY
          }

          # Ensure six CH pages are the intended published pages.
          for i in "${!clones[@]}"; do
            cid="${clones[$i]}"; slug="${slugs[$i]}"
            curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -o "$root/p-$cid.json" "$site/wp-json/wp/v2/pages/$cid?context=edit"
            python3 - "$root/p-$cid.json" "$cid" "$slug" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert int(p.get('id') or 0)==int(sys.argv[2]) and p.get('slug')==sys.argv[3] and p.get('status')=='publish'
          assert '/ch/' in (p.get('link') or '')
          PY
          done
          echo CH_PAGES_OK

          # List Elementor templates.
          : > "$root/templates.ndjson"
          for page in 1 2 3 4 5; do
            out="$root/t-$page.json"
            code=$(curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -o "$out" -w '%{http_code}' "$site/wp-json/wp/v2/elementor_library?context=edit&per_page=100&page=$page")
            if [[ "$code" == 400 ]]; then break; fi
            [[ "$code" == 200 ]] || exit 1
            jq -c '.[]' "$out" >> "$root/templates.ndjson"
            [[ $(jq 'length' "$out") -lt 100 ]] && break
          done
          mapfile -t tids < <(jq -r '.id' "$root/templates.ndjson")
          [[ ${#tids[@]} -gt 0 ]] || { echo NO_TEMPLATES; exit 1; }
          : > "$root/candidates.tsv"

          for tid in "${tids[@]}"; do
            make_req "$root/i-$tid.req" "seo-inspect-$tid-${GITHUB_RUN_ID}" elementor.inspect true false "{\"id\":$tid}"
            call "$root/i-$tid.req" "$root/i-$tid.res"
            python3 - "$root/templates.ndjson" "$root/i-$tid.res" "$tid" "${originals[*]}" >> "$root/candidates.tsv" <<'PY'
          import json,re,sys
          nd,resf,tid,orig=sys.argv[1:]
          tid=int(tid); orig=list(map(int,orig.split()))
          meta=None
          for line in open(nd,encoding='utf-8'):
              x=json.loads(line)
              if int(x.get('id') or 0)==tid: meta=x; break
          d=json.load(open(resf,encoding='utf-8')); doc=((d.get('data') or {}).get('document') or {})
          cond=doc.get('conditions') or []
          title=''
          if meta:
              t=meta.get('title') or {}; title=str(t.get('raw') or t.get('rendered') or '')
          text=json.dumps(cond)
          hits=sum(bool(re.search(r'(?<!\d)%d(?!\d)'%n,text)) for n in orig)
          if hits or 'seo' in title.lower():
              print(f'{tid}\t{hits}\t{title}\t{json.dumps(cond,separators=(",",":"))}')
          PY
          done
          cat "$root/candidates.tsv"

          python3 - "$root/candidates.tsv" "$root/selected.json" "${originals[*]}" "${clones[*]}" <<'PY'
          import json,re,sys
          src,out,orig_s,clone_s=sys.argv[1:]
          orig=list(map(int,orig_s.split())); clones=list(map(int,clone_s.split()))
          rows=[]
          for line in open(src,encoding='utf-8'):
              p=line.rstrip('\n').split('\t',3)
              if len(p)==4: rows.append({'id':int(p[0]),'hits':int(p[1]),'title':p[2],'conditions':json.loads(p[3])})
          best=[r for r in rows if r['hits']==6]
          assert len(best)==1,[(r['id'],r['hits'],r['title']) for r in rows]
          r=best[0]; old=r['conditions']; new=list(old)
          for c in old:
              if not isinstance(c,str): continue
              for oid,cid in zip(orig,clones):
                  if re.search(r'(?<!\d)%d(?!\d)'%oid,c):
                      nc=re.sub(r'(?<!\d)%d(?!\d)'%oid,str(cid),c)
                      if nc not in new: new.append(nc)
          added=[x for x in new if x not in old]
          assert len(added)==6,(len(added),added)
          json.dump({'id':r['id'],'title':r['title'],'conditions':new,'added':added},open(out,'w'),ensure_ascii=False)
          print('SELECTED id=%s title=%s added=%d'%(r['id'],r['title'],len(added)))
          PY

          tid=$(jq -r '.id' "$root/selected.json")
          cond=$(jq -c '.conditions' "$root/selected.json")
          payload=$(python3 - "$tid" "$cond" <<'PY'
          import json,sys
          print(json.dumps({'id':int(sys.argv[1]),'conditions':json.loads(sys.argv[2])},separators=(',',':')))
          PY
          )
          make_req "$root/dry.req" "seo-link-dry-${GITHUB_RUN_ID}" elementor.replace_document true false "$payload"
          call "$root/dry.req" "$root/dry.res"
          echo DRY_RUN_OK
          make_req "$root/live.req" "seo-link-live-${GITHUB_RUN_ID}" elementor.replace_document false true "$payload"
          call "$root/live.req" "$root/live.res"
          echo LIVE_UPDATE_OK

          make_req "$root/rb.req" "seo-link-readback-${GITHUB_RUN_ID}" elementor.inspect true false "{\"id\":$tid}"
          call "$root/rb.req" "$root/rb.res"
          python3 - "$root/rb.res" "${originals[*]}" "${clones[*]}" <<'PY'
          import json,re,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); text=json.dumps((((d.get('data') or {}).get('document') or {}).get('conditions') or []))
          for n in map(int,(sys.argv[2]+' '+sys.argv[3]).split()): assert re.search(r'(?<!\d)%d(?!\d)'%n,text),n
          print('READBACK_OK original=6 ch=6')
          PY

          for action in rewrite.flush cache.flush elementor.regenerate; do
            make_req "$root/a.req" "seo-link-${action//./-}-${GITHUB_RUN_ID}" "$action" false true '{}'
            call "$root/a.req" "$root/a.res"
          done

          failures=0
          for slug in "${slugs[@]}"; do
            out="$root/$slug.html"
            meta=$(curl -sS -L --max-redirs 8 -H 'Cache-Control: no-cache, no-store' -o "$out" -w '%{http_code}|%{url_effective}' "$site/ch/$slug/?seo_link=${GITHUB_RUN_ID}")
            code="${meta%%|*}"; final="${meta#*|}"; bytes=$(wc -c < "$out")
            echo "CH_RENDER slug=$slug http=$code final=$final bytes=$bytes"
            [[ "$code" == 200 && "$final" == *"/ch/$slug/"* && "$bytes" -gt 30000 ]] || failures=$((failures+1))
          done
          echo "FINAL failures=$failures template_id=$tid"
          (( failures == 0 ))
