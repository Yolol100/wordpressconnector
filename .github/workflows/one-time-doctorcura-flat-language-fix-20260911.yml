name: One-time DoctorCura CH content final repair 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-flat-language-fix-20260911.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Restore all page content and featured images on six CH landing pages
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-ch-content-final"; rm -rf "$root"; mkdir -p "$root"
          src=(900448 900449 900450 900451 900452 900453)
          ch=(900512 900514 900516 900518 900520 900522)
          slugs=(gewichtsmanagement akne-behandlung schlafberatung erektionsprobleme haarausfall online-arzt)

          req(){ python3 - "$1" "$2" "$3" "$4" "$5" "$6" <<'PY'
          import json,sys
          out,rid,action,dry,confirm,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':rid,'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':json.loads(payload)},open(out,'w'),ensure_ascii=False,separators=(',',':'))
          PY
          }
          call(){
            code=$(curl -sS -L --connect-timeout 12 --max-time 180 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$1" -o "$2" -w '%{http_code}' "$site/wp-json/webactueel-wordpress-connector/v1/execute")
            [[ "$code" == 200 ]] || { echo "HTTP=$code"; cat "$2"; exit 1; }
            python3 - "$2" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok'),d
          PY
          }

          for i in "${!src[@]}"; do
            s="${src[$i]}"; c="${ch[$i]}"; slug="${slugs[$i]}"
            req "$root/src.req" "final-src-$s-${GITHUB_RUN_ID}" post.get true false "{\"id\":$s}"
            call "$root/src.req" "$root/src.res"
            req "$root/ch.req" "final-ch-$c-${GITHUB_RUN_ID}" post.get true false "{\"id\":$c}"
            call "$root/ch.req" "$root/ch.res"

            python3 - "$root/src.res" "$root/ch.res" "$root/post.json" "$root/media.json" "$root/flags" "$c" "$slug" <<'PY'
          import json,sys
          s=((json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('post') or {})
          c=((json.load(open(sys.argv[2],encoding='utf-8')).get('data') or {}).get('post') or {})
          cid=int(sys.argv[6]); slug=sys.argv[7]
          assert s.get('status')=='publish' and c.get('status')=='publish'
          assert s.get('slug')==slug and c.get('slug')==slug and int(c.get('parent') or 0)==900510
          featured=int(s.get('featured_media') or 0); assert featured>0
          content=s.get('content') or ''; excerpt=s.get('excerpt') or ''; title=s.get('title') or ''
          assert content and excerpt and title
          json.dump({'id':cid,'title':title,'content':content,'excerpt':excerpt},open(sys.argv[3],'w'),ensure_ascii=False,separators=(',',':'))
          json.dump({'id':featured,'target_type':'featured_image','target_id':cid},open(sys.argv[4],'w'),separators=(',',':'))
          need_media=int(c.get('featured_media') or 0)!=featured
          open(sys.argv[5],'w').write('media='+('1' if need_media else '0'))
          print('PREPARED slug=%s title=%d content=%d excerpt=%d featured=%d media_change=%s'%(slug,len(title),len(content),len(excerpt),featured,need_media))
          PY
            pp=$(cat "$root/post.json")
            req "$root/pdry.req" "final-post-dry-$c-${GITHUB_RUN_ID}" post.update true false "$pp"
            call "$root/pdry.req" "$root/pdry.res"
            req "$root/plive.req" "final-post-live-$c-${GITHUB_RUN_ID}" post.update false true "$pp"
            call "$root/plive.req" "$root/plive.res"

            source "$root/flags"
            if [[ "$media" == 1 ]]; then
              mp=$(cat "$root/media.json")
              req "$root/mdry.req" "final-media-dry-$c-${GITHUB_RUN_ID}" media.assign true false "$mp"
              call "$root/mdry.req" "$root/mdry.res"
              req "$root/mlive.req" "final-media-live-$c-${GITHUB_RUN_ID}" media.assign false true "$mp"
              call "$root/mlive.req" "$root/mlive.res"
            fi

            req "$root/v.req" "final-verify-$c-${GITHUB_RUN_ID}" post.get true false "{\"id\":$c}"
            call "$root/v.req" "$root/v.res"
            python3 - "$root/src.res" "$root/v.res" "$slug" <<'PY'
          import json,sys
          s=((json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('post') or {})
          c=((json.load(open(sys.argv[2],encoding='utf-8')).get('data') or {}).get('post') or {})
          for k in ('title','content','excerpt'):
              assert c.get(k)==s.get(k),(sys.argv[3],k)
          assert int(c.get('featured_media') or 0)==int(s.get('featured_media') or 0),(sys.argv[3],'featured')
          print('MATCH_OK slug=%s featured=%s'%(sys.argv[3],c.get('featured_media')))
          PY
          done

          req "$root/cond.req" "final-cond-${GITHUB_RUN_ID}" option.get true false '{"name":"elementor_pro_theme_builder_conditions"}'
          call "$root/cond.req" "$root/cond.res"
          python3 - "$root/cond.res" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); v=(d.get('data') or {}).get('value') or {}
          c=((v.get('single') or {}).get('900460') or [])
          need=['include/singular/page/'+x for x in ['900512','900514','900516','900518','900520','900522']]
          assert all(x in c for x in need),c
          print('DISPLAY_CONDITIONS_OK count='+str(len(c)))
          PY

          for action in elementor.regenerate cache.flush; do
            req "$root/a.req" "final-${action//./-}-${GITHUB_RUN_ID}" "$action" false true '{}'
            call "$root/a.req" "$root/a.res"
          done

          failures=0
          for slug in "${slugs[@]}"; do
            out="$root/$slug.html"
            meta=$(curl -sS -L --max-redirs 8 -H 'Cache-Control: no-cache, no-store' -o "$out" -w '%{http_code}|%{url_effective}' "$site/ch/$slug/?finalcontent=${GITHUB_RUN_ID}")
            code="${meta%%|*}"; final="${meta#*|}"
            metrics=$(python3 - "$out" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          body=re.search(r'<body\b([^>]*)>',t,re.I|re.S); a=body.group(1) if body else ''
          cls=re.search(r'class=["\']([^"\']+)',a,re.I); c=cls.group(1) if cls else ''
          text=re.sub(r'<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>|<[^>]+>',' ',t,flags=re.I|re.S); text=' '.join(text.split())
          print('%d|%d|%d|%d|%s'%(len(t.encode()),len(text),t.lower().count('elementor-element'),len(re.findall(r'<img\b',t,re.I)),'elementor-page-900460' in c))
          PY
          )
            echo "LIVE slug=$slug http=$code final=$final metrics=$metrics"
            txt=$(echo "$metrics"|cut -d'|' -f2); elems=$(echo "$metrics"|cut -d'|' -f3); imgs=$(echo "$metrics"|cut -d'|' -f4); seo=$(echo "$metrics"|cut -d'|' -f5)
            [[ "$code" == 200 && "$final" == *"/ch/$slug/"* && "$txt" -gt 10000 && "$elems" -ge 230 && "$imgs" -ge 10 && "$seo" == True ]] || failures=$((failures+1))
          done
          echo "FINAL failures=$failures"
          (( failures == 0 ))
          echo 'FINAL_SUCCESS all_6_CH_pages_content_excerpt_title_featured_image_match_sources'
