name: One-time DoctorCura source vs CH content inspect 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-flat-language-fix-20260911.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare source and CH pages
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-content-inspect"; rm -rf "$root"; mkdir -p "$root"
          src=(900448 900449 900450 900451 900452 900453)
          ch=(900512 900514 900516 900518 900520 900522)
          slugs=(gewichtsmanagement akne-behandlung schlafberatung erektionsprobleme haarausfall online-arzt)
          req(){ python3 - "$1" "$2" "$3" "$4" <<'PY'
          import json,sys
          out,rid,action,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':rid,'action':action,'dry_run':True,'confirm':False,'payload':json.loads(payload)},open(out,'w'),separators=(',',':'))
          PY
          }
          call(){
            code=$(curl -sS -L --connect-timeout 12 --max-time 180 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$1" -o "$2" -w '%{http_code}' "$site/wp-json/webactueel-wordpress-connector/v1/execute")
            [[ "$code" == 200 ]] || { echo HTTP_$code; cat "$2"; exit 1; }
          }
          for i in "${!src[@]}"; do
            s="${src[$i]}"; c="${ch[$i]}"; slug="${slugs[$i]}"
            for pair in "src:$s" "ch:$c"; do
              kind="${pair%%:*}"; id="${pair#*:}"
              req "$root/p.req" "cmp-post-$id-${GITHUB_RUN_ID}" post.get "{\"id\":$id}"
              call "$root/p.req" "$root/p.res"
              req "$root/e.req" "cmp-el-$id-${GITHUB_RUN_ID}" elementor.inspect "{\"id\":$id}"
              call "$root/e.req" "$root/e.res"
              req "$root/a.req" "cmp-acf-$id-${GITHUB_RUN_ID}" acf.get "{\"object_type\":\"post\",\"object_id\":$id}"
              call "$root/a.req" "$root/a.res" || true
              python3 - "$root/p.res" "$root/e.res" "$root/a.res" "$kind" "$slug" "$id" <<'PY'
          import json,sys,os
          p=json.load(open(sys.argv[1],encoding='utf-8')); e=json.load(open(sys.argv[2],encoding='utf-8'))
          a={}
          try: a=json.load(open(sys.argv[3],encoding='utf-8'))
          except: pass
          post=((p.get('data') or {}).get('post') or {})
          doc=((e.get('data') or {}).get('document') or {})
          av=(a.get('data') or {}) if isinstance(a,dict) else {}
          print('CMP kind=%s slug=%s id=%s status=%s parent=%s featured=%s content_len=%s excerpt_len=%s elem_count=%s edit_mode=%r template_type=%r acf=%s'%(
            sys.argv[4],sys.argv[5],sys.argv[6],post.get('status'),post.get('parent'),post.get('featured_media'),len(post.get('content') or ''),len(post.get('excerpt') or ''),len(doc.get('data') or []),doc.get('edit_mode'),doc.get('template_type'),json.dumps(av,separators=(',',':'))[:5000]))
          PY
            done
          done
