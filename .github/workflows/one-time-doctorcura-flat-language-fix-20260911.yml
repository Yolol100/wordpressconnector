name: One-time DoctorCura CH ACF fields repair 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-flat-language-fix-20260911.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Copy all ACF fields including text and images to six CH pages
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-ch-acf"; rm -rf "$root"; mkdir -p "$root"
          src=(900448 900449 900450 900451 900452 900453)
          ch=(900512 900514 900516 900518 900520 900522)
          slugs=(gewichtsmanagement akne-behandlung schlafberatung erektionsprobleme haarausfall online-arzt)

          req(){ python3 - "$1" "$2" "$3" "$4" "$5" "$6" <<'PY'
          import json,sys
          out,rid,action,dry,confirm,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':rid,'action':action,'dry_run':dry=='true','confirm':confirm=='true','payload':json.loads(payload)},open(out,'w'),ensure_ascii=False,separators=(',',':'))
          PY
          }
          call(){
            code=$(curl -sS -L --connect-timeout 12 --max-time 180 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$1" -o "$2" -w '%{http_code}' "$site/wp-json/webactueel-wordpress-connector/v1/execute")
            [[ "$code" == 200 ]] || { echo "HTTP=$code"; cat "$2"; exit 1; }
            python3 - "$2" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok'),d
          PY
          }

          for i in "${!src[@]}"; do
            s="${src[$i]}"; c="${ch[$i]}"; slug="${slugs[$i]}"

            req "$root/src.req" "acf-src-$s-${GITHUB_RUN_ID}" acf.get true false "{\"post_id\":$s}"
            call "$root/src.req" "$root/src.res"
            req "$root/grp.req" "acf-groups-$s-${GITHUB_RUN_ID}" acf.field_groups true false "{\"post_id\":$s}"
            call "$root/grp.req" "$root/grp.res"
            req "$root/ch.req" "acf-ch-$c-${GITHUB_RUN_ID}" acf.get true false "{\"post_id\":$c}"
            call "$root/ch.req" "$root/ch.res"

            python3 - "$root/src.res" "$root/grp.res" "$root/ch.res" "$root/payload.json" "$c" "$slug" <<'PY'
          import json,sys
          sd=json.load(open(sys.argv[1],encoding='utf-8')); gd=json.load(open(sys.argv[2],encoding='utf-8')); cd=json.load(open(sys.argv[3],encoding='utf-8'))
          sf=((sd.get('data') or {}).get('fields') or {})
          cf=((cd.get('data') or {}).get('fields') or {})
          groups=((gd.get('data') or {}).get('field_groups') or [])
          assert isinstance(sf,dict) and sf, (sys.argv[6],'source ACF empty')
          name_to_key={}
          types={}
          for g in groups:
              for f in (g.get('fields') or []):
                  n=f.get('name'); k=f.get('key'); t=f.get('type')
                  if n and k: name_to_key[n]=k
                  if n: types[n]=t
          payload={}
          for name,value in sf.items():
              payload[name_to_key.get(name,name)] = value
          json.dump({'target':int(sys.argv[5]),'fields':payload},open(sys.argv[4],'w'),ensure_ascii=False,separators=(',',':'))
          changed=[k for k,v in sf.items() if cf.get(k)!=v]
          image_like=[k for k in sf if types.get(k) in ('image','gallery','file')]
          text_like=[k for k in sf if types.get(k) in ('text','textarea','wysiwyg','email','url','number')]
          print('ACF_SOURCE slug=%s fields=%d changed=%d text=%s image=%s keys=%s'%(sys.argv[6],len(sf),len(changed),','.join(text_like),','.join(image_like),','.join(sf.keys())))
          PY

            payload=$(cat "$root/payload.json")
            req "$root/dry.req" "acf-dry-$c-${GITHUB_RUN_ID}" acf.update true false "$payload"
            call "$root/dry.req" "$root/dry.res"
            req "$root/live.req" "acf-live-$c-${GITHUB_RUN_ID}" acf.update false true "$payload"
            call "$root/live.req" "$root/live.res"

            req "$root/v.req" "acf-verify-$c-${GITHUB_RUN_ID}" acf.get true false "{\"post_id\":$c}"
            call "$root/v.req" "$root/v.res"
            python3 - "$root/src.res" "$root/v.res" "$slug" <<'PY'
          import json,sys
          s=((json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('fields') or {})
          c=((json.load(open(sys.argv[2],encoding='utf-8')).get('data') or {}).get('fields') or {})
          missing=[]; mismatch=[]
          for k,v in s.items():
              if k not in c: missing.append(k)
              elif c[k]!=v: mismatch.append(k)
          assert not missing and not mismatch,(sys.argv[3],missing,mismatch)
          print('ACF_MATCH_OK slug=%s fields=%d'%(sys.argv[3],len(s)))
          PY
          done

          for action in elementor.regenerate cache.flush; do
            req "$root/a.req" "acf-${action//./-}-${GITHUB_RUN_ID}" "$action" false true '{}'
            call "$root/a.req" "$root/a.res"
          done

          failures=0
          for slug in "${slugs[@]}"; do
            out="$root/$slug.html"
            meta=$(curl -sS -L --max-redirs 8 -H 'Cache-Control: no-cache, no-store' -o "$out" -w '%{http_code}|%{url_effective}' "$site/ch/$slug/?acffix=${GITHUB_RUN_ID}")
            code="${meta%%|*}"; final="${meta#*|}"
            metrics=$(python3 - "$out" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>|<[^>]+>',' ',t,flags=re.I|re.S); text=' '.join(text.split())
          print('%d|%d|%d'%(len(text),len(re.findall(r'<img\b',t,re.I)),t.lower().count('elementor-element')))
          PY
          )
            echo "LIVE slug=$slug http=$code final=$final metrics=$metrics"
            txt=$(echo "$metrics"|cut -d'|' -f1); imgs=$(echo "$metrics"|cut -d'|' -f2); elems=$(echo "$metrics"|cut -d'|' -f3)
            [[ "$code" == 200 && "$final" == *"/ch/$slug/"* && "$txt" -gt 10000 && "$imgs" -ge 10 && "$elems" -ge 230 ]] || failures=$((failures+1))
          done
          echo "FINAL failures=$failures"
          (( failures == 0 ))
          echo 'FINAL_SUCCESS acf_fields_text_images_all_6_CH_pages_match_sources'
