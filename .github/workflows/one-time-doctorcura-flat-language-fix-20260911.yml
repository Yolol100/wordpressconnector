name: One-time DoctorCura CH condition cache inspect 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-flat-language-fix-20260911.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect SEO template meta and Elementor Pro condition cache
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-cond-cache"; rm -rf "$root"; mkdir -p "$root"
          make_req(){ python3 - "$1" "$2" "$3" "$4" <<'PY'
          import json,sys
          out,rid,action,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':rid,'action':action,'dry_run':True,'confirm':False,'payload':json.loads(payload)},open(out,'w'),separators=(',',':'))
          PY
          }
          call(){
            code=$(curl -sS -L --connect-timeout 12 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$1" -o "$2" -w '%{http_code}' "$site/wp-json/webactueel-wordpress-connector/v1/execute")
            [[ "$code" == 200 ]] || { echo "HTTP=$code"; cat "$2"; exit 1; }
          }
          make_req "$root/t.req" "cond-template-${GITHUB_RUN_ID}" elementor.inspect '{"id":900460}'
          call "$root/t.req" "$root/t.res"
          python3 - "$root/t.res" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok'),d
          doc=((d.get('data') or {}).get('document') or {})
          print('TEMPLATE_CONDITIONS='+json.dumps(doc.get('conditions') or [],separators=(',',':')))
          PY
          make_req "$root/o.req" "cond-option-${GITHUB_RUN_ID}" option.get '{"name":"elementor_pro_theme_builder_conditions"}'
          call "$root/o.req" "$root/o.res"
          python3 - "$root/o.res" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok'),d
          print('OPTION_DATA='+json.dumps(d.get('data') or {},separators=(',',':'))[:12000])
          PY
