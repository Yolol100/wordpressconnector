name: One-time DoctorCura CH resolved page inspect 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-flat-language-fix-20260911.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect body page ids and canonical URLs
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          slugs=(gewichtsmanagement akne-behandlung schlafberatung erektionsprobleme haarausfall online-arzt)
          for slug in "${slugs[@]}"; do
            for path in "/$slug/" "/ch/$slug/"; do
              f="$RUNNER_TEMP/x.html"
              curl -sS -L -H 'Cache-Control: no-cache, no-store' -o "$f" "$site$path?pidcheck=${GITHUB_RUN_ID}"
              python3 - "$f" "$path" <<'PY'
          import re,sys,html
          t=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          body=re.search(r'<body\b([^>]*)>',t,re.I|re.S)
          attrs=body.group(1) if body else ''
          ids=sorted(set(re.findall(r'(?:page-id-|postid-)(\d+)',attrs,re.I)))
          can=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',t,re.I)
          if not can: can=re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',t,re.I)
          cls=re.search(r'class=["\']([^"\']+)',attrs,re.I)
          print('RESOLVE path=%s pageids=%s canonical=%s bodyclass=%s'%(sys.argv[2],','.join(ids) or 'none',html.unescape(can.group(1)) if can else 'none',(cls.group(1)[:400] if cls else 'none')))
          PY
            done
          done
