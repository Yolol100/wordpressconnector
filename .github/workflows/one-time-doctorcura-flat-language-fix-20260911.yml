name: One-time DoctorCura CH Elementor render diagnose 20260911

on:
  push:
    branches:
      - chat/doctorcura-ch-sixpage-inspect-20260911
    paths:
      - '.github/workflows/one-time-doctorcura-flat-language-fix-20260911.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare SEO template and original/CH Elementor documents
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]] || exit 1
          root="$RUNNER_TEMP/dc-ch-render"; rm -rf "$root"; mkdir -p "$root"
          originals=(900448 900449 900450 900451 900452 900453)
          clones=(900512 900514 900516 900518 900520 900522)
          slugs=(gewichtsmanagement akne-behandlung schlafberatung erektionsprobleme haarausfall online-arzt)
          template=900460

          make_req(){ python3 - "$1" "$2" "$3" <<'PY'
          import json,sys
          out,rid,payload=sys.argv[1:]
          json.dump({'version':1,'request_id':rid,'action':'elementor.inspect','dry_run':True,'confirm':False,'payload':json.loads(payload)},open(out,'w'),separators=(',',':'))
          PY
          }
          call(){
            code=$(curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$1" -o "$2" -w '%{http_code}' "$site/wp-json/webactueel-wordpress-connector/v1/execute")
            [[ "$code" == 200 ]] || exit 1
            python3 - "$2" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok'),d
          PY
          }

          make_req "$root/template.req" "diag-template-${GITHUB_RUN_ID}" "{\"id\":$template}"
          call "$root/template.req" "$root/template.res"
          python3 - "$root/template.res" <<'PY'
          import json,sys,collections
          d=json.load(open(sys.argv[1],encoding='utf-8')); doc=((d.get('data') or {}).get('document') or {})
          widgets=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('widgetType'): widgets.append(x.get('widgetType'))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(doc.get('data') or [])
          print('TEMPLATE id=%s type=%s elements=%d conditions=%s' % (doc.get('post_id'),doc.get('template_type'),len(doc.get('data') or []),json.dumps(doc.get('conditions') or [])))
          print('TEMPLATE_WIDGETS='+json.dumps(collections.Counter(widgets),sort_keys=True))
          PY

          for i in "${!originals[@]}"; do
            oid="${originals[$i]}"; cid="${clones[$i]}"; slug="${slugs[$i]}"
            for kind in original clone; do
              if [[ "$kind" == original ]]; then id="$oid"; else id="$cid"; fi
              make_req "$root/$kind-$id.req" "diag-$kind-$id-${GITHUB_RUN_ID}" "{\"id\":$id}"
              call "$root/$kind-$id.req" "$root/$kind-$id.res"
            done
            python3 - "$root/original-$oid.res" "$root/clone-$cid.res" "$slug" <<'PY'
          import json,sys,hashlib
          a=json.load(open(sys.argv[1],encoding='utf-8')); b=json.load(open(sys.argv[2],encoding='utf-8')); slug=sys.argv[3]
          da=((a.get('data') or {}).get('document') or {}); db=((b.get('data') or {}).get('document') or {})
          ja=json.dumps(da.get('data') or [],sort_keys=True,separators=(',',':'))
          jb=json.dumps(db.get('data') or [],sort_keys=True,separators=(',',':'))
          print('DOC slug=%s orig=%s clone=%s orig_elements=%d clone_elements=%d same_data=%s orig_type=%s clone_type=%s orig_settings=%s clone_settings=%s' % (slug,da.get('post_id'),db.get('post_id'),len(da.get('data') or []),len(db.get('data') or []),ja==jb,da.get('template_type'),db.get('template_type'),json.dumps(da.get('page_settings') or {},sort_keys=True),json.dumps(db.get('page_settings') or {},sort_keys=True)))
          PY
            for path in "/$slug/" "/ch/$slug/"; do
              key=$(printf '%s' "$path" | tr '/-' '__')
              curl -sS -L -H 'Cache-Control: no-cache, no-store' -o "$root/$key.html" "$site$path?diag=${GITHUB_RUN_ID}"
              python3 - "$root/$key.html" "$path" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          body=re.search(r'<body\b[^>]*>(.*)</body>',t,re.I|re.S)
          s=body.group(1) if body else t
          text=re.sub(r'<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>|<[^>]+>',' ',s,flags=re.I|re.S)
          text=' '.join(text.split())
          print('HTML path=%s bytes=%d textchars=%d elementor=%d postcontent=%d' % (sys.argv[2],len(t.encode()),len(text),t.lower().count('elementor-element'),t.lower().count('elementor-widget-theme-post-content')))
          PY
            done
          done
