# TEMPORARY branch-only diagnostic. Must be removed before PR.
name: Temporary WPCS conservative Yoda check
on:
  push:
    branches:
      - fix/wpcs-remaining-20261115
permissions:
  contents: write
jobs:
  safe-yoda:
    if: github.repository == 'Yolol100/wordpressconnector'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout bounded temporary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/wpcs-remaining-20261115
          persist-credentials: true
      - name: Prepare PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xmlreader, xml, dom
          coverage: none
      - name: Run strict equivalence Yoda edits, test original contract suite, inspect source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Yolol100/wordpressconnector'
          test "$GITHUB_REF" = 'refs/heads/fix/wpcs-remaining-20261115'
          test -z "$(git status --porcelain)"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root='plugin/wordpressconnector';
          $testCorpus='';
          foreach(new RecursiveIteratorIterator(new RecursiveDirectoryIterator('tests',FilesystemIterator::SKIP_DOTS)) as $t){
              if($t->isFile()&&str_ends_with($t->getFilename(),'.php'))$testCorpus.=file_get_contents($t->getPathname())."\n";
          }
          $total=0;$files=0;
          foreach(new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root,FilesystemIterator::SKIP_DOTS)) as $file){
              if(!$file->isFile()||!str_ends_with($file->getFilename(),'.php'))continue;
              $src=file_get_contents($file->getPathname());
              $tokens=token_get_all($src);$cursor=0;$edits=[];
              foreach($tokens as $token){
                  $segment=is_array($token)?$token[1]:$token;
                  if(is_array($token)&&$token[0]===T_VARIABLE){
                      $tail=substr($src,$cursor);
                      $regex='~\A(?<left>\$[A-Za-z_]\w*(?:\s*\[\s*(?:\$[A-Za-z_]\w*|[0-9]+|\x27[^\x27\\\\]*\x27|"[^"\\\\]*")\s*\])*)\s*(?<op>===|!==|==|!=)\s*(?<right>null|true|false|[0-9]+(?:\.[0-9]+)?|\x27[^\x27\\\\]*\x27|"[^"\\\\]*")(?=\s*(?:[);,}\]?]|&&|\|\||$))~i';
                      if(preg_match($regex,$tail,$m)){
                          $prefix=substr($src,max(0,$cursor-5),min($cursor,5));
                          if(!preg_match('~(?:->|\?->|::|\$)\s*$~',$prefix) && !str_contains($testCorpus,$m[0])){
                              $edits[]=['offset'=>$cursor,'length'=>strlen($m[0]),'after'=>$m['right'].' '.$m['op'].' '.$m['left']];
                          }
                      }
                  }
                  $cursor+=strlen($segment);
              }
              for($i=count($edits)-1;$i>=0;$i--){
                  $e=$edits[$i];
                  $src=substr_replace($src,$e['after'],$e['offset'],$e['length']);
              }
              if($edits){
                  $files++;$total+=count($edits);
                  file_put_contents($file->getPathname(),$src);
              }
          }
          echo "Symmetric pure-literal comparisons moved: $total in $files files\n";
          if($total<100||$total>140)throw new RuntimeException("Unexpected number of eligible comparisons");
          PHP
          find plugin/wordpressconnector -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/php-lint.log"
          git add plugin/wordpressconnector
          test -n "$(git diff --cached --name-only)"
          while IFS= read -r p; do case "$p" in plugin/wordpressconnector/*.php) ;; *) echo "unexpected file: $p"; exit 1 ;; esac; done < <(git diff --cached --name-only)
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(wpcs): use symmetric Yoda comparison for pure literal operands'
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1 || { tail -n 50 "$RUNNER_TEMP/contracts.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/wpcs-tools"
          cat > "$RUNNER_TEMP/wpcs-tools/composer.json" <<'JSON'
          {
            "name": "webactueel/temporary-wpcs-yoda",
            "require-dev": {
              "squizlabs/php_codesniffer": "3.13.6",
              "wp-coding-standards/wpcs": "3.4.1"
            },
            "config": {
              "allow-plugins": {"dealerdirect/phpcodesniffer-composer-installer": true}
            }
          }
          JSON
          composer install --working-dir="$RUNNER_TEMP/wpcs-tools" --prefer-dist --no-interaction --no-progress
          status=0
          "$RUNNER_TEMP/wpcs-tools/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/wpcs-final.json" || status=$?
          python3 - "$RUNNER_TEMP/wpcs-final.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          t=j['totals']
          print("FINAL WPCS",t,'files',len(j['files']))
          assert len(j['files'])==57
          assert t['errors']<2249 and t['warnings']<=150, 'Yoda pass must improve errors without growing warnings'
          PY
          git push origin 'HEAD:refs/heads/fix/wpcs-remaining-20261115'
          echo "pushed_commit=$(git rev-parse HEAD)"
      - name: Keep temporary evidence for readback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: temporary-wpcs-yoda-evidence
          path: |
            \${{ runner.temp }}/wpcs-final.json
            \${{ runner.temp }}/contracts.log
            \${{ runner.temp }}/php-lint.log
          retention-days: 1
