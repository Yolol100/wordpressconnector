# TEMPORARY scoped alignment runner. Must be deleted before PR.
name: Temporary WPCS alignment diagnostic
on:
  push:
    branches:
      - fix/wpcs-remaining-20261115
permissions:
  contents: write
jobs:
  alignment:
    if: github.repository == 'Yolol100/wordpressconnector'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/wpcs-remaining-20261115
          persist-credentials: true
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, xmlreader, xml, dom
          coverage: none
      - name: Fix only trailing variable alignment and verify every contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Yolol100/wordpressconnector"
          test "$GITHUB_REF" = "refs/heads/fix/wpcs-remaining-20261115"
          test "$(git status --porcelain | wc -l)" -eq 0
          mkdir -p "$RUNNER_TEMP/wpcs-tools"
          cat > "$RUNNER_TEMP/wpcs-tools/composer.json" <<'JSON'
          {
            "name": "webactueel/wpcs-temporary-alignment-review",
            "require-dev": {
              "squizlabs/php_codesniffer": "3.13.6",
              "wp-coding-standards/wpcs": "3.4.1"
            },
            "config": {"allow-plugins":{"dealerdirect/phpcodesniffer-composer-installer":true}}
          }
          JSON
          composer install --working-dir="$RUNNER_TEMP/wpcs-tools" --prefer-dist --no-interaction --no-progress
          "$RUNNER_TEMP/wpcs-tools/vendor/bin/phpcbf" --standard=phpcs.xml.dist --sniffs=Generic.Formatting.MultipleStatementAlignment plugin/wordpressconnector > "$RUNNER_TEMP/phpcbf.log" 2>&1 || true
          git add plugin/wordpressconnector
          test -n "$(git diff --cached --name-only)"
          while IFS= read -r p; do case "$p" in plugin/wordpressconnector/*.php) ;; *) echo "unexpected path $p"; exit 1 ;; esac; done < <(git diff --cached --name-only)
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style(wpcs): realign local variable assignments after snake_case fixes"
          find plugin/wordpressconnector -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/php-lint.log"
          bash scripts/run-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/contracts.log"; exit 1; }
          status=0
          "$RUNNER_TEMP/wpcs-tools/vendor/bin/phpcs" --standard=phpcs.xml.dist --report=json > "$RUNNER_TEMP/wpcs-final.json" || status=$?
          python3 - "$RUNNER_TEMP/wpcs-final.json" <<'PY'
          import sys,json
          r=json.load(open(sys.argv[1]))
          t=r['totals']
          print("AFTER ALIGNMENT WPCS:",t,"files",len(r['files']))
          assert len(r['files'])==57
          assert t['errors'] <= 2249 and t['warnings'] < 245, 'Alignment must not make standards worse'
          PY
          git push origin "HEAD:refs/heads/fix/wpcs-remaining-20261115"
          echo "pushed=$(git rev-parse HEAD)"
          
      - name: Upload temporary audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: temporary-wpcs-alignment-evidence
          path: |
            ${{ runner.temp }}/wpcs-final.json
            ${{ runner.temp }}/contracts.log
            ${{ runner.temp }}/phpcbf.log
            ${{ runner.temp }}/php-lint.log
          retention-days: 1
