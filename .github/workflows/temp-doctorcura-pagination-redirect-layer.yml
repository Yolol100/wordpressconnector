name: Temporary DoctorCura Pagination Route Query Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-pagination-redirect-layer.yml'
      - 'scripts/temp-doctorcura-route-query-diagnostic.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
      REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
      REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect exact WordPress route query and auto-rollback
        run: python3 scripts/temp-doctorcura-route-query-diagnostic.py
