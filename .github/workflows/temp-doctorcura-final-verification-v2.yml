# rerun after post 5892 polish
name: Temporary DoctorCura final verification v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-doctorcura-final-verification-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Final live readback
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"; [[ "$site" == 'https://doctorcura.com' ]]
          base="$site/wp-json/webactueel-wordpress-connector/v1"; snippets="$site/wp-json/code-snippets/v1/snippets"; root="$RUNNER_TEMP/dc-final-v2"; rm -rf "$root"; mkdir -p "$root"
          call(){ suf="$1"; action="$2"; payload="$3"; python3 - "$root/r-$suf.json" "$action" "$payload" <<'PY'
          import json,sys,uuid
          p,a,payload=sys.argv[1:]; json.dump({'version':1,'request_id':'dc-final2-'+uuid.uuid4().hex[:20],'action':a,'dry_run':True,'confirm':False,'payload':json.loads(payload)},open(p,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
            code=$(curl -sS -L --connect-timeout 10 --max-time 120 --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Content-Type: application/json' --data-binary "@$root/r-$suf.json" -o "$root/o-$suf.json" -w '%{http_code}' "$base/execute"); [[ "$code" == 200 ]] || { echo "HTTP_FAIL $action $code" >&2; exit 1; }; python3 - "$root/o-$suf.json" <<'PY'
          import json,sys
          if not json.load(open(sys.argv[1],encoding='utf-8')).get('ok'): raise SystemExit('connector action ok=false')
          PY
          }
          health=$(curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -o /dev/null -w '%{http_code}' "$base/health"); [[ "$health" == 200 ]]

          : > "$root/objects.tsv"
          for type in page post product elementor_library wp_block; do
            page=1
            while (( page <= 50 )); do
              call "list-${type}-${page}" post.list "{\"post_type\":\"$type\",\"status\":\"any\",\"per_page\":100,\"page\":$page}"
              python3 - "$root/o-list-${type}-${page}.json" "$type" >> "$root/objects.tsv" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); typ=sys.argv[2]; data=d.get('data') or {}
          for x in data.get('items',[]):
              if isinstance(x,dict) and isinstance(x.get('id'),int): print(f"{x['id']}\t{typ}\t{x.get('status','')}\t{x.get('slug','')}")
          PY
              pages=$(python3 - "$root/o-list-${type}-${page}.json" <<'PY'
          import json,sys
          print(int((json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('pages') or 1))
          PY
              ); (( page >= pages )) && break; page=$((page+1))
            done
          done
          sort -u "$root/objects.tsv" -o "$root/objects.tsv"
          objects=0; posts=0
          while IFS=$'\t' read -r id type status slug; do
            call "get-$id" post.get "{\"id\":$id}"; call "el-$id" elementor.inspect "{\"id\":$id}" || true
            python3 - "$root/o-get-$id.json" "$root/o-el-$id.json" "$id" "$type" "$status" "$slug" <<'PY'
          import html,json,os,re,sys
          postf,elf,id_s,typ,status,slug=sys.argv[1:]
          p=(json.load(open(postf,encoding='utf-8')).get('data') or {}).get('post') or {}; raw=json.dumps(p,ensure_ascii=False)
          if os.path.exists(elf):
              try: raw+=' '+json.dumps((json.load(open(elf,encoding='utf-8')).get('data') or {}).get('document') or {},ensure_ascii=False)
              except Exception: pass
          legacy=[r'Keizersgracht\s*241',r'1016\s*EA',r'tel:0855055433',r'(?<!\d)085\s*505\s*5433(?!\d)',r'(?<!\d)08\s*550\s*55\s*433(?!\d)',r'\+31\s*\(0\)\s*85\s*505\s*5433']
          for pat in legacy:
              m=re.search(pat,raw,re.I)
              if m: raise SystemExit(f'LEGACY_CONTACT id={id_s} type={typ} slug={slug} term={m.group(0)}')
          if typ=='post' and status=='publish':
              text=' '.join(str(p.get(k,'')) for k in ('title','excerpt','content'))
              text=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S); text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S); text=html.unescape(re.sub(r'<[^>]+>',' ',text)); text=re.sub(r'\s+',' ',text)
              us=[r'United\s+States(?:\s+of\s+America)?',r'\bUSA\b',r'\bU\.S\.A\.?\b',r'\bU\.S\.\b',r'\bUS-(?=[A-Za-zÄÖÜäöüß])',r'\bAmerican(?:s|er|e|en|em|es)?\b',r'\bAmerika(?:nisch\w*)?\b',r'\bFDA\b',r'Food\s+and\s+Drug\s+Administration',r'\bZepbound\b',r'\b911\b',r'\b988\b',r'1-800-222-1222',r'\bMedicare\b',r'\bMedicaid\b',r'\bDEA\b',r'\bHIPAA\b',r'\bUS-Dollar\b',r'\bUS\s+dollars?\b']
              for pat in us:
                  m=re.search(pat,text,re.I)
                  if m: raise SystemExit(f'US_REFERENCE id={id_s} slug={slug} term={m.group(0)}')
              awkward=[r'\bDeutschland-(?:Markt|Patient|Adresse|Bundesstaat|Apothek|Gesundheit|Krankenversicherung)',r'je\s+nach\s+Deutschland',r'einzelnen\s+Deutschland',r'Ihrem\s+Deutschland',r'Ihren\s+Deutschland',r'jeweiligen\s+Deutschland',r'Deutschland\s+zugelassene[nr]?\s+(?:Arzt|Ärztin)',r'\bden Deutschland\b',r'\bder Deutschland\b']
              for pat in awkward:
                  m=re.search(pat,text,re.I)
                  if m: raise SystemExit(f'LOCALIZATION_ANOMALY id={id_s} slug={slug} term={m.group(0)}')
          PY
            objects=$((objects+1)); [[ "$type" == post && "$status" == publish ]] && posts=$((posts+1))
          done < "$root/objects.tsv"
          echo "CONTENT_AUDIT_OK objects=$objects posts=$posts"

          for id in 3 9 95; do call "expect-$id" post.get "{\"id\":$id}"; call "expect-el-$id" elementor.inspect "{\"id\":$id}" || true; done
          python3 - "$root" <<'PY'
          import glob,json,sys
          root=sys.argv[1]
          def data(id):
              s=''
              for p in glob.glob(root+f'/o-expect*{id}.json'):
                  try:s+=json.dumps(json.load(open(p,encoding='utf-8')).get('data'),ensure_ascii=False)
                  except:pass
              return s
          for id,need in [(3,['Veldbloemlaan 93','3452CK Vleuten, The Netherlands']),(9,['Veldbloemlaan 93','+31 85 505 54 33']),(95,['Veldbloemlaan 93','+31 85 505 54 33'])]:
              s=data(id)
              for x in need:
                  if x not in s: raise SystemExit(f'EXPECTED_VALUE_MISSING id={id} value={x}')
          print('EXPECTED_CONTACT_LOCATIONS_OK')
          PY

          declare -A expected=( [woocommerce_store_address]='Veldbloemlaan 93' [woocommerce_store_address_2]='' [woocommerce_store_city]='Vleuten' [woocommerce_store_postcode]='3452CK' [woocommerce_default_country]='NL' )
          for key in "${!expected[@]}"; do
            call "opt-${key//_/-}" option.get "{\"name\":\"$key\"}"
            python3 - "$root/o-opt-${key//_/-}.json" "$key" "${expected[$key]}" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); data=d.get('data') or {}; v=data.get('value') if isinstance(data,dict) else None
          if str(v if v is not None else '')!=sys.argv[3]: raise SystemExit(f'WOO_MISMATCH {sys.argv[2]}={v!r}')
          PY
          done
          echo WOO_CONTACT_OPTIONS_OK

          scode=$(curl -sS -L --user "${REST_USERNAME}:${REST_APP_PASSWORD}" -H 'Accept: application/json' -o "$root/snippets.json" -w '%{http_code}' "$snippets?per_page=100&page=1"); [[ "$scode" == 200 ]]
          python3 - "$root/snippets.json" <<'PY'
          import json,re,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); items=d if isinstance(d,list) else d.get('items',d.get('snippets',[])) if isinstance(d,dict) else []; raw=' '.join(str(x.get('code','')) for x in items if isinstance(x,dict))
          for pat in [r'Keizersgracht\s*241',r'1016\s*EA',r'tel:0855055433',r'(?<!\d)085\s*505\s*5433(?!\d)',r'(?<!\d)08\s*550\s*55\s*433(?!\d)']:
              if re.search(pat,raw,re.I): raise SystemExit('SNIPPET_LEGACY_CONTACT')
          print('SNIPPETS_CONTACT_OK')
          PY

          call core filesystem.read_text '{"path":"wp-content/plugins/doctorcura-core/includes/extra-request-form.php"}'
          python3 - "$root/o-core.json" <<'PY'
          import json,sys
          s=((json.load(open(sys.argv[1],encoding='utf-8')).get('data') or {}).get('content') or '')
          for old in ['Keizersgracht 241','1016 EA','tel:0855055433','085 505 5433']:
              if old in s: raise SystemExit('CORE_LEGACY '+old)
          for new in ['Veldbloemlaan 93','3452CK Vleuten, The Netherlands','tel:+31855055433','+31 85 505 54 33']:
              if new not in s: raise SystemExit('CORE_MISSING '+new)
          print('CORE_CONTACT_OK')
          PY
          echo "FINAL_VERIFICATION_OK objects=$objects posts=$posts"
