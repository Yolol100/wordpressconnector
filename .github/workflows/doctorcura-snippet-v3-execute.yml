name: DoctorCura SEO Snippet V4 Execute

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doctorcura-seo-snippet-v4-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Revalidate trusted DoctorCura request
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRUSTED_REQUEST_ACTOR: ${{ vars.WPCONNECTOR_TRUSTED_REQUEST_ACTOR }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,99}$ ]] || exit 1
          pr="$RUNNER_TEMP/pr.json"
          code=$(curl --silent --show-error --location --output "$pr" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_REPO_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [[ "$code" == '200' ]] || exit 1
          python3 - "$pr" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          repo=os.environ['GITHUB_REPOSITORY']; owner=os.environ['REPOSITORY_OWNER']; trusted=os.environ.get('TRUSTED_REQUEST_ACTOR',''); expected=os.environ['EXPECTED_HEAD_SHA']
          actor=(p.get('user') or {}).get('login','')
          ok=(p.get('state')=='open' and actor and actor in {owner,trusted} and (p.get('head') or {}).get('sha')==expected and ((p.get('head') or {}).get('repo') or {}).get('full_name')==repo and ((p.get('base') or {}).get('repo') or {}).get('full_name')==repo and (p.get('base') or {}).get('ref')=='main')
          if not ok: raise SystemExit('Trusted DoctorCura V4 validation failed.')
          PY

      - name: Update, activate and verify snippet 43
        env:
          SITE_URL: ${{ vars.DOCTORCURA_SITE_URL }}
          REST_USERNAME: ${{ secrets.DOCTORCURA_REST_USERNAME }}
          REST_APP_PASSWORD: ${{ secrets.DOCTORCURA_REST_APPLICATION_PASSWORD }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" && test -n "${REST_USERNAME:-}" && test -n "${REST_APP_PASSWORD:-}"
          [[ "$SITE_URL" == 'https://doctorcura.com' || "$SITE_URL" == 'https://doctorcura.com/' ]] || { echo 'DoctorCura target mismatch.' >&2; exit 1; }

          root="$RUNNER_TEMP/doctorcura-seo-snippet-v4"
          rm -rf "$root" && mkdir -p "$root"
          site="${SITE_URL%/}"
          connector="$site/wp-json/webactueel-wordpress-connector/v1"
          snippets="$site/wp-json/code-snippets/v1/snippets"
          snippet_id=43
          expected_v3_sha='71ed90665ee03315c04188da264ba8e0f694649015d8df44c98b960845612f23'

          health_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/health.json" --write-out '%{http_code}' "$connector/health")
          [[ "$health_code" == '200' ]] || { echo "DoctorCura connector health failed: HTTP $health_code" >&2; exit 1; }
          python3 - "$root/health.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok') or d.get('transport')!='rest': raise SystemExit('DoctorCura connector health payload invalid.')
          print('DoctorCura target/auth health OK; connector version='+str(d.get('version') or d.get('connector_version') or 'unknown'))
          PY

          before_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/before.json" --write-out '%{http_code}' "$snippets/$snippet_id")
          [[ "$before_code" == '200' ]] || { echo "Snippet 43 preflight failed: HTTP $before_code" >&2; exit 1; }
          python3 - "$root/before.json" "$expected_v3_sha" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          code=str(item.get('code') or '').replace('\r\n','\n').strip()
          digest=hashlib.sha256(code.encode()).hexdigest()
          if int(item.get('id',0))!=43 or item.get('name')!='DoctorCura SEO indexation cleanup': raise SystemExit('Snippet 43 identity mismatch.')
          if bool(item.get('active')): raise SystemExit('Snippet 43 is active before V4; refusing overwrite.')
          if digest!=sys.argv[2]: raise SystemExit('Snippet 43 source does not match rolled-back V3; refusing overwrite.')
          print('Snippet 43 V4 preflight OK: exact V3 source and inactive.')
          PY

          cat > "$root/snippet.php" <<'PHP'
          /**
           * DoctorCura SEO indexation cleanup.
           * Keeps technical endpoints functional while discouraging indexing,
           * consolidates WooCommerce variation parameter canonicals, and applies one
           * explicitly verified legacy redirect.
           */

          if ( ! function_exists( 'wa_doctorcura_should_send_noindex_header' ) ) {
              function wa_doctorcura_should_send_noindex_header(): bool {
                  $request_uri = isset( $_SERVER['REQUEST_URI'] )
                      ? wp_unslash( (string) $_SERVER['REQUEST_URI'] )
                      : '';
                  $path = (string) wp_parse_url( $request_uri, PHP_URL_PATH );

                  if ( false !== strpos( $request_uri, '/wc-api/' ) || isset( $_GET['wc-ajax'] ) ) {
                      return true;
                  }

                  return 1 === preg_match( '~/feed/?$~i', $path );
              }
          }

          add_filter(
              'wp_headers',
              static function ( $headers ) {
                  if ( wa_doctorcura_should_send_noindex_header() ) {
                      $headers['X-Robots-Tag'] = 'noindex, follow';
                  }

                  return $headers;
              },
              100
          );

          add_filter(
              'rest_post_dispatch',
              static function ( $response, $server, $request ) {
                  $response = rest_ensure_response( $response );

                  if ( $response instanceof WP_REST_Response ) {
                      $response->header( 'X-Robots-Tag', 'noindex, follow' );
                  }

                  return $response;
              },
              100,
              3
          );

          add_filter(
              'wpseo_canonical',
              static function ( $canonical ) {
                  if ( ! function_exists( 'is_product' ) || ! is_product() ) {
                      return $canonical;
                  }

                  foreach ( array_keys( $_GET ) as $key ) {
                      if ( 0 !== strpos( (string) $key, 'attribute_' ) ) {
                          continue;
                      }

                      $product_id = get_queried_object_id();
                      $permalink  = $product_id ? get_permalink( $product_id ) : false;

                      return $permalink ? $permalink : $canonical;
                  }

                  return $canonical;
              },
              20
          );

          add_action(
              'template_redirect',
              static function (): void {
                  if ( is_admin() ) {
                      return;
                  }

                  $request_uri = isset( $_SERVER['REQUEST_URI'] )
                      ? wp_unslash( (string) $_SERVER['REQUEST_URI'] )
                      : '';
                  $path = untrailingslashit( (string) wp_parse_url( $request_uri, PHP_URL_PATH ) );
                  $gtranslate_language = isset( $_SERVER['HTTP_X_GT_LANG'] )
                      ? strtolower( sanitize_key( wp_unslash( (string) $_SERVER['HTTP_X_GT_LANG'] ) ) )
                      : '';

                  $visible_legacy_path = '/fr/product-categorie/sexual-problems' === $path;
                  $translated_origin_path = 'fr' === $gtranslate_language
                      && '/product-categorie/sexual-problems' === $path;

                  if ( ! $visible_legacy_path && ! $translated_origin_path ) {
                      return;
                  }

                  header(
                      'Location: https://doctorcura.com/product-category/sexuelle-probleme/',
                      true,
                      301
                  );
                  exit;
              },
              1
          );
          PHP

          php -r '$c=file_get_contents($argv[1]); $f=tempnam(sys_get_temp_dir(),"dcseo-").".php"; file_put_contents($f,"<?php\n".$c); passthru("php -l ".escapeshellarg($f),$rc); @unlink($f); exit($rc);' "$root/snippet.php"

          python3 - "$root/snippet.php" "$root/update.json" <<'PY'
          import json,sys
          payload={
              'name':'DoctorCura SEO indexation cleanup',
              'desc':'Indexation cleanup for technical endpoints, Woo variation canonicals, and one verified fixed legacy redirect.',
              'code':open(sys.argv[1],encoding='utf-8').read(),
              'tags':['seo','indexation','doctorcura'],
              'scope':'global',
              'active':False,
              'priority':10,
          }
          json.dump(payload,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY

          update_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST \
            --header 'Accept: application/json' --header 'Content-Type: application/json' \
            --data-binary "@$root/update.json" --output "$root/update-result.json" --write-out '%{http_code}' "$snippets/$snippet_id")
          [[ "$update_code" == '200' ]] || { echo "Snippet 43 V4 update failed: HTTP $update_code" >&2; exit 1; }

          readback_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/readback.json" --write-out '%{http_code}' "$snippets/$snippet_id")
          [[ "$readback_code" == '200' ]] || { echo "Snippet 43 V4 readback failed: HTTP $readback_code" >&2; exit 1; }
          python3 - "$root/readback.json" "$root/snippet.php" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          expected=open(sys.argv[2],encoding='utf-8').read().replace('\r\n','\n').strip(); actual=str(item.get('code') or '').replace('\r\n','\n').strip()
          if int(item.get('id',0))!=43 or item.get('name')!='DoctorCura SEO indexation cleanup' or actual!=expected: raise SystemExit('Snippet 43 V4 exact readback mismatch.')
          if bool(item.get('active')): raise SystemExit('Snippet 43 activated during V4 update unexpectedly.')
          print('Snippet 43 V4 updated and inactive; exact readback PASS.')
          PY

          activated_by_run=false
          rollback() {
            rc=$?
            if [[ "$rc" -ne 0 && "$activated_by_run" == 'true' ]]; then
              echo 'V4 regression failed; deactivating snippet 43.' >&2
              curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
                --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
                --output "$root/rollback.json" "$snippets/$snippet_id/deactivate" >/dev/null || true
            fi
            exit "$rc"
          }
          trap rollback EXIT

          activate_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --request POST --header 'Accept: application/json' \
            --output "$root/activate.json" --write-out '%{http_code}' "$snippets/$snippet_id/activate" || true)
          echo "Code Snippets V4 activate HTTP ${activate_code:-transport-error}; verifying by readback."
          activated_by_run=true

          active_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --user "${REST_USERNAME}:${REST_APP_PASSWORD}" --header 'Accept: application/json' \
            --output "$root/active.json" --write-out '%{http_code}' "$snippets/$snippet_id")
          [[ "$active_code" == '200' ]] || { echo "Active V4 readback failed: HTTP $active_code" >&2; exit 1; }
          python3 - "$root/active.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); item=d.get('snippet',d) if isinstance(d,dict) else {}
          if not bool(item.get('active')): raise SystemExit('Snippet 43 V4 is not active after activation.')
          print('Snippet 43 V4 active readback PASS.')
          PY

          fetch_headers() {
            curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --dump-header "$2" "$1"
          }
          fetch_headers "$site/" "$root/home.headers"
          fetch_headers "$site/fr/" "$root/fr.headers"
          fetch_headers "$site/en/" "$root/en.headers"
          fetch_headers "$site/product/epipen/" "$root/product.headers"
          fetch_headers "$site/fr/product/condyline/" "$root/fr-product.headers"
          fetch_headers "$site/product-category/sexuelle-probleme/" "$root/redirect-target.headers"
          fetch_headers "$site/wp-json/" "$root/rest.headers"
          fetch_headers "$site/product-category/alle-medikamente/feed/" "$root/feed.headers"
          fetch_headers "$site/?wc-ajax=%25%25endpoint%25%25" "$root/wcajax.headers"
          fetch_headers "$site/fr/product-categorie/sexual-problems/" "$root/redirect.headers"

          variation_url="$site/product/epipen/?attribute_pa_wirkstarke=150mcg&attribute_pa_menge=3&attribute_pa_medikament=epipen"
          variation_code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output "$root/variation.html" --write-out '%{http_code}' "$variation_url")

          python3 - "$root" "$variation_code" <<'PY'
          import os,re,sys
          root=sys.argv[1]; variation_code=sys.argv[2]
          def raw(name): return open(os.path.join(root,name),encoding='iso-8859-1',errors='replace').read()
          def statuses(name): return [int(x) for x in re.findall(r'^HTTP/\S+\s+(\d{3})',raw(name),re.M|re.I)]
          def last_status(name):
              values=statuses(name); return values[-1] if values else 0
          def has_noindex(name): return bool(re.search(r'^X-Robots-Tag:\s*[^\r\n]*\bnoindex\b',raw(name),re.M|re.I))
          for name in ('home.headers','fr.headers','en.headers','product.headers','fr-product.headers','redirect-target.headers'):
              if last_status(name)!=200: raise SystemExit(f'{name} did not return HTTP 200: {statuses(name)}')
              if has_noindex(name): raise SystemExit(f'{name} unexpectedly received noindex')
          for name in ('rest.headers','feed.headers','wcajax.headers'):
              status=last_status(name)
              if status>=500 or status==0: raise SystemExit(f'{name} returned unsafe status: {statuses(name)}')
              if not has_noindex(name): raise SystemExit(f'{name} is missing X-Robots-Tag noindex')
          redirect=raw('redirect.headers')
          if last_status('redirect.headers')!=301: raise SystemExit(f'Legacy category redirect is not 301: {statuses("redirect.headers")}')
          locations=re.findall(r'^Location:\s*(\S+)\s*$',redirect,re.M|re.I)
          expected='https://doctorcura.com/product-category/sexuelle-probleme'
          if not locations or locations[-1].rstrip('/')!=expected: raise SystemExit('Legacy redirect Location incorrect: '+repr(locations[-1:] if locations else []))
          if variation_code!='200': raise SystemExit('Variation URL HTTP '+variation_code)
          html=open(os.path.join(root,'variation.html'),encoding='utf-8',errors='replace').read()
          canonicals=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',html,re.I)
          if not canonicals: canonicals=re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',html,re.I)
          if not canonicals or canonicals[0].rstrip('/')!='https://doctorcura.com/product/epipen': raise SystemExit('Variation canonical incorrect: '+repr(canonicals[:3]))
          print('V4 regression PASS: indexable pages preserved; REST/feed/wc-ajax noindex; exact fixed redirect; variation canonical.')
          PY

          activated_by_run=false
          trap - EXIT
          echo "DOCTORCURA_SNIPPET_V4_RESULT request_id=$REQUEST_ID snippet_id=43 active=true source_sha=b6522cecb2286684b36092b42256ddd111fe7a1f12125d08e4665d4829d728be rollback=armed-and-not-needed"
